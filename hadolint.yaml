---
# Fail on warnings, not just errors: the findings worth having here
# (pipes without pipefail, bad chown/copy) are warnings.
failure-threshold: warning
format: tty
no-color: true

ignored:
  # Pin versions in apt-get install. Debian and Ubuntu archives drop old
  # package versions within weeks, so a pin breaks the next build for no
  # safety gained; the base image tag is what fixes the package set.
  - DL3008
