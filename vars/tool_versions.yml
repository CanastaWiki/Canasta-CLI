---
# Pinned versions of the tools and images the CLI installs or runs, shared
# across roles so there is ONE definition. Loaded play-global in canasta.yml
# pre_tasks (the direct commands read it too). Reviewed and bumped per release.
# k3s and helm for cluster installs are pinned in roles/orchestrator/defaults;
# the CLI image pins its own copies in the Dockerfile.
sops_version: "v3.13.2"
age_version: "v1.3.1"

# sha256 of the sops release binaries, verified after download (the repo-server
# sidecar fetches sops at pod start). Update alongside sops_version.
sops_sha256:
  amd64: "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef"
  arm64: "78abf2e15c86250a1553ae6f53aba96be6b2a8126f160b1534959add3467ad76"

# sha256 of the age release tarballs. Update alongside age_version.
age_sha256:
  amd64: "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"
  arm64: "c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a"

# uv, installed from its release tarball (keyed by `uname -m`). Update the
# checksums alongside uv_version.
uv_version: "0.13.9"
uv_sha256:
  x86_64: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
  aarch64: "0797542018e541a9288855df555c8077eed06f7a47d206362030480e8ecc9f3d"

# restic image for backup and restore, both orchestrators.
restic_image: "docker.io/restic/restic:0.20.0"

# cert-manager manifest applied by create on a cluster without cert-manager.
# A cluster that already runs cert-manager keeps its installed version.
cert_manager_version: "v1.21.3"

# csi-driver-nfs Helm chart installed by `storage setup nfs`.
csi_driver_nfs_chart_version: "4.13.6"

# Argo CD repo-server sidecar image for the helm-sops CMP. Should track the
# argo-cd chart's appVersion. Play-global (not an orchestrator default) because
# gitops init includes the sidecar task cross-role, where role defaults are
# out of scope.
argocd_sops_sidecar_image: "quay.io/argoproj/argocd:v3.3.9"

# argo-cd Helm chart installed by create on a cluster without Argo CD. Pinned so
# the images Argo CD pulls change only when this changes. A cluster that
# already runs Argo CD keeps its installed chart.
argocd_chart_version: "10.10.5"

# The chart pulls Redis anonymously from ecr-public.aws.com, which rate-limits
# by source address. Use the same image from mirror.gcr.io; keep the tag equal
# to the pinned chart's redis.image.tag.
argocd_redis_image_repository: "mirror.gcr.io/library/redis"
argocd_redis_image_tag: "8.6.4-alpine"
