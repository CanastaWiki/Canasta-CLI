---
# Build Canasta image from local source.
#
# Input:
#   build_from (path to workspace containing Canasta/ and optionally CanastaBase/)
#   canasta_default_image (the Canasta image an overlay builds on by default)
#   build_arg  (optional list of "KEY=VALUE" strings forwarded to the builds)
#   instance_id or id, instance_is_k8s
# Output fact: _built_image (str: "canasta:local-<id>" on Compose,
#   "canasta:local" on Kubernetes)

# Each Compose instance gets its own tag: a tag shared by the instances on a
# host is taken over by whichever built last, and the others run that build
# once their containers are recreated. Kubernetes keeps canasta:local, the
# name its values.yaml and in-cluster registry pushes refer to.
- name: Name the image this build produces
  ansible.builtin.set_fact:
    _build_image_name: >-
      {{ 'canasta:local' if (instance_is_k8s | bool)
         else 'canasta:local-' ~ (instance_id | default(id)) }}

- name: Verify Canasta source exists
  ansible.builtin.stat:
    path: "{{ build_from }}/Canasta/Dockerfile"
  register: _canasta_dockerfile

- name: Fail if Canasta source not found
  ansible.builtin.fail:
    msg: "Canasta Dockerfile not found at {{ build_from }}/Canasta/Dockerfile"
  when: not _canasta_dockerfile.stat.exists

- name: Validate build-arg format (KEY=VALUE)
  ansible.builtin.fail:
    msg: "Invalid --build-arg '{{ item }}': expected KEY=VALUE"
  loop: "{{ build_arg | default([]) }}"
  when: "'=' not in item"

# Render the user's build args as "--build-arg KEY=VALUE ..." tokens. They
# are appended after any built-in --build-arg, so a user-supplied BASE_IMAGE
# wins (docker uses the last value for a repeated build-arg key).
- name: Assemble build-arg flags
  ansible.builtin.set_fact:
    _build_arg_flags: >-
      {{ build_arg | default([])
         | map('regex_replace', '^(.+)$', '--build-arg \1')
         | join(' ') }}

# BuildKit attaches a provenance attestation that differs on every build, so
# rebuilding unchanged source would still yield a new image ID and digest, and
# upgrade would restart the instance for nothing. Only BuildKit knows the flag:
# the legacy Docker builder and podman reject it.
- name: Check whether the build runs on BuildKit
  ansible.builtin.shell:
    cmd: >-
      [ "${DOCKER_BUILDKIT:-1}" != 0 ]
      && {{ inspect_command | default('docker') }} buildx version
  register: _buildkit_probe
  changed_when: false
  failed_when: false
  when: inspect_command | default('docker') == 'docker'

- name: Drop the provenance attestation on BuildKit
  ansible.builtin.set_fact:
    _build_arg_flags: >-
      {{ ('--provenance=false ' ~ _build_arg_flags) | trim
         if (_buildkit_probe.rc | default(1)) == 0
         else _build_arg_flags }}

- name: Check for CanastaBase source
  ansible.builtin.stat:
    path: "{{ build_from }}/CanastaBase/Dockerfile"
  register: _base_dockerfile

- name: Build CanastaBase locally
  when: _base_dockerfile.stat.exists
  block:
    - name: Build CanastaBase image
      ansible.builtin.command:
        cmd: "{{ inspect_command | default('docker') }} build {{ _build_arg_flags }} -t canasta-base:local ."
        chdir: "{{ build_from }}/CanastaBase"
      changed_when: true

    - name: Set base image to local build
      ansible.builtin.set_fact:
        _base_image_arg: "canasta-base:local"

# Canasta source (it carries contents.yaml) builds on CanastaBase. Anything
# else under Canasta/ is an overlay on the full Canasta image.
- name: Check whether the Canasta source is the Canasta repository
  ansible.builtin.stat:
    path: "{{ build_from }}/Canasta/contents.yaml"
  register: _canasta_contents

- name: Use published base image
  ansible.builtin.set_fact:
    _base_image_arg: >-
      {{ 'ghcr.io/canastawiki/canasta-base:latest'
         if _canasta_contents.stat.exists
         else canasta_default_image }}
  when: not _base_dockerfile.stat.exists

# The effective base is the last BASE_IMAGE build-arg (a user-supplied one
# wins over the built-in), else the auto-detected base. If the effective base
# resolves to the output tag, the overlay would build FROM its own output —
# overwriting the base and, on a repeat build, silently layering the overlay
# on top of itself. Guard it.
- name: Resolve effective BASE_IMAGE
  ansible.builtin.set_fact:
    _effective_base_image: >-
      {{ (build_arg | default([]) | select('match', '^BASE_IMAGE=')
          | map('regex_replace', '^BASE_IMAGE=', '') | list | last)
         if (build_arg | default([]) | select('match', '^BASE_IMAGE=') | list | length > 0)
         else _base_image_arg }}

- name: Fail if the base image collides with the build-from output tag
  ansible.builtin.fail:
    msg: >-
      --build-arg BASE_IMAGE={{ _build_image_name }} collides with the
      build-from output tag ({{ _build_image_name }}): the overlay would build
      FROM its own output and overwrite it (and double-layer on a repeat
      build). Tag the base under a distinct name, e.g. `docker tag
      {{ _build_image_name }} canasta:merged`, and pass
      --build-arg BASE_IMAGE=canasta:merged.
  when: _effective_base_image == _build_image_name

- name: Build Canasta image from source
  ansible.builtin.command:
    cmd: >-
      {{ inspect_command | default('docker') }} build
      --build-arg BASE_IMAGE={{ _base_image_arg }}
      {{ _build_arg_flags }} -t {{ _build_image_name }} .
    chdir: "{{ build_from }}/Canasta"
  changed_when: true

- name: Set built image fact
  ansible.builtin.set_fact:
    _built_image: "{{ _build_image_name }}"
