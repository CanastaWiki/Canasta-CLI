---
# Build Canasta image from local source.
#
# Input:
#   build_from (path to a workspace containing Canasta/: a Canasta checkout,
#     which holds both images' source, or an overlay on the Canasta image)
#   canasta_default_image (the Canasta image an overlay builds on by default)
#   build_arg  (optional list of "KEY=VALUE" strings forwarded to the builds)
#   build_base_only (optional bool: build canasta-base alone under the output tag)
#   instance_id or id
# Output fact: _built_image (str: "canasta:local-<id>")

# Each instance gets its own tag: a tag shared by the instances on a host is
# taken over by whichever built last, and the others run that build once
# their containers are recreated.
- name: Name the image this build produces
  ansible.builtin.set_fact:
    _build_image_name: >-
      {{ 'canasta:local-' ~ (instance_id | default(id)) }}

- name: Verify Canasta source exists
  ansible.builtin.stat:
    path: "{{ build_from }}/Canasta/Dockerfile"
  register: _canasta_dockerfile

- name: Fail if Canasta source not found
  ansible.builtin.fail:
    msg: "Canasta Dockerfile not found at {{ build_from }}/Canasta/Dockerfile"
  when: not _canasta_dockerfile.stat.exists

- name: Validate build-arg format (KEY=VALUE)
  ansible.builtin.fail:
    msg: "Invalid --build-arg '{{ item }}': expected KEY=VALUE"
  loop: "{{ build_arg | default([]) }}"
  when: "'=' not in item"

# Render the user's build args as "--build-arg KEY=VALUE ..." tokens. They
# are appended after any built-in --build-arg, so a user-supplied BASE_IMAGE
# wins (docker uses the last value for a repeated build-arg key).
- name: Assemble build-arg flags
  ansible.builtin.set_fact:
    _build_arg_flags: >-
      {{ build_arg | default([])
         | map('regex_replace', '^(.+)$', '--build-arg \1')
         | join(' ') }}

# BuildKit attaches a provenance attestation that differs on every build, so
# rebuilding unchanged source would still yield a new image ID and digest, and
# upgrade would restart the instance for nothing. Only BuildKit knows the flag:
# the legacy Docker builder and podman reject it.
- name: Check whether the build runs on BuildKit
  ansible.builtin.shell:
    cmd: >-
      [ "${DOCKER_BUILDKIT:-1}" != 0 ]
      && {{ inspect_command | default('docker') }} buildx version
  register: _buildkit_probe
  changed_when: false
  failed_when: false
  when: inspect_command | default('docker') == 'docker'

- name: Drop the provenance attestation on BuildKit
  ansible.builtin.set_fact:
    _build_arg_flags: >-
      {{ ('--provenance=false ' ~ _build_arg_flags) | trim
         if (_buildkit_probe.rc | default(1)) == 0
         else _build_arg_flags }}

# A Canasta checkout with Dockerfile.canasta holds both images' source:
# canasta-base builds from its Dockerfile and canasta from Dockerfile.canasta.
# Anything else under Canasta/ is an overlay on the full Canasta image.
- name: Check whether the Canasta source holds both images
  ansible.builtin.stat:
    path: "{{ build_from }}/Canasta/Dockerfile.canasta"
  register: _canasta_two_images

# contents.yaml without Dockerfile.canasta is a Canasta checkout from before
# it built canasta-base too, whose base came from a separate repository.
- name: Check for a Canasta checkout without the canasta-base source
  ansible.builtin.stat:
    path: "{{ build_from }}/Canasta/contents.yaml"
  register: _canasta_contents

- name: Fail on a Canasta checkout without the canasta-base source
  ansible.builtin.fail:
    msg: >-
      {{ build_from }}/Canasta has no Dockerfile.canasta. Update it to a
      current Canasta checkout, which builds both canasta-base and canasta.
  when:
    - _canasta_contents.stat.exists
    - not _canasta_two_images.stat.exists

- name: Choose the canasta-base source
  ansible.builtin.set_fact:
    _base_source_dir: "{{ 'Canasta' if _canasta_two_images.stat.exists else '' }}"
    _build_base_only: "{{ build_base_only | default(false) | bool }}"
    _user_base_image: >-
      {{ build_arg | default([]) | select('match', '^BASE_IMAGE=')
         | map('regex_replace', '^BASE_IMAGE=', '') | list | last
         | default('') }}

- name: Fail if there is no canasta-base source to build alone
  ansible.builtin.fail:
    msg: >-
      --canasta-base with --build-from builds canasta-base alone, but
      {{ build_from }}/Canasta is not a Canasta checkout with
      Dockerfile.canasta.
  when:
    - _build_base_only | bool
    - _base_source_dir == ''

# The base tag is per instance, like the output tag: a host-wide one would
# let two overlapping builds put one instance's image on another's base.
- name: Name the local canasta-base build
  ansible.builtin.set_fact:
    _local_base_image: "canasta-base:local-{{ instance_id | default(id) }}"

- name: Build canasta-base alone
  ansible.builtin.command:
    cmd: >-
      {{ inspect_command | default('docker') }} build
      {{ _build_arg_flags }} -t {{ _build_image_name }} .
    chdir: "{{ build_from }}/{{ _base_source_dir }}"
  changed_when: true
  when: _build_base_only | bool

# A user-supplied BASE_IMAGE replaces the local canasta-base build, so it
# is not built.
- name: Build canasta-base locally
  ansible.builtin.command:
    cmd: >-
      {{ inspect_command | default('docker') }} build
      {{ _build_arg_flags }} -t {{ _local_base_image }} .
    chdir: "{{ build_from }}/{{ _base_source_dir }}"
  changed_when: true
  when:
    - not (_build_base_only | bool)
    - _base_source_dir != ''
    - _user_base_image == ''

# The effective base is a user-supplied BASE_IMAGE, else the built-in one.
# A canasta-base build alone has no base to record.
- name: Resolve effective BASE_IMAGE
  ansible.builtin.set_fact:
    _base_image_arg: "{{ _builtin_base }}"
    _effective_base_image: >-
      {{ '' if _build_base_only | bool else (_user_base_image or _builtin_base) }}
  vars:
    _builtin_base: >-
      {{ _local_base_image if _base_source_dir != ''
         else canasta_default_image }}

# If the effective base resolves to the output tag, the overlay would build
# FROM its own output — overwriting the base and, on a repeat build,
# silently layering the overlay on top of itself.
- name: Fail if the base image collides with the build-from output tag
  ansible.builtin.fail:
    msg: >-
      --build-arg BASE_IMAGE={{ _build_image_name }} collides with the
      build-from output tag ({{ _build_image_name }}): the overlay would build
      FROM its own output and overwrite it (and double-layer on a repeat
      build). Tag the base under a distinct name, e.g. `docker tag
      {{ _build_image_name }} canasta:merged`, and pass
      --build-arg BASE_IMAGE=canasta:merged.
  when: _effective_base_image == _build_image_name

# The user's build args follow the built-in BASE_IMAGE, so theirs wins.
- name: Build Canasta image from source
  ansible.builtin.command:
    cmd: >-
      {{ inspect_command | default('docker') }} build
      {{ '-f Dockerfile.canasta' if _canasta_two_images.stat.exists else '' }}
      --build-arg BASE_IMAGE={{ _base_image_arg }}
      {{ _build_arg_flags }} -t {{ _build_image_name }} .
    chdir: "{{ build_from }}/Canasta"
  changed_when: true
  when: not (_build_base_only | bool)

- name: Set built image fact
  ansible.builtin.set_fact:
    _built_image: "{{ _build_image_name }}"
