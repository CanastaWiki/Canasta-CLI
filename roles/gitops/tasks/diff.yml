---
# GitOps diff for Kubernetes. The Compose diff runs in direct_commands
# and never reaches Ansible.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Remember or recall the gitops SSH key
  ansible.builtin.include_tasks: _ssh_key.yml

- name: Require a Kubernetes instance
  ansible.builtin.fail:
    msg: >-
      gitops diff for Compose instances does not run under
      CANASTA_FORCE_ANSIBLE; unset it and run the command again.
  when: not (instance_is_k8s | bool)

- name: Show gitops diff
  ansible.builtin.include_tasks: diff_kubernetes.yml
