---
# GitOps push (Compose) — commit staged changes and push to remote.
# Push flow: validates role, accepts message, supports
# the staged-changes-only model.
# Requires: instance_path, instance_id (set by dispatcher)
# Optional: message (commit message, defaults to 'Configuration update')

# --- Fail fast on a locked git-crypt checkout ---
# Reading hosts.yaml below parses it as YAML; if git-crypt was never unlocked
# it is ciphertext and from_yaml crashes on non-UTF-8 bytes. Stop with an
# actionable message first.
- name: Detect a locked git-crypt checkout
  ansible.builtin.include_tasks: "_detect_gitcrypt_lock.yml"

# --- Validate role allows push ---
- name: Read hosts.yaml
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/hosts.yaml"
  register: _push_hosts_raw

- name: Read .gitops-host
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-host"
  register: _push_host_raw

- name: Parse host config
  ansible.builtin.set_fact:
    _push_hostname: "{{ _push_host_raw.content | b64decode | trim }}"
    _push_hosts: "{{ _push_hosts_raw.content | b64decode | from_yaml }}"

- name: Find current host config
  ansible.builtin.set_fact:
    _push_host_entry: >-
      {{ _push_hosts.hosts | default([])
          | selectattr('name', 'equalto', _push_hostname)
          | first | default({}) }}
    _push_role: >-
      {{ (_push_hosts.hosts | default([])
          | selectattr('name', 'equalto', _push_hostname)
          | first | default({})).get('role', 'both') }}
    _push_pr_mode: >-
      {{ (_push_hosts.hosts | default([])
          | selectattr('name', 'equalto', _push_hostname)
          | first | default({})).get('pull_requests', false) | bool }}

- name: Fail if role does not allow push
  ansible.builtin.fail:
    msg: >-
      Host '{{ _push_hostname }}' has role '{{ _push_role }}' which
      does not allow pushing. Only 'source' and 'both' roles can push.
  when: _push_role not in ['source', 'both']

- name: Install and register the git-crypt merge driver
  ansible.builtin.include_tasks: "_ensure_merge_driver.yml"

# --- Migrate pre-classifier cleartext secret literals into vars.yaml ---
# Runs before the shared-key migration so a freshly-encrypted secret can still
# be promoted to _shared if it qualifies.
- name: Migrate reclassified secret literals from env.template
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_migrate_reclassified_secrets.yml

# --- Is this host up to date with the remote? ---
# The migration below rewrites hosts/_shared/vars.yaml, which .gitattributes
# encrypts with git-crypt. Git merges the stored ciphertext, so a rewrite made
# from a stale base can never be replayed on top of another host's version and
# leaves a conflict no canasta command resolves. Defer the migration instead —
# the keys move on the next push, once the operator has pulled.
#
# A fetch that fails (no network, no credentials) leaves the host treated as up
# to date: the push that follows reports the real problem.
- name: Fetch the remote to compare against
  ansible.builtin.command:
    cmd: "git fetch origin main"
    chdir: "{{ instance_path }}"
  environment: "{{ gitops_git_env }}"
  register: _push_fetch
  changed_when: false
  failed_when: false

- name: Count commits this host is missing
  ansible.builtin.command:
    cmd: "git rev-list --count HEAD..@{upstream}"
    chdir: "{{ instance_path }}"
  register: _push_behind
  changed_when: false
  failed_when: false

- name: Record whether this host is behind the remote
  ansible.builtin.set_fact:
    _push_is_behind: >-
      {{ (_push_fetch.rc | default(1)) == 0
         and (_push_behind.rc | default(1)) == 0
         and (_push_behind.stdout | default('0', true) | trim | int) > 0 }}

# --- Auto-migrate shared-category keys to _shared/vars.yaml ---
# Keys named in gitops_shared_keys (vars/main.yml) belong in the
# shared file so all hosts inherit them. On every push, any such key
# present in host vars.yaml is moved to _shared/vars.yaml (host's
# value wins on merge) and removed from host vars.yaml. Keys not in
# the list — including environment-identifying values like
# RESTIC_REPOSITORY and AWS_BUCKET_NAME — stay per-host so dev /
# staging / prod can address different infrastructure.
- name: Read host vars
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/{{ _push_hostname }}/vars.yaml"
  register: _push_host_vars_raw

- name: Check for _shared/vars.yaml
  ansible.builtin.stat:
    path: "{{ instance_path }}/hosts/_shared/vars.yaml"
  register: _push_shared_stat

- name: Read existing shared vars
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/_shared/vars.yaml"
  register: _push_shared_vars_raw
  when: _push_shared_stat.stat.exists

- name: Migrate shared-category keys
  ansible.builtin.set_fact:
    _push_host_vars: "{{ _push_host_vars_raw.content | b64decode | from_yaml }}"
    _push_shared_vars: >-
      {{ (_push_shared_stat.stat.exists
          | ternary(_push_shared_vars_raw.content | b64decode | from_yaml, {})) }}

- name: Identify keys to migrate
  ansible.builtin.set_fact:
    _push_keys_to_migrate: >-
      {{ _push_host_vars | dict2items
         | selectattr('key', 'in', gitops_shared_keys)
         | list }}

- name: Defer the migration while this host is behind
  ansible.builtin.debug:
    msg: >-
      Holding back {{ _push_keys_to_migrate | length }} shared credential
      key(s) from hosts/_shared/vars.yaml: this host is behind the remote,
      and that file is encrypted, so a rewrite from a stale base could not
      be merged. Run 'canasta gitops pull', then push again.
  when:
    - _push_keys_to_migrate | length > 0
    - _push_is_behind | bool

- name: Write migrated shared vars
  when:
    - _push_keys_to_migrate | length > 0
    - not (_push_is_behind | bool)
  block:
    - name: Create _shared directory
      ansible.builtin.file:
        path: "{{ instance_path }}/hosts/_shared"
        state: directory
        mode: "0755"

    - name: Merge migrated keys into shared vars
      ansible.builtin.copy:
        content: >-
          {{ _push_shared_vars
             | combine(dict(_push_keys_to_migrate
                            | map(attribute='key')
                            | zip(_push_keys_to_migrate
                                  | map(attribute='value'))
                            | list))
             | to_nice_yaml(indent=2) }}
        dest: "{{ instance_path }}/hosts/_shared/vars.yaml"
        mode: "0644"
      no_log: true

    - name: Remove migrated keys from host vars
      ansible.builtin.copy:
        content: >-
          {{ _push_host_vars | dict2items
             | rejectattr('key', 'in', gitops_shared_keys)
             | items2dict
             | to_nice_yaml(indent=2) }}
        dest: "{{ instance_path }}/hosts/{{ _push_hostname }}/vars.yaml"
        mode: "0644"
      no_log: true

    - name: Stage migrated vars files
      ansible.builtin.command:
        cmd: "git add hosts/_shared/vars.yaml hosts/{{ _push_hostname }}/vars.yaml"
        chdir: "{{ instance_path }}"
      changed_when: true

    - name: Report migration
      ansible.builtin.debug:
        msg: "Migrated {{ _push_keys_to_migrate | length }} shared credential key(s) to hosts/_shared/vars.yaml."

# --- PR mode prereq check ---
- name: Check gh CLI is installed (PR mode)
  ansible.builtin.command:
    cmd: "gh --version"
  register: _gh_check
  changed_when: false
  ignore_errors: true
  when: _push_pr_mode | bool

- name: Fail if gh not installed (PR mode)
  ansible.builtin.fail:
    msg: >-
      pull_requests is enabled but the GitHub CLI (gh) is not installed.
      Install it: brew install gh / sudo apt install gh
      See https://cli.github.com/
  when:
    - _push_pr_mode | bool
    - _gh_check.rc | default(0) != 0

# --- Commit and push ---
# Note: no staging here. Users stage changes explicitly via
# 'canasta gitops add <files>'. Push only commits what's already staged
# and pushes any unpushed commits.

- name: Check for staged changes
  ansible.builtin.command:
    cmd: "git diff --cached --quiet"
    chdir: "{{ instance_path }}"
  register: _push_staged
  changed_when: false
  ignore_errors: true  # rc=1 means there are staged changes

# Commits already made (e.g. by 'canasta gitops fix-submodules') must
# still be pushed even when nothing is staged.
- name: Count unpushed commits
  ansible.builtin.command:
    cmd: "git rev-list --count @{upstream}..HEAD"
    chdir: "{{ instance_path }}"
  register: _push_unpushed
  changed_when: false
  ignore_errors: true  # no upstream configured -> treat as none

- name: Determine what there is to push
  ansible.builtin.set_fact:
    _push_has_staged: "{{ _push_staged.rc != 0 }}"
    _push_has_unpushed: "{{ (_push_unpushed.stdout | default('0', true) | trim | int) > 0 }}"

- name: Report no changes
  ansible.builtin.debug:
    msg: "No changes to push."
  when: not _push_has_staged and not _push_has_unpushed

- name: End play if nothing to push
  ansible.builtin.meta: end_play
  when: not _push_has_staged and not _push_has_unpushed

# --- Guard: never commit a git-crypt path as plaintext ---
# A checkout cloned/reset/restored without `git-crypt unlock` has no clean
# filter, so a staged encrypted path (hosts/**/vars.yaml) is cleartext and a
# commit would leak secrets to the remote. Stop before committing.
- name: Guard against committing unencrypted git-crypt files
  ansible.builtin.include_tasks: "_check_gitcrypt_staged.yml"
  when: _push_has_staged

# --- Direct push (default) ---
- name: Direct push to main
  when: not (_push_pr_mode | bool)
  block:
    - name: Commit staged changes
      ansible.builtin.command:
        cmd: >-
          git -c commit.gpgsign=false
          commit -m "{{ message | default('Configuration update') }}"
        chdir: "{{ instance_path }}"
      changed_when: true
      when: _push_has_staged

    # The commit above is already made, so on a rejection the operator's work
    # is safe locally. Catch the push failure and translate git's raw
    # non-fast-forward hint (which points at raw `git pull`) into canasta-native
    # guidance; surface any other failure verbatim.
    - name: Push to main
      ansible.builtin.command:
        cmd: "git push origin main"
        chdir: "{{ instance_path }}"
      environment: "{{ gitops_git_env }}"
      register: _push_result
      changed_when: true
      failed_when: false

    - name: Explain a non-fast-forward rejection in canasta terms
      ansible.builtin.fail:
        msg: >-
          The remote has changes this host does not have yet, so the push was
          rejected. Your local commit is safe. Run 'canasta gitops pull' to
          integrate the remote changes, then 'canasta gitops push' again.
      when:
        - _push_result.rc != 0
        - >-
          'non-fast-forward' in (_push_result.stderr | default(''))
          or 'rejected' in (_push_result.stderr | default(''))

    - name: Fail if the push failed for another reason
      ansible.builtin.fail:
        msg: "git push failed: {{ _push_result.stderr | default('') | trim }}"
      when: _push_result.rc != 0

    - name: Report pushed
      ansible.builtin.debug:
        msg: "Configuration pushed."

# --- Pull request mode ---
- name: Push via pull request
  when: _push_pr_mode | bool
  block:
    - name: Generate branch name
      ansible.builtin.set_fact:
        _push_branch: "gitops-{{ _push_hostname }}-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: Create feature branch
      ansible.builtin.command:
        cmd: "git checkout -b {{ _push_branch }}"
        chdir: "{{ instance_path }}"
      changed_when: true

    - name: Commit staged changes
      ansible.builtin.command:
        cmd: >-
          git -c commit.gpgsign=false
          commit -m "{{ message | default('Configuration update') }}"
        chdir: "{{ instance_path }}"
      register: _pr_commit
      changed_when: true
      when: _push_has_staged

    - name: Push feature branch
      ansible.builtin.command:
        cmd: "git push origin {{ _push_branch }}"
        chdir: "{{ instance_path }}"
      environment: "{{ gitops_git_env }}"
      changed_when: true

    - name: Create pull request
      ansible.builtin.command:
        cmd: >-
          gh pr create
          --title "{{ message | default('Configuration update') }}"
          --body "Gitops push from host {{ _push_hostname }}."
        chdir: "{{ instance_path }}"
      register: _pr_result
      changed_when: true

    - name: Switch back to main
      ansible.builtin.command:
        cmd: "git checkout main"
        chdir: "{{ instance_path }}"
      changed_when: false

    - name: Report pull request created
      ansible.builtin.debug:
        msg: "Pull request created: {{ _pr_result.stdout | trim }}"
