---
# Bring config/wikis.yaml and wikis.yaml.template into agreement, whichever
# one was edited.
#
# Both are compared with the template as staged in the git index, which is
# where they last agreed: this sync stages the template whenever it brings
# them into agreement. An edited template is rendered into
# config/wikis.yaml, keeping this host's urls; an edited config/wikis.yaml
# is captured into the template; edits to both that disagree stop the run
# rather than drop one. url is per-host and is not compared.
#
# A no-op unless both files exist, so it is safe on K8s gitops and
# non-gitops instances.
#
# Input: instance_path.

- name: Stat live wikis.yaml for sync
  ansible.builtin.stat:
    path: "{{ instance_path }}/config/wikis.yaml"
  register: _sync_wikis_live_stat

- name: Stat wikis.yaml.template for sync
  ansible.builtin.stat:
    path: "{{ instance_path }}/wikis.yaml.template"
  register: _sync_wikis_tmpl_stat

- name: Check for a pull still to be applied
  ansible.builtin.include_tasks: _gitops_apply_pending.yml
  when: _sync_wikis_live_stat.stat.exists and _sync_wikis_tmpl_stat.stat.exists

- name: Default to no sync
  ansible.builtin.set_fact:
    _sync_wikis_action: "none"
    _sync_wikis_active: >-
      {{ _sync_wikis_live_stat.stat.exists and _sync_wikis_tmpl_stat.stat.exists
         and not (_gitops_apply_pending | default(false) | bool) }}

- name: Read live wikis.yaml for sync
  ansible.builtin.slurp:
    src: "{{ instance_path }}/config/wikis.yaml"
  register: _sync_wikis_live_raw
  when: _sync_wikis_active | bool

- name: Read wikis.yaml.template for sync
  ansible.builtin.slurp:
    src: "{{ instance_path }}/wikis.yaml.template"
  register: _sync_wikis_tmpl_raw
  when: _sync_wikis_active | bool

- name: Read the template as staged
  ansible.builtin.shell:
    cmd: "git show :wikis.yaml.template 2>/dev/null || true"
    chdir: "{{ instance_path }}"
  register: _sync_wikis_base
  changed_when: false
  when: _sync_wikis_active | bool

# A wiki's aliases are host-specific: wikis.yaml.template names them with
# placeholders that this host's vars fill in, so an edit made in
# config/wikis.yaml has nowhere to go and would be lost on the next render.
# The live file's aliases are held to the record of them written whenever
# it last agreed with its sources.
- name: Read the record of config/wikis.yaml
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-wikis-record"
  register: _sync_wikis_record
  failed_when: false
  when: _sync_wikis_active | bool

- name: Read the host name for the alias check
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-host"
  register: _sync_wikis_host_raw
  failed_when: false
  when: _sync_wikis_active | bool

- name: Stop on a locked git-crypt checkout
  ansible.builtin.include_tasks: _detect_gitcrypt_lock.yml
  when: _sync_wikis_active | bool

# One base64 line per file: the host's vars.yaml and the shared vars.yaml,
# first as they are now and then as staged. A file that does not exist is an
# empty line; the closing line keeps trailing empty lines from being
# stripped. --filters decrypts git-crypt paths.
- name: Read the host vars now and as staged for the alias check
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      host={{ (_sync_wikis_host_raw.content | default('') | b64decode | trim) | quote }}
      for f in "hosts/$host/vars.yaml" hosts/_shared/vars.yaml; do
        if [ -f "$f" ]; then base64 < "$f" | tr -d '\n'; fi; echo
      done
      for f in "hosts/$host/vars.yaml" hosts/_shared/vars.yaml; do
        git cat-file --filters ":$f" 2>/dev/null | base64 | tr -d '\n'; echo
      done
      echo end
    chdir: "{{ instance_path }}"
    executable: /bin/bash
  register: _sync_wikis_vars
  changed_when: false
  no_log: true  # host vars hold passwords
  when:
    - _sync_wikis_active | bool
    - _sync_wikis_host_raw.content is defined

- name: Find aliases edited in config/wikis.yaml
  ansible.builtin.set_fact:
    _sync_wikis_alias_edits: >-
      {{ (_sync_wikis_live_raw.content | b64decode)
         | canasta_wikis_alias_edits(
             _sync_wikis_tmpl_raw.content | b64decode,
             _sync_wikis_base.stdout,
             (_v[1] | b64decode | from_yaml or {}) | combine(_v[0] | b64decode | from_yaml or {}),
             (_v[3] | b64decode | from_yaml or {}) | combine(_v[2] | b64decode | from_yaml or {}),
             _sync_wikis_record.content | default('') | b64decode) }}
  vars:
    _v: "{{ _sync_wikis_vars.stdout_lines }}"
  no_log: true  # reads the host vars
  when:
    - _sync_wikis_active | bool
    - _sync_wikis_vars.stdout_lines is defined

- name: Refuse alias edits made in config/wikis.yaml
  ansible.builtin.fail:
    msg: >-
      The aliases of wiki {{ _sync_wikis_alias_edits | join(', ') }} were
      changed in config/wikis.yaml. Under gitops a wiki's aliases come from
      wikis.yaml.template, as "{{ '{{' }}placeholder{{ '}}' }}" entries whose
      values are in each host's vars.yaml. Make the change there, and put
      config/wikis.yaml back as it was.
  when: _sync_wikis_alias_edits | default([]) | length > 0

- name: Decide which way to sync
  ansible.builtin.set_fact:
    _sync_wikis_live: "{{ _sync_wikis_live_raw.content | b64decode }}"
    _sync_wikis_tmpl: "{{ _sync_wikis_tmpl_raw.content | b64decode }}"
    _sync_wikis_action: >-
      {{ (_sync_wikis_live_raw.content | b64decode)
         | canasta_wikis_sync_action(
             _sync_wikis_tmpl_raw.content | b64decode,
             _sync_wikis_base.stdout) }}
  when: _sync_wikis_active | bool

- name: Fail when both files were edited and disagree
  ansible.builtin.fail:
    msg: >-
      config/wikis.yaml and wikis.yaml.template were both edited and no
      longer agree. Make the change in one of them, restore the other
      (git checkout -- wikis.yaml.template restores the template), then
      retry.
  when: _sync_wikis_action == 'conflict'

- name: Capture config/wikis.yaml edits into the template
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_reconcile_wikis_template.yml
  when: _sync_wikis_action == 'capture'

- name: Render template edits into config/wikis.yaml
  ansible.builtin.copy:
    content: >-
      {{ _sync_wikis_tmpl
         | canasta_wikis_render_with_live_urls(
             _sync_wikis_live,
             ((_v[1] | b64decode | from_yaml or {}) | combine(_v[0] | b64decode | from_yaml or {}))
             if _v else none) }}
    dest: "{{ instance_path }}/config/wikis.yaml"
    mode: "0644"
  vars:
    _v: "{{ _sync_wikis_vars.stdout_lines | default([]) }}"
  when: _sync_wikis_action == 'render'

- name: Stage the template once it agrees with config/wikis.yaml
  ansible.builtin.command:
    cmd: git add -- wikis.yaml.template
    chdir: "{{ instance_path }}"
  changed_when: false
  when: _sync_wikis_active | bool

- name: Record what config/wikis.yaml now agrees on
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_record_wikis.yml
  when: _sync_wikis_active | bool
