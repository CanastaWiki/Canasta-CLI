---
# Require a git identity for the gitops repository's commits before anything
# is changed: --git-user-name, or one already configured on the target host.
# _git_identity_repo.yml stores the flags in the repository once it exists.
#
# Optional input: git_user_name.

- name: Check git identity is configured
  ansible.builtin.command:
    cmd: "git config user.name"
  register: _git_identity
  changed_when: false
  failed_when: false
  when: git_user_name | default('', true) == ''

- name: Fail if git identity not configured
  ansible.builtin.fail:
    msg: >-
      Git user identity is not configured for this canasta gitops setup.
      Pass --git-user-name and --git-user-email to this command.
  when:
    - git_user_name | default('', true) == ''
    - _git_identity.rc != 0
