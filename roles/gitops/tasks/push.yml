---
# GitOps push.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Remember or recall the gitops SSH key
  ansible.builtin.include_tasks: _ssh_key.yml

# Nudge inline Settings.php secrets toward `config set --secret`.
# Warn-only unless gitops_strict_secrets is set.
- name: Detect inline Settings.php secrets
  ansible.builtin.include_tasks: "_detect_settings_secrets.yml"

- name: Run gitops push
  ansible.builtin.include_tasks: "_push.yml"
