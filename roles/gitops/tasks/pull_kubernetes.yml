---
# GitOps pull (Kubernetes).
# Pulls repo changes and re-renders per-host values locally.
# Use 'gitops push' to commit and push any rendered changes.
# Requires: instance_path, instance_id (set by dispatcher)

# Rebase, not merge or fast-forward-only — see pull_compose.yml. --rebase is
# explicit so the outcome does not depend on the host's ambient pull config.
- name: Pull values repo
  ansible.builtin.command:
    cmd: "git -c commit.gpgsign=false pull --rebase"
    chdir: "{{ instance_path }}"
  register: _git_pull
  changed_when: "'Already up to date' not in _git_pull.stdout"
  failed_when: false

# Never leave the repo mid-rebase: name what conflicted, roll back to where the
# pull started, and fail with local commits intact.
- name: Explain and roll back a failed pull
  when: _git_pull.rc != 0
  block:
    - name: Hand the failure to the shared explainer
      ansible.builtin.set_fact:
        _pull_failure: "{{ _git_pull }}"

    - name: Report why the pull could not be replayed
      ansible.builtin.include_tasks: "_explain_pull_failure.yml"

# Keep extensions/skins submodules in sync with the pulled pointers.
- name: Update submodules
  ansible.builtin.command:
    cmd: "git submodule update --init --recursive"
    chdir: "{{ instance_path }}"
  changed_when: _git_pull.changed
  ignore_errors: true  # OK if no submodules configured

- name: Check for multi-env structure
  ansible.builtin.stat:
    path: "{{ instance_path }}/values.template.yaml"
  register: _pull_template_check

- name: Render per-host values
  ansible.builtin.include_tasks: render_kubernetes.yml
  when:
    - _pull_template_check.stat.exists
    - _git_pull.changed

- name: Display result
  ansible.builtin.debug:
    msg: >-
      {{ _git_pull.stdout }}
      {{ (_git_pull.changed) | ternary(
         'Run "canasta gitops push" to commit rendered values.',
         '') }}
