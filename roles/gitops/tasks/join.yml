---
# GitOps join — connect an existing Canasta instance to an existing
# gitops repository. The instance must already be created (canasta create).
# This is the multi-host onboarding flow: Host A did 'gitops init',
# Host B runs 'gitops join' to connect to the same repo.
#
# Input: host_name, role, repo, key, force
# Requires: instance_path, instance_id, instance_orchestrator (set by dispatcher)

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

# Early-dispatch to the K8s join, then end_play so the ~400-line Compose
# join flow below does not run on K8s. Kept in place by design: a full
# dispatch would extract the Compose flow into its own file, but the
# end_play ends the whole play (not just this role), so the split needs a
# dedicated, integration-tested change rather than a mechanical move.
- name: Dispatch to K8s join
  ansible.builtin.include_tasks: join_kubernetes.yml
  when: instance_is_k8s | bool

- name: Skip Compose join for K8s
  ansible.builtin.meta: end_play
  when: instance_is_k8s | bool

# --- Step 1: Validate prerequisites ---
- name: Check git is installed
  ansible.builtin.command:
    cmd: "git --version"
  changed_when: false

- name: Check git-crypt is installed
  ansible.builtin.command:
    cmd: "git-crypt --version"
  changed_when: false

- name: Configure the git identity
  ansible.builtin.include_tasks: _git_identity.yml

- name: Refuse an instance already connected to a gitops repo
  ansible.builtin.include_tasks: _join_require_no_repo.yml

# --key is a controller-local path. The ansible.builtin.copy task
# below reads src from the controller automatically (Ansible's
# default copy behavior). If the file doesn't exist, copy will
# fail with a clear error.

# --- Step 2: Clone repo to temp location ---
- name: Clone the gitops repository to a temp directory
  ansible.builtin.include_tasks: _join_clone_repo.yml
  vars:
    _join_git_env: "{{ gitops_git_env }}"

# --- Step 3: Unlock git-crypt ---
# --key (the symmetric key) unlocks any git-crypt repo, including one that
# also has GPG recipients. Without it, a repo with GPG recipients is unlocked
# through a forwarded GPG agent.
- name: Detect git-crypt GPG recipients in cloned repo
  ansible.builtin.shell:
    cmd: "ls .git-crypt/keys/default/0/*.gpg >/dev/null 2>&1 && echo gpg || echo symmetric"
    chdir: "{{ _join_tmpdir.path }}"
    executable: /bin/bash
  register: _join_gitcrypt_mode
  changed_when: false
  failed_when: false

- name: Choose the git-crypt unlock method
  ansible.builtin.set_fact:
    _join_unlock: >-
      {{ 'key' if (key | default('', true) | length > 0)
         else ('gpg' if _join_gitcrypt_mode.stdout | default('') == 'gpg'
               else 'none') }}

- name: Fail if symmetric git-crypt repo but no --key provided
  ansible.builtin.fail:
    msg: >-
      This gitops repo uses a symmetric git-crypt key, but --key was not
      provided. Re-run with --key /path/to/gitops.key (the symmetric key
      file exported by `canasta gitops init`).
  when: _join_unlock == 'none'

- name: Unlock git-crypt via GPG agent
  ansible.builtin.command:
    cmd: "git-crypt unlock"
    chdir: "{{ _join_tmpdir.path }}"
  changed_when: true
  when: _join_unlock == 'gpg'

- name: Unlock git-crypt with provided key
  when: _join_unlock == 'key'
  block:
    - name: Create temp file for the git-crypt key
      ansible.builtin.tempfile:
        state: file
        prefix: "canasta-gitcrypt-"
      register: _join_keyfile

    - name: Copy git-crypt key from controller to remote
      ansible.builtin.copy:
        src: "{{ key }}"
        dest: "{{ _join_keyfile.path }}"
        mode: "0600"

    - name: Unlock git-crypt with the key
      ansible.builtin.command:
        cmd: "git-crypt unlock {{ _join_keyfile.path | quote }}"
        chdir: "{{ _join_tmpdir.path }}"
      register: _join_unlock_result
      changed_when: true
      failed_when: false

    - name: Fail if the key does not unlock the repository
      ansible.builtin.fail:
        msg: >-
          The key {{ key }} does not unlock this gitops repository. Pass the
          git-crypt key that `canasta gitops init` exported for it with --key.
      when: _join_unlock_result.rc != 0
  always:
    - name: Remove temp key from remote
      ansible.builtin.file:
        path: "{{ _join_keyfile.path }}"
        state: absent
      when: _join_keyfile.path is defined

# --- Step 4: Validate host name not already in config ---
- name: Read hosts.yaml and refuse a host name already in it
  ansible.builtin.include_tasks: _join_read_hosts.yml
  vars:
    _join_host_noun: host

# Each wiki's url on this host comes from this instance's wikis.yaml, so
# every wiki in the repo's farm must already exist here. Check before the
# instance is changed.
- name: Check for the repo's wikis template
  ansible.builtin.stat:
    path: "{{ _join_tmpdir.path }}/wikis.yaml.template"
  register: _join_template_stat

- name: Read the repo's wikis template
  ansible.builtin.slurp:
    src: "{{ _join_tmpdir.path }}/wikis.yaml.template"
  register: _join_template_raw
  when: _join_template_stat.stat.exists

- name: Read this instance's wikis
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: read
  register: _join_local_wikis

- name: Find the repo's wikis this instance lacks
  ansible.builtin.set_fact:
    _join_missing_wikis: >-
      {{ ((_join_template_raw.content | default('') | b64decode)
          | canasta_wikis_template_ids)
         | difference(_join_local_wikis.wiki_ids | default([])) }}
    _join_example_host: >-
      {{ ((_join_local_wikis.wikis | default([]) | first | default({})).url
          | default('<domain>')).split('/') | first }}

- name: Fail if this instance lacks some of the repo's wikis
  ansible.builtin.fail:
    msg: |
      This gitops repository's wiki farm has wiki(s) that instance '{{ instance_id }}' does not: {{ _join_missing_wikis | join(', ') }}.
      Each wiki's URL on this host is taken from the instance, so add them before joining, for example:
      {% for w in _join_missing_wikis %}
        canasta add -i {{ instance_id }} -w {{ w }} -u {{ _join_example_host }}/{{ w }}
      {% endfor %}
      Then run 'canasta gitops join' again. Nothing was changed.
  when: _join_missing_wikis | length > 0

# --- Step 5: Move .git into instance directory ---
- name: Move the cloned .git into the instance
  ansible.builtin.include_tasks: _join_move_git.yml

# When joining a host that was populated by a backup/restore move, the working
# tree carries each submodule's .git gitlink file but not the .git/modules
# backing (the snapshot never captures the top-level .git). Every git op below —
# starting with the diff — would then abort on the dangling gitlink. Restore
# .gitmodules, drop the stale submodule working trees, and re-clone them first.
- name: Restore .gitmodules from the cloned repo
  ansible.builtin.command:
    cmd: "git checkout HEAD -- .gitmodules"
    chdir: "{{ instance_path }}"
  changed_when: true
  failed_when: false  # repo may have no submodules

- name: Heal dangling submodule gitlinks left by a move
  ansible.builtin.include_tasks: _heal_dangling_submodules.yml

- name: Re-clone healed submodules
  ansible.builtin.include_tasks: "_update_submodules.yml"
  vars:
    submodule_git_env: "{{ gitops_git_env }}"

# Joining overlays the repo's tracked files onto a working tree that
# already holds this host's instance files. A blind `git checkout HEAD
# -- .` rewrites *every* tracked path, so it unlinks files under config/
# (Caddyfile.global, Caddyfile.site, composer.local.json) even when their
# content already matches HEAD. Those files are bind-mounted and can be
# owned by the container user, so the host account running the join may
# not be able to unlink them — aborting the whole join with an opaque
# "non-zero return code". Materialize .gitattributes first so
# git-crypt's filters decrypt encrypted paths (hosts/**) on checkout,
# then rewrite only the paths that actually differ, and turn a
# permission failure into an actionable message.
- name: Materialize .gitattributes so git-crypt filters apply on checkout
  ansible.builtin.command:
    cmd: "git checkout HEAD -- .gitattributes"
    chdir: "{{ instance_path }}"
  changed_when: true

# The joined repo may already name a merge driver this host cannot resolve
# yet; register it now so the first pull can merge encrypted paths.
- name: Install and register the git-crypt merge driver
  ansible.builtin.include_tasks: "_ensure_merge_driver.yml"

- name: Check out the files that differ from the repo
  ansible.builtin.include_tasks: _join_checkout_differing.yml
  vars:
    _join_blocked_remedy: |-
      They are likely owned by the container user (bind-mounted files
      under config/, such as Caddyfile.global, Caddyfile.site, or
      composer.local.json), so your account cannot overwrite them. Stop
      the instance and make the instance directory writable by your
      user, then retry with --reinit:

        canasta stop -i {{ id | default('<id>') }}
        sudo chown -R "$(id -un):$(id -gn)" {{ instance_path }}
        canasta gitops join ... --reinit

# --- Step 6: Extract vars from current .env ---
# Classify via the canonical secret classifier so join and init agree — a
# host that joins must placeholder exactly the keys init would (secrets +
# host-specific), or it silently diverges from the rest of the farm.
- name: Read the keys set with config set --secret
  ansible.builtin.slurp:
    src: "{{ instance_path }}/config/secret-keys"
  register: _join_opaque_names_raw
  failed_when: false

# Keys set with `config set --secret` are secrets whatever their names, so
# they are carried with the host-specific keys.
- name: Classify keys via the canonical secret classifier
  ansible.builtin.set_fact:
    _join_host_specific_keys: >-
      {{ canasta_host_specific_nonsecret
         + (_join_opaque_names_raw.content | default('') | b64decode).split() }}
    _join_secret_regex: "{{ canasta_secret_key_regex }}"

- name: Read current .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _join_env
  no_log: true  # registers the whole .env, including passwords

- name: Read wikis for URL and password extraction
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: read
  register: _join_wikis

- name: Build vars from current .env and wikis
  ansible.builtin.set_fact:
    _join_vars: >-
      {{
        dict(
          _join_env.variables | dict2items
          | selectattr('key', 'in', _join_host_specific_keys)
          | map(attribute='key')
          | map('lower')
          | zip(
              _join_env.variables | dict2items
              | selectattr('key', 'in', _join_host_specific_keys)
              | map(attribute='value')
              | list)
          | list
        )
        | combine(
            dict(
              _join_env.variables | dict2items
              | selectattr('key', 'match', _join_secret_regex)
              | map(attribute='key')
              | map('lower')
              | zip(
                  _join_env.variables | dict2items
                  | selectattr('key', 'match', _join_secret_regex)
                  | map(attribute='value')
                  | list)
              | list
            )
          )
      }}

- name: Add wiki URL vars
  ansible.builtin.set_fact:
    _join_vars: >-
      {{ _join_vars | combine(
           dict(_join_wikis.wikis | default([])
                | map(attribute='id')
                | map('regex_replace', '^', 'wiki_url_')
                | zip(_join_wikis.wikis | default([])
                      | map(attribute='url')
                      | list)
                | list)
         ) }}

- name: Read admin passwords
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_read_admin_passwords.yml"
  vars:
    admin_password_wiki_ids: "{{ _join_wikis.wiki_ids | default([]) }}"

- name: Add admin password vars
  ansible.builtin.set_fact:
    _join_vars: "{{ _join_vars | combine(_gitops_admin_passwords) }}"
  no_log: true

# --- Step 7: Add host to config and write vars ---
- name: Register this host in hosts.yaml
  ansible.builtin.include_tasks: _register_host.yml
  vars:
    _register_file_mode: "0600"
    _register_dir_mode: "0700"

# A host's vars.yaml may already carry keys prepared in the repository before
# this host existed, and not every per-host var is an .env key —
# innodb_buffer_pool_size is consumed by my.cnf.template and appears in no
# .env. Writing only the .env-derived set would drop them. The joining host's
# own .env still wins on conflict: it describes the instance that is actually
# here, where a committed value was only a prediction of it.
- name: Check for committed vars for this host
  ansible.builtin.stat:
    path: "{{ instance_path }}/hosts/{{ host_name }}/vars.yaml"
  register: _join_existing_vars_stat

- name: Read committed vars for this host
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/{{ host_name }}/vars.yaml"
  register: _join_existing_vars_raw
  when: _join_existing_vars_stat.stat.exists
  no_log: true

- name: Parse committed vars for this host
  ansible.builtin.set_fact:
    _join_existing_vars: >-
      {{ (_join_existing_vars_stat.stat.exists
          | ternary(_join_existing_vars_raw.content | default('') | b64decode
                    | from_yaml, {})) | default({}, true) }}
  no_log: true

# Kept: committed keys the .env-derived set has no value for. Replaced:
# committed entries whose key is in that set but whose pair is not, which is
# to say the same key carrying a different value.
- name: Record which committed vars this join keeps and which it replaces
  ansible.builtin.set_fact:
    _join_vars_preserved: >-
      {{ _join_existing_vars | dict2items
         | rejectattr('key', 'in', _join_vars.keys() | list)
         | map(attribute='key') | list | sort }}
    _join_vars_replaced: >-
      {{ (_join_existing_vars | dict2items
          | selectattr('key', 'in', _join_vars.keys() | list)
          | list)
         | difference(_join_vars | dict2items | list)
         | map(attribute='key') | list | sort }}

- name: Write host vars
  ansible.builtin.copy:
    content: "{{ _join_existing_vars | combine(_join_vars) | to_nice_yaml(indent=2) }}"
    dest: "{{ instance_path }}/hosts/{{ host_name }}/vars.yaml"
    mode: "0600"
  no_log: true

- name: Restrict the checked-out hosts/ tree to the operator
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_restrict_hosts_dir.yml"

- name: Report committed vars kept from the repository
  ansible.builtin.debug:
    msg: >-
      Kept from this host's committed vars.yaml, having no counterpart in
      its .env: {{ _join_vars_preserved | join(', ') }}
  when: _join_vars_preserved | length > 0

- name: Report committed vars replaced by this host's .env
  ansible.builtin.debug:
    msg: >-
      Replaced with this host's own value, taken from the .env of the
      instance being joined: {{ _join_vars_replaced | join(', ') }}
  when: _join_vars_replaced | length > 0

# --- Step 8: Write .gitops-host ---
- name: Save .gitops-host identity
  ansible.builtin.copy:
    content: "{{ host_name }}"
    dest: "{{ instance_path }}/.gitops-host"
    mode: "0644"

# --- Step 9: Render .env and wikis.yaml from templates + vars ---
# Join builds host vars from the fresh create's .env, but doesn't
# re-render .env from the template. Without this, shared vars from
# hosts/_shared/vars.yaml (backup creds, etc.) never flow into .env.
- name: Render .env and wikis.yaml from templates
  ansible.builtin.include_role:
    name: gitops
    tasks_from: render_compose.yml

# env.template carries no COMPOSE_PROFILES literal — the reconcile materializes
# it from the feature flags and DB mode. Without it a joined .env has no
# COMPOSE_PROFILES until the next start/reconcile. Mirrors pull_compose.yml.
- name: Reconcile COMPOSE_PROFILES after render
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/sync_compose_profiles.yml

- name: Regenerate orchestrator config (Caddyfile)
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml

# Rootless Podman maps container writes to a host subuid, which would later
# block operator-side writes (e.g. `gitops pull` re-rendering wikis.yaml).
# Re-own the operator-writable, container-read-only directories to the host
# user now, excluding runtime dirs the containers keep writing into.
- name: Fix operator directory ownership (rootless Podman)
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/_rootless_operator_chown.yml"
  when: not (instance_is_k8s | bool)

# --- Step 10: Update submodules ---
- name: Update submodules
  ansible.builtin.include_tasks: "_update_submodules.yml"
  vars:
    submodule_git_env: "{{ gitops_git_env }}"

# --- Step 11: Commit and push ---
# Stage only the join's own artifacts — the host registration and this host's
# vars. A blind `git add -A` also sweeps in the fresh instance's untracked
# create-time default settings (e.g. config/settings/global/*.php that this
# repo intentionally deleted) and pushes them back into the shared repo. All
# other tracked files were already reconciled to HEAD by the checkout above, so
# there is nothing else to stage. (config/wikis.yaml, .env, Caddyfile and
# .gitops-host are gitignored and never committed.)
- name: Stage the host registration and this host's vars
  ansible.builtin.command:
    cmd: "git add -- hosts/hosts.yaml hosts/{{ host_name }}/vars.yaml"
    chdir: "{{ instance_path }}"
  changed_when: true

- name: Commit and push the host registration
  ansible.builtin.include_tasks: _join_commit_push.yml
  vars:
    _join_commit_message: "Add host {{ host_name }}"
    _join_git_env: "{{ gitops_git_env }}"

# The rendered files match HEAD; `gitops pull` diffs against this commit.
- name: Record HEAD as the applied commit
  ansible.builtin.shell:
    cmd: "git rev-parse HEAD > .gitops-applied"
    chdir: "{{ instance_path }}"
  changed_when: true

# --- Step 12: Clean up temp dir ---
- name: Remove temp clone directory
  ansible.builtin.file:
    path: "{{ _join_tmpdir.path }}"
    state: absent

# --- Step 13: Report ---
- name: Report gitops joined
  ansible.builtin.debug:
    msg: >-
      Joined gitops repository for '{{ instance_id }}' as
      host '{{ host_name }}' with role '{{ role | default('both') }}'.
