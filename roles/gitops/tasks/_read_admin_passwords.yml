---
# Read each wiki's admin-password_<id> file on the instance's host.
#
# A wiki with no password file gets no key: the render writes every
# admin_password_<id> it finds back out as admin-password_<id>, so an
# empty value would replace a working password with an empty one.
#
# Input: instance_path, admin_password_wiki_ids (list of wiki IDs)
# Output: _gitops_admin_passwords ({'admin_password_<id>': password})

- name: Read admin password files
  ansible.builtin.slurp:
    src: "{{ instance_path }}/admin-password_{{ _admin_pw_wiki }}"
  loop: "{{ admin_password_wiki_ids }}"
  loop_control:
    loop_var: _admin_pw_wiki
  register: _admin_pw_files
  failed_when: >-
    _admin_pw_files is failed
    and not ((_admin_pw_files.msg | default('') | lower)
             is match('file not found:'))
  no_log: true

- name: Collect admin passwords
  ansible.builtin.set_fact:
    _gitops_admin_passwords: >-
      {{ dict(_admin_pw_files.results
              | selectattr('content', 'defined')
              | map(attribute='_admin_pw_wiki')
              | map('regex_replace', '^', 'admin_password_')
              | zip(_admin_pw_files.results
                    | selectattr('content', 'defined')
                    | map(attribute='content')
                    | map('b64decode')
                    | list)
              | list) }}
  no_log: true
