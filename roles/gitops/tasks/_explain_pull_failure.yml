---
# Turn a failed `git pull --rebase` into a message the operator can act on,
# then roll the rebase back.
#
# Conflicts are listed by kind and sent to 'canasta gitops resolve', which
# replays the pull and stops at them. This host's uncommitted changes are
# replayed as commits too (see _set_aside_local_changes.yml), so a conflict
# with one of them is resolved the same way.
#
# The conflicted paths must be read before the abort clears them.
#
# Requires: instance_path, instance_id, _pull_failure (the registered failed
# pull result).

- name: Collect conflicted paths before the rebase is rolled back
  ansible.builtin.include_tasks: _classify_conflicts.yml

# Never leave the repo mid-rebase: roll back to where the pull started so the
# operator has one clear problem to solve. The caller puts the set-aside
# local changes back afterward.
- name: Abort an incomplete rebase
  ansible.builtin.shell:
    cmd: "umask 022 && git rebase --abort"
    chdir: "{{ instance_path }}"
  register: _pull_abort
  changed_when: _pull_abort.rc == 0
  failed_when: false

- name: Restrict the restored hosts/ tree to the operator
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_restrict_hosts_dir.yml"

- name: Fail with an explanation of what blocked the pull
  ansible.builtin.fail:
    msg: |-
      {% if _pull_conflict_encrypted | length > 0 or _pull_conflict_binary | length > 0 or _pull_conflict_plain | length > 0 %}
      Cannot pull: this host's local commits or uncommitted changes conflict
      with the remote changes, so they could not be replayed on top. The pull
      was rolled back: the instance is exactly as it was, with its local
      commits and changes intact.

      Conflicting file(s):
      {% for f in _pull_conflict_plain %}
        - {{ f }} (edit to resolve)
      {% endfor %}
      {% for f in _pull_conflict_encrypted %}
        - {{ f }} (encrypted and not mergeable: keep one version)
      {% endfor %}
      {% for f in _pull_conflict_binary %}
        - {{ f }} (binary: keep one version)
      {% endfor %}

      Run 'canasta gitops resolve -i {{ instance_id }}' to replay the pull
      and stop at the conflicts. Edit out the conflict markers, or keep one
      version whole with '--keep local <file>' or '--keep remote <file>',
      then finish with '--continue'; '--abort' goes back to where the pull
      started.
      {% else %}
      Cannot pull: the rebase could not be completed and was rolled back: the
      instance is exactly as it was, with its local commits and changes intact.
      git said: {{ (_pull_failure.stdout | default('') ~ ' '
                    ~ _pull_failure.stderr | default('')) | trim }}
      {% endif %}
