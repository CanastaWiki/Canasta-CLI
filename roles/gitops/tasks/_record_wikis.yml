---
# Record the host-specific fields config/wikis.yaml holds now that it
# agrees with its gitops sources. The gitops syncs hold the next live file
# to this record to find edits made in config/wikis.yaml, which a staged
# host vars.yaml cannot show: 'canasta config set' stages the vars before
# their values reach config/wikis.yaml.
#
# Input: instance_path. Optional: _record_wikis_only, the fields to record
# from config/wikis.yaml; the others keep their recorded values.

- name: Read config/wikis.yaml for the record
  ansible.builtin.slurp:
    src: "{{ instance_path }}/config/wikis.yaml"
  register: _record_wikis_raw
  failed_when: false

- name: Read the record it replaces
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-wikis-record"
  register: _record_wikis_previous
  failed_when: false
  when: _record_wikis_only is defined

- name: Write the record of config/wikis.yaml
  ansible.builtin.copy:
    content: "{{ _record_wikis_json }}\n"
    dest: "{{ instance_path }}/.gitops-wikis-record"
    mode: "0644"
  vars:
    _record_wikis_json: >-
      {{ _record_wikis_raw.content | default('') | b64decode
         | canasta_wikis_record(
             _record_wikis_previous.content | default('') | b64decode,
             _record_wikis_only | default(none)) }}
  when: _record_wikis_json | length > 0
