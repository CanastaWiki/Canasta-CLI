---
# Detect whether git-crypt is locked in this checkout by inspecting the
# git-crypt header of hosts/hosts.yaml. If locked, try to unlock before
# failing: with --key when given (the symmetric key unlocks any git-crypt
# repo, including one that also has GPG recipients), otherwise through a
# forwarded GPG agent when the repo has GPG recipients.
#
# Requires: instance_path. Optional: key (symmetric key path on the
# controller).

- name: Read hosts.yaml git-crypt header
  ansible.builtin.shell:
    cmd: "set -o pipefail; head -c 10 hosts/hosts.yaml 2>/dev/null | od -An -tx1 | tr -d ' \\n'"
    chdir: "{{ instance_path }}"
    executable: /bin/bash
  register: _gitcrypt_lock_hdr
  changed_when: false
  failed_when: false

- name: Try to unlock a locked checkout
  when: _gitcrypt_lock_hdr.stdout | default('') == '00474954435259505400'
  block:
    - name: Detect git-crypt GPG recipients
      ansible.builtin.shell:
        cmd: "ls .git-crypt/keys/default/0/*.gpg >/dev/null 2>&1 && echo gpg || echo symmetric"
        chdir: "{{ instance_path }}"
        executable: /bin/bash
      register: _gitcrypt_mode
      changed_when: false
      failed_when: false

    # The same check git-crypt unlock makes before refusing to run.
    - name: Check for uncommitted changes that block git-crypt unlock
      ansible.builtin.command:
        cmd: "git status --porcelain --untracked-files=no"
        chdir: "{{ instance_path }}"
      register: _gitcrypt_dirty
      changed_when: false

    - name: Fail when uncommitted changes block git-crypt unlock
      ansible.builtin.fail:
        msg: |-
          git-crypt is locked in this checkout, and it cannot be unlocked
          while tracked files have uncommitted changes:
          {{ _gitcrypt_dirty.stdout }}
          Set the changes aside, unlock, and restore them, then retry. In
          {{ instance_path }}:

            git stash push --message canasta-gitcrypt-unlock
          {% if key | default('', true) | length > 0 or _gitcrypt_mode.stdout | default('') != 'gpg' %}
            git-crypt unlock /path/to/gitops.key
          {% else %}
            git-crypt unlock            # needs the GPG key / forwarded agent
          {% endif %}
            git stash pop --index

          Or discard them with 'git checkout HEAD -- <file>' and retry.
      when: _gitcrypt_dirty.stdout | trim | length > 0

    # --key names a file on the controller; git-crypt runs on the target.
    - name: Unlock with the symmetric key
      when: key | default('', true) | length > 0
      block:
        - name: Create a temp path for the git-crypt key on the target
          ansible.builtin.tempfile:
            state: file
            prefix: canasta-gitcrypt-
          register: _gitcrypt_tmpkey

        - name: Copy the git-crypt key to the target
          ansible.builtin.copy:
            src: "{{ key }}"
            dest: "{{ _gitcrypt_tmpkey.path }}"
            mode: "0600"

        - name: Run git-crypt unlock with the key
          ansible.builtin.command:
            argv: [timeout, "60", git-crypt, unlock, "{{ _gitcrypt_tmpkey.path }}"]
            chdir: "{{ instance_path }}"
          register: _gitcrypt_unlock_sym
          changed_when: _gitcrypt_unlock_sym.rc == 0
          failed_when: false
      always:
        - name: Remove the temp git-crypt key from the target
          ansible.builtin.file:
            path: "{{ _gitcrypt_tmpkey.path }}"
            state: absent
          when: _gitcrypt_tmpkey.path is defined

    - name: Run git-crypt unlock through the GPG agent
      ansible.builtin.command:
        argv: [timeout, "60", git-crypt, unlock]
        chdir: "{{ instance_path }}"
      register: _gitcrypt_unlock_gpg
      changed_when: _gitcrypt_unlock_gpg.rc == 0
      failed_when: false
      when:
        - key | default('', true) | length == 0
        - _gitcrypt_mode.stdout | default('') == 'gpg'

    - name: Read hosts.yaml git-crypt header after the unlock attempt
      ansible.builtin.shell:
        cmd: "set -o pipefail; head -c 10 hosts/hosts.yaml 2>/dev/null | od -An -tx1 | tr -d ' \\n'"
        chdir: "{{ instance_path }}"
        executable: /bin/bash
      register: _gitcrypt_relock_hdr
      changed_when: false
      failed_when: false

    - name: Fail when git-crypt could not be unlocked
      ansible.builtin.fail:
        msg: >-
          git-crypt is locked in this checkout: hosts/hosts.yaml is still
          encrypted on disk, so gitops cannot read the host topology.
          {% if key | default('', true) | length > 0 %}
          Unlocking with --key {{ key }} failed:
          {{ (_gitcrypt_unlock_sym.stderr | default('') | trim) or (_gitcrypt_unlock_sym.msg | default('')) }}
          {% elif _gitcrypt_mode.stdout | default('') == 'gpg' %}
          Unlocking through the GPG agent failed:
          {{ (_gitcrypt_unlock_gpg.stderr | default('') | trim) or (_gitcrypt_unlock_gpg.msg | default('')) }}.
          The target needs the private key, or a forwarded agent (e.g.
          RemoteForward to its S.gpg-agent); or pass --key with the
          symmetric key file.
          {% else %}
          The repo has no GPG recipients, so pass --key /path/to/gitops.key
          (the symmetric key exported by `canasta gitops init`).
          {% endif %}
      # A failed unlock (e.g. the wrong key) can leave hosts.yaml missing
      # rather than encrypted, so its exit status counts too.
      when: >-
        _gitcrypt_relock_hdr.stdout | default('') == '00474954435259505400'
        or _gitcrypt_unlock_sym.rc | default(0) != 0
        or _gitcrypt_unlock_gpg.rc | default(0) != 0
