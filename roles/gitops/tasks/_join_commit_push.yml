---
# Commit what the join staged and push it.
#
# A clean --reinit re-attach can reproduce the exact tree already in the
# repo, leaving nothing staged. Skip the commit in that case so the join
# doesn't abort on git's "nothing to commit" exit status. (--quiet exits
# non-zero when there *are* staged changes.)
#
# Input: instance_path, _join_commit_message, _join_git_env (environment
# for the push). Optional: _join_commit_identity (git -c options naming
# the committer), force.

- name: Check for staged changes
  ansible.builtin.command:
    cmd: "git diff --cached --quiet"
    chdir: "{{ instance_path }}"
  register: _join_staged
  changed_when: false
  failed_when: false

- name: Commit
  ansible.builtin.command:
    cmd: >-
      git -c commit.gpgsign=false {{ _join_commit_identity | default('') }}
      commit -m {{ _join_commit_message | quote }}
    chdir: "{{ instance_path }}"
  changed_when: true
  when: _join_staged.rc != 0

- name: Push to remote
  ansible.builtin.command:
    cmd: "git push {{ (force | default(false) | bool) | ternary('--force', '') }}"
    chdir: "{{ instance_path }}"
  environment: "{{ _join_git_env }}"
  changed_when: true
