---
# Stage one or more explicitly named files for the next gitops push.
# At least one file is required (enforced by the CLI parser). Each path
# is relative to the instance root.
#
# config/wikis.yaml is rendered from wikis.yaml.template, so staging it
# directly would drop a literal edit (e.g. a wiki display name) on the
# next render and never reach other hosts. When it is among the files,
# route it through the reconcile (capture into the template) instead of
# a bare 'git add'.
#
# Input: files (str: space-separated paths), canasta_root.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Parse the requested files
  ansible.builtin.set_fact:
    _add_files: >-
      {{ (files | default('', true)).split()
         | map('regex_replace', '^\./', '') | list }}

- name: Classify the request
  ansible.builtin.set_fact:
    _add_has_wikis: "{{ 'config/wikis.yaml' in _add_files }}"
    _add_other_files: "{{ _add_files | reject('equalto', 'config/wikis.yaml') | list }}"

# Stage each explicitly named file other than the rendered wikis.yaml.
# Keep the loop non-fatal so a bad path does not abort with the opaque
# generic "non-zero return code"; the next task turns any failure into a
# legible message.
- name: Stage requested files
  ansible.builtin.command:
    cmd: "git add -- {{ item }}"
    chdir: "{{ instance_path }}"
  register: _git_add_file
  changed_when: _git_add_file.rc == 0
  failed_when: false
  loop: "{{ _add_other_files }}"

# git add exits non-zero for a path outside the repository (e.g. a
# shell-relative '../wikis.yaml.template' typed from a subdirectory) or a
# path that does not exist. Name each rejected file with the reason in
# plain words, and remind that paths are relative to the instance root.
# When the operator is in a subdirectory of a local instance, show the
# root-relative spelling of what they typed.
- name: Locate the current directory within a local instance
  ansible.builtin.set_fact:
    _add_cwd_rel: >-
      {{ (_add_cwd | relpath(instance_path))
         if (ansible_connection | default('local')) == 'local'
            and _add_cwd.startswith(instance_path.rstrip('/') ~ '/')
         else '' }}
  vars:
    _add_cwd: >-
      {{ (lookup('env', 'CANASTA_HOST_PWD')
          | default(lookup('env', 'PWD'), true)).rstrip('/') }}

- name: Fail clearly when a requested file could not be staged
  ansible.builtin.fail:
    msg: |-
      Could not stage the following file(s). Paths are relative to the
      instance root ({{ instance_path }}), not your current directory.
      {% for f in _git_add_failures %}
      {% set err = f.stderr | default('', true) | trim %}
      {% if 'did not match any files' in err %}
      - {{ f.item }}: no such file under the instance root
      {% elif 'outside repository' in err %}
      - {{ f.item }}: outside the instance
      {% else %}
      - {{ f.item }}: {{ err | regex_replace('^(fatal|error): ', '') | default('git add failed', true) }}
      {% endif %}
      {% if _add_cwd_rel and not f.item.startswith('/') %}
        typed from {{ _add_cwd_rel }}/, that is {{ (_add_cwd_rel ~ '/' ~ f.item) | normpath }}
      {% endif %}
      {% endfor %}
  vars:
    _git_add_failures: >-
      {{ _git_add_file.results | default([])
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0) | list }}
  when: _git_add_failures | length > 0

- name: Check for a pull still to be applied
  ansible.builtin.include_tasks: _gitops_apply_pending.yml
  when: _add_has_wikis

# Until the pulled commit is rendered, config/wikis.yaml still holds the
# previous values, so capturing it would undo the pulled change.
- name: Refuse to capture config/wikis.yaml before a pulled commit is applied
  ansible.builtin.fail:
    msg: >-
      The last 'canasta gitops pull' fetched a commit but stopped before
      applying it, so config/wikis.yaml does not reflect it yet. Fix what
      stopped the pull, then run 'canasta gitops pull' again before
      capturing config/wikis.yaml.
  when:
    - _add_has_wikis
    - _gitops_apply_pending | bool

# config/wikis.yaml: capture the literal edit into the template rather
# than staging the rendered file.
- name: Capture wikis.yaml edits into the gitops template
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_reconcile_wikis_template.yml
  when: _add_has_wikis

- name: Check whether config/wikis.yaml is tracked
  ansible.builtin.command:
    cmd: "git ls-files --error-unmatch config/wikis.yaml"
    chdir: "{{ instance_path }}"
  register: _wikis_tracked
  failed_when: false
  changed_when: false
  when: _add_has_wikis

# Stage the rendered wikis.yaml only when it is tracked (it is gitignored
# on current instances, where there is nothing to stage and a bare
# 'git add' would error).
- name: Stage the tracked rendered wikis.yaml
  ansible.builtin.command:
    cmd: "git add -- config/wikis.yaml"
    chdir: "{{ instance_path }}"
  register: _git_add_wikis
  changed_when: _git_add_wikis.rc == 0
  when:
    - _add_has_wikis
    - (_wikis_tracked.rc | default(1)) == 0

# wikis.yaml.template lives at the instance root; stage it whenever it
# exists (a no-op when unchanged).
- name: Stage wikis.yaml.template
  ansible.builtin.command:
    cmd: "git add -- wikis.yaml.template"
    chdir: "{{ instance_path }}"
  register: _git_add_tmpl
  changed_when: _git_add_tmpl.rc == 0
  when:
    - _add_has_wikis
    - _reconcile_wikis_tmpl.stat.exists | default(false)

- name: Report captured wikis.yaml edits
  ansible.builtin.debug:
    msg: >-
      Captured config/wikis.yaml edits into wikis.yaml.template
      (e.g. wiki display names). Staged for push.
  when:
    - _add_has_wikis
    - _reconcile_wikis_write is defined
    - _reconcile_wikis_write.changed | default(false)
