---
# Record the aliases config/wikis.yaml holds now that it agrees with its
# gitops sources. The wikis.yaml sync holds the next live file to this
# record to find aliases edited in config/wikis.yaml, which a staged host
# vars.yaml cannot show: 'canasta config set' stages the vars before their
# alias values reach config/wikis.yaml.
#
# Input: instance_path.

- name: Read config/wikis.yaml for the alias record
  ansible.builtin.slurp:
    src: "{{ instance_path }}/config/wikis.yaml"
  register: _record_wikis_raw
  failed_when: false

- name: Write the alias record
  ansible.builtin.copy:
    content: "{{ _record_wikis_json }}\n"
    dest: "{{ instance_path }}/.gitops-wikis-aliases"
    mode: "0644"
  vars:
    _record_wikis_json: >-
      {{ _record_wikis_raw.content | default('') | b64decode
         | canasta_wikis_alias_record }}
  when: _record_wikis_json | length > 0
