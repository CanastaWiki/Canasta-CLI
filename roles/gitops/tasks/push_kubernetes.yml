---
# GitOps push (Kubernetes).
# Syncs config files into values.yaml, re-renders per-host values,
# then pushes to remote. Argo CD detects the change and syncs.
# Requires: instance_path, instance_id (set by dispatcher)
# Optional: message (commit message, defaults to 'Configuration update')

- name: Set K8s namespace
  ansible.builtin.set_fact:
    _k8s_namespace: "canasta-{{ instance_id }}"

# --- Validate role allows push ---
- name: Read hosts.yaml
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/hosts.yaml"
  register: _push_hosts_raw

- name: Read .gitops-host
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-host"
  register: _push_host_raw

- name: Find current host role
  ansible.builtin.set_fact:
    _push_hostname: "{{ _push_host_raw.content | b64decode | trim }}"
    _push_role: >-
      {{ ((_push_hosts_raw.content | b64decode | from_yaml).hosts | default([])
          | selectattr('name', 'equalto', _push_host_raw.content | b64decode | trim)
          | first | default({})).get('role', 'both') }}

- name: Fail if role does not allow push
  ansible.builtin.fail:
    msg: >-
      Host '{{ _push_hostname }}' has role '{{ _push_role }}' which
      does not allow pushing. Only 'source' and 'both' roles can push.
  when: _push_role not in ['source', 'both']

- name: Regenerate Caddyfile from current wikis.yaml
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/rewrite_caddy.yml"

- name: Sync config files
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/k8s_sync_config.yml"

# --- Version gitops-managed Secrets into git as SOPS-encrypted manifests.
# Self-describing: a .sops.yaml at the repo root (written by gitops init
# --encrypt-secrets) is the marker that this instance encrypts its Secrets, so
# push needs no flag of its own. Git becomes the source of truth for the
# Secrets Argo renders. ---
- name: Check whether the instance uses SOPS secret encryption
  ansible.builtin.stat:
    path: "{{ instance_path }}/.sops.yaml"
  register: _push_sops_marker

- name: Version gitops-managed Secrets with SOPS
  when: _push_sops_marker.stat.exists
  block:
    - name: Resolve gitops host name
      ansible.builtin.slurp:
        src: "{{ instance_path }}/.gitops-host"
      register: _push_host_file

    - name: Set gitops host name
      ansible.builtin.set_fact:
        host_name: "{{ _push_host_file.content | b64decode | trim }}"

    - name: Encrypt Secrets into git
      ansible.builtin.include_tasks: _write_sops_secrets.yml

- name: Render sidecars to Helm values
  canasta_render_sidecars:
    instance_path: "{{ instance_path }}"
    orchestrator: kubernetes
    secret_key_regex: "{{ canasta_secret_key_regex }}"

- name: Read values.yaml from remote
  ansible.builtin.slurp:
    src: "{{ instance_path }}/values.yaml"
  register: _push_values

- name: Read values-configdata.yaml from remote
  ansible.builtin.slurp:
    src: "{{ instance_path }}/values-configdata.yaml"
  register: _push_configdata

- name: Read values-sidecars.yaml from remote
  ansible.builtin.slurp:
    src: "{{ instance_path }}/values-sidecars.yaml"
  register: _push_sidecars

# Derive the ingress domains from the farm's wiki URLs (union extraDomains) so
# the committed rendered values route exactly the wikis' hostnames — the same
# derivation helm_deploy.yml applies on a direct deploy, done here so a
# GitOps-managed instance (deployed by Argo from rendered-values.yaml) stays in
# sync. Falls back to the persisted domains when wikis.yaml is absent/empty.
- name: Read wikis.yaml for ingress-domain derivation
  ansible.builtin.slurp:
    src: "{{ instance_path }}/config/wikis.yaml"
  register: _push_wikis_raw
  failed_when: false

- name: Derive ingress domains from wiki URLs
  ansible.builtin.set_fact:
    _push_base_values: "{{ _push_values.content | b64decode | from_yaml }}"
    _push_domains: >-
      {{ (_push_wikis_raw.content | default('') | b64decode)
         | canasta_wiki_ingress_domains(
             (_push_values.content | b64decode | from_yaml).extraDomains
             | default([]), []) }}

# configData + sidecars are complete, freshly-rebuilt snapshots that fully own
# their keys — merge NON-recursively so each REPLACES the copy already in
# values.yaml (a recursive merge would keep stale keys from deleted files
# forever). The derived domains list likewise replaces the persisted one.
- name: Merge fresh configData + sidecars + derived domains over the values
  ansible.builtin.set_fact:
    _push_merged_values: >-
      {{ _push_base_values
         | combine(_push_configdata.content | b64decode | from_yaml)
         | combine(_push_sidecars.content | b64decode | from_yaml)
         | combine({'domains': _push_domains}
                   if (_push_domains | length) > 0 else {}) }}

- name: Merge configData + sidecars into values.yaml for git
  ansible.builtin.copy:
    content: "{{ _push_merged_values | to_nice_yaml(indent=2) }}"
    dest: "{{ instance_path }}/values.yaml"
    mode: "0644"

# Re-render per-host values from template + vars if the multi-env
# structure exists. Single-env instances without hosts/ are unaffected.
- name: Check for multi-env structure
  ansible.builtin.stat:
    path: "{{ instance_path }}/values.template.yaml"
  register: _push_template_check

- name: Update values.template.yaml from current values
  ansible.builtin.copy:
    content: "{{ _push_merged_values | to_nice_yaml(indent=2) }}"
    dest: "{{ instance_path }}/values.template.yaml"
    mode: "0644"
  when: _push_template_check.stat.exists

- name: Render per-host values
  ansible.builtin.include_tasks: render_kubernetes.yml
  vars:
    render_secret_checksums: true
  when: _push_template_check.stat.exists

# Values that select MediaWiki's own database account make the web pods read
# its password from the db Secret's WIKI_DB_PASSWORD key, which upgrade adds
# to the live Secret when it stages the move. Without the key, Argo CD would
# roll out pods that cannot start, so do not publish such values.
- name: Find the database account the pushed values select
  ansible.builtin.set_fact:
    _push_db_values: >-
      {{ ((_rendered_values if _push_template_check.stat.exists
           else _push_merged_values).db | default({})) }}
    _push_db_secret_name: >-
      {{ (_rendered_values if _push_template_check.stat.exists
          else _push_merged_values).secrets.dbSecretName
         | default(instance_id ~ '-db-credentials', true) }}

- name: Decide whether the pushed values need the account's password
  ansible.builtin.set_fact:
    _push_wiki_db_user: >-
      {{ (_push_db_values.wikiUser | default('root', true))
         if (_push_db_values.enabled | default(true) | bool) else 'root' }}

- name: Read the db Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: "{{ _push_db_secret_name }}"
    namespace: "{{ _k8s_namespace }}"
  register: _push_db_secret
  no_log: true
  when: _push_wiki_db_user != 'root'

- name: Refuse values whose account has no password in the db Secret
  ansible.builtin.fail:
    msg: >-
      Not pushing: this host's values make MediaWiki connect as
      '{{ _push_wiki_db_user }}', but the {{ _push_db_secret_name }} Secret
      has no WIKI_DB_PASSWORD key, so the web pods Argo CD rolls out could
      not start. 'canasta upgrade' adds the key when it moves the instance
      to its own account. To push without it, put this host back on root
      with 'canasta config set CANASTA_DB_ROOT_ACCOUNT=true -i
      {{ instance_id }}'.
  when:
    - _push_wiki_db_user != 'root'
    - >-
      'WIKI_DB_PASSWORD' not in
      ((_push_db_secret.resources | default([]) | first | default({})).data
       | default({}, true))

- name: Stage changes to the gitops-managed paths
  ansible.builtin.include_tasks: _stage_tracked_paths.yml
  vars:
    _stage_paths: "{{ gitops_k8s_tracked_paths }}"

- name: Check for staged changes
  ansible.builtin.command:
    cmd: "git diff --cached --quiet"
    chdir: "{{ instance_path }}"
  register: _git_staged
  changed_when: false
  ignore_errors: true

- name: Commit staged changes
  ansible.builtin.command:
    argv:
      - git
      - -c
      - commit.gpgsign=false
      - commit
      - -m
      - "{{ message | default('Configuration update', true) }}"
    chdir: "{{ instance_path }}"
    # The message is taken verbatim; a $WORD in it is not a variable.
    expand_argument_vars: false
  when: _git_staged.rc != 0
  changed_when: true

# Push whenever the local branch is ahead of its upstream — this run's commit
# OR a commit left behind by an earlier push whose `git push` failed after the
# commit (a transient drop / SSH reset). Gating the push on freshly-staged
# changes alone stranded that earlier commit: the next push staged nothing, so
# it never retried and the config was silently never published.
- name: Count commits not yet pushed
  ansible.builtin.command:
    cmd: "git rev-list --count @{u}..HEAD"
    chdir: "{{ instance_path }}"
  register: _unpushed
  changed_when: false
  failed_when: false

# Authenticate with the staged deploy key (or --ssh-key), like init/join — not
# the ambient ssh/agent, which isn't present on every gitops host (a joined
# host authenticates only via its .gitops-deploy-key).
- name: Push to remote
  ansible.builtin.command:
    cmd: "git push"
    chdir: "{{ instance_path }}"
  when: (_unpushed.stdout | default('0', true) | int) > 0
  environment: "{{ gitops_k8s_git_env }}"
  register: _push_result
  changed_when: true
  failed_when: false

# The commit is already in place, so on a rejection the operator's work is safe
# locally. Translate git's raw non-fast-forward hint into canasta-native
# guidance; surface any other failure verbatim.
- name: Explain a non-fast-forward rejection in canasta terms
  ansible.builtin.fail:
    msg: >-
      The remote has changes this host does not have yet, so the push was
      rejected. Your local commit is safe. Run 'canasta gitops pull' to
      integrate the remote changes, then 'canasta gitops push' again.
  when:
    - _push_result is defined
    - _push_result.rc | default(0) != 0
    - >-
      'non-fast-forward' in (_push_result.stderr | default(''))
      or 'rejected' in (_push_result.stderr | default(''))

- name: Fail if the push failed for another reason
  ansible.builtin.fail:
    msg: "git push failed: {{ _push_result.stderr | default('') | trim }}"
  when:
    - _push_result is defined
    - _push_result.rc | default(0) != 0

- name: Report result
  ansible.builtin.debug:
    msg: >-
      {{ ((_unpushed.stdout | default('0', true) | int) > 0)
         | ternary('Configuration pushed. Argo CD will sync shortly.',
                   'No changes to push.') }}
