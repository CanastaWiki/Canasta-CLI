---
# GitOps join (Kubernetes) — connect a K8s instance to an existing
# gitops repository as a new environment.
#
# Clones the repo, creates per-host vars from the instance's current
# values.yaml, renders rendered-values.yaml, creates an Argo CD
# Application pointing at the new rendered file.
#
# No git-crypt on K8s. A K8s repo is cleartext unless it was initialized with
# --encrypt-secrets, in which case a .sops.yaml marks it and this join
# provisions the operator key (via --key) + a helm-sops sidecar on the joining
# cluster so its Argo can decrypt (see _join_sops.yml). The Compose join path
# (gitops/tasks/join.yml) still uses git-crypt unlock instead.
#
# Input: host_name, role, repo, key, force
#   key is the SSH deploy key path basename (private at <key>.ssh,
#   public at <key>.ssh.pub). Despite the name, no git-crypt meaning
#   on K8s.
# Requires: instance_path, instance_id (set by dispatcher)

# --- Validate prerequisites ---
- name: Require --key (the SSH deploy key basename)
  ansible.builtin.fail:
    msg: >-
      --key is required on Kubernetes: it is the basename of the SSH deploy
      key generated by `canasta gitops init` (<key>.ssh).
  when: key | default('', true) | length == 0

- name: Require an SSH repository URL
  ansible.builtin.include_tasks: _require_ssh_remote.yml

- name: Check git is installed
  ansible.builtin.command:
    cmd: "git --version"
  changed_when: false

- name: Refuse an instance already connected to a gitops repo
  ansible.builtin.include_tasks: _join_require_no_repo.yml

# --- Snapshot this host's own values.yaml ---
# The per-host vars written further down (domains above all — this host's
# identity) must describe THIS host. values.yaml is tracked in the K8s repo, so
# the checkout that materializes the clone replaces it with the repo's copy,
# i.e. the first host's. Read it here, before any repo work touches it, and
# extract the per-host vars from this snapshot.
- name: Snapshot this host's values.yaml before the clone overwrites it
  ansible.builtin.slurp:
    src: "{{ instance_path }}/values.yaml"
  register: _join_local_values_raw

# --- Stage SSH deploy key on the target ---
# The SSH deploy key was generated by the original `gitops init`
# (see init_kubernetes.yml). The operator passes --key as the
# basename — `<key>.ssh` is the private key, `<key>.ssh.pub` is
# the public side they registered as a deploy key on the forge.
# The private key gets mirrored to the target so git operations
# there can authenticate against the forge.
# --ssh-key, when passed, overrides _ssh_key_target_path in the
# GIT_SSH_COMMAND below; otherwise the staged deploy key is used.
- name: Set SSH key paths
  ansible.builtin.set_fact:
    _ssh_key_path: "{{ key }}.ssh"
    _ssh_key_target_path: "{{ instance_path }}/.gitops-deploy-key"

# The deploy key lives on the controller, but by this point resolve_instance
# has switched the play's connection to the instance host. delegate_to:
# localhost + vars: ansible_connection: local does NOT reliably override that
# host-level switch, so the slurp would run on the target and fail to find the
# controller path (silently — no_log + the minimal stdout callback hide it).
# Use the save/switch-to-local/restore dance instead, the same shape
# init_kubernetes.yml uses for its controller-side key work.
- name: Save connection state before controller-side key read
  ansible.builtin.set_fact:
    _gjk_saved:
      host: "{{ ansible_host | default('localhost') }}"
      conn: "{{ ansible_connection | default('local') }}"
      user: "{{ ansible_user | default('') }}"
      python: "{{ ansible_python_interpreter | default(ansible_playbook_python) }}"

- block:
    - name: Switch to local for SSH key read
      ansible.builtin.set_fact:
        ansible_host: "localhost"
        ansible_connection: "local"
        ansible_user: ""
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Read SSH deploy key from controller
      ansible.builtin.slurp:
        src: "{{ _ssh_key_path }}"
      register: _gitops_ssh_key
      no_log: true
  always:
    - name: Restore connection state after key read
      ansible.builtin.set_fact:
        ansible_host: "{{ _gjk_saved.host }}"
        ansible_connection: "{{ _gjk_saved.conn }}"
        ansible_user: "{{ _gjk_saved.user }}"
        ansible_python_interpreter: "{{ _gjk_saved.python }}"

- name: Stage SSH deploy private key on target for git operations
  ansible.builtin.copy:
    content: "{{ _gitops_ssh_key.content | b64decode }}"
    dest: "{{ _ssh_key_target_path }}"
    mode: "0600"
  no_log: true

# --- Clone repo to temp location ---
- name: Clone the gitops repository to a temp directory
  ansible.builtin.include_tasks: _join_clone_repo.yml
  vars:
    _join_git_env: "{{ gitops_k8s_git_env }}"

# A SOPS-managed repo (.sops.yaml at the root) means this joining cluster must
# render encrypted Secrets: it needs the operator age key (to decrypt) and its
# own helm-sops sidecar. Detected from the fresh clone; the provisioning +
# key-match check happen below (after the tree is materialized), and the Argo
# Application is generated with the plugin source accordingly.
- name: Detect a SOPS-managed repo in the clone
  ansible.builtin.stat:
    path: "{{ _join_tmpdir.path }}/.sops.yaml"
  register: _join_sops_marker

- name: Enable SOPS for this environment when the repo is SOPS-managed
  ansible.builtin.set_fact:
    gitops_sops_secrets: "{{ _join_sops_marker.stat.exists }}"

# --- Validate host name not already in config ---
- name: Read hosts.yaml and refuse an environment name already in it
  ansible.builtin.include_tasks: _join_read_hosts.yml
  vars:
    _join_host_noun: environment

# --- Move .git into instance directory ---
- name: Move the cloned .git into the instance
  ansible.builtin.include_tasks: _join_move_git.yml

# Mirror the Compose join: a blind `git checkout HEAD -- .` rewrites
# every tracked path and can fail to unlink pre-existing, differently
# owned files. Materialize .gitattributes first so git-crypt
# decrypts hosts/** on checkout, then rewrite only the files that differ
# and surface a permission failure as an actionable message.
# Compose gitops repos carry a .gitattributes that drives git-crypt
# decryption on checkout. K8s gitops repos are cleartext (secrets live in
# K8s Secrets, not the repo), so they have no .gitattributes — make this a
# no-op there rather than a hard failure on a missing pathspec.
- name: Materialize .gitattributes so git-crypt filters apply on checkout
  ansible.builtin.command:
    cmd: "git checkout HEAD -- .gitattributes"
    chdir: "{{ instance_path }}"
  changed_when: true
  failed_when: false

- name: Check out the files that differ from the repo
  ansible.builtin.include_tasks: _join_checkout_differing.yml
  vars:
    _join_blocked_remedy: |-
      They are likely owned by a different user than the account running
      the join. Make the instance directory writable by your user, then
      retry with --reinit:

        sudo chown -R "$(id -un):$(id -gn)" {{ instance_path }}
        canasta gitops join ... --reinit

# Materialize extensions/skins submodules so this host has the source of
# truth on disk for the user-extensions / user-skins PVC sync.
- name: Update submodules
  ansible.builtin.include_tasks: "_update_submodules.yml"
  vars:
    submodule_git_env:
      GIT_SSH_COMMAND: >-
        ssh -i {{ ssh_key | default(_ssh_key_target_path, true) }}
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile=~/.ssh/known_hosts

# --- Extract per-host vars from this host's own values.yaml ---
# Deliberately the pre-clone snapshot, not the file on disk: the checkout above
# has already replaced values.yaml with the repo's copy, so reading it here
# would record the first host's domains as this host's identity.
- name: Parse this host's values snapshot
  ansible.builtin.set_fact:
    _join_values: "{{ _join_local_values_raw.content | b64decode | from_yaml }}"

# --- Add host to config and write vars ---
- name: Register this environment in hosts.yaml
  ansible.builtin.include_tasks: _register_host.yml
  vars:
    _register_file_mode: "0644"
    _register_dir_mode: "0755"

# MediaWiki's account lives in this host's own database server, so which one
# it uses is this host's choice, from its .env.
- name: Read MediaWiki's database account
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/k8s_wiki_db_user.yml"

- name: Write host vars from current values
  ansible.builtin.copy:
    content: |
      # Per-environment values for {{ host_name }}
      domains:
      {% for d in _join_values.domains | default(['localhost']) %}
        - "{{ d }}"
      {% endfor %}
      instance_id: "{{ instance_id }}"
      image_tag: "{{ _join_values.image.tag | default('') }}"
      db_secret_name: "{{ _join_values.secrets.dbSecretName | default('') }}"
      mw_secret_name: "{{ _join_values.secrets.mwSecretName | default('') }}"
      ingress_class: "{{ _join_values.ingress.className | default('') }}"
      ingress_tls: {{ _join_values.ingress.tls | default(true) | lower }}
      web_replica_count: {{ _join_values.web.replicaCount | default(1) }}
      wiki_db_user: "{{ _k8s_wiki_db_user }}"
    dest: "{{ instance_path }}/hosts/{{ host_name }}/vars.yaml"
    mode: "0644"
  no_log: true

# --- Save host identity (before render, which reads it) ---
- name: Save .gitops-host identity
  ansible.builtin.copy:
    content: "{{ host_name }}"
    dest: "{{ instance_path }}/.gitops-host"
    mode: "0644"

# --- Render values for this environment ---
- name: Render values from template + vars
  ansible.builtin.include_tasks: render_kubernetes.yml

# --- Create Argo CD Application for this environment ---
- name: Create argocd directory
  ansible.builtin.file:
    path: "{{ instance_path }}/argocd"
    state: directory
    mode: "0755"

- name: Generate Argo CD Application manifest
  ansible.builtin.copy:
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: canasta-{{ instance_id }}
        namespace: {{ argocd_namespace | default('argocd') }}
      spec:
        project: default
        source:
          repoURL: {{ repo }}
          targetRevision: HEAD
          path: .
      {% if gitops_sops_secrets | default(false) | bool %}
          plugin:
            name: helm-sops
            env:
              - name: HELM_ARGS
                value: "-f hosts/{{ host_name }}/rendered-values.yaml"
              - name: SECRETS_DIR
                value: "hosts/{{ host_name }}/secrets"
      {% else %}
          helm:
            valueFiles:
              - hosts/{{ host_name }}/rendered-values.yaml
      {% endif %}
        destination:
          server: https://kubernetes.default.svc
          namespace: canasta-{{ instance_id }}
        syncPolicy:
          automated:
            selfHeal: true
            prune: true
          syncOptions:
            - CreateNamespace=true
    dest: "{{ instance_path }}/argocd/application.yaml"
    mode: "0644"

# Argo CD on the new host needs the deploy key to clone the repo (and, for
# a self-hosted host, its key trusted), just as init sets up on the first
# host. Without this the Application can't authenticate and never syncs.
- name: Apply Argo CD repo credential Secret + known-hosts trust
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_apply_argo_repo_secret.yml"

# --- SOPS decryption for a joined SOPS-managed repo (gated) ---
# Verify the operator key matches the repo, provision the sops-age Secret, and
# add the helm-sops sidecar so this cluster's Argo can decrypt at render — must
# precede applying the plugin-source Application below.
- name: Provision SOPS decryption on the joining cluster
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_join_sops.yml"
  when: gitops_sops_secrets | default(false) | bool

- name: Ensure the Argo CD repo-server has the helm-sops sidecar
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/k8s_ensure_sops_sidecar.yml"
  when: gitops_sops_secrets | default(false) | bool

- name: Apply Argo CD Application to cluster
  ansible.builtin.include_tasks: _apply_argo_application.yml

# --- Commit and push ---
# Stage only the join's own artifacts: the host registration, this host's
# vars, its rendered values, and the Argo CD Application for this instance. A
# blind `git add -A` also sweeps in the fresh instance's untracked create-time
# files (values.yaml and friends), pushing them into the shared repo. All other
# tracked files were already reconciled to HEAD by the checkout above, so there
# is nothing else to stage (.gitops-host is gitignored).
- name: Stage the host registration and this host's artifacts
  ansible.builtin.command:
    cmd: >-
      git add -- hosts/hosts.yaml
      hosts/{{ host_name }}/vars.yaml
      hosts/{{ host_name }}/rendered-values.yaml
      argocd/application.yaml
    chdir: "{{ instance_path }}"
  changed_when: true

# The commit runs on the target host, which usually has no git identity
# configured (unlike init, which commits on the controller). Set the
# identity inline so the commit never aborts with "Author identity
# unknown" — overridable by --git-user-name / --git-user-email.
- name: Commit and push the environment registration
  ansible.builtin.include_tasks: _join_commit_push.yml
  vars:
    _join_commit_message: "Add environment {{ host_name }}"
    _join_commit_identity: >-
      -c user.name={{ (git_user_name | default('Canasta GitOps', true)) | quote }}
      -c user.email={{ (git_user_email | default('canasta-gitops@' ~ host_name, true)) | quote }}
    _join_git_env: "{{ gitops_k8s_git_env }}"

# --- Clean up ---
- name: Remove temp clone directory
  ansible.builtin.file:
    path: "{{ _join_tmpdir.path }}"
    state: absent

- name: Report gitops joined
  ansible.builtin.debug:
    msg: >-
      Joined gitops repository for '{{ instance_id }}' as
      environment '{{ host_name }}'.
      Argo CD Application points to hosts/{{ host_name }}/rendered-values.yaml.
