---
# Bring the instance's tracked files to the repo's HEAD.
#
# Joining overlays the repo's tracked files onto a working tree that
# already holds this host's instance files. A blind `git checkout HEAD --
# .` rewrites *every* tracked path, so it unlinks files even when their
# content already matches HEAD, and fails on ones the account running the
# join cannot unlink (#571). Rewrite only the paths that actually differ,
# and turn a permission failure into an actionable message. The caller
# materializes .gitattributes first so git-crypt filters decrypt encrypted
# paths on checkout.
#
# Input: instance_path, _join_blocked_remedy (what the failure message
# tells the operator to do about files that could not be replaced).

- name: Find tracked files whose content differs from the repo
  ansible.builtin.command:
    cmd: "git diff --name-only HEAD"
    chdir: "{{ instance_path }}"
  register: _join_diff
  changed_when: false

- name: Check out only the differing files (decrypted via git-crypt)
  ansible.builtin.command:
    cmd: "git checkout HEAD -- {{ item | quote }}"
    chdir: "{{ instance_path }}"
  loop: "{{ _join_diff.stdout_lines }}"
  register: _join_checkout
  changed_when: true
  failed_when: false

- name: Fail with guidance if any file could not be replaced
  vars:
    _join_blocked: >-
      {{ _join_checkout.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
         | map(attribute='item') | list }}
  ansible.builtin.fail:
    msg: |
      Could not replace these tracked files while joining the gitops
      repository (permission denied):

      {% for f in _join_blocked %}
        {{ f }}
      {% endfor %}

      {{ _join_blocked_remedy }}
  when: _join_blocked | length > 0

# Match what `canasta gitops pull` does (git pull --rebase), so an operator
# who runs raw git in the instance directory gets the same result.
- name: Configure git pull strategy
  ansible.builtin.command:
    cmd: "git config pull.rebase true"
    chdir: "{{ instance_path }}"
  changed_when: true
