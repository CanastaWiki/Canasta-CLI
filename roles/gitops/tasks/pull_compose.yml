---
# GitOps pull (Compose) — full multi-host flow.
# Pulls from remote, renders .env and wikis.yaml from templates + host
# vars, writes admin passwords, detects what changed, and flags whether
# a restart or maintenance update is needed.
# Requires: instance_path, instance_id (set by dispatcher)

# --- Step 0: Fail fast on a locked git-crypt checkout ---
# Rendering below parses hosts/**/vars.yaml as YAML; if git-crypt was never
# unlocked those are ciphertext and from_yaml crashes on non-UTF-8 bytes. Stop
# with an actionable message first.
- name: Detect a locked git-crypt checkout
  ansible.builtin.include_tasks: "_detect_gitcrypt_lock.yml"

# Host-local, touches no tracked file, so it is safe ahead of the dirty-tree
# check below. Registering here is what lets a repo created before the driver
# existed start merging encrypted paths on its next pull.
- name: Install and register the git-crypt merge driver
  ansible.builtin.include_tasks: "_ensure_merge_driver.yml"

# An uncaptured config/wikis.yaml edit would be overwritten by the render
# below; capture it first so the uncommitted-changes check stops the pull.
- name: Sync wikis.yaml with its gitops template
  ansible.builtin.include_tasks: "sync_wikis_yaml.yml"

# --- Step 1: Check for uncommitted changes ---
# Only tracked files are a hazard: a pull can overwrite a locally modified
# tracked file. Untracked files cannot be clobbered unless an incoming commit
# adds the same path, which git itself refuses with a clear message — so
# --untracked-files=no keeps a host-local settings override or a scratch file
# from blocking every pull. (It also kept the old advice from being a dead
# end: plain `git stash` does not stash untracked files.)
- name: Check for uncommitted changes to tracked files
  ansible.builtin.command:
    cmd: "git status --porcelain --untracked-files=no"
    chdir: "{{ instance_path }}"
  register: _pull_uncommitted
  changed_when: false

- name: Fail if uncommitted changes exist
  ansible.builtin.fail:
    msg: >-
      Cannot pull: the instance directory has local changes to tracked
      files that a pull could overwrite. Share them with
      'canasta gitops add <file>' then 'canasta gitops push', or discard
      them with 'git checkout -- <file>', then retry.
      Changed files: {{ _pull_uncommitted.stdout }}
  when: _pull_uncommitted.stdout | trim | length > 0

# --- Step 2: Save state before pull ---
- name: Get current commit hash
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ instance_path }}"
  register: _pull_prev_commit
  changed_when: false

# --- Step 3: Pull and update submodules ---
# Rebase, not merge or fast-forward-only. Hosts contribute small config commits
# to one shared branch, so replaying this host's commits on top of the remote is
# the right semantic — and it is the only one that resolves the diverged state
# 'gitops push' sends the operator here to fix. A plain 'git pull' honors the
# host's ambient pull.rebase / pull.ff config, so it could abort on divergence
# with nothing but git's own hints; --rebase is explicit and always applies.
- name: Pull from remote
  ansible.builtin.command:
    cmd: "git -c commit.gpgsign=false pull --rebase"
    chdir: "{{ instance_path }}"
  environment: "{{ gitops_git_env }}"
  register: _pull_result
  changed_when: "'Already up to date' not in _pull_result.stdout"
  failed_when: false

# A conflicting replay stops mid-rebase, which strands the instance in a state
# no canasta command understands. Name what conflicted, roll back to exactly
# where the pull started — local commits intact — and fail.
- name: Explain and roll back a failed pull
  when: _pull_result.rc != 0
  block:
    - name: Hand the failure to the shared explainer
      ansible.builtin.set_fact:
        _pull_failure: "{{ _pull_result }}"

    - name: Report why the pull could not be replayed
      ansible.builtin.include_tasks: "_explain_pull_failure.yml"

# Applying a commit whose .gitattributes no longer encrypts host vars would
# have this host's next write commit secrets in cleartext. Nothing has been
# rendered or checked out in submodules yet, so resetting to the pre-pull
# commit restores the instance exactly, local commits included.
- name: Check the pulled .gitattributes keeps the encryption rules
  ansible.builtin.include_tasks: "_check_gitattributes_rules.yml"
  vars:
    gitattributes_rev: HEAD

- name: Refuse a pull that weakens encryption
  when: _gitattributes_missing | length > 0
  block:
    - name: Roll back to the pre-pull commit
      ansible.builtin.command:
        cmd: "git reset --hard --quiet {{ _pull_prev_commit.stdout }}"
        chdir: "{{ instance_path }}"
      changed_when: true

    - name: Explain the missing encryption rules
      ansible.builtin.fail:
        msg: |-
          Cannot pull: the .gitattributes this pull would apply lacks the
          encryption rule(s) below, so host secrets under hosts/ would no
          longer be encrypted.
          {% if _pull_result is changed %}
          The pull was rolled back — the instance is exactly as it was and the
          local commit(s) are intact.
          {% endif %}

          Missing from .gitattributes:
          {% for line in _gitattributes_missing %}
            {{ line }}
          {% endfor %}

          Put the line(s) back in .gitattributes on the remote branch — in any
          checkout of it, add them, commit, and push — then retry
          'canasta gitops pull'.

- name: Update submodules
  ansible.builtin.include_tasks: "_update_submodules.yml"

- name: Remove submodules the pull dropped
  ansible.builtin.include_tasks: "_remove_dropped_submodules.yml"

# --- Step 4: Check if anything changed ---
- name: Get new commit hash
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ instance_path }}"
  register: _pull_new_commit
  changed_when: false

# What matters is whether the commit now at HEAD has been *applied*, not
# whether this pull moved HEAD. A pull that fetched and then failed before
# rendering leaves HEAD on the new commit with the rendered files still
# holding the old values; comparing HEAD against the pre-pull HEAD would
# find them equal and skip rendering forever, with no way back that does
# not involve raw git against the instance. .gitops-applied records what
# was last rendered, so compare against that.
- name: Read the last applied commit
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-applied"
  register: _pull_applied_raw
  failed_when: false

- name: Set the last applied commit
  ansible.builtin.set_fact:
    _pull_applied: >-
      {{ (_pull_applied_raw.content | default('') | b64decode | trim)
         if (_pull_applied_raw.content is defined) else '' }}

# A rebased or rewritten repo can leave .gitops-applied naming a commit
# that no longer exists, which would break the diff below.
- name: Check the applied commit still exists
  ansible.builtin.command:
    cmd: "git cat-file -e {{ _pull_applied }}^{commit}"
    chdir: "{{ instance_path }}"
  register: _pull_applied_exists
  changed_when: false
  failed_when: false
  when: _pull_applied != ''

- name: Choose the base to diff against
  ansible.builtin.set_fact:
    _pull_diff_base: >-
      {{ _pull_applied
         if (_pull_applied != '' and (_pull_applied_exists.rc | default(1)) == 0)
         else _pull_prev_commit.stdout }}

- name: Skip rendering when this commit is already applied
  when: _pull_applied == _pull_new_commit.stdout
  block:
    - name: Report no changes
      ansible.builtin.debug:
        msg: "Already up to date."
    - name: End play for no-change case
      ansible.builtin.meta: end_play

# --- Step 5: Read host identity and vars ---
- name: Read .gitops-host
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-host"
  register: _pull_host_raw

- name: Set host name
  ansible.builtin.set_fact:
    _pull_hostname: "{{ _pull_host_raw.content | b64decode | trim }}"

- name: Read host vars
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/{{ _pull_hostname }}/vars.yaml"
  register: _pull_vars_raw

- name: Check for shared vars
  ansible.builtin.stat:
    path: "{{ instance_path }}/hosts/_shared/vars.yaml"
  register: _pull_shared_vars_stat

- name: Read shared vars (if present)
  ansible.builtin.slurp:
    src: "{{ instance_path }}/hosts/_shared/vars.yaml"
  register: _pull_shared_vars_raw
  when: _pull_shared_vars_stat.stat.exists

- name: Parse host vars (with shared merged in; host wins)
  ansible.builtin.set_fact:
    _pull_vars: >-
      {{ (_pull_shared_vars_stat.stat.exists
          | ternary(_pull_shared_vars_raw.content | b64decode | from_yaml, {}))
         | combine(_pull_vars_raw.content | b64decode | from_yaml) }}

# --- Step 5b: Record what the rendered files held before this pull ---
# The steps below rewrite .env and config/wikis.yaml before steps that can
# still refuse. Whether a restart is needed must be judged against what
# those files held before the first attempt to apply this commit, so the
# baseline stays on disk until the pull completes and a retry reuses it.
- name: Fingerprint .env and wikis.yaml before rendering
  ansible.builtin.include_tasks: "_rendered_fingerprint.yml"

- name: Read the baseline left by an unfinished pull
  ansible.builtin.slurp:
    src: "{{ instance_path }}/.gitops-pull-baseline"
  register: _pull_baseline_raw
  failed_when: false

- name: Set the pre-render baseline
  ansible.builtin.set_fact:
    _pull_baseline: >-
      {{ (_pull_baseline_raw.content | b64decode | from_json)
         if _pull_baseline_raw.content is defined
         else _rendered_fingerprint }}

- name: Keep the baseline until the pull completes
  ansible.builtin.copy:
    content: "{{ _pull_baseline | to_json }}"
    dest: "{{ instance_path }}/.gitops-pull-baseline"
    mode: "0644"

# --- Step 6: Render .env from env.template + vars ---
- name: Render .env from template
  ansible.builtin.include_tasks: _render_env.yml
  vars:
    env_render_vars: "{{ _pull_vars }}"

# --- Step 7: Render wikis.yaml from template + vars (if template exists) ---
- name: Check if wikis.yaml.template exists
  ansible.builtin.stat:
    path: "{{ instance_path }}/wikis.yaml.template"
  register: _pull_wikis_template_stat

- name: Render wikis.yaml from template
  when: _pull_wikis_template_stat.stat.exists
  block:
    - name: Read wikis.yaml.template
      ansible.builtin.slurp:
        src: "{{ instance_path }}/wikis.yaml.template"
      register: _pull_wikis_template_raw

    # Render into a fact first so we can validate it BEFORE it replaces the
    # live config/wikis.yaml. A wiki whose wiki_url_<id> var is absent on this
    # host renders url empty, which makes MediaWiki's FarmConfigLoader fatal on
    # every request — refuse to write that rather than crash-loop the site.
    # (Mirrors render_compose.yml)
    - name: Render wikis.yaml content from template
      ansible.builtin.set_fact:
        _pull_wikis_content: |
          {% for line in (_pull_wikis_template_raw.content | b64decode).split('\n') %}
          {% if '{{' in line and '}}' in line %}
          {% set before = line.split('{{', 1)[0] %}
          {% set placeholder = line.split('{{', 1)[1].split('}}', 1)[0] %}
          {% set after = line.split('}}', 1)[1] if '}}' in line else '' %}
          {{ before }}{{ _pull_vars[placeholder] | default('') }}{{ after }}
          {% else %}
          {{ line }}
          {% endif %}
          {% endfor %}

    - name: Fail if any wiki url rendered empty (missing wiki_url_<id> var)
      ansible.builtin.fail:
        msg: >-
          Refusing to write config/wikis.yaml on pull: the url for wiki(s)
          {{ _pull_empty_url_wikis | join(', ') }} rendered empty because a
          wiki_url_<id> var is not defined in this host's vars.yaml or
          hosts/_shared/vars.yaml. A wiki added on another host needs its url
          set for this host too — add e.g.
          'wiki_url_{{ _pull_empty_url_wikis[0] }}' to the host vars (a blank
          url makes MediaWiki fatal on every request).
      vars:
        _pull_empty_url_wikis: >-
          {{ (_pull_wikis_content | from_yaml).wikis | default([])
             | rejectattr('url') | map(attribute='id') | list }}
      when: _pull_empty_url_wikis | length > 0

    - name: Write config/wikis.yaml
      ansible.builtin.copy:
        content: "{{ _pull_wikis_content }}"
        dest: "{{ instance_path }}/config/wikis.yaml"
        mode: "0644"

# --- Step 7b: Reconcile COMPOSE_PROFILES with the rendered flags ---
# .env is rendered verbatim from env.template + vars, so a stale
# COMPOSE_PROFILES literal (or a render that dropped internal-db / a feature
# profile) would otherwise survive the pull and leave services unmanaged —
# running but invisible to up/down. Run the same sync used before start so the
# profile set matches the feature flags and the DB mode. This runs before the
# change-detection below, so a profile change correctly flags a restart.
- name: Reconcile COMPOSE_PROFILES after render
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/sync_compose_profiles.yml

# --- Step 7c: Render my.cnf from template + vars (if template exists) ---
- name: Render my.cnf from template
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_render_mycnf.yml"
  vars:
    mycnf_vars: "{{ _pull_vars }}"

# --- Step 7d: Render media-hosts.yaml from template + vars (if it exists) ---
- name: Render media-hosts.yaml from template
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/gitops/tasks/_render_media_hosts.yml"
  vars:
    media_hosts_vars: "{{ _pull_vars }}"

# --- Step 7e: Render the web secret key list to its compose layer ---
- name: Render web secret keys to a compose override layer
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/render_web_env.yml"

# --- Step 8: Write admin password files ---
- name: Write admin password files from vars
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: >-
      {{ instance_path }}/admin-password_{{ item.key
         | regex_replace('^admin_password_', '') }}
    mode: "0600"
  loop: >-
    {{ _pull_vars | dict2items
       | selectattr('key', 'match', '^admin_password_')
       | list }}
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# --- Step 9: Detect what changed ---
- name: Get list of changed files
  ansible.builtin.command:
    cmd: "git diff --name-only {{ _pull_diff_base }}"
    chdir: "{{ instance_path }}"
  register: _pull_changed_files
  changed_when: false

- name: Fingerprint .env and wikis.yaml after rendering
  ansible.builtin.include_tasks: "_rendered_fingerprint.yml"

# A pull that untracks the sidecar env bridge deletes this host's copy; a
# restart renders it again.
- name: Check for the sidecar env bridge
  ansible.builtin.stat:
    path: "{{ instance_path }}/config/settings/global/00-canasta-sidecar-env.php"
  register: _pull_bridge

- name: Determine if restart is needed
  ansible.builtin.set_fact:
    _pull_needs_restart: >-
      {{ (_pull_baseline.env | default('') != _rendered_fingerprint.env)
         or (_pull_baseline.wikis | default('') != _rendered_fingerprint.wikis)
         or (_pull_changed_files.stdout_lines | default([])
             | select('match',
               '^(env\.template|config/Caddyfile|config/secret-keys-web$|docker-compose\.override\.yml)')
             | list | length > 0)
         or ('config/settings/global/00-canasta-sidecar-env.php'
             in (_pull_changed_files.stdout_lines | default([]))
             and not _pull_bridge.stat.exists) }}
    _pull_needs_maintenance: >-
      {{ _pull_changed_files.stdout_lines | default([])
         | select('match', '^(extensions/|skins/)')
         | list | length > 0 }}

# --- Step 10: Re-apply the backup schedule ---
# Re-materialize the crontab when the pulled config changed the schedule
# (added / edited / removed config/backup-schedule.yml). The rematerialize
# task applies the file's schedule, or removes the crontab entry if the
# file is now gone.
- name: Re-materialize the backup schedule if it changed
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/backup_schedule_rematerialize.yml
  when: >-
    _pull_changed_files.stdout_lines | default([])
    | select('search', 'config/backup-schedule.yml') | list | length > 0

# --- Step 11: Save applied commit ---
# Written only after every apply step above has succeeded; a pull that
# stops earlier leaves the commit unapplied, so the next pull re-applies it.
- name: Write .gitops-applied
  ansible.builtin.copy:
    content: "{{ _pull_new_commit.stdout }}"
    dest: "{{ instance_path }}/.gitops-applied"
    mode: "0644"

- name: Remove the pre-render baseline
  ansible.builtin.file:
    path: "{{ instance_path }}/.gitops-pull-baseline"
    state: absent

# --- Step 12: Report results ---
# Collected as a list so the report is one sentence per outcome: the
# ternaries this replaces rendered '' for every outcome that did not
# apply, and the folded scalar kept the newlines around them — so a pull
# needing nothing printed a trailing space and a blank line, and a pull
# needing both printed an empty third line.
- name: Summarize what the pull requires
  ansible.builtin.set_fact:
    _pull_followup: >-
      {{ ((['Restart needed.'] if _pull_needs_restart | bool else [])
      + (['Maintenance update needed (extensions/skins changed).']
      if _pull_needs_maintenance | bool else []))
      or ['No restart needed.'] }}

- name: Report pull results
  ansible.builtin.debug:
    msg: >-
      {{ ('Re-applied ' ~ _pull_new_commit.stdout[:7] ~ ' (the previous pull
      did not finish).')
      if _pull_prev_commit.stdout == _pull_new_commit.stdout
      else ('Pulled ' ~ _pull_prev_commit.stdout[:7] ~ '..'
      ~ _pull_new_commit.stdout[:7] ~ '.') }}
      {{ _pull_followup | join(' ') }}
