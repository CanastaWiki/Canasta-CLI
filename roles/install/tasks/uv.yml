---
# Install uv (Astral Python package manager) and optionally install
# tools via uv. Accepts two vars from the caller:
#   uv_install_self (bool) — install the uv binary itself
#   uv_targets (list of str) — tools to install via 'uv tool install <target>'
#
# Debian 13 (trixie) stable ships podman-compose 1.3.0 which has a
# critical bug with ${VAR:-default} variable substitution
# (containers/podman-compose#1105). Installing via uv provides a
# fixed version outside the system package manager.
#
# Tools land in ~/.local/bin, which a non-interactive SSH session (how
# Canasta runs compose) does not have on PATH. Linking each tool into
# /usr/local/bin — ahead of /usr/bin on Debian's default PATH — makes
# `podman-compose` resolve to the uv copy rather than the broken apt
# one, for the runtime, `canasta doctor`, and operators alike.

- name: Determine operator (SSH) user
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  register: _install_user_cmd

- name: Determine operator home directory
  ansible.builtin.command: "echo ~{{ _install_user_cmd.stdout | trim }}"
  become: false
  changed_when: false
  register: _install_home_cmd

- name: Set install paths fact
  ansible.builtin.set_fact:
    _install_home: "{{ _install_home_cmd.stdout | trim }}"
    _uv_bin: "{{ _install_home_cmd.stdout | trim }}/.local/bin/uv"

- name: Check if uv is already installed
  ansible.builtin.stat:
    path: "{{ _uv_bin }}"
  register: _uv_stat

- name: Install uv
  when:
    - not _uv_stat.stat.exists
    - uv_install_self | default(false) | bool or (uv_targets | default([]) | length > 0)
  become: false
  block:
    # The installer is unpinned — the same trade the k3s/helm
    # installers make. pipefail surfaces a mid-pipe failure that
    # would otherwise pass silently. Failures here abort the run;
    # there is no silent skip.
    - name: Download and run uv installer
      ansible.builtin.shell:
        cmd: "set -o pipefail; curl -LsSf https://astral.sh/uv/install.sh | sh"
        executable: /bin/bash
        creates: "{{ _uv_bin }}"
      changed_when: true

- name: Resolve version constraints per tool
  ansible.builtin.set_fact:
    _uv_tool_specs: >-
      {{ uv_targets | default([]) | map('regex_replace', '^podman-compose$',
         'podman-compose>=1.3.1') | list }}

- name: Install requested tools via uv
  when: uv_targets | default([]) | length > 0
  become: false
  block:
    # `uv tool install` is idempotent: an already-satisfied spec exits 0.
    - name: Install each uv target
      ansible.builtin.command:
        cmd: "{{ _uv_bin }} tool install {{ item }}"
      loop: "{{ _uv_tool_specs }}"
      changed_when: true

- name: Link uv-installed tools into /usr/local/bin
  ansible.builtin.file:
    src: "{{ _install_home }}/.local/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ uv_targets | default([]) }}"
  become: true
  when: uv_targets | default([]) | length > 0
