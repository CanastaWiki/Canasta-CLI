---
# Uninstall k3s, kubectl, helm, and clean up iptables rules. NFS exports
# that `canasta storage setup nfs --install-server` scoped to this cluster's
# nodes are withdrawn once the cluster is gone.
# Idempotent — skips if k3s is not installed. Handles both the
# control-plane (k3s-uninstall.sh) and worker (k3s-agent-uninstall.sh)
# install forms; the k3s installer creates a different script
# depending on whether it set up a server or an agent.
#
# On a worker uninstall, if cp_host is provided, also SSH to the
# control plane afterward and 'kubectl delete node <hostname>' so the
# Node entry is removed from the cluster's view. Without that, the
# Node lingers in 'kubectl get nodes' and a worker rejoining with the
# same hostname reclaims it (preserving its AGE) — which masks the
# uninstall.

- name: Check for k3s server uninstall script
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-uninstall.sh
  register: _k3s_server_uninstall

- name: Check for k3s agent uninstall script
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-agent-uninstall.sh
  register: _k3s_agent_uninstall

- name: Determine k3s role and uninstall script
  ansible.builtin.set_fact:
    _k3s_uninstall_script: >-
      {{ '/usr/local/bin/k3s-uninstall.sh'
         if _k3s_server_uninstall.stat.exists
         else ('/usr/local/bin/k3s-agent-uninstall.sh'
               if _k3s_agent_uninstall.stat.exists else '') }}
    _k3s_role_label: >-
      {{ 'control plane'
         if _k3s_server_uninstall.stat.exists
         else ('worker'
               if _k3s_agent_uninstall.stat.exists else '') }}

- name: Report k3s not installed
  ansible.builtin.debug:
    msg: "k3s is not installed."
  when: not _k3s_uninstall_script

# A run interrupted after the k3s uninstall script but before its own
# cleanup leaves the kubeconfig behind. With k3s gone, one that points at
# the local API server is stale, and the NFS export withdrawal below would
# take it for a live cluster. Remove it, as the interrupted run would have;
# a kubeconfig for any other cluster is left alone.
- name: Read a kubeconfig left behind by a removed k3s
  ansible.builtin.slurp:
    src: "~/.kube/config"
  register: _k3s_leftover_kubeconfig
  failed_when: false
  when: not _k3s_uninstall_script

- name: Remove the kubeconfig of the removed local k3s
  ansible.builtin.file:
    path: "~/.kube/config"
    state: absent
  when:
    - not _k3s_uninstall_script
    - _k3s_leftover_kubeconfig.content is defined
    - >-
      'server: https://127.0.0.1:6443' in (_k3s_leftover_kubeconfig.content | b64decode)
      or 'server: https://localhost:6443' in (_k3s_leftover_kubeconfig.content | b64decode)

# Worker uninstalls leave a Node entry on the control plane unless we
# delete it. To keep cluster state coherent, require --cp-host so we
# know where to send the delete. Control-plane uninstalls don't need
# it; control plane is itself the registry, and tearing it down
# discards the Node list along with everything else.
- name: Require --cp-host for worker uninstalls
  ansible.builtin.fail:
    msg: >-
      --cp-host <name> is required when uninstalling a k3s worker
      (the registered control-plane host, so the worker's Node is
      removed from the cluster).
  when:
    - _k3s_role_label == 'worker'
    - not (cp_host is defined and (cp_host | length > 0))

# Capture the worker's hostname *before* the uninstall script runs.
# k8s Node names default to the OS hostname (the k3s installer doesn't
# pass --node-name in this codebase), so this is what we'll ask cp to
# delete from its Node registry below.
- name: Capture worker hostname for Node cleanup
  ansible.builtin.command:
    cmd: hostname
  register: _worker_hostname_raw
  changed_when: false
  when: _k3s_role_label == 'worker'

# A local-path PV lives on the node that provisioned it, and the k3s
# uninstall removes /var/lib/rancher/k3s — so detaching a worker deletes
# any volume bound there. The database of a multi-node instance is the
# common case: it uses local-path by default and lands wherever the
# scheduler put it. Ask the control plane what would be lost, first.
- name: Guard volumes pinned to a worker being removed
  when: _k3s_role_label == 'worker'
  block:
    - name: Resolve cp-host SSH target for the volume check
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_cp_host_ssh.yml"

    - name: List PersistentVolumes pinned to a node
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - StrictHostKeyChecking=accept-new
          - "{{ _cp_ssh_target }}"
          - >-
            sudo k3s kubectl get pv -o
            jsonpath='{range .items[?(@.spec.nodeAffinity)]}
            {.spec.claimRef.namespace}/{.spec.claimRef.name}{"\t"}
            {.spec.nodeAffinity.required.nodeSelectorTerms[*].matchExpressions[*].values[*]}
            {"\n"}{end}'
      delegate_to: canasta_controller
      register: _pinned_pvs
      changed_when: false
      failed_when: false

    # An empty listing from a failed call would let the guard pass.
    - name: Refuse when the control plane cannot list the volumes
      ansible.builtin.fail:
        msg: >-
          Could not list PersistentVolumes on control plane '{{ cp_host }}'
          to check what uninstalling k3s from
          '{{ _worker_hostname_raw.stdout | trim }}' would destroy:
          {{ (_pinned_pvs.stderr | default('') | trim) or ('exit code ' ~ _pinned_pvs.rc) }}.
          Make the control plane reachable, or pass --force to proceed
          without the check.
      when:
        - _pinned_pvs.rc != 0
        - not (force | default(false) | bool)

    - name: Warn that the volume check was skipped
      ansible.builtin.debug:
        msg: >-
          --force given: could not list PersistentVolumes on control plane
          '{{ cp_host }}'; any volumes stored on this node will be destroyed.
      when:
        - _pinned_pvs.rc != 0
        - force | default(false) | bool

    - name: Select the volumes this uninstall would destroy
      ansible.builtin.set_fact:
        _doomed_volumes: >-
          {{ (_pinned_pvs.stdout_lines | default([]))
             | map('trim') | reject('equalto', '')
             | select('search', '(^|\s)'
                      ~ (_worker_hostname_raw.stdout | trim) ~ '(\s|$)')
             | map('regex_replace', '\s.*$', '')
             | list }}

    - name: Refuse to destroy volumes bound to this node
      ansible.builtin.fail:
        msg: >-
          Uninstalling k3s from '{{ _worker_hostname_raw.stdout | trim }}'
          would destroy {{ _doomed_volumes | length }} PersistentVolume(s)
          stored on it: {{ _doomed_volumes | join(', ') }}.
          Their data lives under /var/lib/rancher/k3s on that node and the
          uninstall removes it. Back up or migrate the affected instances
          first, or pass --force to proceed and lose the data.
      when:
        - _doomed_volumes | length > 0
        - not (force | default(false) | bool)

    - name: Warn that pinned volumes are being destroyed
      ansible.builtin.debug:
        msg: >-
          --force given: destroying {{ _doomed_volumes | length }}
          PersistentVolume(s) on this node: {{ _doomed_volumes | join(', ') }}.
      when:
        - _doomed_volumes | length > 0
        - force | default(false) | bool

# The install writes the kubeconfig under the connecting user's HOME, so
# gather it without become.
- name: Gather minimal facts for HOME directory
  ansible.builtin.setup:
    filter: ansible_env
  when: _k3s_uninstall_script | length > 0

# `storage setup` records its class as the controller-wide default that
# `create` inherits. Once the cluster holding that class is gone the default
# names a class that no longer exists, so note now whether it is here.
- name: Read the default storage class
  canasta_registry:
    state: get_setting
    setting_key: defaultStorageClass
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _uninstall_default_sc
  when: _k3s_role_label == 'control plane'

- name: Check whether the default storage class is on this cluster
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - storageclass
      - "{{ _uninstall_default_sc.value }}"
      - -o
      - name
  become: true
  register: _uninstall_default_sc_here
  changed_when: false
  failed_when: false
  when:
    - _k3s_role_label == 'control plane'
    - (_uninstall_default_sc.value | default('', true)) | length > 0

- name: Uninstall k3s
  when: _k3s_uninstall_script | length > 0
  become: true
  vars:
    _k3s_local_api_servers:
      - https://127.0.0.1:6443
      - https://localhost:6443
  block:
    - name: Report uninstalling
      ansible.builtin.debug:
        msg: "Uninstalling Kubernetes ({{ _k3s_role_label }})..."

    - name: Run k3s uninstall script
      ansible.builtin.command:
        cmd: "{{ _k3s_uninstall_script }}"
      changed_when: true

    # kubectl/helm/kubeconfig only exist on a control-plane install,
    # but `state: absent` is a no-op on workers, so leave unconditional.
    - name: Remove kubectl symlink
      ansible.builtin.file:
        path: /usr/local/bin/kubectl
        state: absent

    - name: Remove helm
      ansible.builtin.file:
        path: /usr/local/bin/helm
        state: absent

    - name: Clean up stale KUBE-SERVICES iptables rules
      ansible.builtin.shell:
        cmd: |
          iptables -t nat -D PREROUTING -m comment --comment "kubernetes service portals" -j KUBE-SERVICES 2>/dev/null || true
          iptables -t nat -D OUTPUT -m comment --comment "kubernetes service portals" -j KUBE-SERVICES 2>/dev/null || true
      changed_when: true

    # The kubeconfig may since have been pointed at, or merged with,
    # another cluster; it goes only when the local k3s API is all it holds.
    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: "{{ ansible_env.HOME }}/.kube/config"
      register: _k3s_kubeconfig
      failed_when: false
      no_log: true

    - name: List the API servers in the kubeconfig
      ansible.builtin.set_fact:
        _k3s_kubeconfig_servers: >-
          {{ (_k3s_kubeconfig.content | default('') | b64decode)
             | regex_findall('server:\s*(\S+)') | unique }}

    - name: Remove kubeconfig
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube/config"
        state: absent
      when:
        - _k3s_kubeconfig_servers | length > 0
        - _k3s_kubeconfig_servers | difference(_k3s_local_api_servers) | length == 0

    - name: Report kubeconfig kept
      ansible.builtin.debug:
        msg: >-
          Left {{ ansible_env.HOME }}/.kube/config in place: it holds
          clusters other than this host's k3s
          ({{ _k3s_kubeconfig_servers | difference(_k3s_local_api_servers) | join(', ') }}).
      when: _k3s_kubeconfig_servers | difference(_k3s_local_api_servers) | length > 0

    - name: Report uninstalled
      ansible.builtin.debug:
        msg: "Kubernetes ({{ _k3s_role_label }}) uninstalled."

- name: Clear the default storage class that was on this cluster
  when: (_uninstall_default_sc_here.rc | default(1)) == 0
  block:
    - name: Clear the default storage class
      canasta_registry:
        state: set_setting
        setting_key: defaultStorageClass
      delegate_to: canasta_controller
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Clear the default access mode that went with it
      canasta_registry:
        state: set_setting
        setting_key: defaultAccessMode
      delegate_to: canasta_controller
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Report default storage class cleared
      ansible.builtin.debug:
        msg: "Cleared default storage class '{{ _uninstall_default_sc.value }}'."

# Not gated on k3s still being installed: if an earlier run removed k3s and
# then failed, a re-run must still withdraw the exports. The task acts only
# once the cluster's kubeconfig is gone.
- name: Withdraw NFS exports that followed this cluster
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/nfs_exports_remove.yml"

# --- Worker only: clean up the Node entry on the control plane ---

- name: Delete worker Node from control plane
  when: _k3s_role_label == 'worker'
  block:
    - name: Resolve cp-host SSH target from hosts.yml
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_cp_host_ssh.yml"

    - name: Delete Node from control plane
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - StrictHostKeyChecking=accept-new
          - "{{ _cp_ssh_target }}"
          - >-
            sudo k3s kubectl delete node
            {{ (_worker_hostname_raw.stdout | trim) | quote }}
            --ignore-not-found
      delegate_to: canasta_controller
      vars:
        ansible_connection: local
      register: _node_delete
      changed_when: "'deleted' in (_node_delete.stdout | default(''))"

    - name: Report Node cleanup
      ansible.builtin.debug:
        msg: "Removed Node '{{ _worker_hostname_raw.stdout | trim }}' from control plane."
      when: "'deleted' in (_node_delete.stdout | default(''))"
