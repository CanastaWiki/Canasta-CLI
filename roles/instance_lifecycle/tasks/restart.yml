---
# Restart a Canasta instance.
# Input: id (optional)

# Top-level `canasta restart` needs this; nested callers
# (config set/unset, add, backup restore) already passed through
# resolve_instance.yml at their own entry point. Re-running it here
# would do a needless registry round-trip.
- name: Resolve instance (skip if caller already resolved it)
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"
  when: instance_path is not defined

- name: Warn about gitops changes not yet pushed
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/k8s_warn_unpushed_gitops.yml"
  when: instance_is_k8s | bool

# Validate config/sidecars.yaml while the instance is still running, so a
# declaration the start would refuse does not leave it stopped.
- name: Check config/sidecars.yaml before stopping
  canasta_render_sidecars:
    instance_path: "{{ instance_path }}"
    orchestrator: "{{ instance_orchestrator | default('compose') }}"
    secret_key_regex: "{{ canasta_secret_key_regex }}"
  check_mode: true

- name: Check that Caddy can start behind the edge before stopping
  canasta_edge:
    state: check
    instance_id: "{{ instance_id }}"
    instance_path: "{{ instance_path }}"
  when: not (instance_is_k8s | bool)

- name: Stop containers
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: stop.yml

# Regenerate config before start so `canasta restart` picks up edits to
# Caddyfile.global and wikis.yaml.
- name: Regenerate config before start
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml

- name: Start containers
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: start.yml

- name: Learn the wikis' localized Special namespace names for the edge
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: edge_learn.yml

- name: Finish a restore whose own restart failed
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/backup/tasks/finish_restore.yml"

- name: Report restarted
  ansible.builtin.debug:
    msg: "Instance '{{ instance_id }}' restarted."

- name: Report wikis that do not answer through the edge
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: edge_probe.yml

- name: Report a failed startup composer update
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/mediawiki/tasks/report_composer_failure.yml"
