---
# canasta crowdsec status - show registered bouncers and active
# decisions. Read-only.
# Input: id (optional)

- name: Preflight (resolve, crowdsec running, build cscli prefix)
  ansible.builtin.include_tasks: _preflight.yml

# JSON (not the table) so we can collapse the caddy bouncer family. CrowdSec
# auto-creates an undeletable 'canasta-caddy@<ip>' child every time the caddy
# container reconnects from a new IP, so the raw list grows a trail of stale
# 'valid' rows that confuse the output (issue #619).
- name: List registered bouncers
  ansible.builtin.command:
    cmd: "{{ _cscli_prefix }} cscli bouncers list -o json"
    chdir: "{{ _cscli_chdir | default(omit) }}"
  register: _crowdsec_bouncers
  changed_when: false

# cscli prints "null" (not "[]") when no bouncers exist, so coalesce to an
# empty list before parsing.
- name: Parse bouncer list
  ansible.builtin.set_fact:
    _crowdsec_bouncer_list: "{{ ((_crowdsec_bouncers.stdout | trim) or '[]') | from_json }}"

- name: List active decisions
  ansible.builtin.command:
    cmd: "{{ _cscli_prefix }} cscli decisions list"
    chdir: "{{ _cscli_chdir | default(omit) }}"
  register: _crowdsec_decisions
  changed_when: false

# Central API state is read from the engine's local files and database, never
# by contacting the Central API: `cscli capi status` only exercises login, so
# it passes while every pull is refused, and each call counts toward the
# free-tier login limit whose overrun bans the host's IP.
- name: Check for Central API (community blocklist) credentials
  ansible.builtin.command:
    cmd: >-
      {{ _cscli_prefix }} sh -c
      'grep -qs "^login:" /etc/crowdsec/online_api_credentials.yaml'
    chdir: "{{ _cscli_chdir | default(omit) }}"
  register: _crowdsec_capi_creds
  changed_when: false
  failed_when: false

# Each pull that brings decisions records an alert; the engine itself uses
# the newest one as its last pull time.
- name: Find the last community-blocklist pull
  ansible.builtin.command:
    cmd: "{{ _cscli_prefix }} cscli alerts list --origin CAPI -l 1 -o json"
    chdir: "{{ _cscli_chdir | default(omit) }}"
  register: _crowdsec_capi_last
  changed_when: false
  failed_when: false

# `cscli decisions list` excludes CAPI blocklist decisions, so count them by
# origin. -o raw keeps the payload to one integer; tail drops the CSV header.
- name: Count community-blocklist (CAPI) decisions
  ansible.builtin.command:
    cmd: >-
      {{ _cscli_prefix }} sh -c
      'cscli decisions list --origin CAPI -o raw 2>/dev/null | tail -n +2 | wc -l'
    chdir: "{{ _cscli_chdir | default(omit) }}"
  register: _crowdsec_capi_count
  changed_when: false
  failed_when: false

# Console-subscribed blocklists carry origin 'lists' and are excluded from the
# default decisions list; fetch them (raw CSV) and break them down per list.
- name: List console-blocklist (lists) decisions
  ansible.builtin.command:
    cmd: >-
      {{ _cscli_prefix }}
      cscli decisions list --origin lists -o raw
    chdir: "{{ _cscli_chdir | default(omit) }}"
  register: _crowdsec_lists_raw
  changed_when: false
  failed_when: false

- name: Break down console blocklists by list
  ansible.builtin.set_fact:
    _crowdsec_blocklist_lines: >-
      {{ _crowdsec_lists_raw.stdout | default('') | canasta_crowdsec_blocklist_breakdown }}

- name: Summarize Central API and console state
  ansible.builtin.set_fact:
    _crowdsec_capi_line: >-
      {{ (_crowdsec_capi_last.stdout | default(''))
         | canasta_crowdsec_capi_line(_crowdsec_capi_creds.rc == 0,
                                      _crowdsec_capi_count.stdout | default('0')) }}
    # Console blocklists (origin 'lists') are observable; enrollment is not —
    # confirming it needs PAPI. They are additional to the CAPI community
    # blocklist above, so say that is unaffected or "none" reads as unprotected.
    _crowdsec_console_line: >-
      {{ ('active' ~ _crowdsec_blocklist_lines)
         if (_crowdsec_blocklist_lines | trim) != ''
         else 'none (optional; the community blocklist above is unaffected) —
               add more with: canasta crowdsec console-enroll <key>' }}

- name: Show CrowdSec status
  ansible.builtin.debug:
    msg: |-
      CrowdSec status for instance '{{ instance_id }}'

      Bouncers:
      {{ _crowdsec_bouncer_list | canasta_crowdsec_status_bouncers }}

      Central API (community blocklist): {{ _crowdsec_capi_line }}
      Console blocklists: {{ _crowdsec_console_line }}

      Local decisions (manual bans + scenario detections):
      {{ _crowdsec_decisions.stdout | default('(none)') }}
