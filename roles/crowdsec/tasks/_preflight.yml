---
# Shared preflight for crowdsec subcommands: resolve the instance, verify the
# crowdsec engine is up (Compose service or K8s local API pod), and build the
# orchestrator-appropriate cscli prefix.
# Output: instance_id, instance_path, instance_orchestrator (+ the rest of
# resolve_instance's facts), _cscli_prefix, _cscli_chdir.

# Top-level `canasta crowdsec ...` needs this; nested callers (the
# start/upgrade auto-enroll path) already resolved the instance, and
# re-resolving from CWD would pick the wrong directory when the CLI was
# invoked outside the instance dir (e.g. `canasta upgrade` from $HOME).
- name: Resolve instance (skip if caller already resolved it)
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"
  when: instance_path is not defined

- name: Read CrowdSec enablement from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: CANASTA_ENABLE_CROWDSEC
  register: _crowdsec_enable_env

- name: Note whether CrowdSec is enabled
  ansible.builtin.set_fact:
    _crowdsec_enabled: "{{ _crowdsec_enable_env.value | default('false', true) | lower == 'true' }}"

# --- Compose: the crowdsec service must be running ---
- name: Verify crowdsec service is running (Compose)
  when: not (instance_is_k8s | bool)
  block:
    - name: List running services
      ansible.builtin.command:
        argv:
          - "{{ inspect_command | default('docker') }}"
          - ps
          - --filter
          - status=running
          - --filter
          - "label=com.docker.compose.project={{ instance_path | basename | lower }}"
          - --format
          - >-
            {% if 'podman' in (inspect_command | default('docker') | basename) -%}
            {% raw %}{{index .Labels "com.docker.compose.service"}}{% endraw %}
            {%- else -%}
            {% raw %}{{.Label "com.docker.compose.service"}}{% endraw %}
            {%- endif %}
        chdir: "{{ instance_path }}"
      register: _crowdsec_running
      changed_when: false

    - name: Refuse when the crowdsec service is not running
      ansible.builtin.fail:
        msg: >-
          {% if _crowdsec_enabled | bool -%}
          CrowdSec is enabled for instance '{{ instance_id }}', but its
          crowdsec container is not running. Run 'canasta status -i
          {{ instance_id }}' and check the crowdsec container's logs to
          see why it did not start.
          {%- else -%}
          The crowdsec service is not running for instance
          '{{ instance_id }}'. Enable it first with
          'canasta config set CANASTA_ENABLE_CROWDSEC=true', then retry.
          {%- endif %}
      when: "'crowdsec' not in (_crowdsec_running.stdout_lines | default([]))"

# --- Kubernetes: the local API pod must be Ready ---
# The agent in the caddy pod is checked by `crowdsec status`, which reports
# when it stops reporting to the local API.
- name: Verify the CrowdSec local API is running (Kubernetes)
  when: instance_is_k8s | bool
  block:
    # Space-separated `name=ready` pairs for every container in each Running
    # crowdsec pod, e.g. "crowdsec=true |", one `|`-terminated group per pod.
    # kubectl jsonpath has no filter expressions, so emit them all and
    # substring-match the first pod's group below. items[*] rather than
    # items[0], so no Running pod prints nothing instead of failing kubectl.
    - name: Read container readiness from the crowdsec pod
      ansible.builtin.command:
        cmd: >-
          kubectl get pods -n canasta-{{ instance_id }}
          -l app.kubernetes.io/component=crowdsec
          --field-selector=status.phase=Running
          -o "jsonpath={range .items[*]}{range .status.containerStatuses[*]}{.name}={.ready} {end}|{end}"
      register: _crowdsec_k8s_ready
      changed_when: false

    - name: Refuse when the CrowdSec local API is not running
      ansible.builtin.fail:
        msg: >-
          {% if _crowdsec_enabled | bool -%}
          CrowdSec is enabled for instance '{{ instance_id }}', but its
          local API pod is not running. Run
          'canasta status -i {{ instance_id }}' and check the pod's
          logs ('kubectl logs -n canasta-{{ instance_id }}
          -l app.kubernetes.io/component=crowdsec -c crowdsec') to see why it
          did not start.
          {%- else -%}
          The CrowdSec engine is not running for instance
          '{{ instance_id }}'. Enable it first with
          'canasta config set CANASTA_ENABLE_CROWDSEC=true', then retry.
          {%- endif %}
      when: "'crowdsec=true' not in (_crowdsec_k8s_ready.stdout | default('')).split('|') | first"

- name: Build the cscli command prefix for this orchestrator
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/crowdsec_cscli_prefix.yml"
