---
# Import a SQL dump into a wiki database.
# Input: instance_path, instance_orchestrator, instance_id,
#        import_wiki_id, import_database_path
#
# The load runs where db_admin.yml says database administration runs (the
# db service, or web for an external database), and the mariadb client
# reads its password from that container's own environment, so the secret
# never enters the command line. That keeps these execs off no_log, so a
# load failure surfaces the actual mariadb stderr (the SQL error) instead
# of a redacted message.

- name: Find where database administration runs
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/db_admin.yml"

- name: Check if database file is gzipped
  ansible.builtin.set_fact:
    _is_gzipped: "{{ import_database_path | regex_search('\\.gz$') is not none }}"

# Unique per run, so overlapping imports into one instance can't load each
# other's dump.
- name: Name this import's temp file in the container
  ansible.builtin.set_fact:
    _import_container_file: >-
      /tmp/canasta-import-{{ lookup('ansible.builtin.password',
      '/dev/null length=16 chars=ascii_lowercase,digits') }}.sql{{
      _is_gzipped | bool | ternary('.gz', '') }}

- name: Create database if it does not exist
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: "{{ _db_admin_service }}"
    exec_command: "{{ _db_admin_pwd }} mariadb {{ _db_admin_args }} -e 'CREATE DATABASE IF NOT EXISTS `{{ import_wiki_id }}`'"

- name: Create a private temp file on the target host for the dump
  ansible.builtin.tempfile:
    state: file
    suffix: "{{ _is_gzipped | bool | ternary('.sql.gz', '.sql') }}"
  register: _import_host_tmp

- name: Load the dump into the database
  block:
    # For localhost this is a local copy; for remote hosts ansible transfers
    # the file, so the source path doesn't need to exist on the remote.
    - name: Transfer database dump to target host
      ansible.builtin.copy:
        src: "{{ import_database_path }}"
        dest: "{{ _import_host_tmp.path }}"
        mode: "0600"

    # The orchestrator owns how a file lands in a container (docker
    # compose cp vs kubectl cp); dispatch.
    - name: Copy database dump into the database administration container
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/copy_into_container.yml
      vars:
        copy_service: "{{ _db_admin_service }}"
        copy_src: "{{ _import_host_tmp.path }}"
        copy_dest: "{{ _import_container_file }}"

    - name: Import gzipped database
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: "{{ _db_admin_service }}"
        exec_command: "gunzip -c {{ _import_container_file }} | {{ _db_admin_pwd }} mariadb {{ _db_admin_args }} '{{ import_wiki_id }}'"
        exec_long: true
      when: _is_gzipped | bool

    - name: Import plain SQL database
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: "{{ _db_admin_service }}"
        exec_command: "{{ _db_admin_pwd }} mariadb {{ _db_admin_args }} '{{ import_wiki_id }}' < {{ _import_container_file }}"
        exec_long: true
      when: not (_is_gzipped | bool)
  always:
    - name: Clean up transferred dump from target host
      ansible.builtin.file:
        path: "{{ _import_host_tmp.path }}"
        state: absent

    - name: Clean up temp dump file
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: "{{ _db_admin_service }}"
        exec_command: "rm -f {{ _import_container_file }}"
