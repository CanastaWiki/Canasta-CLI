---
# Import a SQL dump into a wiki database.
# Input: instance_path, instance_orchestrator, instance_id,
#        import_wiki_id, import_database_path
#
# The load runs where db_admin.yml says database administration runs (the
# db service, or web for an external database), and the mariadb client
# reads its password from that container's own environment, so the secret
# never enters the command line. That keeps these execs off no_log, so a
# load failure surfaces the actual mariadb stderr (the SQL error) instead
# of a redacted message.

- name: Find where database administration runs
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/db_admin.yml"

- name: Check if database file is gzipped
  ansible.builtin.set_fact:
    _is_gzipped: "{{ import_database_path | regex_search('\\.gz$') is not none }}"

# Unique per run, so overlapping imports into one instance can't load each
# other's dump.
- name: Name this import's temp file in the container
  ansible.builtin.set_fact:
    _import_container_file: >-
      /tmp/canasta-import-{{ lookup('ansible.builtin.password',
      '/dev/null length=16 chars=ascii_lowercase,digits') }}.sql{{
      _is_gzipped | bool | ternary('.gz', '') }}

- name: Create database if it does not exist
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: "{{ _db_admin_service }}"
    exec_dotenv: "{{ _db_admin_dotenv }}"
    exec_command: "{{ _db_admin_pwd }} mariadb {{ _db_admin_args }} -e 'CREATE DATABASE IF NOT EXISTS `{{ import_wiki_id }}`'"

# On a local connection the dump is already on the target host, so it is
# copied into the container from where it is. The path is resolved because
# docker cp copies a symlink rather than its target.
- name: Check whether the dump is already on the target host
  ansible.builtin.set_fact:
    _import_local: >-
      {{ (ansible_connection | default('')) in ['local', 'ansible.builtin.local'] }}

# Next to the instance rather than in /tmp, which may be a tmpfs too
# small for the dump.
- name: Create a private temp dir on the target host for the dump
  ansible.builtin.tempfile:
    state: directory
    path: "{{ instance_path }}"
    prefix: .canasta-import-
  register: _import_host_tmp
  when: not _import_local

- name: Set the dump's path on the target host
  ansible.builtin.set_fact:
    _import_src: >-
      {{ import_database_path | realpath if _import_local
         else _import_host_tmp.path ~ '/dump.sql'
              ~ (_is_gzipped | bool | ternary('.gz', '')) }}

- name: Load the dump into the database
  block:
    # Staging the upload in the temp dir rather than ansible_remote_tmp
    # (~/.ansible/tmp by default) keeps it on the instance's filesystem.
    - name: Transfer database dump to target host
      ansible.builtin.copy:
        src: "{{ import_database_path }}"
        dest: "{{ _import_src }}"
        mode: "0600"
      vars:
        ansible_remote_tmp: "{{ _import_host_tmp.path }}"
      when: not _import_local

    # The orchestrator owns how a file lands in a container (docker
    # compose cp vs kubectl cp); dispatch.
    - name: Copy database dump into the database administration container
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/copy_into_container.yml
      vars:
        copy_service: "{{ _db_admin_service }}"
        copy_src: "{{ _import_src }}"
        copy_dest: "{{ _import_container_file }}"

    # The dump's leading bytes, not its name, decide how it is read: gzip,
    # xz and zstd are decompressed in the container, anything else is fed
    # to mariadb as SQL. The db container has all three tools; the web
    # container, used for an external database, has only gunzip.
    - name: Import the database dump
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: "{{ _db_admin_service }}"
        exec_dotenv: "{{ _db_admin_dotenv }}"
        exec_command: >-
          set -o pipefail 2>/dev/null; f={{ _import_container_file }};
          case "$(head -c 6 "$f" | od -An -tx1 | tr -d ' \n')" in
          1f8b*) d=gunzip ;; fd377a585a00) d=xz ;; 28b52ffd*) d=zstd ;; *) d= ;;
          esac;
          if [ -z "$d" ]; then
          {{ _db_admin_pwd }} mariadb {{ _db_admin_args }} '{{ import_wiki_id }}' < "$f";
          elif command -v "$d" >/dev/null 2>&1; then
          "$d" -dc "$f" | {{ _db_admin_pwd }} mariadb {{ _db_admin_args }} '{{ import_wiki_id }}';
          else echo "The dump is $d-compressed, and the {{ _db_admin_service }}
          container has no $d to decompress it; decompress it first." >&2; exit 3; fi
        exec_long: true
  always:
    - name: Clean up transferred dump from target host
      ansible.builtin.file:
        path: "{{ _import_host_tmp.path }}"
        state: absent
      when: not _import_local

    - name: Clean up temp dump file
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: "{{ _db_admin_service }}"
        exec_command: "rm -f {{ _import_container_file }}"
