---
# Restore a wiki's uploaded media into its per-wiki images directory.
#
# The File: page rows come from the database (--database); this only places
# the files. `import_images_path` is a tar (.tar or .tar.gz — the content is
# sniffed, so the extension does not matter) of a wiki's images dir at the
# hash-directory level (0/, 1/, archive/, ...). A single leading images/
# parent is elided. Files land in images/<wiki-id>/ — the per-wiki
# $wgUploadDirectory ($MW_HOME/images/<id>, symlinked to the images
# volume/PVC) — owned by www-data, matching create-storage-dirs.sh.
#
# Input: instance_path, instance_orchestrator, instance_id,
#        import_wiki_id, import_images_path

# On a local connection the tarball is already on the target host, so it
# is copied into the container from where it is. The path is resolved
# because docker cp copies a symlink rather than its target.
- name: Check whether the tarball is already on the target host
  ansible.builtin.set_fact:
    _import_images_local: >-
      {{ (ansible_connection | default('')) in ['local', 'ansible.builtin.local'] }}

# Next to the instance rather than in /tmp, which may be a tmpfs too
# small for the tarball.
- name: Create a private temp dir on the target host for the tarball
  ansible.builtin.tempfile:
    state: directory
    path: "{{ instance_path }}"
    prefix: .canasta-import-
  register: _import_images_host_tmp
  when: not _import_images_local

# Unique per run, so overlapping imports into one instance can't extract
# each other's tarball.
- name: Set the tarball paths
  ansible.builtin.set_fact:
    _import_images_src: >-
      {{ import_images_path | realpath if _import_images_local
         else _import_images_host_tmp.path ~ '/images.tar' }}
    _import_images_container_file: >-
      /tmp/canasta-import-{{ lookup('ansible.builtin.password',
      '/dev/null length=16 chars=ascii_lowercase,digits') }}.tar

- name: Place the images in the wiki's uploads dir
  block:
    # Staging the upload in the temp dir rather than ansible_remote_tmp
    # (~/.ansible/tmp by default) keeps it on the instance's filesystem.
    - name: Transfer images tarball to target host
      ansible.builtin.copy:
        src: "{{ import_images_path }}"
        dest: "{{ _import_images_src }}"
        mode: "0600"
      vars:
        ansible_remote_tmp: "{{ _import_images_host_tmp.path }}"
      when: not _import_images_local

    # Orchestrator dispatch (docker compose cp vs kubectl cp) into the web
    # container, which mounts the images volume/PVC.
    - name: Copy images tarball into the web container
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/copy_into_container.yml"
      vars:
        copy_service: web
        copy_src: "{{ _import_images_src }}"
        copy_dest: "{{ _import_images_container_file }}"

    # Extract the hash-dir tree into the wiki's uploads dir and fix ownership.
    # A single leading images/ parent (someone tarred the parent dir instead of
    # its contents) is elided so files always land at the hash-directory level.
    # exec_long: a large media tree can take a while, so run detached + polled
    # (survives a controller-side SSH reset).
    - name: Extract images into the wiki's uploads dir (owned by www-data)
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: web
        exec_long: true
        exec_command: >-
          set -e;
          dest="/var/www/mediawiki/w/images/{{ import_wiki_id }}";
          mkdir -p "$dest";
          stage="$(mktemp -d)";
          tar xf {{ _import_images_container_file | quote }} -C "$stage";
          if [ -d "$stage/images" ] && [ "$(ls -A "$stage" | wc -l)" = "1" ];
          then src="$stage/images";
          else src="$stage";
          fi;
          cp -a "$src/." "$dest/";
          chown -R www-data:www-data "$dest";
          rm -rf "$stage"
  always:
    - name: Clean up transferred tarball from target host
      ansible.builtin.file:
        path: "{{ _import_images_host_tmp.path }}"
        state: absent
      ignore_errors: true
      when: not _import_images_local

    - name: Clean up images tarball in the web container
      ansible.builtin.include_tasks:
        file: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
        apply:
          ignore_errors: true
      vars:
        exec_service: web
        exec_command: "rm -f {{ _import_images_container_file | quote }}"
