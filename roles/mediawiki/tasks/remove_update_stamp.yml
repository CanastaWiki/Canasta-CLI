---
# Delete a wiki's update.php stamp, so the next start runs update.php for
# that wiki instead of trusting a stamp written for an earlier database.
# Images that keep the stamp under config/persistent keep it across
# container recreation; older images keep it at the top of the volume.
# The web container owns config/persistent, so the stamp is removed there.
#
# Input:
#   update_stamp_wiki (str) - wiki ID
#   plus what orchestrator/tasks/exec.yml needs

- name: Remove the wiki's update.php stamp
  ansible.builtin.include_tasks:
    file: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
    # Applied to the included tasks, not the include, where it is inert.
    apply:
      ignore_errors: true
  vars:
    exec_service: web
    exec_command: >-
      rm -f
      /mediawiki/config/persistent/maintenance_update_{{ update_stamp_wiki | quote }}.info
      /mediawiki/maintenance_update_{{ update_stamp_wiki | quote }}.info
