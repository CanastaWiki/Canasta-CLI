---
# Export one database as a SQL dump on the host.
# Input: instance_path, instance_orchestrator, export_db (database name),
#        export_dest (host path), export_gzip (bool)
#
# The dump names no database (no CREATE DATABASE / USE), so it can be
# imported into a database of another name. It runs where database
# administration runs (db_admin.yml): the db container, or the web container
# for an external database.

- name: Find where database administration runs
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/db_admin.yml"

# Overlapping exports of one database would otherwise share a temp file in the
# container, and one run's rm or gzip would take the other's dump.
- name: Name this export's temp file in the container
  ansible.builtin.set_fact:
    _export_tmp: >-
      /tmp/canasta-export-{{ lookup('ansible.builtin.password',
      '/dev/null length=16 chars=ascii_lowercase,digits') }}.sql

# The password reaches the dump through MYSQL_PWD (db_admin.yml), so it never
# appears in the dump process's argument list. The umask keeps the dump
# owner-only; the copy out of the container carries that mode.
- name: Dump database to temp file in container
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: "{{ _db_admin_service }}"
    exec_dotenv: "{{ _db_admin_dotenv }}"
    exec_long: true
    exec_command: >-
      umask 077 &&
      {{ _db_admin_pwd }} mariadb-dump {{ _db_admin_args }}
      {{ export_db | quote }}
      > {{ _export_tmp }}

- name: Compress dump if gzip requested
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: "{{ _db_admin_service }}"
    exec_command: "gzip -f {{ _export_tmp }}"
  when: export_gzip | bool

# kubectl cp writes the destination with the default umask rather than the
# source's mode, but keeps the mode of a file that already exists.
- name: Create the export file owner-only before copying into it
  ansible.builtin.file:
    path: "{{ export_dest }}"
    state: touch
    mode: "0600"
  register: _export_touch
  failed_when: false

- name: Fail when the export file cannot be created
  ansible.builtin.fail:
    msg: >-
      Could not create {{ export_dest }} on the instance's host
      ({{ ansible_host | default('localhost') }}): {{ _export_touch.msg | default('') }}.
      Check that its directory exists there.
  when: _export_touch.failed | default(false)

# The orchestrator owns how a file is copied out of the container
# (docker compose cp vs kubectl cp); dispatch.
- name: Copy dump from the container to the host
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/copy_from_container.yml
  vars:
    copy_service: "{{ _db_admin_service }}"
    copy_src: "{{ _export_tmp }}{{ (export_gzip | bool) | ternary('.gz', '') }}"
    copy_dest: "{{ export_dest }}"

- name: Restrict exported dump to its owner
  ansible.builtin.file:
    path: "{{ export_dest }}"
    mode: "0600"

- name: Clean up temp files in container
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: "{{ _db_admin_service }}"
    exec_command: "rm -f {{ _export_tmp }} {{ _export_tmp }}.gz"
