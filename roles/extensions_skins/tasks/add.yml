---
# Add an extension/skin to an instance.
#
# Each name is, in order: bundled (shipped in the image; nothing is
# cloned, it is only enabled), already local (a checkout in the instance's
# extensions/ or skins/; its branch is verified), or cloned. Cloning needs
# --clone or --repository; without either the command fails before changing
# anything, naming the URL and its source.
#
# For a clone it resolves the git URL + branch (REL1_YY for Gerrit remotes) from
# ExtensionJson.json or Wikimedia Gerrit, adds it as a submodule (gitops) or a plain clone
# (non-gitops) under extensions/ or skins/, commits it in gitops,
# registers any composer.json in config/composer.local.json and best-effort
# installs its non-dev requirements (--no-dev); a resolution failure is reported
# and the registration reverted rather than aborting, and optionally enables it
# (write settings + run update.php).
#
# Input: id, wiki (optional, passed to enable), names (comma-separated),
#        mw_version (optional override), repository (optional override),
#        branch (optional override), clone (bool), skip_enable (bool), skip_update (bool),
#        _item_type (extensions|skins)

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Refuse Kubernetes (unsupported)
  ansible.builtin.fail:
    msg: >-
      'canasta {{ _item_type }} add' is only supported on Compose (including
      gitops) instances; Kubernetes user extensions live in a PVC and are not
      managed this way.
  when: instance_orchestrator | default('compose') in ['kubernetes', 'k8s']

- name: Refuse --repository/--branch with several names
  ansible.builtin.fail:
    msg: >-
      --repository and --branch apply to a single {{ _item_type[:-1] }};
      add the others in a separate command.
  when:
    - names.split(',') | map('trim') | reject('equalto', '') | list | length > 1
    - (repository | default('', true) | length > 0) or (branch | default('', true) | length > 0)

- name: Set item directory
  ansible.builtin.set_fact:
    _item_dir: "{{ 'skins' if (_item_type == 'skins') else 'extensions' }}"

- name: Detect whether the instance is gitops-managed
  ansible.builtin.stat:
    path: "{{ instance_path }}/.git"
  register: _git_dir

- name: Record gitops status
  ansible.builtin.set_fact:
    is_gitops: "{{ _git_dir.stat.exists | bool }}"

- name: "Detect MediaWiki version (for REL1_YY) unless overridden"
  when: mw_version is not defined or mw_version | default('') | trim == ''
  block:
    - name: Run maintenance/version.php
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: web
        exec_command: >-
          v="";
          if [ -f /var/www/mediawiki/w/maintenance/version.php ]; then
          v=$(php /var/www/mediawiki/w/maintenance/version.php | grep -oE "[0-9]+[.][0-9]+[.][0-9]+" | head -n1); fi;
          if [ -z "$v" ] && [ -f /var/www/mediawiki/w/includes/Defines.php ]; then
          v=$(grep -oE "MW_VERSION[^0-9]*[0-9.]+" /var/www/mediawiki/w/includes/Defines.php
          | head -n1 | sed -E "s/.*([0-9]+[.][0-9]+[.][0-9]+).*/\1/"); fi;
          printf '%s' "$v"
        exec_long: true
    - name: Parse MediaWiki version
      ansible.builtin.set_fact:
        _mw_version: >-
          {{ exec_result.stdout | trim | default('', true) }}
  rescue:
    - name: Record that version detection failed
      ansible.builtin.set_fact:
        _mw_version: ""

- name: Apply MW version override
  ansible.builtin.set_fact:
    _mw_version: "{{ mw_version | default(_mw_version | default('')) }}"
  when: mw_version is defined and mw_version | default('') | trim != ''

- name: Fail loudly if the MediaWiki version could not be detected
  ansible.builtin.fail:
    msg: >-
      Could not detect a valid MediaWiki version
      (/var/www/mediawiki/w/maintenance/version.php missing, a version that is
      not 1.x, or the web container is not running). Start the instance first,
      or pass an explicit version with --mw-version (e.g. --mw-version 1.43.2).
  when: >
    _mw_version is not defined
    or _mw_version | default('', true) | trim == ''
    or _mw_version | default('', true) | trim is not match('^1\\.\\d+(\\.\\d+)?$')

- name: Set ExtensionJson.json offline snapshot path
  ansible.builtin.set_fact:
    _extjson_path: "{{ canasta_root }}/data/ExtensionJson.json"

- name: "Set requested {{ _item_type }}"
  ansible.builtin.set_fact:
    _names_list: "{{ names.split(',') | map('trim') | reject('equalto', '') | list }}"
    _item_kind: "{{ 'Skin' if (_item_type == 'skins') else 'Extension' }}"

# Bundled items are symlinks into ../canasta-{{ _item_type }} (or real
# directories); user items are symlinks into ../user-{{ _item_type }}.
- name: "Probe bundled {{ _item_type }}"
  block:
    - name: "List bundled {{ _item_type }} in the web container"
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
      vars:
        exec_service: web
        exec_command: >-
          cd /var/www/mediawiki/w/{{ _item_type }} &&
          for d in */; do d="${d%/}";
          [ -d "$d" ] || continue;
          if [ -L "$d" ]; then case "$(readlink "$d")" in
          */canasta-{{ _item_type }}/*) ;;
          *) continue ;; esac; fi;
          printf '%s\n' "$d";
          done
    - name: "Record bundled {{ _item_type }}"
      ansible.builtin.set_fact:
        _bundled_dirs: >-
          {{ (exec_result.stdout | default('')).splitlines() | map('trim')
             | reject('equalto', '') | list }}
  rescue:
    - name: "Fail: could not list bundled {{ _item_type }}"
      ansible.builtin.fail:
        msg: >-
          Could not list the bundled {{ _item_type }} in the web container, so
          it is unknown which of {{ _names_list | join(', ') }} ship with
          Canasta. Start the instance first.

- name: "List {{ _item_dir }}/ on the instance"
  ansible.builtin.find:
    paths: "{{ instance_path }}/{{ _item_dir }}"
    file_type: any
  register: _local_entries

- name: "Map lowercase names to on-disk spellings"
  ansible.builtin.set_fact:
    _bundled_map: "{{ dict(_bundled_dirs | map('lower') | zip(_bundled_dirs)) }}"
    _local_map: >-
      {{ dict(_local_entries.files | map(attribute='path') | map('basename')
              | map('lower')
              | zip(_local_entries.files | map(attribute='path') | map('basename'))) }}
    _classified: []

- name: "Classify requested {{ _item_type }} as bundled, local, or to clone"
  ansible.builtin.set_fact:
    _classified: >-
      {{ _classified + [
           {'name': _bundled_map[item | lower], 'category': 'bundled'}
           if (item | lower) in _bundled_map else
           {'name': _local_map[item | lower], 'category': 'local'}
           if (item | lower) in _local_map else
           {'name': item, 'category': 'clone'}] }}
  loop: "{{ _names_list }}"

- name: "Split bundled from non-bundled {{ _item_type }}"
  ansible.builtin.set_fact:
    _bundled_names: >-
      {{ _classified | selectattr('category', 'equalto', 'bundled')
         | map(attribute='name') | list }}
    _non_bundled: "{{ _classified | rejectattr('category', 'equalto', 'bundled') | list }}"

- name: "Refuse --repository/--branch for a bundled {{ _item_type[:-1] }}"
  ansible.builtin.fail:
    msg: >-
      {{ _item_kind }} '{{ _bundled_names | first }}' is bundled with Canasta;
      its version comes from the image, so --repository and --branch do not
      apply.
  when:
    - _bundled_names | length > 0
    - (repository | default('', true) | length > 0) or (branch | default('', true) | length > 0)

- name: "Resolve {{ _item_type }} git URL and branch"
  canasta_extension_resolve:
    name: "{{ item.name }}"
    item_type: "{{ _item_type }}"
    mw_version: "{{ _mw_version | default('', true) }}"
    repository: "{{ repository | default(omit) }}"
    branch: "{{ branch | default(omit) }}"
    json_path: "{{ _extjson_path }}"
  loop: "{{ _non_bundled }}"
  loop_control:
    label: "{{ item.name }}"
  register: _resolved
  # The bundled snapshot lives on the controller.
  delegate_to: canasta_controller

- name: "Initialize {{ _item_type }} to add"
  ansible.builtin.set_fact:
    _to_add: []

# A local checkout keeps its on-disk spelling so _add_one finds it.
- name: "Collect resolved {{ _item_type }} with their category"
  ansible.builtin.set_fact:
    _to_add: >-
      {{ _to_add + [item | combine({
           'name': item.item.name if item.item.category == 'local' else item.name,
           'category': item.item.category})] }}
  loop: "{{ _resolved.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: "Set {{ _item_type }} that need cloning"
  ansible.builtin.set_fact:
    _clone_pending: "{{ _to_add | selectattr('category', 'equalto', 'clone') | list }}"

- name: "Refuse to clone without --clone or --repository"
  ansible.builtin.fail:
    msg: >-
      {% for c in _clone_pending %}{{ _item_kind }} '{{ c.name }}' is not
      bundled and not in {{ _item_dir }}/. It would be cloned from
      {{ c.repository }} ({{ c.source_label }}). {% endfor %}Pass --clone to
      clone {{ 'it' if (_clone_pending | length == 1) else 'them' }}.
  when:
    - _clone_pending | length > 0
    - not (clone | default(false) | bool)
    - repository | default('', true) | length == 0

- name: "Report bundled {{ _item_type }}"
  when: _bundled_names | length > 0
  ansible.builtin.debug:
    msg: >-
      {{ _bundled_names
         | map('regex_replace', '^(.*)$',
               _item_kind ~ " '\1' is bundled with Canasta; nothing to clone.")
         | list }}

- name: "Add each {{ _item_type }} to the instance"
  ansible.builtin.include_tasks: _add_one.yml
  loop: "{{ _to_add }}"
  loop_control:
    label: "{{ item.name }}"

# Items that ship a composer.json declare PHP package requirements (the
# non-dev ones matter at runtime). MediaWiki's composer merge plugin picks
# them up only if the item's composer.json is listed in
# config/composer.local.json — so register it, then install.
- name: "Check added {{ _item_type }} for a composer.json"
  ansible.builtin.stat:
    path: "{{ instance_path }}/{{ _item_dir }}/{{ item.name }}/composer.json"
  loop: "{{ _to_add }}"
  loop_control:
    label: "{{ item.name }}"
  register: _composer_probes

- name: "Collect {{ _item_type }} with composer requirements"
  ansible.builtin.set_fact:
    # Relative to w/. The container's directory monitor links a new
    # user-extensions/<name> into extensions/ as soon as it appears, and
    # run-all.sh recreates the links before composer on every start.
    _composer_paths: >-
      {{ _composer_probes.results
         | selectattr('stat.exists')
         | map(attribute='item.name')
         | map('regex_replace', '^(.*)$', _item_dir ~ '/\1/composer.json')
         | list }}

- name: "Register composer requirements in composer.local.json"
  when: _composer_paths | length > 0
  canasta_composer_local:
    instance_path: "{{ instance_path }}"
    include: "{{ _composer_paths }}"
  register: _composer_local

# Best-effort install: run it BEFORE committing config/composer.local.json so
# a dependency conflict (or a downed web container) cannot leave a broken,
# committed config that the next container start's run-all.sh would also choke
# on. On failure we revert the registration and warn instead of aborting.
- name: "Install composer requirements (--no-dev)"
  when: _composer_paths | length > 0
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: web
    # The merge plugin silently skips an include that is not there yet, so
    # wait briefly for the monitor to link each new item.
    exec_command: >-
      cp /mediawiki/config/composer.local.json /var/www/mediawiki/w/composer.local.json &&
      cd /var/www/mediawiki/w &&
      for f in {{ _composer_paths | map('quote') | join(' ') }}; do
      i=0; while [ ! -e "$f" ] && [ $i -lt 30 ]; do sleep 1; i=$((i+1)); done;
      [ -e "$f" ] || { echo "$f is not visible in the container" >&2; exit 1; };
      done &&
      composer update --no-dev --no-interaction
    exec_long: true
    # Best-effort: a composer dependency conflict must not abort the whole
    # command. rx_fail only applies while exec_long is true (the command then
    # runs through resilient_exec.yml, which honors it and still records
    # exec_result so the caller can revert + warn).
    rx_fail: false

- name: "Commit composer.local.json (gitops) on successful install"
  when:
    - _composer_paths | length > 0
    - exec_result.rc | default(1) == 0
    - is_gitops | bool
  block:
    - name: "Stage composer.local.json (gitops)"
      ansible.builtin.command:
        cmd: "git -C {{ instance_path | quote }} add -- config/composer.local.json"
        chdir: "{{ instance_path }}"
      changed_when: true

    - name: "Commit composer.local.json (gitops)"
      ansible.builtin.command:
        cmd: >-
          git -C {{ instance_path | quote }} -c commit.gpgsign=false commit
          -m {{ ('Add composer requirements for ' ~ (_to_add | map(attribute='name') | join(', '))) | quote }}
        chdir: "{{ instance_path }}"
      changed_when: true
      ignore_errors: true  # nothing to commit if the file content was already committed

- name: "Revert composer registration when install failed"
  when:
    - _composer_paths | length > 0
    - exec_result.rc | default(1) != 0
  block:
    - name: "Warn that the composer install failed"
      ansible.builtin.debug:
        msg: >-
          Composer could not install the requirements for
          {{ _to_add | map(attribute='name') | join(', ') }}
          (composer exited {{ exec_result.rc | default('?') }}). The
          {{ _item_type }} code was added, but its PHP dependencies are NOT
          installed and were left out of config/composer.local.json to keep the
          instance's composer config valid. Resolve the conflict — usually a
          version pin that is incompatible with the instance's existing
          packages — then re-run the add or register the requirements manually.

    # Only what this run added: items that were already registered were
    # working before and must stay.
    - name: "Unregister composer requirements to keep config clean"
      when: _composer_local.added | default([]) | length > 0
      canasta_composer_local:
        instance_path: "{{ instance_path }}"
        include: "{{ _composer_local.added }}"
        state: absent

- name: "Enable added {{ _item_type }} (with containers up so the monitor has linked them)"
  when: not (skip_enable | default(false) | bool)
  block:
    - name: "Ensure containers are running so the monitor links the new {{ _item_type }}"
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: start.yml
      when: instance_orchestrator | default('compose') not in ['kubernetes', 'k8s']

    - name: "Enable added {{ _item_type }}"
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/extensions_skins/tasks/enable.yml"
      vars:
        _names: "{{ (_bundled_names + (_to_add | map(attribute='name') | list)) | join(',') }}"
