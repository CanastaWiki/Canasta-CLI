---
# Disable extensions or skins.
# Input: id, wiki (optional), _item_type (extensions|skins), _names (comma-separated)

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Refuse a paused instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/refuse_paused.yml"

- name: Read wikis
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: read
  register: _disable_wikis

- name: Fail when the named wiki is not in this instance
  ansible.builtin.fail:
    msg: >-
      Wiki '{{ wiki }}' is not in this instance. Present wikis:
      {{ _disable_wikis.wiki_ids | join(', ') }}.
  when:
    - wiki | default('') != ''
    - wiki not in _disable_wikis.wiki_ids

- name: "Refuse to disable {{ _item_type }} that enabled ones require"
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/extensions_skins/tasks/_check_requires.yml"
  vars:
    _requires_state: disable
    _requires_names: "{{ _names.split(',') | map('trim') | list }}"
    _requires_wiki: "{{ wiki | default('') }}"
    _requires_wiki_ids: "{{ _disable_wikis.wiki_ids | default([]) }}"

- name: "Disable {{ _item_type }}"
  canasta_settings_yaml:
    instance_path: "{{ instance_path }}"
    item_type: "{{ _item_type }}"
    state: disable
    names: "{{ _names.split(',') | map('trim') | list }}"
    wiki: "{{ wiki | default(omit) }}"
  register: _settings_change

- name: "Commit {{ _item_type }} disable (gitops)"
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/extensions_skins/tasks/_commit_settings.yml"
  vars:
    _settings_action: Disable

- name: "Report {{ _item_type }} disabled"
  ansible.builtin.debug:
    msg: "Disabled {{ _item_type }}: {{ _names }}"
