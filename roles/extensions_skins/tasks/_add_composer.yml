---
# The composer phase of extension|skin add: register each added item's
# composer.json in config/composer.local.json, install it, and on a failed
# install or an autoloader that requires missing files, revert this run's
# registrations and warn or fail. Expects _to_add, _item_dir and _item_type
# from add.yml.

# Items that ship a composer.json declare PHP package requirements (the
# non-dev ones matter at runtime). MediaWiki's composer merge plugin picks
# them up only if the item's composer.json is listed in
# config/composer.local.json — so register it, then install.
- name: "Check added {{ _item_type }} for a composer.json"
  ansible.builtin.stat:
    path: "{{ instance_path }}/{{ _item_dir }}/{{ item.name }}/composer.json"
  loop: "{{ _to_add }}"
  loop_control:
    label: "{{ item.name }}"
  register: _composer_probes

- name: "Collect {{ _item_type }} with composer requirements"
  ansible.builtin.set_fact:
    # Relative to w/. The container's directory monitor links a new
    # user-extensions/<name> into extensions/ as soon as it appears, and
    # run-all.sh recreates the links before composer on every start.
    _composer_paths: >-
      {{ _composer_probes.results
         | selectattr('stat.exists')
         | map(attribute='item.name')
         | map('regex_replace', '^(.*)$', _item_dir ~ '/\1/composer.json')
         | list }}

# Composer writes an autoload.files entry into vendor/ whether or not the file
# exists, and every wiki then fails to load, so such an item is not registered.
- name: "Check the autoload files of added {{ _item_type }}"
  when: _composer_paths | length > 0
  canasta_composer_autoload:
    instance_path: "{{ instance_path }}"
    include: "{{ _composer_paths }}"
  register: _autoload_check

- name: "Leave out {{ _item_type }} that autoload missing files"
  ansible.builtin.set_fact:
    _autoload_broken: "{{ _autoload_check.broken | default([]) }}"
    _composer_paths: >-
      {{ _composer_paths
         | reject('in', _autoload_check.broken | default([])
                        | map(attribute='include') | list)
         | list }}

- name: "Register composer requirements in composer.local.json"
  when: _composer_paths | length > 0
  canasta_composer_local:
    instance_path: "{{ instance_path }}"
    include: "{{ _composer_paths }}"
  register: _composer_local

# Best-effort install: run it BEFORE committing config/composer.local.json so
# a dependency conflict (or a downed web container) cannot leave a broken,
# committed config that the next container start's run-all.sh would also choke
# on. On failure we revert the registration and warn instead of aborting.
- name: "Install composer requirements (--no-dev)"
  when: _composer_paths | length > 0
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/extensions_skins/tasks/_composer_update.yml"
  vars:
    composer_update_wait: "{{ _composer_paths }}"

# The checks below overwrite exec_result, and a block's when is
# re-evaluated for every task in it.
- name: "Record the composer install result"
  when: _composer_paths | length > 0
  ansible.builtin.set_fact:
    _composer_install_result: "{{ exec_result }}"

# composer exits 0 even when the autoloader it writes requires files that do
# not exist.
- name: "Check that the files the autoloader requires exist"
  when:
    - _composer_paths | length > 0
    - _composer_install_result.rc | default(1) == 0
  ansible.builtin.include_tasks:
    file: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
    apply:
      ignore_errors: true
  vars:
    exec_service: web
    exec_command: "php --"
    exec_stdin: "{{ canasta_root }}/roles/extensions_skins/files/missing_autoload_files.php"

- name: "Record the files the autoloader requires that do not exist"
  ansible.builtin.set_fact:
    _autoload_missing: >-
      {{ (exec_result.stdout_lines | default([]))
         if (_composer_paths | length > 0
             and _composer_install_result.rc | default(1) == 0
             and exec_result.rc | default(0) == 1)
         else [] }}

- name: "Commit composer.local.json (gitops) on successful install"
  when:
    - _composer_paths | length > 0
    - _composer_install_result.rc | default(1) == 0
    - _autoload_missing | length == 0
    - is_gitops | bool
  block:
    - name: "Stage composer.local.json (gitops)"
      ansible.builtin.command:
        cmd: "git -C {{ instance_path | quote }} add -- config/composer.local.json"
        chdir: "{{ instance_path }}"
      changed_when: true

    - name: "Commit composer.local.json (gitops)"
      ansible.builtin.command:
        cmd: >-
          git -C {{ instance_path | quote }} -c commit.gpgsign=false commit
          -m {{ ('Add composer requirements for ' ~ (_to_add | map(attribute='name') | join(', '))) | quote }}
          -- config/composer.local.json
        chdir: "{{ instance_path }}"
      register: _composer_commit
      changed_when: _composer_commit.rc == 0
      # Nothing to commit when the file content was already committed.
      failed_when:
        - _composer_commit.rc != 0
        - _composer_commit.stdout is not search('nothing (added )?to commit|no changes added to commit')

- name: "Revert composer registration when install failed"
  when:
    - _composer_paths | length > 0
    - (_composer_install_result.rc | default(1) != 0) or (_autoload_missing | length > 0)
  block:
    # Only what this run added: items that were already registered were
    # working before and must stay.
    - name: "Unregister composer requirements to keep config clean"
      when: _composer_local.added | default([]) | length > 0
      canasta_composer_local:
        instance_path: "{{ instance_path }}"
        include: "{{ _composer_local.added }}"
        state: absent

    # Rebuild vendor/ from the restored list, which also clears
    # composer-update.failed on success.
    - name: "Rebuild composer state from the restored list"
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/extensions_skins/tasks/_composer_update.yml"

    - name: "Warn that the composer install failed"
      when: _composer_install_result.rc | default(1) != 0
      vars:
        _composer_failed_reason: >-
          {{ ((_composer_install_result.stderr | default('')).splitlines()
              | select('match', 'composer-update.failed: ')
              | map('replace', 'composer-update.failed: ',
                    '; config/persistent/composer-update.failed: ')
              | map('regex_replace', '[.]$', '')
              | first) | default('') }}
        _composer_rebuild_failure: >-
          {% if (exec_result.rc | default(1)) != 0 %} Rebuilding composer
          state from the restored list also failed (exit
          {{ exec_result.rc | default('?') }}){{ _composer_rebuild_reason }}.{% endif %}
        _composer_rebuild_reason: >-
          {{ ((exec_result.stderr | default('')).splitlines()
              | select('match', 'composer-update.failed: ')
              | map('replace', 'composer-update.failed: ',
                    '; config/persistent/composer-update.failed: ')
              | map('regex_replace', '[.]$', '')
              | first) | default('') }}
      ansible.builtin.debug:
        msg: >-
          Composer could not install the requirements for
          {{ _to_add | map(attribute='name') | join(', ') }}
          (composer exited {{ _composer_install_result.rc | default('?') }}){{ _composer_failed_reason }}. The
          {{ _item_type }} code was added, but its PHP dependencies are NOT
          installed and were left out of config/composer.local.json to keep the
          instance's composer config valid. Resolve the conflict — usually a
          version pin that is incompatible with the instance's existing
          packages — then re-run the add or register the requirements manually.{{ _composer_rebuild_failure }}

- name: "Fail: {{ _item_type }} autoload files that do not exist"
  when: (_autoload_broken | length > 0) or (_autoload_missing | length > 0)
  vars:
    _autoload_left_out: >-
      {{ (_autoload_broken | map(attribute='include') | list)
         + ((_composer_local.added | default([]))
            if (_autoload_missing | length > 0) else []) }}
    # The items whose files are missing, which can be ones registered before
    # this run; otherwise what this run left out or added.
    _autoload_owners: >-
      {{ ((_autoload_broken | map(attribute='include') | map('dirname')
           | map('basename') | list)
          + (_autoload_missing | select('match', _item_dir ~ '/[^/]+/')
             | map('regex_replace', '^' ~ _item_dir ~ '/', '')
             | map('regex_replace', '/.*$', '')
             | list)) | unique | list }}
    _autoload_names: >-
      {{ _autoload_owners
         or (_autoload_left_out | map('dirname') | map('basename') | list)
         or (_to_add | map(attribute='name') | list) }}
  ansible.builtin.fail:
    msg: >-
      {% for b in _autoload_broken %}{{ b.include }} autoloads files that
      are not in the repository: {{ b.missing | join(', ') }}. {% endfor %}
      {%- if _autoload_missing | length > 0 %}After composer update the
      autoloader requires files that do not exist:
      {{ _autoload_missing | join(', ') }}. {% endif %}
      {%- if _autoload_left_out | length > 0 %}So that the wikis keep
      loading, {{ _autoload_left_out | join(', ') }}
      {{ 'was' if (_autoload_left_out | length == 1) else 'were' }} left out
      of config/composer.local.json. {% endif %}The {{ _item_type[:-1] }} code was added
      {{- '' if (skip_enable | default(false) | bool) else (' but nothing was enabled') }}.
      Fix the autoload.files entries of the composer.json and re-run the
      add, or remove the {{ _item_type[:-1] }} with
      'canasta {{ _item_type[:-1] }} remove {{ _autoload_names | join(',') }}'.
      {%- if _autoload_missing | length > 0 and exec_result.rc | default(0) != 0 %}
      Rebuilding composer state from the restored list failed (exit
      {{ exec_result.rc }}); run 'canasta restart' to rebuild it.{% endif %}
