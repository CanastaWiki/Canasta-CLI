---
# A gitops pull whose conflicts are being resolved by hand leaves the
# repository mid-rebase (or mid-merge), with every tracked file at the
# upstream version, so the configuration is half-merged. Commands that read
# or write it must not act on it until the resolution finishes. Read-only
# commands, delete and stop declare unfinished_pull_ok in
# command_definitions.yml and are not checked.
#
# Input: instance_id, instance_path, canasta_unfinished_pull_ok (optional).
# Output: unfinished_pull (bool), unfinished_pull_reason.

- name: Check for an unfinished gitops pull
  ansible.builtin.stat:
    path: "{{ instance_path }}/.git/{{ item }}"
  loop:
    - rebase-merge
    - rebase-apply
    - MERGE_HEAD
  register: _unfinished_pull_stat
  when: not (canasta_unfinished_pull_ok | default(false) | bool)

- name: Describe the unfinished gitops pull
  ansible.builtin.set_fact:
    unfinished_pull: "{{ _found | length > 0 }}"
    unfinished_pull_reason: >-
      its gitops repository is in the middle of a pull whose conflicts are
      not resolved, so its configuration is half-merged.
      {% if _verb == 'merge' -%}
      In {{ instance_path }}, resolve the conflicts and run
      'git merge --continue', or go back to where the pull started with
      'git merge --abort'.
      {%- else -%}
      Finish it with 'canasta gitops resolve -i {{ instance_id }} --continue',
      or go back to where the pull started with
      'canasta gitops resolve -i {{ instance_id }} --abort'.
      {%- endif %}
  vars:
    _found: >-
      {{ (_unfinished_pull_stat.results | default([]))
         | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
         | map(attribute='item') | list }}
    _verb: "{{ 'merge' if 'MERGE_HEAD' in _found else 'rebase' }}"
