---
# Generate a secure password.
# 30 chars, includes uppercase, digits, and symbols.
# Symbols are limited to those validate_passwords.yml accepts, which also
# keeps out '$' (MediaWiki bug T355013). Comma separates entries in the
# lookup's chars list, so it is left out.
#
# Output fact: _generated_password

- name: Generate secure password
  ansible.builtin.set_fact:
    _generated_password: >-
      {{ lookup('ansible.builtin.password', '/dev/null length=30 chars=ascii_letters,digits,@%^-_+.:') }}
