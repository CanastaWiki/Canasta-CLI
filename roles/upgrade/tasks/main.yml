---
# Upgrade a single Canasta instance.
# Runs all migrations, handles MySQL-to-MariaDB, rebuilds custom images,
# refreshes stack files, pulls images, restarts.
# Input: instance_path, instance_id, instance_devmode

# --- Check instance directory exists ---
- name: Check if instance directory exists
  ansible.builtin.stat:
    path: "{{ instance_path }}"
  register: _upgrade_dir

- name: Skip upgrade if instance directory is missing
  when: not (_upgrade_dir.stat.exists | default(false))
  block:
    - name: Report missing instance
      ansible.builtin.debug:
        msg: >-
          Instance '{{ instance_id }}' directory not found at
          {{ instance_path }}. Skipping upgrade.

    - name: End upgrade for missing instance
      ansible.builtin.meta: end_role

# Record whether the instance is up before anything runs, so the restart step
# never starts an instance the operator had stopped. Config and image refreshes
# still land on disk; they apply on the next start.
- name: Check pre-upgrade running state
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/check_running.yml"

- name: Record pre-upgrade running state
  ansible.builtin.set_fact:
    _was_running: "{{ _container_running | default(false) | bool }}"

# Writing the stack files reconciles CANASTA_CADDY_IMAGE in .env, so the
# Caddy image check needs the value from before it.
- name: Record the Caddy image before the stack files are rewritten
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: CANASTA_CADDY_IMAGE
  register: _upgrade_caddy_env_before
  failed_when: false

# --- Migrations ---
- name: Report checking migrations
  ansible.builtin.debug:
    msg: "Checking for config migrations..."

- name: Run migrations
  ansible.builtin.include_tasks: run_migrations.yml

# --- DB migrations (MySQL->MariaDB) ---
- name: Run DB migrations
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/upgrade/tasks/migrations/mysql_to_mariadb.yml

# --- Rebuild custom image if instance was built from source ---
- name: Check for BuildFrom in registry
  canasta_registry:
    id: "{{ instance_id }}"
    state: query
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _upgrade_inst

# Facts persist across the upgrade loop's iterations, so every one of these is
# set unconditionally: a value left behind by the previous instance would
# otherwise be read as this instance's. The stat is likewise unconditional
# (an empty buildFrom just stats a path that does not exist) rather than
# registered under a `when:`, which would leave a skip-result dict behind.
- name: Note the recorded build-from source
  ansible.builtin.set_fact:
    _upgrade_build_from: "{{ _upgrade_inst.instance.buildFrom | default('') }}"

# A BASE_IMAGE pinned to an older Canasta release would rebuild the image on
# that release again, leaving the instance behind the upgrade's target.
- name: Move a BASE_IMAGE pinned to an older Canasta release to the target
  ansible.builtin.set_fact:
    _upgrade_build_args: >-
      {{ _upgrade_inst.instance.buildArgs | default([])
         | canasta_retarget_base_image(canasta_default_image) }}

- name: Check that the recorded build-from source still exists
  ansible.builtin.stat:
    path: "{{ _upgrade_build_from }}/Canasta/Dockerfile"
  register: _upgrade_build_from_stat

- name: Decide whether the image can be rebuilt from source
  ansible.builtin.set_fact:
    _upgrade_rebuild: >-
      {{ _upgrade_build_from != '' and _upgrade_build_from_stat.stat.exists }}

# A recorded build-from path can go missing (a deleted checkout, or a staging
# directory under /tmp that its tool cleaned up). Skip this instance's rebuild
# rather than failing: the upgrade loop has no per-instance rescue, so failing
# here strands every instance after this one in the registry. The image tag
# bump and the registry pull stay gated on buildFrom below, so the instance
# keeps running the image it has instead of being pointed at a stock one.
- name: Warn that the recorded build-from source is gone
  ansible.builtin.debug:
    msg: >-
      Instance '{{ instance_id }}' is built from source at
      '{{ _upgrade_build_from }}', but no Canasta/Dockerfile exists there.
      Skipping the image rebuild and leaving the instance on its current
      image. Restore that source tree, then re-run the upgrade to rebuild.
  when:
    - _upgrade_build_from != ''
    - not _upgrade_rebuild | bool

- name: Reset the rebuilt image change signal for this instance
  ansible.builtin.set_fact:
    _upgrade_rebuilt_image_changed: false

- name: Rebuild image from source
  ansible.builtin.include_role:
    name: imagebuild
    tasks_from: build_from_source.yml
  vars:
    build_from: "{{ _upgrade_build_from }}"
    build_arg: "{{ _upgrade_build_args }}"
    build_base_only: >-
      {{ _upgrade_inst.instance.buildTarget | default('') == 'canasta-base' }}
  when: _upgrade_rebuild | bool

- name: Record the base image of the rebuilt image
  canasta_registry:
    id: "{{ instance_id }}"
    state: update
    build_base: "{{ _effective_base_image }}"
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  when: _upgrade_rebuild | bool

- name: Record the moved BASE_IMAGE in the registry
  when:
    - _upgrade_rebuild | bool
    - _upgrade_build_args != (_upgrade_inst.instance.buildArgs | default([]))
  block:
    - name: Update the recorded build args
      canasta_registry:
        id: "{{ instance_id }}"
        state: update
        build_args: "{{ _upgrade_build_args }}"
      delegate_to: canasta_controller
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Report the moved BASE_IMAGE
      ansible.builtin.debug:
        msg: >-
          Rebuilt '{{ instance_id }}' on BASE_IMAGE {{ canasta_default_image }}
          (was {{ (_upgrade_inst.instance.buildArgs
          | select('match', '^BASE_IMAGE=') | list | last)[11:] }}).

- name: Compare the rebuilt image with the running one
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/compare_rebuilt_image.yml
  when: _upgrade_rebuild | bool

# --- Refresh config ---
# Force-refresh the managed docker-compose.yml so compose changes (e.g. a
# newly added crowdsec service) reach instances created on an older
# version. User-adjacent files stay no-clobber inside write_stack_files.
- name: Refresh stack files (force-refresh managed compose)
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: write_stack_files.yml
  vars:
    stack_files_force: true

# The Caddyfile is rendered, so a template change reaches existing instances
# only by re-rendering it.
- name: Regenerate the Caddyfile
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml

- name: Initialize orchestrator config
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: init_config.yml

# Bring a gitops instance's .gitignore current with the shipped rules.
# Like the managed compose stack files above, .gitignore is CLI-managed
# scaffolding; unlike them it was never refreshed after 'gitops init', so
# ignore rules added in later releases never reached existing instances.
# No-ops on non-gitops instances.
- name: Refresh gitops .gitignore (managed ignore rules)
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/refresh_gitignore.yml

# Create wikis.yaml.template for a gitops instance that lacks it (e.g. a
# Go-CLI-era repo predating the template). Without it the wikis.yaml
# reconcile/advisory machinery is inert. No-ops on non-gitops instances
# and when the template already exists.
- name: Backfill gitops wikis.yaml.template if missing
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/backfill_wikis_template.yml

# Create my.cnf.template for a gitops instance that lacks it. my.cnf is
# host-specific (innodb_buffer_pool_size must fit the host's RAM), so a
# repo spanning hosts of different sizes cannot share one. Create-only,
# and stages nothing — the operator finishes the migration. No-ops on
# non-gitops instances and when the template already exists.
- name: Backfill gitops my.cnf.template if missing
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/backfill_mycnf_template.yml

# init_config writes config/haproxy-backend.cfg; a gitops repo created before
# the HAProxy edge would otherwise leave it untracked.
- name: Stage haproxy-backend.cfg in a gitops repo that lacks it
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/stage_haproxy_backend_cfg.yml

# Facts persist across the instances of one upgrade run, so clear the image
# change signal before this instance sets its own.
- name: Reset image change signals for this instance
  ansible.builtin.set_fact:
    _pull_changed: false

# --- Bump the configured image tag (CANASTA_IMAGE in .env) ---
- name: Update configured image tag
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/upgrade_image_tag.yml

# --- Pull and restart ---
- name: Report pulling images
  ansible.builtin.debug:
    msg: "Pulling Canasta container images..."
  when: _upgrade_inst.instance.buildFrom | default('') == ''

- name: Pull latest images
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: pull.yml
  when: _upgrade_inst.instance.buildFrom | default('') == ''

- name: Check if new images were pulled
  ansible.builtin.set_fact:
    _images_updated: "{{ _pull_changed | default(false) | bool }}"

# --- Rebuild buildable services ---
# Services with a `build:` directive are rebuilt when an image change is
# detected; updates the shared _images_updated fact.
- name: Rebuild buildable services if needed
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/upgrade_rebuild_buildable.yml

- name: Check whether the managed Caddy image changes
  ansible.builtin.include_tasks: check_caddy_image.yml

# Left by a run whose restart of this instance failed. That run already
# pointed .env at the new image, so nothing else here would see a change,
# and the instance would be reported up to date without ever having come
# up healthy on it.
- name: Check for an upgrade whose restart failed
  ansible.builtin.stat:
    path: "{{ instance_path }}/.upgrade-incomplete"
  register: _upgrade_incomplete_marker

- name: Note whether a previous upgrade is unfinished
  ansible.builtin.set_fact:
    _upgrade_incomplete: "{{ _upgrade_incomplete_marker.stat.exists }}"

# A compose-only change (e.g. gaining the crowdsec service), a new managed
# Caddy image, or .env values the
# migrations quoted, must also trigger a recreate, not just an image bump.
# A build_from instance pulls nothing, so _images_updated stays false for it;
# it restarts when its rebuilt image differs from the one it runs.
# An instance whose custom image failed to build keeps its current
# containers: recreating them could start the stock image in place of the
# custom one.
- name: Decide whether a restart is needed
  ansible.builtin.set_fact:
    _restart_needed: >-
      {{ ((_images_updated | bool)
          or (_compose_stack_copy is defined and _compose_stack_copy is changed)
          or (_upgrade_caddy_image_changed | default(false) | bool)
          or (_upgrade_rebuilt_image_changed | bool)
          or (_upgrade_incomplete | default(false) | bool)
          or (_mig_requote is defined and _mig_requote is changed))
         and (_upgrade_build_failed_services | default([]) | length) == 0 }}

- name: Reset the restart failure signals for this instance
  ansible.builtin.set_fact:
    _upgrade_restart_failed: false
    _composer_update_failure: ''

# A failed restart is recorded rather than raised, so the remaining instances
# still upgrade; the playbook fails once the loop is done.
- name: Restart containers
  when:
    - _restart_needed | bool
    - _was_running | bool
  block:
    - name: Report restarting
      ansible.builtin.debug:
        msg: "Restarting containers..."

    - name: Stop containers
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: stop.yml

    - name: Start containers
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: start.yml

    - name: Flush MediaWiki cache
      ansible.builtin.include_tasks:
        file: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
        # Apply to the included tasks — OK if the container isn't ready yet.
        apply:
          ignore_errors: true
      vars:
        exec_service: web
        exec_command: "touch /var/www/mediawiki/w/LocalSettings.php"

    - name: Clear the unfinished upgrade marker
      ansible.builtin.file:
        path: "{{ instance_path }}/.upgrade-incomplete"
        state: absent

    - name: Report instance upgraded
      ansible.builtin.debug:
        msg: "Canasta upgraded successfully!"

    - name: Report a failed startup composer update
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/mediawiki/tasks/report_composer_failure.yml"
  rescue:
    - name: Record the failed restart
      ansible.builtin.include_tasks: record_restart_failure.yml

    - name: Mark the upgrade unfinished so the next run restarts the instance
      ansible.builtin.copy:
        content: ""
        dest: "{{ instance_path }}/.upgrade-incomplete"
        mode: "0644"

# After the restart: the instance must be running on the refreshed compose
# file, which takes MediaWiki's credentials from WIKI_DB_USER /
# WIKI_DB_PASSWORD.
- name: Move MediaWiki to its own database account
  ansible.builtin.include_tasks: migrate_wiki_db_account.yml
  when: not (_upgrade_restart_failed | bool)

# After the restart too, so the running web container's image decides which
# includes it ignores.
- name: Tidy composer.local.json
  ansible.builtin.include_tasks: tidy_composer_local.yml
  when: not (_upgrade_restart_failed | bool)

- name: Warn about extensions and skins that override bundled ones
  ansible.builtin.include_tasks: warn_overrides.yml
  when: not (_upgrade_restart_failed | bool)

- name: Re-render generated compose layers
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: rerender_compose_layers.yml
  when: not (_restart_needed | bool and _was_running | bool)

# Without a restart, a running Caddy would keep the previous Caddyfile.
- name: Reload Caddy with the regenerated Caddyfile
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/reload_caddy.yml
  when: not (_restart_needed | bool and _was_running | bool)

# Also for an instance upgrade did not restart, so one that predates the
# boot unit gets it.
- name: Start the instance at boot under rootless Podman
  canasta_boot_unit:
    state: enabled
    instance_id: "{{ instance_id }}"
    instance_path: "{{ instance_path }}"
    compose_command: "{{ compose_command | default('docker compose') }}"
    inspect_command: "{{ inspect_command | default('docker') }}"
    devmode: "{{ instance_devmode | default(false) | bool }}"
  when:
    - _was_running | bool
    - not (_upgrade_restart_failed | bool)

# A stopped instance keeps its refreshed config/image on disk but is left
# stopped, so upgrade never starts something the operator had brought down.
- name: Report config refreshed on a stopped instance
  ansible.builtin.debug:
    msg: >-
      Config refreshed. Instance '{{ instance_id }}' was stopped, so it was
      left stopped — the changes apply the next time it starts.
  when:
    - _restart_needed | bool
    - not (_was_running | bool)

# The database account move restarts or redeploys the instance itself.
- name: Report already up to date
  ansible.builtin.debug:
    msg: "Already up to date — no restart needed."
  when:
    - not (_restart_needed | bool)
    - not (_mig_db_redeployed | default(false) | bool)
    - (_upgrade_build_failed_services | default([]) | length) == 0

# Recorded rather than failed here so the remaining instances still upgrade;
# the playbook fails once the loop is done.
- name: Record the failed upgrade
  ansible.builtin.set_fact:
    _upgrade_failures: >-
      {{ (_upgrade_failures | default([]))
         + ["'" ~ instance_id ~ "': building "
            ~ (_upgrade_build_failed_services | join(', '))
            ~ " failed; the instance was left on its current containers"] }}
  when: (_upgrade_build_failed_services | default([]) | length) > 0
