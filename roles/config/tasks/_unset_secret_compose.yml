---
# config unset --secret on Compose: reverse _set_secret_compose.yml for the
# keys recorded in config/secret-keys — remove them from .env, from the
# gitops vars and env.template on a gitops instance, and from the key lists,
# then re-render docker-compose.web-env.yml. A key that was never set with
# --secret is left alone in .env, so a recognized key cannot be removed here
# without the validation and side effects of a plain `config unset`.
# Input: keys, instance_path.

- name: Read the recorded secret keys
  ansible.builtin.slurp:
    src: "{{ instance_path }}/config/secret-keys"
  register: _unset_opaque_names_raw
  failed_when: false

- name: Select the recorded secret keys being removed
  ansible.builtin.set_fact:
    _config_secret_names: >-
      {{ keys.split()
         | select('in', (_unset_opaque_names_raw.content | default('') | b64decode).split())
         | list }}

- name: Remove each secret from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: unset
    keys: "{{ _config_secret_names }}"
  when: _config_secret_names | length > 0

- name: Forget the secret keys
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/{{ item.0 }}"
    line: "{{ item.1 }}"
    state: absent
  loop: "{{ ['secret-keys', 'secret-keys-web'] | product(keys.split()) | list }}"

- name: Render web secret keys to a compose override layer
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/render_web_env.yml"

- name: Check for gitops instance
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _config_gitops_stat

- name: Remove the secrets from the gitops vars
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/config/tasks/_remove_gitops_vars.yml
  vars:
    _config_unset_keys: "{{ _config_secret_names }}"
  when:
    - _config_gitops_stat.stat.exists | default(false)
    - _config_secret_names | length > 0

- name: Stage the secret key lists
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_stage_tracked_paths.yml
  vars:
    _stage_paths:
      - config/secret-keys
      - config/secret-keys-web
  when: _config_gitops_stat.stat.exists | default(false)
