---
# Apply side effects when specific config keys are changed.
# Input: _config_key (str), _config_value (str), instance_path

# Enabling OpenSearch or the observability stack raises the host memory a
# Canasta instance needs (either -> ~4 GiB, both -> ~8 GiB). Enforce it BEFORE
# the flag is written to .env (this runs earlier in _set_single than the
# canasta_env write), so a host that can't run the feature is refused with the
# flag left off rather than left half-enabled. Only checks on enable (true);
# disabling never needs more memory.
- name: Enforce memory floor when enabling OpenSearch or observability
  when:
    - _config_key in ['CANASTA_ENABLE_OPENSEARCH', 'CANASTA_ENABLE_OBSERVABILITY']
    - _config_value | lower == 'true'
  block:
    - name: Read the current OpenSearch and observability flags from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: "{{ item }}"
      loop:
        - CANASTA_ENABLE_OPENSEARCH
        - CANASTA_ENABLE_OBSERVABILITY
      register: _se_mem_flags

    - name: Check host memory for the resulting profile set
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/check_host_memory.yml
      vars:
        # The key being set is going to true; the other flag keeps its current
        # .env value.
        _mem_search_enabled: >-
          {{ (_config_key == 'CANASTA_ENABLE_OPENSEARCH')
             or (_se_mem_flags.results[0].value | default('false') | lower == 'true') }}
        _mem_obs_enabled: >-
          {{ (_config_key == 'CANASTA_ENABLE_OBSERVABILITY')
             or (_se_mem_flags.results[1].value | default('false') | lower == 'true') }}

# OpenSearch is for CirrusSearch, so turning it on enables Elastica and
# CirrusSearch for every wiki (unless already enabled), and turning it off
# disables them: CirrusSearch can do nothing without it. The restart that
# follows brings the cluster and the instance's settings in line.
- name: Enable or disable CirrusSearch with OpenSearch
  canasta_settings_yaml:
    instance_path: "{{ instance_path }}"
    item_type: extensions
    state: "{{ 'enable' if _config_value | lower == 'true' else 'disable' }}"
    names: [Elastica, CirrusSearch]
  when:
    - _config_key == 'CANASTA_ENABLE_OPENSEARCH'
    - _config_value is defined

# Two incompatible-feature combinations are caught here at config-set
# time, before the misconfiguration can land in .env. The runtime
# FarmConfigLoader.php in the canasta image catches the same conditions
# at request time as a safety net for hand-edited configs, but the
# user-facing UX of failing fast at the CLI is much friendlier than
# discovering the problem when the container restart-loops on next
# start.
- name: Validate CANASTA_ENABLE_VERY_SHORT_URLS=true does not collide with current state
  when:
    - _config_key == 'CANASTA_ENABLE_VERY_SHORT_URLS'
    - _config_value | lower == 'true'
  block:
    - name: Read wikis.yaml to check for path-based wikis
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _se_vsu_wikis

    - name: Find any wikis with a path component in their URL
      ansible.builtin.set_fact:
        _path_based_wiki_ids: >-
          {{ _se_vsu_wikis.wikis | default([])
             | selectattr('url', 'search', '/')
             | map(attribute='id') | list }}

    - name: Fail if any wiki has a path-based URL
      ansible.builtin.fail:
        msg: >-
          Cannot enable very short URLs: the following wikis have
          path-based URLs:
          {{ _path_based_wiki_ids | join(', ') }}.
          Each wiki must be on a unique hostname when
          CANASTA_ENABLE_VERY_SHORT_URLS=true. Either remove these
          wikis first or change them to hostname-only URLs.
      when: _path_based_wiki_ids | length > 0

    - name: Read CANASTA_ENABLE_WIKI_DIRECTORY from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: CANASTA_ENABLE_WIKI_DIRECTORY
      register: _se_vsu_wd

    - name: Fail if wiki directory is enabled
      ansible.builtin.fail:
        msg: >-
          Cannot enable very short URLs while
          CANASTA_ENABLE_WIKI_DIRECTORY is true. The wiki directory
          is served at /wikis, which collides with a page titled
          'Wikis' on any wiki using root-relative short URLs.
          Either disable the directory first
          (canasta config set CANASTA_ENABLE_WIKI_DIRECTORY=false)
          or leave very short URLs off.
      when: _se_vsu_wd.value | default('false') | lower == 'true'

# Mirror image: enabling the wiki directory while very short URLs are
# on hits the same conflict.
- name: Validate CANASTA_ENABLE_WIKI_DIRECTORY=true does not collide with very short URLs
  when:
    - _config_key == 'CANASTA_ENABLE_WIKI_DIRECTORY'
    - _config_value | lower == 'true'
  block:
    - name: Read CANASTA_ENABLE_VERY_SHORT_URLS from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: CANASTA_ENABLE_VERY_SHORT_URLS
      register: _se_wd_vsu

    - name: Fail if very short URLs are enabled
      ansible.builtin.fail:
        msg: >-
          Cannot enable wiki directory while
          CANASTA_ENABLE_VERY_SHORT_URLS is true. The wiki directory
          is served at /wikis, which collides with a page titled
          'Wikis' on any wiki using root-relative short URLs.
          Either disable very short URLs first
          (canasta config set CANASTA_ENABLE_VERY_SHORT_URLS=false)
          or leave the directory disabled.
      when: _se_wd_vsu.value | default('false') | lower == 'true'

# The path applies relative to every wiki's URL, so in a farm it can land
# inside another wiki's path on the same host.
- name: Validate MW_SITEMAP_URL_PATH does not overlap another wiki
  when:
    - _config_key == 'MW_SITEMAP_URL_PATH'
    - _config_value | length > 0
  block:
    - name: Read wikis.yaml to check the sitemap paths
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _se_sitemap_wikis

    - name: Fail if a wiki's sitemaps would overlap another wiki
      ansible.builtin.fail:
        msg: "{{ _se_sitemap_wikis.wikis | sitemap_farm_collision_error(_config_value) }}"
      when: (_se_sitemap_wikis.wikis | sitemap_farm_collision_error(_config_value)) | length > 0

- name: Apply HTTP_PORT/HTTPS_PORT side effects
  when: _config_key in ['HTTP_PORT', 'HTTPS_PORT']
  block:
    - name: Read TLS_MODE to determine active scheme
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: TLS_MODE
      register: _se_tls_mode

    - name: Determine active port key for this instance
      vars:
        _se_plain: "{{ _se_tls_mode.value | default('', true) | trim | lower == 'off' }}"
      ansible.builtin.set_fact:
        _active_port_key: "{{ _se_plain | ternary('HTTP_PORT', 'HTTPS_PORT') }}"
        _active_scheme: "{{ _se_plain | ternary('http', 'https') }}"
        _default_port: "{{ _se_plain | ternary('80', '443') }}"

    # Only the "active" port (HTTP_PORT when http-only, HTTPS_PORT otherwise)
    # is reflected in wikis.yaml and MW_SITE_*. Changing the inactive port
    # only affects docker port mappings.
    - name: Apply wikis.yaml/.env updates for active port
      when: _config_key == _active_port_key
      block:
        - name: Read wikis.yaml for port update
          canasta_wikis_yaml:
            instance_path: "{{ instance_path }}"
            state: read
          register: _se_wikis

        - name: Extract domain (strip path and existing port)
          ansible.builtin.set_fact:
            _base_domain: "{{ _se_wikis.wikis[0].url | regex_replace('/.*$', '') | regex_replace(':[0-9]+$', '') }}"
          when: _se_wikis.wikis | length > 0

        - name: Compute new domain suffix
          ansible.builtin.set_fact:
            _port_suffix: "{{ (_config_value == _default_port) | ternary('', ':' + _config_value) }}"
          when: _se_wikis.wikis | length > 0

        - name: Update wikis.yaml URLs with new port
          canasta_wikis_yaml:
            instance_path: "{{ instance_path }}"
            state: update_port
            port: "{{ _config_value }}"
            default_port: "{{ _default_port }}"
          when: _se_wikis.wikis | length > 0

        - name: Update MW_SITE_SERVER with new port
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: set
            key: MW_SITE_SERVER
            value: "{{ _active_scheme }}://{{ _base_domain }}{{ _port_suffix }}"
          when: _se_wikis.wikis | length > 0

        - name: Update MW_SITE_FQDN with new port (domain only, no scheme)
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: set
            key: MW_SITE_FQDN
            value: "{{ _base_domain }}{{ _port_suffix }}"
          when: _se_wikis.wikis | length > 0

# Switching TLS_MODE to or from "off" flips which port is "active" (the one
# reflected in wikis.yaml and MW_SITE_*). The HTTP_PORT/HTTPS_PORT
# handler above only fires when the port values change; we need a
# parallel handler for when the *scheme* changes but the port values
# don't.
- name: Apply TLS_MODE side effects
  when: _config_key == 'TLS_MODE'
  block:
    - name: Read both HTTP_PORT and HTTPS_PORT from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read_all
      register: _se_caddy_env
      no_log: true  # registers the whole .env, including passwords

    - name: Compute new active scheme/port/default
      vars:
        _new_http_only: "{{ _config_value | trim | lower == 'off' }}"
      ansible.builtin.set_fact:
        _active_scheme: "{{ _new_http_only | ternary('http', 'https') }}"
        _active_port: >-
          {{ _new_http_only
             | ternary(
                 _se_caddy_env.variables.HTTP_PORT | default('80'),
                 _se_caddy_env.variables.HTTPS_PORT | default('443')) }}
        _default_port: "{{ _new_http_only | ternary('80', '443') }}"

    - name: Read wikis.yaml for scheme update
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _se_caddy_wikis

    - name: Apply wikis.yaml/.env updates for new active scheme
      when: _se_caddy_wikis.wikis | length > 0
      block:
        - name: Extract domain (strip path and existing port)
          ansible.builtin.set_fact:
            _base_domain: "{{ _se_caddy_wikis.wikis[0].url | regex_replace('/.*$', '') | regex_replace(':[0-9]+$', '') }}"

        - name: Compute new domain suffix
          ansible.builtin.set_fact:
            _port_suffix: "{{ (_active_port == _default_port) | ternary('', ':' + _active_port) }}"

        - name: Update wikis.yaml URLs with new active port
          canasta_wikis_yaml:
            instance_path: "{{ instance_path }}"
            state: update_port
            port: "{{ _active_port }}"
            default_port: "{{ _default_port }}"

        - name: Update MW_SITE_SERVER with new scheme and port
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: set
            key: MW_SITE_SERVER
            value: "{{ _active_scheme }}://{{ _base_domain }}{{ _port_suffix }}"

        - name: Update MW_SITE_FQDN with new port
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: set
            key: MW_SITE_FQDN
            value: "{{ _base_domain }}{{ _port_suffix }}"

- name: Apply MW_SITE_FQDN side effects
  when: _config_key == 'MW_SITE_FQDN'
  block:
    # MW_SITE_FQDN in .env has already been overwritten with the new value by
    # the time this cascade fires, but MW_SITE_SERVER still holds the OLD
    # domain (we only update it here, below). Read it to recover the old
    # FQDN so update_domain can filter to wikis on that domain — without the
    # filter, every wiki's URL gets clobbered to the new domain regardless
    # of its original host.
    - name: Read current MW_SITE_SERVER to preserve scheme and old FQDN
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: MW_SITE_SERVER
      register: _current_server

    - name: Extract old FQDN and scheme from current MW_SITE_SERVER
      ansible.builtin.set_fact:
        _old_fqdn: >-
          {{ _current_server.value | default('')
             | regex_replace('^https?://', '')
             | regex_replace('/.*$', '')
             | regex_replace(':.*$', '') }}
        _server_scheme: "{{ (_current_server.value | default('https://') | regex_search('^https?://')) or 'https://' }}"

    - name: Update wikis.yaml URLs (only for wikis on the old FQDN)
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: update_domain
        old_domain: "{{ _old_fqdn }}"
        domain: "{{ _config_value }}"
      when:
        - _old_fqdn != ''
        - _old_fqdn != _config_value

    - name: Update MW_SITE_SERVER to match new FQDN
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: MW_SITE_SERVER
        value: "{{ _server_scheme }}{{ _config_value }}"

- name: Sync COMPOSE_PROFILES / caddy image when feature flags change
  when:
    - _config_key in ['CANASTA_ENABLE_VARNISH',
                      'CANASTA_ENABLE_OBSERVABILITY', 'CANASTA_ENABLE_CROWDSEC',
                      'CANASTA_ENABLE_REDIS']
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/sync_compose_profiles.yml

# CrowdSec without a bouncer key enforces nothing until the bouncer is
# registered. The restart this config-set triggers auto-enrolls the bouncer
# (orchestrator start.yml), so the normal case just works; only flag the
# manual fallback for --no-restart, where no start runs to enroll it.
- name: Note bouncer enrollment when CrowdSec is enabled without a key
  when:
    - _config_key == 'CANASTA_ENABLE_CROWDSEC'
    - _config_value | lower == 'true'
  block:
    - name: Read CROWDSEC_BOUNCER_API_KEY from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: CROWDSEC_BOUNCER_API_KEY
      register: _se_crowdsec_key
      no_log: true  # holds the bouncer's API key

    - name: Advise on bouncer enrollment
      ansible.builtin.debug:
        msg: >-
          CrowdSec is enabled. The Caddy bouncer is enrolled automatically
          when the instance starts.
          {{ '' if not (no_restart | default(false) | bool)
             else ("Because --no-restart was used, run 'canasta start -i "
                   ~ instance_id ~ "' (or 'canasta crowdsec bouncer-enroll -i "
                   ~ instance_id ~ "') to activate enforcement.") }}
      when: _se_crowdsec_key.value | default('') | length == 0

# .env still holds the old flag here; it is written after the side effects.
- name: Apply CANASTA_ENABLE_OBSERVABILITY side effects
  when: _config_key == 'CANASTA_ENABLE_OBSERVABILITY' and _config_value | lower == 'true'
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: ensure_observability_credentials.yml
  vars:
    _obs_enabling: true

# --- MW_SITE_SERVER domain change cascade ---
# When the domain changes, update MW_SITE_FQDN, wikis.yaml URLs,
# and (via the existing update_config.yml in set.yml) Caddyfile.
- name: Cascade MW_SITE_SERVER domain change
  when: _config_key == 'MW_SITE_SERVER'
  block:
    - name: Extract new FQDN and scheme from MW_SITE_SERVER
      ansible.builtin.set_fact:
        _new_fqdn: "{{ _config_value | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"
        _new_scheme: "{{ _config_value | regex_replace('^(https?)://.*$', '\\1') }}"

    - name: Read current MW_SITE_FQDN
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: MW_SITE_FQDN
      register: _se_old_fqdn

    - name: Update MW_SITE_FQDN
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: MW_SITE_FQDN
        value: "{{ _new_fqdn }}"

    - name: Update wikis.yaml URLs (only for wikis on the old FQDN)
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: update_domain
        old_domain: "{{ _se_old_fqdn.value }}"
        domain: "{{ _new_fqdn }}"
      when: _se_old_fqdn.found and _se_old_fqdn.value != _new_fqdn
