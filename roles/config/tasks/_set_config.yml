---
# Set .env config values (validation + side effects). Split out of set.yml so
# `--secret` can take a separate, side-effect-free path (_set_secret.yml).
# Input: _config_settings, instance_path, force, web (list the keys in
#        config/env-keys-web for the web container).

# Checked against the whole pool before any key is written: the keys
# constrain each other, and a pool PHP-FPM rejects takes the wiki down.
- name: Collect the values being set
  ansible.builtin.set_fact:
    _set_new_values: >-
      {{ dict(_config_settings | map('regex_replace', '=.*$', '')
              | zip(_config_settings | map('regex_replace', '^[^=]*=', ''))) }}
  no_log: true  # the values may be passwords

- name: Read .env for the PHP-FPM pool check
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _set_pool_env
  no_log: true  # registers the whole .env, including passwords
  when: _set_new_values.keys() | select('match', '^PM_') | list | length > 0

- name: Refuse a PHP-FPM pool PHP-FPM would reject
  ansible.builtin.fail:
    msg: "{{ _set_pool_error }}"
  when:
    - _set_pool_env.variables is defined
    - _set_pool_error | length > 0
  vars:
    _set_pool_error: >-
      {{ _set_pool_env.variables | combine(_set_new_values)
         | php_fpm_pool_error(canasta_known_keys) }}

- name: Read the plain web keys
  ansible.builtin.include_tasks: _read_web_env_keys.yml

- name: Validate, apply side effects, and set each key
  ansible.builtin.include_tasks: _set_single.yml
  loop: "{{ _config_settings }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"

- name: Record the plain web keys
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/env-keys-web"
    line: "{{ _setting.split('=', 1)[0] }}"
    create: true
    mode: "0644"
  loop: "{{ _config_settings }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"
  when:
    - web | default(false) | bool
    - not (secret | default(false) | bool)

# Surface a pre-existing CRLF .env while the user is here. The CRs are
# stripped on read (so `config get` looks fine) but reach containers via
# docker --env-file literally — a common cause of restic "wrong password"
# and similar. canasta_env's `set` writes LF lines, so this only flags a
# file the user hasn't fixed.
- name: Check .env for CRLF line endings
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: lint
  register: _set_env_lint

- name: Warn about CRLF .env line endings
  ansible.builtin.debug:
    msg: >-
      Warning: {{ instance_path }}/.env has CRLF line endings.
      Containers (docker --env-file) receive the CR literally, unlike
      'canasta config get' which strips it — a common cause of restic
      'wrong password' or backend auth failures. Use LF line endings.
  when: _set_env_lint.has_crlf

# If the instance is gitops-managed, update vars.yaml so the change
# survives the next gitops pull (which re-renders .env from template).
- name: Check for gitops instance
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _config_gitops_stat

- name: Update gitops vars for changed keys
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/config_update_gitops_vars.yml
  when: _config_gitops_stat.stat.exists | default(false)

- name: Stage the plain web key list
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_stage_tracked_paths.yml
  vars:
    _stage_paths:
      - config/env-keys-web
  when:
    - _config_gitops_stat.stat.exists | default(false)
    - web | default(false) | bool

- name: Regenerate Caddyfile after config change
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml
  when: not (_config_pre_edge | default(false) | bool)
