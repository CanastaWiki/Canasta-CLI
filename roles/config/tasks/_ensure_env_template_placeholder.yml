---
# Ensure env.template has a placeholder line for a single credential key.
# Input: _ep_setting (str: "KEY=VALUE" or "KEY=...")
# Requires: instance_path + the canonical classifier
#           (canasta_secret_key_regex, canasta_host_specific_nonsecret)
# Optional: _config_secret_names, keys set with --secret, which are secrets
#           whatever their names.

- name: Parse key
  ansible.builtin.set_fact:
    _ep_key: "{{ _ep_setting.split('=', 1)[0] }}"

- name: Read env.template for the key's current line
  ansible.builtin.slurp:
    src: "{{ instance_path }}/env.template"
  register: _ep_template
  no_log: true  # an old template can still hold a literal secret

- name: Classify the key
  ansible.builtin.set_fact:
    _ep_secret: >-
      {{ (_ep_key | regex_search(canasta_secret_key_regex)) is not none
         or _ep_key in (_config_secret_names | default([])) }}
    _ep_has_literal: >-
      {{ (_ep_template.content | b64decode).splitlines()
         | select('match', '^' ~ (_ep_key | regex_escape) ~ '=')
         | reject('search', '=[{][{]')
         | list | length > 0 }}

# A literal is the value every host renders. Replacing it with a placeholder
# keeps the value for this host only: the others have no entry, so their next
# render omits the key and falls back to its default. A host-specific key
# that is already a literal therefore stays one, and config set updates the
# literal. A secret is still moved, since a literal secret is a leak, and so
# is a key no two hosts may share, once every host has the literal's value.
- name: Decide whether key should be a placeholder
  ansible.builtin.set_fact:
    _ep_unshare: >-
      {{ _ep_key in canasta_host_specific_never_shared
         and (_ep_has_literal | bool) }}
    _ep_needs_placeholder: >-
      {{ (_ep_secret | bool)
         or (_ep_key in canasta_host_specific_nonsecret
             and not (_ep_has_literal | bool))
         or (_ep_key in canasta_host_specific_never_shared) }}

- name: Give each host the literal's value before it becomes a placeholder
  ansible.builtin.include_tasks: _unshare_env_template_literal.yml
  vars:
    _ul_key: "{{ _ep_key }}"
    _ul_unset: "{{ canasta_host_specific_never_shared[_ep_key] }}"
    _ul_template: "{{ _ep_template.content | b64decode }}"
  when: _ep_unshare | bool

- name: Add placeholder line to env.template
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/env.template"
    regexp: "^{{ _ep_key }}="
    line: "{{ _ep_key }}={{ '{{' }}{{ _ep_key | lower }}{{ '}}' }}"
    state: present
  when: _ep_needs_placeholder
  register: _ep_lineinfile

# Stage env.template alongside the edit, matching _update_gitops_var.yml.
# Without this, a placeholder added for a new credential key is left
# unstaged and silently omitted from the next 'gitops push'.
- name: Stage updated env.template
  ansible.builtin.command:
    cmd: "git add env.template"
    chdir: "{{ instance_path }}"
  when: _ep_needs_placeholder and _ep_lineinfile is changed
  changed_when: true
