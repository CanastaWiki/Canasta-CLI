---
# Remove .env config keys (validation + unapply side effects). Split out of
# unset.yml so `--secret` can take a separate path (_unset_secret.yml).
# Input: keys, instance_path, force.

# An unset PM_* key falls back to the image default, which can break the
# pool the remaining keys form.
- name: Read .env for the PHP-FPM pool check
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _unset_pool_env
  no_log: true  # registers the whole .env, including passwords
  when: keys.split() | select('match', '^PM_') | list | length > 0

- name: Refuse leaving a PHP-FPM pool PHP-FPM would reject
  ansible.builtin.fail:
    msg: "{{ _unset_pool_error }}"
  when:
    - _unset_pool_env.variables is defined
    - _unset_pool_error | length > 0
  vars:
    _unset_pool_error: >-
      {{ _unset_pool_env.variables | dict2items
         | rejectattr('key', 'in', keys.split()) | items2dict
         | php_fpm_pool_error(canasta_known_keys) }}

- name: Read the plain web keys
  ansible.builtin.include_tasks: _read_web_env_keys.yml

- name: Validate, unapply, and remove each key
  ansible.builtin.include_tasks: _unset_single.yml
  loop: "{{ keys.split() }}"
  loop_control:
    loop_var: _config_key

- name: Stop passing the keys to the web container
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/env-keys-web"
    line: "{{ _config_key }}"
    state: absent
  loop: "{{ keys.split() | select('in', _config_web_env_keys) | list }}"
  loop_control:
    loop_var: _config_key

# If the instance is gitops-managed, remove the key from the durable source
# so the next gitops pull doesn't resurrect it (it re-renders .env from
# template).
- name: Check for gitops instance
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _config_gitops_stat

# The orchestrator owns the compose-vs-K8s decision (K8s gitops uses a
# different layout, values.template.yaml, not vars.yaml); dispatch.
- name: Remove gitops vars for unset keys
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/config_remove_gitops_vars.yml
  when: _config_gitops_stat.stat.exists | default(false)

- name: Stage the plain web key list
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_stage_tracked_paths.yml
  vars:
    _stage_paths:
      - config/env-keys-web
  when:
    - _config_gitops_stat.stat.exists | default(false)
    - keys.split() | select('in', _config_web_env_keys) | list | length > 0

- name: Regenerate Caddyfile after config change
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml
  when: not (_config_pre_edge | default(false) | bool)
