---
# config set --secret on Kubernetes: write the values to the gitignored
# config/secrets.env, which feeds the per-instance app Secret
# (k8s_sync_config.yml) that sidecars consume via secretKeyRef. With --web,
# the key is also recorded in config/secrets-web so the web and jobrunner
# pods get it via secretKeyRef (.Values.appSecretEnv).
# Input: _config_settings, instance_path, web.

- name: Write each secret to config/secrets.env
  canasta_env:
    path: "{{ instance_path }}/config/secrets.env"
    state: set
    key: "{{ _setting.split('=', 1)[0] }}"
    value: "{{ _setting.split('=', 1)[1] }}"
  loop: "{{ _config_settings.split() }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"
  no_log: true

# Key names only (not secret); idempotent. Drives .Values.appSecretEnv.
- name: Record web-exposed secret keys
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secrets-web"
    line: "{{ _setting.split('=', 1)[0] }}"
    create: true
    mode: "0644"
  loop: "{{ _config_settings.split() }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"
  when: web | default(false) | bool
