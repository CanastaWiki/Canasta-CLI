---
# Validate a config key against the known keys list.
# Input: _config_key (str), _config_value (str; undefined on unset), force (bool)

# Database infrastructure keys are set at create time and cannot be
# changed afterward — all wikis in the instance share the same DB
# connection, and changing it would orphan existing data.
- name: Block immutable database keys
  ansible.builtin.fail:
    msg: >-
      '{{ _config_key }}' cannot be changed after instance creation.
      Delete the instance and recreate with the new database configuration.
  when: _config_key in canasta_create_only_keys

- name: Validate the value
  ansible.builtin.include_tasks: _validate_value.yml

# Refused even with --force: a value under the old name would be ignored.
- name: Refuse a renamed key
  ansible.builtin.fail:
    msg: >-
      '{{ _config_key }}' was renamed to
      '{{ _renamed[_config_key] }}'{% if _config_key == 'CADDY_AUTO_HTTPS' %}
      ('CADDY_AUTO_HTTPS=off' is now 'TLS_MODE=off'){% endif %}.
      Use {{ _renamed[_config_key] }} instead.
  vars:
    _renamed:
      CADDY_TLS_MODE: TLS_MODE
      CADDY_AUTO_HTTPS: TLS_MODE
      CADDY_TRUSTED_PROXIES: TRUSTED_PROXIES
      CADDY_TLS_CERT: TLS_CERT
      CADDY_TLS_KEY: TLS_KEY
  when: _config_key in _renamed

# A key set with --web (config/env-keys-web) is an app key, accepted
# without --force like the recognized ones.
- name: Check if key is recognized
  ansible.builtin.fail:
    msg: >-
      Unrecognized key '{{ _config_key }}'.
      Use --force to set unrecognized keys.
      Known keys: {{ canasta_known_keys | map(attribute='name') | join(', ') }}
      (Also accepted: keys starting with {{ canasta_secret_prefixes | join(', ') }})
  when:
    - not (force | default(false) | bool)
    - not (web | default(false) | bool)
    - _config_key not in (_config_web_env_keys | default([]))
    - _config_key not in (canasta_known_keys | map(attribute='name') | list)
    - not (_config_key | regex_search('^(' + canasta_secret_prefixes | join('|') + ')'))
