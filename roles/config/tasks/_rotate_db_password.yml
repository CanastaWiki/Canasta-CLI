---
# Change the bundled MariaDB's root password to the new MYSQL_PASSWORD,
# before .env is written. The server reads MYSQL_ROOT_PASSWORD only when it
# initializes an empty data directory, so the running account must change.
# The SQL reaches mariadb on stdin, and the container's own
# MYSQL_ROOT_PASSWORD authenticates, so neither password is on a command line.
# Input: _config_value, instance_path, instance_orchestrator, no_restart

- name: Require a restart for MYSQL_PASSWORD
  ansible.builtin.fail:
    msg: >-
      MYSQL_PASSWORD cannot be set with --no-restart: the wiki must restart
      to connect with the new password.
  when: no_restart | default(false) | bool

- name: Require a non-empty MYSQL_PASSWORD
  ansible.builtin.fail:
    msg: MYSQL_PASSWORD cannot be empty.
  when: _config_value | length == 0

# On a gitops instance, config set records the new password in vars.yaml
# after this change. An unreadable vars.yaml would stop it there, so refuse
# while nothing has been changed yet.
- name: Check for a gitops host identity
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _rdp_gitops_host

- name: Require a readable gitops vars.yaml
  when: _rdp_gitops_host.stat.exists
  block:
    - name: Read the gitops host identity
      ansible.builtin.slurp:
        src: "{{ instance_path }}/.gitops-host"
      register: _rdp_host_raw

    - name: Read the gitops vars.yaml
      ansible.builtin.slurp:
        src: "{{ instance_path }}/hosts/{{ _rdp_host_raw.content | b64decode | trim }}/vars.yaml"
      register: _rdp_vars_raw
      no_log: true

    - name: Parse the gitops vars.yaml
      ansible.builtin.set_fact:
        _rdp_vars_parsed: "{{ (_rdp_vars_raw.content | b64decode | from_yaml) is mapping }}"
      no_log: true
  rescue:
    - name: Refuse when the gitops vars.yaml cannot be read
      ansible.builtin.fail:
        msg: >-
          MYSQL_PASSWORD was not changed: the gitops vars.yaml for this host
          could not be read as YAML, so the new password could not be recorded
          there. Nothing was changed.

- name: Create a temp file for the password change
  ansible.builtin.tempfile:
    state: file
    suffix: .sql
  register: _rdp_sql
  delegate_to: canasta_controller

- name: Change the password in the bundled database
  block:
    - name: Write the password change
      ansible.builtin.copy:
        dest: "{{ _rdp_sql.path }}"
        mode: "0600"
        # With NO_BACKSLASH_ESCAPES, doubling single quotes is the only
        # escaping a string literal needs.
        content: |
          SET SESSION sql_mode = CONCAT(@@sql_mode, ',NO_BACKSLASH_ESCAPES');
          ALTER USER 'root'@'%' IDENTIFIED BY '{{ _rdp_quoted }}';
          ALTER USER IF EXISTS 'root'@'localhost' IDENTIFIED BY '{{ _rdp_quoted }}';
      vars:
        _rdp_quoted: "{{ _config_value | replace(\"'\", \"''\") }}"
      delegate_to: canasta_controller
      no_log: true

    - name: Apply the password change
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/exec.yml
      vars:
        exec_service: db
        exec_no_log: true
        exec_stdin: "{{ _rdp_sql.path }}"
        exec_command: 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mariadb -u root'

    # From here the database holds the new password, so config set must
    # restart the instance even if a later step fails (see set.yml).
    - name: Record that the database password changed
      ansible.builtin.set_fact:
        _db_password_rotated: true
  rescue:
    - name: Report the failed password change
      ansible.builtin.fail:
        msg: >-
          Could not change the password inside the database, so MYSQL_PASSWORD
          was not changed. The instance must be running.
  always:
    - name: Remove the password change temp file
      ansible.builtin.file:
        path: "{{ _rdp_sql.path }}"
        state: absent
      delegate_to: canasta_controller
