---
# canasta config unset --secret — the counterpart to `config set --secret`.
# Clears the keys from .env (_remove_secrets.yml), and from the
# gitignored config/secrets.env and config/secrets-web, which nothing reads
# but an earlier `config set --secret` may have left them in.
# Keys are not validated against the known-key list, so a recognized key
# written to config/secrets.env before `config set --secret` rejected them
# can be cleared.
# Input: keys, instance_path.

- name: Remove each secret from config/secrets.env
  canasta_env:
    path: "{{ instance_path }}/config/secrets.env"
    state: unset
    keys: "{{ keys.split() }}"

# Absent file is not an error for lineinfile state=absent, so no guard.
- name: Remove each secret from config/secrets-web
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secrets-web"
    line: "{{ _config_key }}"
    state: absent
  loop: "{{ keys.split() }}"
  loop_control:
    loop_var: _config_key

- name: Remove the secrets from .env
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/config/tasks/_remove_secrets.yml
