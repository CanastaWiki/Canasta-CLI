---
# canasta config unset --secret — remove keys from the gitignored
# config/secrets.env, the counterpart to `config set --secret`. No .env
# validation, side effects, or gitops vars: these keys were never in .env.
# Keys are not validated against the known-key list, so a recognized key
# written there before `config set --secret` rejected them can be cleared.
# Input: keys, instance_path.

- name: Remove each secret from config/secrets.env
  canasta_env:
    path: "{{ instance_path }}/config/secrets.env"
    state: unset
    keys: "{{ keys.split() }}"

# Absent file is not an error for lineinfile state=absent, so no guard.
- name: Stop exposing the keys to the web and jobrunner pods
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secrets-web"
    line: "{{ _config_key }}"
    state: absent
  loop: "{{ keys.split() }}"
  loop_control:
    loop_var: _config_key
