---
# canasta config set --secret — write opaque secret values to the gitignored
# config/secrets.env, bypassing .env validation and side effects (these are
# arbitrary app keys, not recognized .env config). On K8s they feed the
# per-instance app Secret (k8s_sync_config.yml), consumed by sidecars via
# secretKeyRef; nothing on Compose reads config/secrets.env.
# With --web, the key is also recorded in config/secrets-web so K8s exposes it
# to the web + jobrunner pods via secretKeyRef (.Values.appSecretEnv).
# Input: _config_settings, instance_path, web.

# Recognized keys — the ones `config set` accepts without --force — are read
# from .env by containers, restic, and the K8s sync. Writing one here would
# store it where nothing reads it while .env keeps its old value, so refuse
# rather than accept a value that cannot take effect.
- name: Identify recognized .env keys passed with --secret
  ansible.builtin.set_fact:
    _secret_env_keys: >-
      {{ _secret_keys | select('in', _secret_known_names) | list
         | union(_secret_keys | select('match', _secret_prefix_re) | list) }}
  vars:
    _secret_keys: "{{ _config_settings.split() | map('regex_replace', '=.*$', '') | list }}"
    _secret_known_names: "{{ canasta_known_keys | map(attribute='name') | list }}"
    _secret_prefix_re: "^({{ canasta_secret_prefixes | join('|') }})"

- name: Reject recognized .env keys passed with --secret
  ansible.builtin.fail:
    msg: |
      Cannot set with --secret: {{ _secret_env_keys | join(', ') }}

      These are recognized configuration keys and are read from .env — on
      Compose the containers and restic receive .env via --env-file, and on
      Kubernetes the ConfigMap and backup Secret are built from it. --secret
      writes config/secrets.env, which nothing on Compose reads and which on
      Kubernetes feeds only the app Secret for sidecars, so the value would
      be stored where nothing reads it while .env keeps its old one.

      Set them without --secret; credential values are masked in
      'canasta config get' output either way:
        canasta config set -i {{ id | default('<id>') }} KEY=VALUE

      --secret is for opaque app keys no .env consumer knows about, such as a
      sidecar credential or a Settings.php API key.
  when: _secret_env_keys | length > 0

- name: Write each secret to config/secrets.env
  canasta_env:
    path: "{{ instance_path }}/config/secrets.env"
    state: set
    key: "{{ _setting.split('=', 1)[0] }}"
    value: "{{ _setting.split('=', 1)[1] }}"
  loop: "{{ _config_settings.split() }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"
  no_log: true

# Key names only (not secret); idempotent. Drives .Values.appSecretEnv.
- name: Record web-exposed secret keys
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secrets-web"
    line: "{{ _setting.split('=', 1)[0] }}"
    create: true
    mode: "0644"
  loop: "{{ _config_settings.split() }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"
  when: web | default(false) | bool
