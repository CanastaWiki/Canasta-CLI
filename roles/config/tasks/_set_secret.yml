---
# canasta config set --secret — store opaque app secrets, bypassing .env
# validation and side effects (these are arbitrary app keys, not recognized
# .env config). Where the value is stored depends on the orchestrator; see
# roles/orchestrator/tasks/config_set_secret.yml.
# Input: _config_settings, instance_path, web.

# Recognized keys — the ones `config set` accepts without --force — have
# their own consumers (containers, restic, the K8s ConfigMap and backup
# Secret) and must go through the normal path with its validation and side
# effects, so refuse them here.
- name: Identify recognized .env keys passed with --secret
  ansible.builtin.set_fact:
    _secret_env_keys: >-
      {{ _secret_keys | select('in', _secret_known_names) | list
         | union(_secret_keys | select('match', _secret_prefix_re) | list) }}
  vars:
    _secret_keys: "{{ _config_settings.split() | map('regex_replace', '=.*$', '') | list }}"
    _secret_known_names: "{{ canasta_known_keys | map(attribute='name') | list }}"
    _secret_prefix_re: "^({{ canasta_secret_prefixes | join('|') }})"

- name: Reject recognized .env keys passed with --secret
  ansible.builtin.fail:
    msg: |
      Cannot set with --secret: {{ _secret_env_keys | join(', ') }}

      These are recognized configuration keys. They are read from .env by
      their own consumers (on Compose the containers and restic, on
      Kubernetes the ConfigMap and backup Secret) and need the validation
      and side effects --secret skips.

      Set them without --secret; credential values are masked in
      'canasta config get' output either way:
        canasta config set -i {{ id | default('<id>') }} KEY=VALUE

      --secret is for opaque app keys no .env consumer knows about, such as a
      sidecar credential or a Settings.php API key.
  when: _secret_env_keys | length > 0

- name: Store the secrets for this orchestrator
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/config_set_secret.yml
