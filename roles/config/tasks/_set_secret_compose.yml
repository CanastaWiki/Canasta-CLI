---
# config set --secret on Compose: write the values to .env, from which
# Compose interpolates any service environment that references ${KEY} (an
# app sidecar's env, for example). The key names are recorded in
# config/secret-keys so gitops and `config get` treat them as secrets
# whatever they are called. With --web, the key is also listed in
# config/secret-keys-web, which renders docker-compose.web-env.yml to pass it
# to the web container (which also runs the job runner). On a gitops instance
# each value gets an env.template placeholder and an entry in the git-crypted
# hosts/<host>/vars.yaml, staged for the next push.
# Input: _config_settings, instance_path, web.

- name: Name the secret keys being set
  ansible.builtin.set_fact:
    _config_secret_names: >-
      {{ _config_settings.split() | map('regex_replace', '=.*$', '') | list }}

- name: Reject secret keys that are not environment variable names
  ansible.builtin.fail:
    msg: >-
      Cannot set with --secret: {{ _secret_bad_names | join(', ') }}. A key
      must start with a letter or underscore and contain only letters,
      digits, and underscores.
  vars:
    _secret_bad_names: >-
      {{ _config_secret_names | reject('match', '^[A-Za-z_][A-Za-z0-9_]*$') | list }}
  when: _secret_bad_names | length > 0

- name: Write each secret to .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: "{{ _setting.split('=', 1)[0] }}"
    value: "{{ _setting.split('=', 1)[1] }}"
  loop: "{{ _config_settings.split() }}"
  loop_control:
    loop_var: _setting
    label: "{{ _setting.split('=', 1)[0] }}"
  no_log: true

- name: Record the secret keys
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secret-keys"
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ _config_secret_names }}"

- name: Record web-exposed secret keys
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secret-keys-web"
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ _config_secret_names }}"
  when: web | default(false) | bool

# Nothing on Compose reads config/secrets.env or config/secrets-web, so a
# copy left there by an earlier `config set --secret` is dropped once the
# key has been set where Compose reads it.
- name: Drop superseded copies from config/secrets.env
  canasta_env:
    path: "{{ instance_path }}/config/secrets.env"
    state: unset
    keys: "{{ _config_secret_names }}"

- name: Drop superseded entries from config/secrets-web
  ansible.builtin.lineinfile:
    path: "{{ instance_path }}/config/secrets-web"
    line: "{{ item }}"
    state: absent
  loop: "{{ _config_secret_names }}"

- name: Render web secret keys to a compose override layer
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/render_web_env.yml"

- name: Check for gitops instance
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _config_gitops_stat

- name: Store the secrets in the gitops vars
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/config/tasks/_update_gitops_vars.yml
  when: _config_gitops_stat.stat.exists | default(false)

- name: Stage the secret key lists
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/_stage_tracked_paths.yml
  vars:
    _stage_paths:
      - config/secret-keys
      - config/secret-keys-web
  when: _config_gitops_stat.stat.exists | default(false)
