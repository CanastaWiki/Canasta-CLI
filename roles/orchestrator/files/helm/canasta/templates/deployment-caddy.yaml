{{- if le (int .Values.caddy.terminationGracePeriodSeconds) (int .Values.caddy.preStopSleepSeconds) }}
  {{- fail "caddy.terminationGracePeriodSeconds must be greater than caddy.preStopSleepSeconds" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canasta.fullname" . }}-caddy
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.caddy.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "canasta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: caddy
  template:
    metadata:
      labels:
        {{- include "canasta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: caddy
      annotations:
        checksum/caddy-config: {{ .Values.configData.caddy | default dict | toJson | sha256sum }}
        {{- if .Values.crowdsec.enabled }}
        # The agent copies the acquisition and whitelist files in only at
        # pod start.
        checksum/crowdsec-config: {{ .Values.configData.crowdsec | default dict | toJson | sha256sum }}
        {{- with (.Values.secretChecksums | default dict).caddy }}
        checksum/secrets: {{ . | quote }}
        {{- end }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ int .Values.caddy.terminationGracePeriodSeconds }}
      containers:
        - name: caddy
          image: {{ .Values.caddy.image | default "caddy:2.10.2-alpine" }}
          # The ingress keeps routing to a deleted pod until its removal from
          # the caddy Service reaches it, so keep serving for that long
          # before Caddy is told to stop. The hook returns on its own.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ int .Values.caddy.preStopSleepSeconds }}
          {{- if .Values.crowdsec.enabled }}
          # The Caddyfile reads the bouncer key via {env.CROWDSEC_BOUNCER_API_KEY}.
          # optional: true lets Caddy start key-less before the bouncer is
          # enrolled — the Caddyfile only emits the crowdsec directive once a
          # key exists (rewrite_caddy.yml's _crowdsec_active guard), so a
          # missing key is a clean no-op, not a startup failure.
          env:
            - name: CROWDSEC_BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "canasta.fullname" . }}-crowdsec
                  key: CROWDSEC_BOUNCER_API_KEY
                  optional: true
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile.site
              subPath: Caddyfile.site
              readOnly: true
            - name: caddy-data
              mountPath: /data
            {{- if .Values.crowdsec.enabled }}
            - name: caddy-logs
              mountPath: /var/log/caddy
            {{- end }}
          {{- with .Values.caddy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
        {{- if .Values.crowdsec.enabled }}
        # CrowdSec agent: parses Caddy's access log from the shared caddy-logs
        # volume and sends its alerts to the local API in the crowdsec pod.
        # It has no readiness probe and its wrapper never exits on an agent
        # failure, so CrowdSec can never take this pod out of service.
        - name: crowdsec-agent
          image: {{ .Values.crowdsec.image }}
          # Stop with Caddy, not before it, so the requests the outgoing pod
          # still serves are parsed too.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ int .Values.caddy.preStopSleepSeconds }}
          command:
            - /bin/sh
            - -c
            - {{ .Files.Get "files/crowdsec-agent-start.sh" | toJson }}
          env:
            - name: DISABLE_LOCAL_API
              value: "true"
            - name: LOCAL_API_URL
              value: http://crowdsec:8080
            - name: AGENT_USERNAME
              value: {{ .Values.crowdsec.agentUsername | default "canasta-caddy-agent" | quote }}
            - name: AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "canasta.fullname" . }}-crowdsec
                  key: CROWDSEC_AGENT_PASSWORD
            # The caddy collection ships the Caddy log parser plus base HTTP
            # attack scenarios. The image carries the hub content, so this
            # installs without network access.
            - name: COLLECTIONS
              value: {{ .Values.crowdsec.collections | quote }}
          volumeMounts:
            - name: crowdsec-config
              mountPath: /cm
              readOnly: true
            - name: caddy-logs
              mountPath: /var/log/caddy
              readOnly: true
          {{- with .Values.crowdsec.agentResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: caddy-config
          configMap:
            name: {{ include "canasta.fullname" . }}-caddy-config
        - name: caddy-data
          emptyDir: {}
        {{- if .Values.crowdsec.enabled }}
        - name: crowdsec-config
          configMap:
            name: {{ include "canasta.fullname" . }}-crowdsec-config
        - name: caddy-logs
          emptyDir: {}
        {{- end }}
