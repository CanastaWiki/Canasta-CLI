{{- if .Values.varnish.enabled }}
{{- if le (int .Values.varnish.terminationGracePeriodSeconds) (int .Values.varnish.preStopSleepSeconds) }}
  {{- fail "varnish.terminationGracePeriodSeconds must be greater than varnish.preStopSleepSeconds" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canasta.fullname" . }}-varnish
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: varnish
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.varnish.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "canasta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: varnish
  template:
    metadata:
      labels:
        {{- include "canasta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: varnish
      annotations:
        checksum/varnish-config: {{ .Values.configData.varnish | default dict | toJson | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ int .Values.varnish.terminationGracePeriodSeconds }}
      containers:
        - name: varnish
          image: {{ .Values.varnish.image }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ int .Values.varnish.preStopSleepSeconds }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: varnish-config
              mountPath: /etc/varnish/default.vcl
              subPath: default.vcl
              readOnly: true
          {{- with .Values.varnish.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
      volumes:
        - name: varnish-config
          configMap:
            name: {{ include "canasta.fullname" . }}-varnish-config
{{- end }}
