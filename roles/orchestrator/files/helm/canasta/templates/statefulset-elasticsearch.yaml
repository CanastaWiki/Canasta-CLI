{{- if .Values.elasticsearch.enabled }}
{{- $heap := toString .Values.elasticsearch.heap }}
{{- if not (regexMatch "^[1-9][0-9]*[mMgG]$" $heap) }}
{{- fail (printf "elasticsearch.heap is '%s', but it must be a whole number of megabytes or gigabytes, such as 768m or 4g" $heap) }}
{{- end }}
{{- $heapMi := atoi (trimSuffix "m" (trimSuffix "g" (lower $heap))) }}
{{- if hasSuffix "g" (lower $heap) }}
{{- $heapMi = mul $heapMi 1024 }}
{{- end }}
{{- $resources := mustMergeOverwrite
      (dict "requests" (dict "memory" (printf "%dMi" (mul $heapMi 2)))
            "limits" (dict "memory" (printf "%dMi" (mul $heapMi 4))))
      (deepCopy (.Values.elasticsearch.resources | default dict)) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "canasta.fullname" . }}-elasticsearch
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  serviceName: {{ include "canasta.fullname" . }}-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "canasta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        {{- include "canasta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: {{ printf "-Xms%s -Xmx%s" $heap $heap | quote }}
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            {{- toYaml $resources | nindent 12 }}
          # Elasticsearch under the CPU limit can take minutes to open
          # its port on first start; the liveness probe alone would kill
          # it at ~90s forever. The startup probe owns that window (up
          # to 5 minutes) and liveness takes over only once it passes.
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.elasticsearch.storageClass }}
        storageClassName: {{ .Values.elasticsearch.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.storage }}
{{- end }}
