{{/*
Services matching Docker Compose service names.
The Canasta container entrypoint, default VCL, and MediaWiki config
reference services by their Compose names (caddy, db, web, varnish, elasticsearch,
memcached).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
{{- if .Values.db.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: db
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
{{- if .Values.varnish.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: varnish
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: varnish
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: varnish
{{- end }}
---
{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9200
      targetPort: http
      protocol: TCP
      name: http
    - port: 9300
      targetPort: transport
      protocol: TCP
      name: transport
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
{{- end }}
---
{{- if .Values.crowdsec.enabled }}
# Routes :8080 to the CrowdSec local API (deployment-crowdsec.yaml). The
# shared Caddyfile hardcodes `api_url http://crowdsec:8080` and the agent in
# the caddy pod uses the same URL, so this name/port must match.
apiVersion: v1
kind: Service
metadata:
  name: crowdsec
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: crowdsec
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: lapi
      protocol: TCP
      name: lapi
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: crowdsec
{{- end }}
{{- if .Values.memcached.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: {{ include "canasta.namespace" . }}
  labels:
    {{- include "canasta.labels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
  annotations:
    {{- include "canasta.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 11211
      targetPort: memcached
      protocol: TCP
      name: memcached
  selector:
    {{- include "canasta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
{{- end }}
