# Default values for the Canasta Helm chart.

# Instance identity
instance:
  id: ""

# Canasta image
image:
  repository: ghcr.io/canastawiki/canasta
  tag: ""               # defaults to chart appVersion if empty
  pullPolicy: IfNotPresent

# Domains for ingress routing (all domains used by wikis in this instance)
# Wiki farm config (wiki IDs, paths, names) lives in wikis.yaml on the config PVC.
domains:
  - localhost

# Web tier
web:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # The web container opens its port only after composer and the
  # per-wiki update.php run, which after an image change can take
  # minutes. Startup gets periodSeconds x failureThreshold (10 minutes)
  # before Kubernetes restarts the container.
  startupProbe:
    periodSeconds: 3
    failureThreshold: 200
  # On deletion the pod keeps serving for preStopSleepSeconds while its
  # removal from the web Service reaches kube-proxy, then Apache stops
  # gracefully, finishing in-flight requests and closing the keep-alive
  # connections Varnish or Caddy hold to it. The grace period bounds the
  # whole shutdown and must exceed the sleep.
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 60
  # Bring a replacement pod up and ready before taking an old one down.
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Caddy (reverse proxy + wiki farm routing)
caddy:
  image: caddy:2.10.2-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # On deletion the pod keeps serving for preStopSleepSeconds while its
  # removal from the caddy Service reaches the ingress, then Caddy stops
  # gracefully. The grace period bounds the whole shutdown and must exceed
  # the sleep.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  # Bring a replacement pod up and ready before taking the old one down.
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Varnish cache
varnish:
  enabled: true
  image: varnish:7.0.2-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # As for web: keep serving while removal from the varnish Service
  # propagates, and replace before removing.
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 30
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Main object cache shared by the web pods and maintenance scripts. The
# container's memory limit leaves room above the cache for memcached's own
# overhead.
memcached:
  enabled: false
  image: memcached:1.6.44-alpine
  # Megabytes of cache (memcached -m).
  memory: 64
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Database (MariaDB)
# Set db.enabled=false and externalDatabase settings to use an external DB.
db:
  enabled: true
  image: mariadb:11.4
  # The account MediaWiki connects with. Any account but root is created and
  # granted the instance's wiki databases (each wiki's own and its declared
  # extra_databases) by the web pod's ensure-db-account init container, with
  # its password read from the WIKI_DB_PASSWORD key of the db Secret.
  wikiUser: root
  storage: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# External database (when db.enabled=false)
externalDatabase:
  host: ""
  port: "3306"
  user: "root"
  ssl: "false"

# Elasticsearch (optional). CirrusSearch supports only Elasticsearch
# 7.10.x, so this pin follows it (and matches the Compose default).
# The fully qualified registry is required: Docker Hub's library/
# elasticsearch never published a 7.10.2 tag.
elasticsearch:
  enabled: false
  image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
  storage: 5Gi
  storageClass: ""
  # Both the minimum and maximum JVM heap. The container's memory request
  # defaults to twice the heap and its limit to four times it; a memory
  # set under resources takes precedence.
  heap: 256m
  resources:
    requests:
      cpu: 250m
    limits:
      cpu: 500m

# CrowdSec (optional). When enabled, the local API runs as its own
# Deployment holding the PVC, an agent sidecar in the Caddy pod parses the
# access log and reports to it, and the Caddy deployment uses the plugin
# image (set by Ansible) so the bouncer can enforce decisions. The agent
# logs in as agentUsername with CROWDSEC_AGENT_PASSWORD from the
# canasta-<id>-crowdsec Secret.
crowdsec:
  enabled: false
  image: docker.io/crowdsecurity/crowdsec:v1.6.11
  collections: "crowdsecurity/caddy crowdsecurity/http-cve"
  agentUsername: canasta-caddy-agent
  storage: 1Gi
  storageClass: ""
  # The local API
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # The agent in the caddy pod
  agentResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Ingress
ingress:
  enabled: true
  className: ""
  tls: true
  annotations: {}
  certManager:
    enabled: false
    issuer: letsencrypt-prod

# Persistent volumes
# For multi-node multi-replica web pods, set storageClass to a
# ReadWriteMany provisioner (e.g. nfs, efs) AND set accessMode to
# ReadWriteMany. The default ReadWriteOnce is correct for single-node
# clusters and for multi-replica deployments where all pods can be
# scheduled to the same node. See `canasta storage setup --help` for
# the available shared-storage commands.
persistence:
  images:
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  extensions:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  skins:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  publicAssets:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Secrets — names of K8s Secrets created by Ansible (not stored here)
secrets:
  dbSecretName: ""      # set by Ansible: <instance_id>-db-credentials
  mwSecretName: ""      # set by Ansible: <instance_id>-mw-secrets
  appSecretName: ""     # set by Ansible: <instance_id>-app-secrets

# App secret keys exposed to the web pods via secretKeyRef from
# the app Secret. Populated from config/secrets-web (keys set with
# `config set --secret --web`) by k8s_sync_config.yml; empty by default so
# existing instances render no extra env.
appSecretEnv: []

# Hashes of the Secret values each workload reads (web, caddy, crowdsec,
# and per sidecar name), set per host by `canasta gitops push`. Each becomes a pod
# annotation, so an Argo CD sync rolls the pods when a value they read
# changes. Never the values themselves.
secretChecksums: {}

# Config data — populated by Ansible or committed via gitops.
# Helm renders these into ConfigMaps for each component.
# When empty, ConfigMaps are not created (allows external management).
configData:
  web: {}       # .env, wikis.yaml, settings--*--*.php, composer.local.json
  env: {}       # allowlisted env vars extracted from .env, one per ConfigMap key
  caddy: {}     # Caddyfile, Caddyfile.site
  varnish: {}   # default.vcl
  crowdsec: {}  # acquis.yaml, whitelists.yaml
  db: {}        # my.cnf

# Argo CD
argocd:
  namespace: argocd
  repoURL: ""
  targetRevision: HEAD
  syncPolicy:
    automated: true
    selfHeal: true
    prune: true

# App sidecars (companion services). Rendered from config/sidecars.yaml
# into values-sidecars.yaml at start; empty here so a release with no
# sidecars renders nothing (and helm prunes a removed one).
sidecars: []
