---
# Stage each wiki's database dump for a backup snapshot.
#
# Compose: run mariadb-dump in the db container as root (the web
# container for an external database, see db_admin.yml) and write its
# output from the host into instance_path/config/backup. restic's
# container mounts that host path, so the dumps appear in the snapshot.
#
# Kubernetes: no-op here. Writing into the live web pod's emptyDir is
# useless — the separately-spawned restic Job mounts the web-config
# ConfigMap, not the live pod's emptyDir. Pre-#513 this dance ran on
# K8s anyway and the dumps silently vanished from on-demand snapshots,
# leaving wiki content unprotected. The K8s path now does the dump as
# an init container inside the restic Job itself — see k8s_run_backup.yml.
#
# One dump per wiki covers the wiki's own database and any extra
# databases it declares, in a single invocation so they share one
# transaction. The password is read from the container's environment
# rather than templated in, so it never reaches the host's process
# table.
#
# A group whose dump fails does not stop the backup. Its databases are
# then dumped one at a time, without the shared transaction, so one
# broken database does not cost the others; those that still fail are
# left out of the snapshot.
#
# Input: instance_path, instance_orchestrator,
#        _backup_wikis (db_groups)
# Output: _backup_dump_failures - one "<db> [<db>...]: <error>" entry per
#         group that could not be dumped (on K8s the Job reports these)

- name: Start with no failed database dumps
  ansible.builtin.set_fact:
    _backup_dump_failures: []

- name: Find where the database dumps run (Compose)
  ansible.builtin.include_tasks: db_admin.yml
  when: instance_orchestrator | default('compose') == 'compose'

# The dumps are written from the host, so the staging directory has to be
# the host user's. A directory a previous run left from inside the web
# container belongs to that container's root, so remove it first.
- name: Remove a staging directory a previous run left (Compose)
  ansible.builtin.include_tasks:
    file: exec.yml
    apply:
      ignore_errors: true
  vars:
    exec_service: web
    exec_command: "rm -rf /mediawiki/config/backup"
  when: instance_orchestrator | default('compose') == 'compose'

- name: Create backup staging directory (Compose)
  ansible.builtin.file:
    path: "{{ instance_path }}/config/backup"
    state: directory
    mode: "0700"
  when: instance_orchestrator | default('compose') == 'compose'

- name: Dump each wiki's database group (Compose)
  ansible.builtin.include_tasks: backup_dump_db_group.yml
  vars:
    # A database that cannot be dumped leaves nothing behind, neither a
    # partial dump nor a previous run's, that could pass for its backup.
    dump_command: >-
      f={{ (instance_path ~ '/config/backup/db_' ~ item.wiki ~ '.sql') | quote }};
      rm -f "$f" "$f.part";
      d() { o=$1; shift;
      {{ _db_admin_exec }} sh -c
      '{{ _db_admin_pwd }} exec mariadb-dump {{ _db_admin_args }}
      --single-transaction --databases "$@"' sh "$@"
      > "$o" 2> "$f.err" && [ -s "$o" ]; };
      if d "$f.tmp" {{ item.databases | map('quote') | join(' ') }};
      then mv "$f.tmp" "$f"; cat "$f.err" >&2;
      else rm -f "$f.tmp";
      {% if item.databases | length > 1 %}
      echo "WARNING: dumping {{ item.databases | join(' ') }} together
      failed; dumping each database on its own" >&2;
      for db in {{ item.databases | map('quote') | join(' ') }}; do
      if d "$f.one" "$db"; then cat "$f.one" >> "$f.part";
      else echo "DUMP-FAILED $db: $(tr '\n' ' ' < "$f.err")"; fi;
      done; rm -f "$f.one";
      if [ -s "$f.part" ]; then mv "$f.part" "$f"; else rm -f "$f.part"; fi;
      {% else %}
      echo "DUMP-FAILED {{ item.databases | join(' ') }}:
      $(tr '\n' ' ' < "$f.err")";
      {% endif %}
      fi;
      rm -f "$f.err"
  loop: "{{ _backup_wikis.db_groups }}"
  loop_control:
    label: >-
      {{ item.wiki }}{{ ' (+ ' ~ (item.databases[1:] | join(', ')) ~ ')'
                         if item.databases | length > 1 else '' }}
  when: instance_orchestrator | default('compose') == 'compose'
