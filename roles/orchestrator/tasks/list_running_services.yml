---
# List the running service/component names for an instance.
# Input: instance_path, instance_id
# Output: _running_services (newline-separated names, may be empty)

- name: Get service list
  ansible.builtin.command:
    argv:
      - "{{ inspect_command | default('docker') }}"
      - ps
      - --filter
      - status=running
      - --filter
      - "label=com.docker.compose.project={{ instance_path | basename | lower }}"
      - --format
      - >-
        {% if 'podman' in (inspect_command | default('docker') | basename) -%}
        {% raw %}{{index .Labels "com.docker.compose.service"}}{% endraw %}
        {%- else -%}
        {% raw %}{{.Label "com.docker.compose.service"}}{% endraw %}
        {%- endif %}
    chdir: "{{ instance_path }}"
  register: _list_services_compose
  changed_when: false

- name: Set running services output
  ansible.builtin.set_fact:
    _running_services: >-
      {{ _list_services_compose.stdout | default('') }}
