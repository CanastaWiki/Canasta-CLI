---
# Bump the instance's configured image to the new default: update
# CANASTA_IMAGE in .env (only when it's the default ghcr.io image and not
# a custom/local build), and move a rebuilt --build-from instance off the
# shared canasta:local tag.
# Input: instance_path, canasta_default_image,
#        _upgrade_inst, _mig, _upgrade_rebuild, _built_image

# --- Update Compose CANASTA_IMAGE tag ---
# Move an instance off the version tag a previous CLI pinned, and leave
# every other value alone: a custom repository, a local build, or a tag
# the operator chose.
#
# Matching the repository alone was not enough. `:latest` lives under the
# official repository and never equals the pinned version, so both
# conditions held on every run and an instance deliberately tracking
# latest was silently moved back to a fixed version — repeatedly, since
# the rewrite could never converge. Requiring a version-shaped tag is
# what separates "the CLI put this here" from "the operator did".
# CANASTA_IMAGE was already read by the migration probe; reuse those
# values instead of re-reading .env.
- name: Name the release the Compose image moves to
  ansible.builtin.set_fact:
    _upgrade_compose_target: >-
      {{ (_mig.env.CANASTA_IMAGE | default('')
          if _mig.env_present.CANASTA_IMAGE | default(false) else '')
         | canasta_retarget_release_image(canasta_default_image) }}

- name: Update Compose image tag
  when:
    - _upgrade_inst.instance.buildFrom | default('') == ''
    - _upgrade_compose_target != ''
    - _upgrade_compose_target != _mig.env.CANASTA_IMAGE
  block:
    # .env only. On a gitops instance the render gives .env this host's CLI
    # default whenever env.template holds no image the operator chose, so
    # the bump survives the next pull without an edit to the shared file.
    - name: Update CANASTA_IMAGE to latest default tag
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: CANASTA_IMAGE
        value: "{{ _upgrade_compose_target }}"

    # The rewrite used to be silent, so an operator who noticed the pin
    # had moved had nothing to connect it to.
    - name: Report the image pin change
      ansible.builtin.debug:
        msg: >-
          Updated CANASTA_IMAGE from {{ _mig.env.CANASTA_IMAGE }} to
          {{ _upgrade_compose_target }}.

# --- Move a rebuilt Compose instance onto its own image tag ---
# An instance naming canasta:local runs whichever --build-from instance on
# the host built that tag last. Once the rebuild has produced the instance's
# own tag, point .env at it. An instance whose source is gone is not rebuilt
# and keeps canasta:local.
- name: Point a rebuilt Compose instance at its own image tag
  when:
    - _upgrade_rebuild | default(false) | bool
    - _mig.env_present.CANASTA_IMAGE
    - _mig.env.CANASTA_IMAGE == 'canasta:local'
    - _built_image != 'canasta:local'
  block:
    - name: Update CANASTA_IMAGE to the instance's own image tag
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: CANASTA_IMAGE
        value: "{{ _built_image }}"

    - name: Report the image tag change
      ansible.builtin.debug:
        msg: "Updated CANASTA_IMAGE from canasta:local to {{ _built_image }}."

    # A gitops pull re-renders .env from env.template, which would put
    # canasta:local back.
    - name: Check if instance is gitops-managed
      ansible.builtin.stat:
        path: "{{ instance_path }}/.gitops-host"
      register: _upgrade_local_image_gitops_stat

    - name: Persist the instance's image tag to env.template
      ansible.builtin.lineinfile:
        path: "{{ instance_path }}/env.template"
        regexp: "^CANASTA_IMAGE="
        line: "CANASTA_IMAGE={{ _built_image }}"
        state: present
      when: _upgrade_local_image_gitops_stat.stat.exists | default(false)

    - name: Stage the updated env.template
      ansible.builtin.command:
        cmd: "git add env.template"
        chdir: "{{ instance_path }}"
      changed_when: true
      when: _upgrade_local_image_gitops_stat.stat.exists | default(false)

    - name: Report the staged image tag
      ansible.builtin.debug:
        msg: "Staged CANASTA_IMAGE={{ _built_image }} in env.template."
      when: _upgrade_local_image_gitops_stat.stat.exists | default(false)
