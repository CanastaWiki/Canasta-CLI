---
# Backfill MYSQL_HOST, MYSQL_PORT, MYSQL_USER, and MYSQL_SSL in .env
# for instances created before roles/create/tasks/_env_update.yml began
# pinning them. podman-compose does not expand ${VAR:-default} in
# docker-compose.yml's environment list — it passes the literal string
# through — so without these keys in .env the web container receives
# MYSQL_HOST=${MYSQL_HOST:-db} and wait-for-it.sh hangs forever waiting
# for a host literally named "${MYSQL_HOST:-db}".
#
# Only sets keys that are absent; never overwrites an operator's value
# (e.g. an external-DB MYSQL_HOST). Skipped entirely when
# USE_EXTERNAL_DB=true, since those setups supply their own DB host.
#
# WIKI_DB_USER / WIKI_DB_PASSWORD, MediaWiki's own account, are always
# filled, for external databases too: docker-compose.yml passes them to web
# without a default. Until an instance has its own account, WIKI_DB_USER is
# the administrator account (MYSQL_USER, root on the bundled database), and
# then WIKI_DB_PASSWORD is copied from MYSQL_PASSWORD every time, so a root
# password rotation or a restored .env never leaves MediaWiki a stale copy.
# CANASTA_DB_ROOT_ACCOUNT=true keeps (or puts) MediaWiki on the
# administrator account.
#
# The keys and values are vars/mysql_defaults.yml, which the Compose fast path
# (direct_commands/_helpers.py, _backfill_db_defaults) reads too.
#
# Input: instance_path

- name: Read USE_EXTERNAL_DB from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: USE_EXTERNAL_DB
  register: _backfill_ext_db

- name: Backfill bundled DB MySQL defaults
  when: not (_backfill_ext_db.found and _backfill_ext_db.value | lower == 'true')
  block:
    - name: Read the bundled DB MySQL keys from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: "{{ item.key }}"
      loop: "{{ canasta_bundled_db_defaults }}"
      loop_control:
        label: "{{ item.key }}"
      register: _backfill_mysql_keys

    - name: Set the missing bundled DB MySQL defaults
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: "{{ item.item.key }}"
        value: "{{ item.item.value }}"
      loop: "{{ _backfill_mysql_keys.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: not item.found or (item.value | default('') | trim) == ''

- name: Read the database account keys from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _backfill_wiki_env
  no_log: true  # registers the whole .env, including passwords

- name: Default MediaWiki's account to the administrator account
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: WIKI_DB_USER
    value: "{{ _backfill_admin_user }}"
  vars:
    _backfill_admin_user: "{{ _backfill_wiki_env.variables.MYSQL_USER | default('root', true) | trim }}"
  when: >-
    (_backfill_wiki_env.variables.WIKI_DB_USER | default('') | trim) == ''
    or ((_backfill_wiki_env.variables.CANASTA_DB_ROOT_ACCOUNT | default('false')
         | string | lower) == 'true'
        and (_backfill_wiki_env.variables.WIKI_DB_USER | trim) != _backfill_admin_user)

- name: Give the administrator account's password to MediaWiki while it uses that account
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: WIKI_DB_PASSWORD
    value: "{{ _backfill_wiki_env.variables.MYSQL_PASSWORD }}"
  vars:
    _backfill_admin_user: "{{ _backfill_wiki_env.variables.MYSQL_USER | default('root', true) | trim }}"
    _backfill_wiki_user: >-
      {{ _backfill_admin_user
         if (_backfill_wiki_env.variables.CANASTA_DB_ROOT_ACCOUNT | default('false')
             | string | lower) == 'true'
         else (_backfill_wiki_env.variables.WIKI_DB_USER | default('', true) | trim
               or _backfill_admin_user) }}
  when:
    - _backfill_wiki_user == _backfill_admin_user
    - (_backfill_wiki_env.variables.MYSQL_PASSWORD | default('')) != ''
    - >-
      (_backfill_wiki_env.variables.WIKI_DB_PASSWORD | default(''))
      != _backfill_wiki_env.variables.MYSQL_PASSWORD
  no_log: true
