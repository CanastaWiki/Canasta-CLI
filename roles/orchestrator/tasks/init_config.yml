---
# Initialize orchestrator configuration for a new instance.
# Common steps (Caddyfile, observability) plus orchestrator-specific config.
# Input: instance_path, instance_orchestrator

- name: Create Caddyfile.site from template (no-clobber)
  ansible.builtin.copy:
    src: "{{ canasta_root }}/instance_template/config/Caddyfile.site"
    dest: "{{ instance_path }}/config/Caddyfile.site"
    force: false
    mode: "0644"

- name: Create Caddyfile.global from template (no-clobber)
  ansible.builtin.copy:
    src: "{{ canasta_root }}/instance_template/config/Caddyfile.global"
    dest: "{{ instance_path }}/config/Caddyfile.global"
    force: false
    mode: "0644"

# Ships empty; no-clobber because this runs on upgrade too.
- name: Create media-hosts.yaml from template (no-clobber)
  ansible.builtin.copy:
    src: "{{ canasta_root }}/instance_template/config/media-hosts.yaml"
    dest: "{{ instance_path }}/config/media-hosts.yaml"
    force: false
    mode: "0644"

- name: Generate observability credentials if enabled
  ansible.builtin.include_tasks: ensure_observability_credentials.yml

- name: Generate Caddyfile
  ansible.builtin.include_tasks: rewrite_caddy.yml

- name: Compose-specific init
  when: not (instance_is_k8s | bool)
  block:
    - name: Sync compose profiles
      ansible.builtin.include_tasks: sync_compose_profiles.yml

    # The HAProxy edge, which reads it, fronts Compose instances. Comments
    # only until the user adds directives; no-clobber because this runs on
    # upgrade too.
    - name: Create haproxy-backend.cfg from template (no-clobber)
      ansible.builtin.copy:
        src: "{{ canasta_root }}/instance_template/config/haproxy-backend.cfg"
        dest: "{{ instance_path }}/config/haproxy-backend.cfg"
        force: false
        mode: "0644"

- name: Kubernetes-specific init
  when: instance_is_k8s | bool
  ansible.builtin.debug:
    msg: "Kubernetes configuration managed via Helm values.yaml"

# Earlier releases wrote haproxy-backend.cfg into Kubernetes instances too.
- name: Remove an unused haproxy-backend.cfg from a Kubernetes instance
  ansible.builtin.include_tasks: remove_k8s_haproxy_backend_cfg.yml
  when: instance_is_k8s | bool
