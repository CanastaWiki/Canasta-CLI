---
# Destroy containers AND volumes/resources for an instance.
# Input: instance_path, instance_orchestrator, instance_managed_cluster, instance_id

- name: Destroy (Docker Compose)
  when: instance_orchestrator | default('compose') == 'compose'
  block:
    - name: Check for docker-compose.sidecars.yml
      ansible.builtin.stat:
        path: "{{ instance_path }}/docker-compose.sidecars.yml"
      register: _destroy_sidecars

    - name: Check for docker-compose.web-env.yml
      ansible.builtin.stat:
        path: "{{ instance_path }}/docker-compose.web-env.yml"
      register: _destroy_web_env

    - name: Check for docker-compose.override.yml
      ansible.builtin.stat:
        path: "{{ instance_path }}/docker-compose.override.yml"
      register: _destroy_override

    # Pass the sidecars layer explicitly: `down -v` only removes volumes
    # declared in the compose files it loads, and an app sidecar's named
    # volume lives in docker-compose.sidecars.yml, which Compose does not
    # auto-load. Without it the volume survives delete and later blocks
    # recreate with a stale-volume error. --remove-orphans still sweeps any
    # stray containers.
    - name: Build compose file arguments for destroy
      ansible.builtin.set_fact:
        _destroy_compose_files: >-
          {{ ['-f', 'docker-compose.yml'] +
             (_destroy_sidecars.stat.exists | ternary(['-f', 'docker-compose.sidecars.yml'], [])) +
             (_destroy_web_env.stat.exists | ternary(['-f', 'docker-compose.web-env.yml'], [])) +
             (_destroy_override.stat.exists | ternary(['-f', 'docker-compose.override.yml'], [])) }}

    # podman-compose ignores COMPOSE_PROFILES from .env, so we must pass
    # --profile flags explicitly for `down` to remove all profiled services.
    - name: Read COMPOSE_PROFILES from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read_all
      register: _env_profiles_destroy
      no_log: true  # registers the whole .env, including passwords
      when: compose_command is search('podman')

    - name: Build compose profile flags
      ansible.builtin.set_fact:
        _destroy_profile_flags: >-
          {{ (_env_profiles_destroy.variables.COMPOSE_PROFILES | default(''))
             | split(',') | map('trim') | reject('equalto', '')
             | map('regex_replace', '^', '--profile ')
             | join(' ') }}
      when: compose_command is search('podman')

    - name: Destroy containers and volumes
      ansible.builtin.command:
        cmd: >-
          {{ compose_command }} {{ _destroy_compose_files | join(' ') }}
          {{ _destroy_profile_flags | default('') }} down -v --remove-orphans
        chdir: "{{ instance_path }}"
      register: _destroy_down
      changed_when: true
      failed_when: false

    # `down -v` skips a volume another container still has mounted and
    # exits 0 anyway.
    - name: List volumes the teardown left behind
      ansible.builtin.command:
        cmd: >-
          {{ inspect_command }} volume ls -q
          --filter label=com.docker.compose.project={{ instance_path | basename | lower }}
      register: _destroy_leftover
      changed_when: false
      failed_when: false
      when: _destroy_down.rc | default(1) == 0

    - name: Record the volumes left behind
      ansible.builtin.set_fact:
        _destroy_leftover_volumes: "{{ _destroy_leftover.stdout_lines | default([]) }}"

    # `down` succeeds when the containers are already gone, so a failure
    # means they may still be running.
    - name: Fail if containers and volumes could not be removed
      ansible.builtin.fail:
        msg: >-
          Failed to remove the containers and volumes of instance
          '{{ instance_id }}': {{ (_destroy_down.stderr | default('', true)
          | trim) or (_destroy_down.msg | default('')) }}
          The instance was not deleted. Use --force to delete it anyway.
      when:
        - _destroy_down.rc | default(1) != 0
        - not (force | default(false) | bool)

    - name: Fail if volumes could not be removed
      ansible.builtin.fail:
        msg: >-
          Failed to remove volume(s) {{ _destroy_leftover_volumes | join(', ') }}
          of instance '{{ instance_id }}'; another container is probably
          still using them. The instance was not deleted. Stop that
          container and run delete again, or use --force to delete the
          instance and leave the volumes.
      when:
        - _destroy_leftover_volumes | length > 0
        - not (force | default(false) | bool)

    - name: Warn that volumes remain
      ansible.builtin.debug:
        msg: >-
          Warning: volume(s) {{ _destroy_leftover_volumes | join(', ') }}
          of instance '{{ instance_id }}' could not be removed and still exist.
      when:
        - _destroy_leftover_volumes | length > 0
        - force | default(false) | bool

    - name: Warn that containers and volumes may remain
      ansible.builtin.debug:
        msg: >-
          Warning: failed to remove the containers and volumes of instance
          '{{ instance_id }}'; they may still exist.
      when:
        - _destroy_down.rc | default(1) != 0
        - force | default(false) | bool

    # Only reached once the teardown succeeded or --force was given, so a
    # failed delete leaves the instance's content in place. The files can
    # be owned by the container's www-data, which the operator cannot
    # remove, so the removal runs as root in a container.
    - name: Clean up container-owned files
      ansible.builtin.command:
        cmd: >-
          {{ inspect_command }} run --rm
          -v {{ instance_path | quote }}:/instance
          docker.io/library/alpine
          find /instance/config /instance/images /instance/public_assets
          -mindepth 1 -delete
      changed_when: true
      ignore_errors: true  # OK if a directory is already gone

    - name: Remove backup staging volume
      ansible.builtin.command:
        cmd: "{{ inspect_command }} volume rm canasta-backup-{{ instance_path | basename }}"
      changed_when: true
      ignore_errors: true  # OK if volume doesn't exist

- name: Destroy (Kubernetes)
  when: instance_orchestrator | default('compose') in ['kubernetes', 'k8s']
  block:
    - name: Set K8s namespace
      ansible.builtin.set_fact:
        _k8s_namespace: "canasta-{{ instance_id }}"

    - name: Uninstall Helm release and clean up
      ansible.builtin.include_tasks: helm_uninstall.yml
