---
# Remove `config unset --secret` keys from where this orchestrator stores
# them, beyond config/secrets.env and config/secrets-web, which the caller
# clears on both. Kubernetes keeps nothing else: the app Secret is rebuilt
# from config/secrets.env on the next start.
# Input: instance_path, instance_orchestrator, keys

- name: Remove the secrets (Compose)
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/config/tasks/_unset_secret_compose.yml
  when: instance_orchestrator | default('compose') == 'compose'
