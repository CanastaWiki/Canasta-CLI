---
# Bring this instance's place behind the host's HAProxy edge, and the edge
# itself, in line with CANASTA_ENABLE_EDGE. Runs before the instance's
# containers start, because its Caddy joins the edge's network.
#
# Input: instance_path, instance_id (or id during create)
# Optional: edge_member (present/absent), to override .env, as delete does.

- name: Render and stage the edge
  canasta_edge:
    instance_id: "{{ instance_id | default(id) }}"
    instance_path: "{{ instance_path }}"
    member: "{{ edge_member | default(omit) }}"
    inspect_command: "{{ inspect_command | default('docker') }}"
  register: _edge

# start.yml sets edge_defer_errors: it brings the instance up first, routed
# by the edge's last good configuration, and fails afterwards.
- name: Stop on an edge configuration error
  ansible.builtin.fail:
    msg: "{{ _edge.error }}"
  when:
    - _edge.error is defined
    - not (edge_defer_errors | default(false) | bool)

- name: Report an edge network IPv6 setting the host no longer matches
  ansible.builtin.debug:
    msg: >-
      The host {{ 'now has' if _edge.network_ipv6_pending else 'no longer has' }}
      IPv6, but the HAProxy edge's network was created
      {{ 'without' if _edge.network_ipv6_pending else 'with' }} it, and its
      setting cannot change while instances are attached. The edge keeps the
      network as it is, and creates it with the new setting once no instance
      is behind it any more.
  when: _edge.network_ipv6_pending is defined

- name: Report Caddyfile.global sites the edge cannot route
  ansible.builtin.debug:
    msg: >-
      config/Caddyfile.global of instance '{{ item.instance }}' has a site
      address the HAProxy edge cannot route by hostname: '{{ item.address }}'
      ({{ item.reason }}). The edge does not serve it, and Caddy cannot obtain
      a certificate for it behind the edge.
  loop: "{{ _edge.unrouted_sites | default([]) }}"
  loop_control:
    label: "{{ item.instance }}: {{ item.address }}"

# Checked here rather than left to `up`, whose port conflict reads as a raw
# Docker error.
- name: Read the addresses this instance's Caddy publishes
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _edge_instance_env
  no_log: true  # registers the whole .env, including passwords
  when:
    - (instance_id | default(id)) not in (_edge.members | default([]))
    - _edge.running | default(false) | bool

- name: Refuse ports the edge owns
  ansible.builtin.fail:
    msg: >-
      This instance publishes port
      {{ _edge_taken | join(' and ') }}, which the HAProxy edge holds for
      {{ _edge.members | join(', ') }}. Put the instance behind the edge
      (CANASTA_ENABLE_EDGE=true), or give it other ports with HTTP_PORT and
      HTTPS_PORT.
  vars:
    _edge_taken: >-
      {{ [_edge_instance_env.variables.CANASTA_CADDY_HTTP_PUBLISH | default('80', true),
          _edge_instance_env.variables.CANASTA_CADDY_HTTPS_PUBLISH | default('443', true)]
         | select('in', ['80', '443']) | list }}
  when:
    - _edge_instance_env is not skipped
    - _edge_taken | length > 0

- name: Find what else listens on 80 and 443
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if command -v ss >/dev/null 2>&1; then
        ss -tlnpH 'sport = :80 or sport = :443' 2>/dev/null
      elif command -v lsof >/dev/null 2>&1; then
        lsof -nP -iTCP:80 -iTCP:443 -sTCP:LISTEN 2>/dev/null | tail -n +2
      fi
  args:
    executable: /bin/bash
  register: _edge_port_holders
  changed_when: false
  failed_when: false
  when:
    - _edge.members | default([]) | length > 0
    - not (_edge.running | default(false) | bool)

- name: Refuse to start the edge while 80 or 443 is taken
  ansible.builtin.fail:
    msg: >-
      The HAProxy edge needs ports 80 and 443, but something is already
      listening on them:
      {{ _edge_port_holders.stdout | trim }}.
      Stop it, or leave the edge off (CANASTA_ENABLE_EDGE=false) and give
      this instance its own ports.
  when:
    - _edge_port_holders is not skipped
    - _edge_port_holders.stdout | default('') | trim | length > 0

# Also when the edge's compose file changed, or acme.sh is not running:
# `up` creates or recreates only the services that need it.
- name: Start the edge
  ansible.builtin.command:
    cmd: >-
      {{ compose_command }} -p canasta-edge up -d
      {{ '--force-recreate' if (_edge.recreate | default(false) | bool) else '' }}
    chdir: "{{ _edge.edge_dir }}"
  register: _edge_up
  changed_when: true
  when:
    - _edge.members | default([]) | length > 0
    - >-
      not (_edge.running | default(false) | bool)
      or (_edge.compose_changed | default(false) | bool)
      or not (_edge.acme_running | default(false) | bool)

# The image runs HAProxy in master-worker mode, where USR2 reloads the
# configuration without dropping connections.
- name: Reload the edge
  ansible.builtin.command:
    argv:
      - "{{ inspect_command | default('docker') }}"
      - kill
      - --signal
      - USR2
      - canasta-edge
  changed_when: true
  when:
    - _edge.members | default([]) | length > 0
    - _edge.running | default(false) | bool
    - _edge.reload | default(false) | bool
    - _edge_up is skipped

# HAProxy answers the challenges, so this needs the edge serving the
# hostnames first. acme.sh installs what it obtains over the stats socket,
# without a reload.
- name: Obtain the edge's Let's Encrypt certificates
  canasta_edge:
    state: issue
    inspect_command: "{{ inspect_command | default('docker') }}"
  register: _edge_issue
  when:
    - _edge.members | default([]) | length > 0
    - _edge.acme | default(false) | bool
    - _edge.error is not defined

- name: Reload the edge for certificates no longer from Let's Encrypt
  ansible.builtin.command:
    argv:
      - "{{ inspect_command | default('docker') }}"
      - kill
      - --signal
      - USR2
      - canasta-edge
  changed_when: true
  when:
    - _edge_issue is not skipped
    - _edge_issue.reload | default(false) | bool

- name: Report certificates Let's Encrypt did not issue
  ansible.builtin.debug:
    msg: >-
      Let's Encrypt did not issue a certificate for {{ item.hostname }}
      ({{ item.reason }}). The edge keeps serving it a certificate from its
      own CA, which browsers do not trust, and retries at the next start and
      every renewal run. Check that {{ item.hostname }} resolves to this host
      and that port 80 reaches it.
  loop: "{{ _edge_issue.unissued | default([]) }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: _edge_issue is not skipped

# -v: the edge's only volume holds its runtime socket.
- name: Stop the edge when no instance is behind it
  ansible.builtin.command:
    cmd: "{{ compose_command }} -p canasta-edge down -v"
    chdir: "{{ _edge.edge_dir }}"
  changed_when: true
  when:
    - _edge.members | default([]) | length == 0
    - _edge.running | default(false) | bool
