---
# Make MediaWiki's database account match .env (Compose). On Kubernetes,
# only say when the account picks up the change.
#
# Account state lives only in the database server: no backup captures it,
# and a restore onto a fresh host, a gitops join or a rebuilt db volume
# starts without it. So this runs on every start, before web boots and
# runs update.php, and after anything that changes the wiki database set,
# and puts the account back the way .env and wikis.yaml say it should be.
# ensure_wiki_db_account.sh does the work inside the db container, which
# reads WIKI_DB_USER and WIKI_DB_PASSWORD from its own environment, so it
# must run after the `up` that gave the db container the current values.
#
# An external database has no db container, so the script runs in the web
# container, which holds MediaWiki's account as MYSQL_USER and
# MYSQL_PASSWORD, and logs in to the server as the .env administrator (see
# db_admin.yml). There it runs after web starts, and of the databases no
# wiki declares, only those a settings file names are reported, since the
# server can hold other applications' databases.
#
# Nothing to do while MediaWiki connects as the administrator account.
#
# Input: instance_path, instance_orchestrator, compose_command
# Output: _wiki_db_undeclared - databases the account cannot use

- name: Read the wiki database account settings
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _ensure_env
  no_log: true  # registers the whole .env, including passwords

- name: Decide whether the account needs ensuring
  ansible.builtin.set_fact:
    _wiki_db_undeclared: []
    _ensure_external: >-
      {{ (_ensure_env.variables.USE_EXTERNAL_DB | default('false')
          | string | lower) == 'true' }}
    _ensure_needed: >-
      {{ not (instance_is_k8s | bool)
         and (_ensure_env.variables.WIKI_DB_USER | default('root', true))
             not in ['root', _ensure_env.variables.MYSQL_USER | default('root', true)] }}

# On Kubernetes the web pod's ensure-db-account init container does this at
# every pod start, from the wikis.yaml the pod was deployed with, so a change
# to the database set reaches the account with the next deploy.
- name: Report when the account follows a database set change (Kubernetes)
  when: instance_is_k8s | bool
  block:
    - name: Read MediaWiki's database account
      ansible.builtin.include_tasks: k8s_wiki_db_user.yml

    - name: Check whether the instance is gitops-managed
      ansible.builtin.stat:
        path: "{{ instance_path }}/.gitops-host"
      register: _ensure_k8s_gitops

    - name: Report when MediaWiki's account gets the new database set
      ansible.builtin.debug:
        msg: >-
          MediaWiki's database account '{{ _k8s_wiki_db_user }}' gets the
          new database set when
          {%- if _ensure_k8s_gitops.stat.exists %}
          this change is pushed and synced ('canasta gitops push -i
          {{ instance_id }}', then 'canasta gitops sync -i {{ instance_id }}').
          {%- else %}
          the instance next restarts ('canasta restart -i {{ instance_id }}').
          {%- endif %}
      when: _k8s_wiki_db_user != 'root'

- name: Ensure the wiki database account
  when: _ensure_needed | bool
  block:
    - name: Read the wiki database set
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _ensure_wikis

    - name: Find where database administration runs
      ansible.builtin.include_tasks: db_admin.yml

    # A stopped instance gets the account on its next start, which runs this.
    - name: Check whether the database is running
      ansible.builtin.command:
        cmd: "{{ _db_admin_exec }} true"
        chdir: "{{ instance_path }}"
      register: _ensure_running
      changed_when: false
      failed_when: false

    - name: Report that the account is updated on the next start
      ansible.builtin.debug:
        msg: >-
          The instance is not running; MediaWiki's database account is
          brought up to date when it next starts.
      when: _ensure_running.rc != 0

    # On a new volume the image's first-run setup serves the socket from a
    # temporary server with networking off, then restarts. Ping the bundled
    # database over TCP so only the real server answers.
    - name: Wait for the database to accept root logins
      when: _ensure_running.rc == 0
      ansible.builtin.command:
        cmd: >-
          {{ _db_admin_exec }} sh -c
          '{{ _db_admin_pwd }} mariadb-admin ping {{ _db_admin_args }}
          {{ "--protocol=tcp -h 127.0.0.1" if _db_admin_service == "db" else "" }}'
        chdir: "{{ instance_path }}"
      register: _ensure_ping
      changed_when: false
      retries: 30
      delay: 5
      until: _ensure_ping.rc == 0

    - name: Create, grant and verify the wiki database account
      when: _ensure_running.rc == 0
      ansible.builtin.command:
        cmd: >-
          {{ _db_admin_exec }}
          {% if _ensure_external | bool -%}
          sh -c 'WIKI_DB_USER="$MYSQL_USER" WIKI_DB_PASSWORD="$MYSQL_PASSWORD"
          DB_HOST="$MYSQL_HOST" DB_PORT="$MYSQL_PORT"
          DB_ADMIN_USER="$CANASTA_DB_ADMIN_USER"
          DB_ADMIN_PASSWORD="$CANASTA_DB_ADMIN_PASSWORD"
          exec sh -s -- "$@"' sh
          {%- else -%}
          sh -s --
          {%- endif %}
          {{ _ensure_wikis.db_groups | map(attribute='databases') | flatten
             | unique | map('quote') | join(' ') }}
        chdir: "{{ instance_path }}"
        stdin: >-
          {{ lookup('ansible.builtin.file', canasta_root
                    ~ '/roles/orchestrator/files/helm/canasta/files/ensure_wiki_db_account.sh') }}
      register: _ensure_result
      changed_when: "'ENSURED ' in _ensure_result.stdout"

    - name: Record databases the account cannot use
      when: _ensure_result is not skipped
      ansible.builtin.set_fact:
        _wiki_db_undeclared: >-
          {{ _ensure_result.stdout_lines | select('match', '^UNDECLARED ')
             | map('regex_replace', '^UNDECLARED ', '') | list }}

    - name: Find the undeclared databases a settings file names (external database)
      ansible.builtin.include_tasks: referenced_databases.yml
      vars:
        refdb_names: "{{ _wiki_db_undeclared }}"
      when:
        - _ensure_result is not skipped
        - _ensure_external | bool

    - name: Report only those (external database)
      ansible.builtin.set_fact:
        _wiki_db_undeclared: "{{ _refdb_referenced }}"
      when:
        - _ensure_result is not skipped
        - _ensure_external | bool

    - name: Warn about databases the wiki account cannot use
      ansible.builtin.debug:
        msg: >-
          WARNING: MediaWiki's database account has no access to
          {{ _wiki_db_undeclared | join(', ') }}, which
          {{ 'is' if _wiki_db_undeclared | length == 1 else 'are' }} not
          declared for any wiki. If a wiki uses
          {{ 'it' if _wiki_db_undeclared | length == 1 else 'one' }} (a Cargo
          database set with $wgCargoDBname, for example), declare it with
          'canasta backup databases add -i {{ instance_id }} -w <wiki> <database>',
          which also includes it in backups.
      when:
        - _wiki_db_undeclared | length > 0
        - not (ensure_quiet | default(false) | bool)
