---
# Sync COMPOSE_PROFILES with feature flags in .env.
# Input: instance_path

- name: Read .env for profile sync
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _env_profiles
  no_log: true  # registers the whole .env, including passwords

- name: Parse current profiles
  ansible.builtin.set_fact:
    _current_profiles: >-
      {{ (_env_profiles.variables.COMPOSE_PROFILES | default(''))
         | split(',') | map('trim') | reject('equalto', '') | list }}

# internal-db is derived from USE_EXTERNAL_DB, so an instance whose
# COMPOSE_PROFILES lost it gets it back. It is excluded from the teardown
# below (_profile_services), so the database container is never removed.
- name: Derive the profiles from the feature flags
  ansible.builtin.set_fact:
    _desired_profiles: >-
      {{ _current_profiles
         | canasta_compose_profiles(_env_profiles.variables, canasta_managed_profiles) }}

- name: Update COMPOSE_PROFILES in .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: COMPOSE_PROFILES
    value: "{{ _desired_profiles | join(',') }}"
  when: _desired_profiles | sort != _current_profiles | sort

# A feature flag flipped off (e.g. CANASTA_ENABLE_REDIS=false) drops
# its profile from COMPOSE_PROFILES, but `docker compose up`/`down` only act
# on active profiles — a container already running under the now-inactive
# profile is treated as an orphan and left running. Stop and remove those
# containers so disabling a feature actually tears it down. Scoped to the
# managed feature profiles; internal-db is intentionally excluded so a
# database container is never auto-removed.
- name: Tear down containers for deactivated feature profiles
  vars:
    _profile_services: "{{ canasta_managed_profile_services }}"
    _removed_profiles: >-
      {{ _current_profiles | difference(_desired_profiles)
         | select('in', _profile_services.keys() | list) | list }}
  when: _removed_profiles | length > 0
  block:
    - name: Check for docker-compose.override.yml (profile teardown)
      ansible.builtin.stat:
        path: "{{ instance_path }}/docker-compose.override.yml"
      register: _teardown_override

    - name: Build compose file arguments for profile teardown
      ansible.builtin.set_fact:
        _teardown_compose_files: >-
          {{ ['-f', 'docker-compose.yml'] +
             (_teardown_override.stat.exists | ternary(['-f', 'docker-compose.override.yml'], [])) +
             ((instance_devmode | default(false) | bool) | ternary(['-f', 'docker-compose.dev.yml'], [])) }}

    - name: Stop and remove containers for deactivated profiles
      ansible.builtin.command:
        cmd: >-
          {{ compose_command }} {{ _teardown_compose_files | join(' ') }}
          {{ _removed_profiles | map('regex_replace', '^', '--profile ') | join(' ') }}
          rm -sf
          {{ _removed_profiles | map('extract', _profile_services) | flatten | join(' ') }}
        chdir: "{{ instance_path }}"
      changed_when: true
      when: compose_command is not search('podman')

    # podman-compose has no `rm`, so Podman removes the containers by their
    # compose labels. Podman ANDs repeated label filters, hence one query
    # per service.
    - name: Find containers for deactivated profiles (Podman)
      ansible.builtin.command:
        argv:
          - "{{ inspect_command | default('podman') }}"
          - ps
          - -aq
          - --filter
          - "label=com.docker.compose.project={{ instance_path | basename | lower }}"
          - --filter
          - "label=com.docker.compose.service={{ item }}"
      loop: "{{ _removed_profiles | map('extract', _profile_services) | flatten }}"
      register: _teardown_podman_ps
      changed_when: false
      when: compose_command is search('podman')

    - name: Collect containers for deactivated profiles (Podman)
      ansible.builtin.set_fact:
        _teardown_podman_ids: >-
          {{ _teardown_podman_ps.results | map(attribute='stdout_lines')
             | flatten | unique }}
      when: compose_command is search('podman')

    - name: Stop and remove containers for deactivated profiles (Podman)
      ansible.builtin.command:
        argv: "{{ [inspect_command | default('podman'), 'rm', '-f'] + _teardown_podman_ids }}"
      changed_when: true
      when:
        - compose_command is search('podman')
        - _teardown_podman_ids | length > 0

# The caddy service runs the plugin image, which carries the CrowdSec
# bouncer, while CrowdSec is on. A CANASTA_CADDY_IMAGE outside the plugin
# image's repository is the operator's own and is left alone.
- name: Reconcile CANASTA_CADDY_IMAGE for CrowdSec
  vars:
    _current_caddy_image: "{{ _env_profiles.variables.CANASTA_CADDY_IMAGE | default('') }}"
    _desired_caddy_image: >-
      {{ _env_profiles.variables | canasta_caddy_image(canasta_caddy_plugin_image) }}
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: CANASTA_CADDY_IMAGE
    value: "{{ _desired_caddy_image }}"
  when: _current_caddy_image != _desired_caddy_image

# The addresses the caddy service publishes: random loopback ports, since
# the HAProxy edge owns the instance's ports. Match _helpers.py.
- name: Reconcile the addresses Caddy publishes
  vars:
    _publish:
      CANASTA_CADDY_HTTP_PUBLISH: "127.0.0.1:"
      CANASTA_CADDY_HTTPS_PUBLISH: "127.0.0.1:"
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ _publish | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: _env_profiles.variables[item.key] | default('') != item.value

- name: Ensure crowdsec config files exist when the profile is active
  ansible.builtin.include_tasks: ensure_crowdsec_config.yml
  when: "'crowdsec' in _desired_profiles"
