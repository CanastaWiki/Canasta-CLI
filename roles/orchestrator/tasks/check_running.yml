---
# Check if the web container is running.
# Input: instance_path
# Output: _container_running (bool)

- name: Build check command for orchestrator
  ansible.builtin.set_fact:
    _check_cmd: >-
      {{ inspect_command | default('docker') }}
      ps --filter label=com.docker.compose.project={{ instance_path | basename | lower }}
      --filter label=com.docker.compose.service=web
      --format {% raw %}{{.ID}}{% endraw %}
    _check_chdir: "{{ instance_path }}"

- name: Check if web is running
  ansible.builtin.command:
    cmd: "{{ _check_cmd }}"
    chdir: "{{ _check_chdir | default(omit) }}"
  register: _ps_result
  changed_when: false
  ignore_errors: true  # OK if container not running

- name: Set running status
  ansible.builtin.set_fact:
    _container_running: >-
      {{ _ps_result.rc == 0
         and _ps_result.stdout | default('') | trim | length > 0
         and _ps_result.stdout | trim != '0' }}
