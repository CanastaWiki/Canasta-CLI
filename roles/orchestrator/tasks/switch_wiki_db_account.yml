---
# Move a running instance's MediaWiki from the database administrator
# account to its own account (canasta_wiki_db_user), once upgrade's checks
# found nothing in the way. A failure after the switch rolls back to the
# administrator account.
#
# Records the keys through config set, restarts so the start creates and
# grants the account (ensure_wiki_db_account.yml), and checks each wiki.
#
# Input: instance_id, instance_path, _mig_db_wikis (canasta_wikis_yaml
#        read), _mig_db_external and _mig_db_admin_user
#        (check_wiki_db_account.yml)
# Output: _mig_db_redeployed (true once the move restarted the instance,
#         onto the new account or back onto root)

- name: Switch to the wiki account, rolling back on failure
  block:
    - name: Generate the account's password
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/common/tasks/generate_password.yml

    - name: Choose the account
      ansible.builtin.set_fact:
        _mig_db_user: "{{ instance_id | canasta_wiki_db_user(_mig_db_external | bool) }}"

    # Through config set, so a gitops instance records the keys in its
    # vars and the next pull does not render them away.
    - name: Record the account in .env
      ansible.builtin.include_role:
        name: config
        tasks_from: set.yml
      vars:
        config_settings_override: >-
          WIKI_DB_USER={{ _mig_db_user }} WIKI_DB_PASSWORD={{ _generated_password }}
        force: true
        no_restart: true
        config_restart_by_caller: true

    - name: Restart onto the new account
      ansible.builtin.include_role:
        name: instance_lifecycle
        tasks_from: restart.yml

    - name: Record that the move restarted the instance
      ansible.builtin.set_fact:
        _mig_db_redeployed: true

    - name: Check that each wiki reaches its database as the new account
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/exec.yml
      vars:
        exec_service: web
        exec_command: >-
          {% for wiki in _mig_db_wikis.wiki_ids %}
          php maintenance/run.php showSiteStats --wiki={{ wiki | quote }} >/dev/null &&
          {% endfor %}
          true

    - name: Check whether the instance is gitops-managed
      ansible.builtin.stat:
        path: "{{ instance_path }}/.gitops-host"
      register: _mig_db_gitops

    - name: Report the database account migration complete
      ansible.builtin.debug:
        msg: >-
          MediaWiki now connects as '{{ _mig_db_user }}', with access to
          this instance's wiki databases only; the database administrator's
          password is no longer in the web container.
          {%- if _mig_db_gitops.stat.exists %}
          The new keys are in this host's gitops vars; run 'canasta
          gitops push -i {{ instance_id }}' to commit them before the
          next pull.
          {%- endif %}

  rescue:
    - name: Report the failed database account migration
      ansible.builtin.debug:
        msg: >-
          WARNING: moving instance '{{ instance_id }}' to its own database
          account failed ({{ ansible_failed_result.msg | default('see the
          error above') }}). Rolling back to the administrator account.

    - name: Roll back to the administrator account
      ansible.builtin.include_role:
        name: config
        tasks_from: set.yml
      vars:
        config_settings_override: "WIKI_DB_USER={{ _mig_db_admin_user }}"
        force: true
        no_restart: true
        config_restart_by_caller: true

    - name: Restart on the administrator account
      ansible.builtin.include_role:
        name: instance_lifecycle
        tasks_from: restart.yml

    - name: Record that the move restarted the instance
      ansible.builtin.set_fact:
        _mig_db_redeployed: true
