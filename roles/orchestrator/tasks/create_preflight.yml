---
# Pre-flight environment checks for `canasta create`, dispatched here by
# the orchestrator role so it owns the Compose-vs-Kubernetes difference
# (the caller, create's _preflight.yml, stays orchestrator-agnostic).
#
# Only Compose has early host probes that must run before any state
# mutation. Kubernetes preflight lives in k8s_preflight.yml and runs
# later, inside create's _validate_inputs.yml, coupled to the namespace
# stale-state check (it must confirm kubectl reachability immediately
# before it) and reused by the storage-setup playbooks — so there is no
# Kubernetes branch here.
#
# At this stage the raw extra-var `orchestrator` is authoritative; the
# `instance_orchestrator` fact isn't set until later in create.
- name: Compose create pre-flight checks
  when: orchestrator | default('compose') == 'compose'
  block:
    # Auto-detect rootless container socket on the target before the
    # first docker call fires. Only runs when the operator didn't pass
    # --docker-host; the play-level env expression in canasta.yml picks
    # up `_detected_docker_host` next-in-line. Probe is silent / cheap
    # even when nothing rootless is installed (`stdout` ends up empty).
    - name: Detect rootless container socket on target
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/detect_docker_socket.yml"
      when: (docker_host | default('')) == ''

    # `docker info` is not evidence of Docker when DOCKER_HOST points at
    # Podman's socket: the Docker CLI talks to Podman's Docker-compatible
    # API and reports success, so the probe below concluded Docker and
    # recorded `docker compose` for an instance that runs under Podman.
    # The socket already answers the question, so settle it here rather
    # than asking a command that cannot distinguish the two.
    #
    # Mirrors the DOCKER_HOST precedence in canasta.yml, so this reads the
    # same socket the probes will actually use.
    - name: Resolve the socket the runtime probes will use
      ansible.builtin.set_fact:
        _preflight_docker_host: >-
          {{ docker_host
             | default(instance_docker_host | default(''), true)
             | default(_detected_docker_host | default(''), true) }}

    - name: Use Podman when the socket in use is Podman's
      ansible.builtin.set_fact:
        compose_command: podman-compose
        inspect_command: podman
      when:
        - not (compose_command | default('docker compose') is search('podman'))
        - _preflight_docker_host is search('podman')

    # Probe the target's runtime before any state mutation. This is the
    # only place detection happens — the CLI never guesses, so the
    # set_fact below is what makes a Podman-only host work, local or
    # remote. When compose_command already names a Podman command (from
    # the registry or .env), probe podman directly instead.
    - name: Check container runtime is available
      when: (compose_command | default('docker compose') is search('podman'))
      block:
        - name: Probe podman info (compose_command is podman-based)
          ansible.builtin.command:
            cmd: podman info
          register: _docker_check
          changed_when: false
          failed_when: false

    - name: Probe Docker then Podman for remote/detected runtime
      when: not (compose_command | default('docker compose') is search('podman'))
      block:
        # failed_when, not ignore_errors: a Podman-only host is expected
        # to miss here, and ignore_errors would print a docker failure
        # block before the fallback below succeeds. Callers read .rc.
        - name: Probe docker info
          ansible.builtin.command:
            cmd: docker info
          register: _docker_check
          changed_when: false
          failed_when: false

        - name: Probe podman info (fallback)
          ansible.builtin.command:
            cmd: podman info
          register: _podman_check
          changed_when: false
          failed_when: false

        - name: Set compose_command to podman-compose if Docker absent but Podman present
          ansible.builtin.set_fact:
            compose_command: podman-compose
            inspect_command: podman
          when:
            - _docker_check.rc | default(1) != 0
            - _podman_check.rc | default(1) == 0

    - name: Fail if container runtime not available
      ansible.builtin.fail:
        msg: >-
          No container runtime is available on this host.
          Docker and Podman are both absent or unreachable.
          Run 'canasta doctor' to check all dependencies.
      when: >-
        (_docker_check.rc | default(1) != 0)
        and (_podman_check.rc | default(1) != 0)

    # Rootless Podman has two prerequisites that are invisible until the
    # instance silently fails: systemd reaps the containers when the
    # session that started them ends unless the user lingers, and
    # rootlessport cannot bind 80/443 while the unprivileged port floor
    # sits above them. Both are cheap to check and confusing to diagnose.
    - name: Check rootless Podman prerequisites
      when: compose_command | default('docker compose') is search('podman')
      block:
        - name: Ask Podman whether it is rootless
          ansible.builtin.command:
            cmd: podman info --format {% raw %}{{.Host.Security.Rootless}}{% endraw %}
          register: _podman_rootless
          changed_when: false
          failed_when: false

        - name: Read lingering and the unprivileged port floor
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              printf '%s\n' "$(loginctl show-user "$(id -un)" --property=Linger 2>/dev/null | cut -d= -f2)"
              printf '%s\n' "$(cat /proc/sys/net/ipv4/ip_unprivileged_port_start 2>/dev/null)"
          args:
            executable: /bin/bash
          register: _rootless_facts
          changed_when: false
          failed_when: false
          when: _podman_rootless.stdout | default('') | trim == 'true'

        - name: Fail when lingering is off
          ansible.builtin.fail:
            msg: >-
              Rootless Podman on this host has lingering disabled, so
              systemd stops the containers as soon as the session that
              started them ends — the instance would be created and then
              immediately die. Enable it with
              'sudo loginctl enable-linger "$(id -un)"' on the target,
              then retry.
          when:
            - _podman_rootless.stdout | default('') | trim == 'true'
            - (_rootless_facts.stdout_lines | default([]))[0] | default('') | trim != 'yes'

        - name: Fail when privileged ports are out of reach
          ansible.builtin.fail:
            msg: >-
              Rootless Podman cannot bind ports 80 and 443 on this host:
              net.ipv4.ip_unprivileged_port_start is
              {{ (_rootless_facts.stdout_lines | default([]))[1] | default('?') }}.
              Caddy would fail to start with "rootlessport cannot expose
              privileged port 80". Fix it with
              'canasta install podman' (or manually:
              'sudo sysctl net.ipv4.ip_unprivileged_port_start=80' and persist
              in /etc/sysctl.d/), or set HTTP_PORT and HTTPS_PORT above
              1024 for this instance.
          when:
            - _podman_rootless.stdout | default('') | trim == 'true'
            - ((_rootless_facts.stdout_lines | default([]))[1] | default('0') | trim | int) > 80

    # Port conflict detection for Compose. Compose's caddy service
    # binds HTTP_PORT and HTTPS_PORT (80 and 443 by default); if
    # anything else is already serving on them, `docker compose up`
    # will either fail the bind or — worse — appear to start while
    # external traffic silently lands on the foreign service.
    #
    # A second instance on one host is expected to move off the
    # defaults, so probe the ports this instance will actually bind.
    # Its .env does not exist yet, but the -e envfile is a
    # controller-side path, so the overrides can be read here.
    #
    # Two probes catch the common cases:
    #  1. `ss -tln` for a userspace listener (apache, nginx, haproxy,
    #     a docker-proxy from another canasta).
    #  2. `systemctl is-active k3s k3s-agent` for the k3s/Traefik
    #     case, where the LoadBalancer installs PREROUTING NAT rules
    #     ahead of Docker's chain — so port 80/443 traffic to the
    #     external IP gets routed to Traefik even though `ss` shows
    #     no host-level listener.
    #
    # Both probes hard-fail with a remediation hint. Neither needs
    # sudo. The k3s probe also catches a stopped-but-not-cleaned k3s
    # (rules may still be present after `systemctl stop` alone), so
    # the message points at k3s-killall too.
    # ss is iproute2 (Linux only); lsof is the macOS default and common
    # on Linux. Try both, and make "no probe available" its own outcome —
    # an unrunnable check must not read as "port is free", which is what
    # `failed_when: false` plus an empty stdout used to produce.
    - name: Read the custom env file for port overrides
      ansible.builtin.slurp:
        src: "{{ envfile }}"
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: _preflight_envfile
      when: envfile is defined and envfile != ''

    # Appending the default keeps [0] defined when the envfile is absent
    # or sets neither key, so no branch is needed for the common case.
    - name: Resolve the ports this instance will bind
      ansible.builtin.set_fact:
        _preflight_http_port: >-
          {{ ((_preflight_port_lines | select('match', '^HTTP_PORT=') | list)
              + ['HTTP_PORT=80'])[0].split('=', 1)[1] }}
        _preflight_https_port: >-
          {{ ((_preflight_port_lines | select('match', '^HTTPS_PORT=') | list)
              + ['HTTPS_PORT=443'])[0].split('=', 1)[1] }}
      vars:
        # splitlines(), not split('\n'): a folded scalar hands Jinja a
        # literal backslash-n, so the split would never match and every
        # instance would silently fall back to 80/443.
        _preflight_port_lines: >-
          {{ (_preflight_envfile.content | default('') | b64decode).splitlines()
             | map('trim') | select('match', '^HTTPS?_PORT=[0-9]+$') | list }}

    - name: Probe for userspace listener on the HTTP port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if command -v ss >/dev/null 2>&1; then
            ss -tlnH "sport = :{{ _preflight_http_port }}"
          elif command -v lsof >/dev/null 2>&1; then
            lsof -nP -iTCP:{{ _preflight_http_port }} -sTCP:LISTEN 2>/dev/null | tail -n +2
          else
            echo "CANASTA_PORT_PROBE_UNAVAILABLE"
          fi
      args:
        executable: /bin/bash
      register: _port80_listener
      changed_when: false
      failed_when: false

    - name: Probe for userspace listener on the HTTPS port
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if command -v ss >/dev/null 2>&1; then
            ss -tlnH "sport = :{{ _preflight_https_port }}"
          elif command -v lsof >/dev/null 2>&1; then
            lsof -nP -iTCP:{{ _preflight_https_port }} -sTCP:LISTEN 2>/dev/null | tail -n +2
          else
            echo "CANASTA_PORT_PROBE_UNAVAILABLE"
          fi
      args:
        executable: /bin/bash
      register: _port443_listener
      changed_when: false
      failed_when: false

    # Neither tool present: say so rather than let a check that never ran
    # look like a clean result. Not fatal — a missing lsof/ss should not
    # block a create on an otherwise healthy host.
    - name: Warn when the port check could not run
      ansible.builtin.debug:
        msg: >-
          Could not check whether ports {{ _preflight_http_port }} and
          {{ _preflight_https_port }} are free: neither `ss` nor `lsof`
          is available on this host. If something else is already
          serving on them, compose will fail to bind (or caddy will
          start while traffic lands on the other service).
      when: >-
        "CANASTA_PORT_PROBE_UNAVAILABLE" in
        (_port80_listener.stdout | default(''))

    - name: Fail if the HTTP port is already in use
      ansible.builtin.fail:
        msg: >-
          Port {{ _preflight_http_port }} is already in use on this host:
          {{ _port80_listener.stdout | trim }}.
          `canasta create` (Compose) needs ports {{ _preflight_http_port }}
          and {{ _preflight_https_port }} free for the caddy service.
          Stop the conflicting service, use a different host, or give
          this instance its own ports by passing an env file that sets
          HTTP_PORT and HTTPS_PORT ('canasta create -e <file>').
      when:
        - _port80_listener.stdout | default('') | trim | length > 0
        - '"CANASTA_PORT_PROBE_UNAVAILABLE" not in (_port80_listener.stdout | default(""))'

    - name: Fail if the HTTPS port is already in use
      ansible.builtin.fail:
        msg: >-
          Port {{ _preflight_https_port }} is already in use on this host:
          {{ _port443_listener.stdout | trim }}.
          `canasta create` (Compose) needs ports {{ _preflight_http_port }}
          and {{ _preflight_https_port }} free for the caddy service.
          Stop the conflicting service, use a different host, or give
          this instance its own ports by passing an env file that sets
          HTTP_PORT and HTTPS_PORT ('canasta create -e <file>').
      when:
        - _port443_listener.stdout | default('') | trim | length > 0
        - '"CANASTA_PORT_PROBE_UNAVAILABLE" not in (_port443_listener.stdout | default(""))'

    - name: Probe whether k3s is running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - k3s
          - k3s-agent
      register: _k3s_active
      changed_when: false
      failed_when: false

    # `systemctl is-active` prints one line per service. Treat any
    # 'active' line as a positive — even if only k3s-agent is active.
    # Traefik claims 80 and 443, so an instance that binds neither is
    # unaffected and must not be blocked.
    - name: Fail if k3s is running
      ansible.builtin.fail:
        msg: >-
          k3s is running on this host. Its Traefik LoadBalancer
          installs iptables PREROUTING rules that intercept traffic
          to the host's external IP on ports 80 and 443 BEFORE
          Docker's NAT can claim them — Compose's caddy will appear
          to start but external requests will land on Traefik (and
          404). Stop k3s with 'sudo systemctl stop k3s' followed by
          'sudo /usr/local/bin/k3s-killall.sh' (the latter also
          flushes the lingering iptables rules), use a different
          host for Compose installs, or give this instance ports
          other than 80 and 443 via 'canasta create -e <file>'.
      when:
        - >-
          _k3s_active.stdout_lines | default([])
          | select('eq', 'active') | length > 0
        - >-
          '80' in [_preflight_http_port, _preflight_https_port]
          or '443' in [_preflight_http_port, _preflight_https_port]

    # The host memory floor is profile-aware (~2 GiB base, ~4 GiB with
    # Elasticsearch or observability, ~8 GiB with both), so it can't be checked
    # here: preflight runs before the -e envfile is merged, so the intended
    # feature flags aren't known yet. create enforces it in _env_update.yml
    # once .env is finalized, via roles/orchestrator/tasks/check_host_memory.yml.

    # Compose-only host-gateway compatibility probe. The web service maps
    # gateway.docker.internal to the magic "host-gateway" value, which
    # podman only learned in 4.4 — on podman < 4.4, `compose up` aborts with
    # "invalid IP address in add-host: host-gateway". When the target runs an
    # older podman, resolve the bridge gateway IP ourselves so _env_update.yml
    # can pin HOST_GATEWAY in .env. The probe stays empty (and HOST_GATEWAY
    # unset, so the magic value is used) for Docker and podman >= 4.4.
    - name: Probe podman version for host-gateway support
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {% raw %}command -v podman >/dev/null 2>&1 || exit 0
          ver=$(podman --version 2>/dev/null | awk '{print $3}')
          [ -n "$ver" ] || exit 0
          # Emit the bridge gateway only when podman is older than 4.4.0.
          if [ "$(printf '%s\n4.4.0\n' "$ver" | sort -V | head -n1)" = "$ver" ] \
             && [ "$ver" != "4.4.0" ]; then
              podman network inspect podman \
                  --format '{{range .Subnets}}{{.Gateway}}{{end}}' 2>/dev/null
          fi{% endraw %}
      args:
        executable: /bin/bash
      register: _host_gateway_probe
      changed_when: false
      failed_when: false

    - name: Record host-gateway fallback IP
      ansible.builtin.set_fact:
        _host_gateway_fallback: "{{ _host_gateway_probe.stdout | default('') | trim }}"

    # Compose-only storage preflight. Canasta images are ~2.3 GiB; with
    # database volumes, logs, and build cache, container storage can
    # exhaust a small root partition. This warns (rather than fails like
    # the memory check) because disk is recoverable mid-flight — the
    # operator can free space or move container storage to a larger
    # volume without re-provisioning the host.
    #
    # The storage root is parsed from the `docker info` output already
    # captured by the availability check above, so no extra runtime call
    # is needed. Docker CE reports it as `Docker Root Dir`; the
    # podman-docker shim (rootless Podman) reports `graphRoot` instead,
    # so match either.
    - name: Resolve container storage root
      ansible.builtin.set_fact:
        _docker_root_dir: >-
          {{ (_docker_check.stdout | default('')
             | regex_findall('(?:Docker Root Dir|graphRoot):\s*(.+)') | first | default('')) | trim }}

    # `df --output=avail` is GNU coreutils only (BusyBox/BSD lack it);
    # `failed_when: false` keeps the check best-effort so it silently
    # no-ops on those targets rather than aborting create. Output is in
    # 1K blocks; tail -1 drops the header row.
    - name: Check available disk space on Docker storage
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && df --output=avail {{ _docker_root_dir | quote }}
          2>/dev/null | tail -1
      args:
        executable: /bin/bash
      register: _docker_storage_avail
      changed_when: false
      failed_when: false
      when: _docker_root_dir | length > 0

    - name: Warn if Docker storage has less than 20 GiB free
      ansible.builtin.debug:
        msg: >-
          WARNING: Container storage at {{ _docker_root_dir }}
          has only {{ (_docker_storage_avail.stdout | trim | int / (1024 * 1024)) | round(1) }}
          GiB free (recommended minimum: 20 GiB). Canasta images are ~2.3 GiB
          and database/migration operations need additional space. Move
          container storage to a larger volume, or free space, before this
          instance grows.
      when:
        - _docker_storage_avail.stdout | default('') | trim | length > 0
        - (_docker_storage_avail.stdout | trim | int) < 20 * 1024 * 1024
