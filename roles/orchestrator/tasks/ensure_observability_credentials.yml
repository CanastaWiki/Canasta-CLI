---
# Generate OpenSearch credentials if observability is enabled.
# Input: instance_path, _obs_enabling (optional; true when the flag is being
# enabled but not yet written to .env)

- name: Read .env for observability check
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _env_obs
  no_log: true  # registers the whole .env, including passwords

- name: Check if observability is enabled
  ansible.builtin.set_fact:
    _obs_enabled: >-
      {{ (_obs_enabling | default(false) | bool)
         or (_env_obs.variables.CANASTA_ENABLE_OBSERVABILITY | default('false', true) | lower == 'true') }}

- name: Generate observability credentials
  when: _obs_enabled | bool
  block:
    - name: Probe for Python bcrypt module
      ansible.builtin.command:
        cmd: python3 -c "import bcrypt"
      register: _bcrypt_probe
      changed_when: false
      failed_when: false

    - name: Refuse to proceed without bcrypt
      ansible.builtin.fail:
        msg: >-
          Observability requires the Python 'bcrypt' module on the
          instance's host ({{ ansible_host | default('localhost') }}),
          but 'python3 -c "import bcrypt"' failed there. Install it for
          that host's python3 (e.g. the python3-bcrypt package on Debian
          and Ubuntu) and retry. Probe stderr: {{ _bcrypt_probe.stderr | default('(empty)') }}
      when: _bcrypt_probe.rc != 0

    - name: Set OS_USER if empty
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: OS_USER
        value: admin
      when: _env_obs.variables.OS_USER | default('') == ''

    - name: Generate OS_PASSWORD if empty
      when: _env_obs.variables.OS_PASSWORD | default('') == ''
      block:
        - name: Generate password for OpenSearch
          ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/generate_password.yml"

        - name: Set OS_PASSWORD
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: set
            key: OS_PASSWORD
            value: "{{ _generated_password }}"

    - name: Generate OS_PASSWORD_HASH if empty
      when: _env_obs.variables.OS_PASSWORD_HASH | default('') == ''
      block:
        - name: Read current OS_PASSWORD
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: read
            key: OS_PASSWORD
          register: _os_pass
          no_log: true  # holds the OpenSearch password

        - name: Generate bcrypt hash
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import bcrypt,sys;
                print(bcrypt.hashpw(sys.stdin.buffer.read().strip(),
                bcrypt.gensalt()).decode())
            stdin: "{{ _os_pass.value }}"
            stdin_add_newline: false
          register: _bcrypt_result
          changed_when: false
          no_log: true

        - name: Set OS_PASSWORD_HASH
          canasta_env:
            path: "{{ instance_path }}/.env"
            state: set
            key: OS_PASSWORD_HASH
            value: "{{ _bcrypt_result.stdout | trim | replace('$', '$$') }}"
          no_log: true

- name: Check for gitops management
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _obs_gitops_host

# Compose interpolates $ in .env values; $$ is its literal dollar sign.
# Normalizing through the unescaped form leaves an already-escaped hash as is.
# A gitops host is skipped: the next pull would render the stored value from
# vars.yaml back over it and restart for a change that means nothing.
- name: Escape $ in an existing OS_PASSWORD_HASH
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: set
    key: OS_PASSWORD_HASH
    value: "{{ _env_obs.variables.OS_PASSWORD_HASH | replace('$$', '$') | replace('$', '$$') }}"
  when:
    - _env_obs.variables.OS_PASSWORD_HASH | default('') != ''
    - not _obs_gitops_host.stat.exists
  no_log: true
