---
# Store `config set --secret` values where this orchestrator reads them.
# Compose: .env (interpolated into service environments), plus the gitops
# vars on a gitops instance. Kubernetes: config/secrets.env, which feeds the
# per-instance app Secret (.env becomes a ConfigMap there).
# Input: instance_path, instance_orchestrator, _config_settings, web

- name: Store the secrets (Compose)
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/config/tasks/_set_secret_compose.yml
  when: instance_orchestrator | default('compose') == 'compose'

- name: Store the secrets (Kubernetes)
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/config/tasks/_set_secret_kubernetes.yml
  when: instance_orchestrator | default('compose') in ['kubernetes', 'k8s']
