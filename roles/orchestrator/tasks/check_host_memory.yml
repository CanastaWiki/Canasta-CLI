---
# Profile-aware host memory floor (Compose). Elasticsearch and the
# observability stack each raise the memory a Canasta instance needs, so the
# minimum depends on which are enabled:
#   neither    -> ~2 GiB
#   either one -> ~4 GiB
#   both       -> ~8 GiB
# Thresholds sit below the marketed size because a host reports less to the
# kernel after firmware/hypervisor reserves (a "4 GiB" host reports ~3700-3900
# MiB), so 1600/3500/7000 accept a real 2/4/8 GiB host respectively. The K8s
# per-node capacity check (k8s_preflight.yml) is separate — the host-memory
# numbers here do not transfer to per-node cluster capacity.
#
# Input: _mem_es_enabled (bool), _mem_obs_enabled (bool)

- name: Determine the required memory floor
  ansible.builtin.set_fact:
    _mem_floor_mib: >-
      {{ 7000 if ((_mem_es_enabled | bool) and (_mem_obs_enabled | bool))
         else (3500 if ((_mem_es_enabled | bool) or (_mem_obs_enabled | bool))
               else 1600) }}
    _mem_floor_label: >-
      {{ '8 GiB' if ((_mem_es_enabled | bool) and (_mem_obs_enabled | bool))
         else ('4 GiB' if ((_mem_es_enabled | bool) or (_mem_obs_enabled | bool))
               else '2 GiB') }}
    _mem_reason: >-
      {{ 'Elasticsearch and the observability stack are both enabled'
         if ((_mem_es_enabled | bool) and (_mem_obs_enabled | bool))
         else ('Elasticsearch is enabled' if (_mem_es_enabled | bool)
               else ('the observability stack is enabled'
                     if (_mem_obs_enabled | bool) else 'the base requirement')) }}

- name: Measure host total memory (MiB)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import os;
      print(os.sysconf('SC_PAGE_SIZE')
      * os.sysconf('SC_PHYS_PAGES') // (1024**2))"
  register: _mem_measure
  changed_when: false
  ignore_errors: true  # OK if the memory check is unavailable

- name: Fail if the host has less than the required memory
  ansible.builtin.fail:
    msg: >-
      This host reports {{ _mem_measure.stdout | trim }} MiB of total memory,
      but this configuration needs at least about {{ _mem_floor_label }}
      ({{ _mem_reason }}). Use a larger host, or disable that feature.
  when:
    - _mem_measure.stdout | default('') | trim | length > 0
    - (_mem_measure.stdout | trim | int) < (_mem_floor_mib | int)
