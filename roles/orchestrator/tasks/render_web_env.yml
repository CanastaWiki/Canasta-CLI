---
# Render config/secret-keys-web and config/env-keys-web to
# docker-compose.web-env.yml, and say which listed keys this host
# has no value for, since they are left out.
#
# Input: instance_path

- name: Render web environment keys to a compose override layer
  canasta_render_web_env:
    instance_path: "{{ instance_path }}"
  register: _web_env_render

- name: Report web environment keys this host has no value for
  ansible.builtin.debug:
    msg: >-
      Not passed to the web container because this host has no value for
      {{ _web_env_render.message }}.
  when: _web_env_render.missing | default([]) | length > 0
