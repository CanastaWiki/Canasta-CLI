---
# Remove the backup staging directory after a snapshot or a restore.
#
# Compose-only work. The K8s path's dump-databases init container uses
# an emptyDir that's torn down with the Job — nothing to clean up, so
# this is a no-op on Kubernetes.
#
# The dumps are written from the host, and a restore hands them to the
# instance directory's owner, so the host can remove them whether or not
# the web container is up. A directory the web container re-owned (its
# startup rsync re-owns config/) can be beyond the host user's reach, so
# that case falls back to removing it from inside the container. Whatever
# survives both is reported: the dumps are full database copies.
#
# Input: instance_path, instance_orchestrator

- name: Clean up backup staging directory (Compose)
  when: instance_orchestrator | default('compose') == 'compose'
  block:
    - name: Remove the backup staging directory on the host
      ansible.builtin.file:
        path: "{{ instance_path }}/config/backup"
        state: absent
      failed_when: false

    - name: Check whether the backup staging directory is gone
      ansible.builtin.stat:
        path: "{{ instance_path }}/config/backup"
        get_checksum: false
      register: _dump_cleanup_left

    - name: Remove the backup staging directory from the web container
      ansible.builtin.include_tasks:
        file: exec.yml
        apply:
          ignore_errors: true
      vars:
        exec_service: web
        exec_command: "rm -rf /mediawiki/config/backup"
      when: _dump_cleanup_left.stat.exists

    - name: Check the backup staging directory again
      ansible.builtin.stat:
        path: "{{ instance_path }}/config/backup"
        get_checksum: false
      register: _dump_cleanup_still_left
      when: _dump_cleanup_left.stat.exists

    - name: Warn that database dumps were left behind
      ansible.builtin.debug:
        msg: >-
          WARNING: could not remove {{ instance_path }}/config/backup, which
          holds full database dumps. Remove it by hand (on rootless Podman:
          'podman unshare rm -rf {{ instance_path }}/config/backup'; otherwise
          try sudo).
      when: _dump_cleanup_still_left.stat.exists | default(false)
