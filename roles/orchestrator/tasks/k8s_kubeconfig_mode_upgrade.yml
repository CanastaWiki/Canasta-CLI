---
# Restrict the k3s kubeconfig on a control plane whose k3s unit still
# writes it world-readable (0644). The unit is edited to 0640 plus the SSH
# user's primary group, and k3s is restarted so it rewrites the file.
# Running pods are unaffected by a k3s restart.

- name: Check for the k3s server unit
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: _kcm_unit

- name: Restrict the k3s kubeconfig
  when: _kcm_unit.stat.exists
  block:
    - name: Look up the SSH user's primary group
      ansible.builtin.command:
        cmd: id -gn
      register: _kcm_group
      changed_when: false

    - name: Make the k3s unit write the kubeconfig as 0640
      ansible.builtin.replace:
        path: /etc/systemd/system/k3s.service
        regexp: "(\\s'--write-kubeconfig-mode' \\\\\\n\\s*)'0644'( \\\\\\n)"
        replace: "\\g<1>'0640'\\g<2>\t'--write-kubeconfig-group' \\\\\n\t'{{ _kcm_group.stdout }}'\\g<2>"
      become: true
      register: _kcm_edit

    - name: Restart k3s to rewrite the kubeconfig
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      become: true
      when: _kcm_edit is changed

    - name: Wait for k3s after the restart
      ansible.builtin.command:
        cmd: k3s kubectl cluster-info
      register: _kcm_ready
      until: _kcm_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: _kcm_edit is changed

    - name: Report the kubeconfig restriction
      ansible.builtin.debug:
        msg: "Restricted /etc/rancher/k3s/k3s.yaml to mode 0640, group {{ _kcm_group.stdout }}."
      when: _kcm_edit is changed
