---
# Start containers for an instance.
# Dispatches to Compose or Kubernetes based on instance_orchestrator.
# Input: instance_path, instance_devmode (bool), instance_orchestrator

- name: Start (Docker Compose)
  when: instance_orchestrator | default('compose') == 'compose'
  block:
    - name: Sync compose profiles
      ansible.builtin.include_tasks: sync_compose_profiles.yml

    - name: Render sidecars to a compose override layer
      canasta_render_sidecars:
        instance_path: "{{ instance_path }}"
        orchestrator: compose

    - name: Check for docker-compose.sidecars.yml
      ansible.builtin.stat:
        path: "{{ instance_path }}/docker-compose.sidecars.yml"
      register: _sidecars_exists

    - name: Check for docker-compose.override.yml
      ansible.builtin.stat:
        path: "{{ instance_path }}/docker-compose.override.yml"
      register: _override_exists

    # Layer order: base, then generated sidecars, then the user override
    # (so a service-name clash lets the operator's raw override win), then
    # devmode last.
    - name: Build compose file arguments
      ansible.builtin.set_fact:
        _compose_files: >-
          {{ ['-f', 'docker-compose.yml'] +
             (_sidecars_exists.stat.exists | ternary(['-f', 'docker-compose.sidecars.yml'], [])) +
             (_override_exists.stat.exists | ternary(['-f', 'docker-compose.override.yml'], [])) +
             ((instance_devmode | default(false) | bool) | ternary(['-f', 'docker-compose.dev.yml'], [])) }}

    - name: Report starting containers
      ansible.builtin.debug:
        msg: "Starting containers..."

    # The compose command can be overridden for podman deployments.
    # When using rootless Podman instead of Docker, set
    # compose_command: "podman-compose" in the instance .env or via
    # extra-vars.  The -f flags are appended automatically by
    # _compose_files above, so duplicating them here would break.
    # compose_command and inspect_command are defined in
    # roles/orchestrator/defaults/main.yml (override for Podman).
    - name: Set compose and inspect commands
      ansible.builtin.set_fact:
        _compose_cmd: "{{ compose_command }}"
        _inspect_cmd: "{{ inspect_command }}"

    # podman-compose ignores COMPOSE_PROFILES from .env, so we must pass
    # --profile flags explicitly.  Docker Compose reads .env automatically,
    # so the flags are empty for Docker.
    - name: Read COMPOSE_PROFILES from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read_all
      register: _env_profiles_start
      no_log: true  # registers the whole .env, including passwords
      when: compose_command is search('podman')

    - name: Build compose profile flags
      ansible.builtin.set_fact:
        _compose_profile_flags: >-
          {{ (_env_profiles_start.variables.COMPOSE_PROFILES | default(''))
             | split(',') | map('trim') | reject('equalto', '')
             | map('regex_replace', '^', '--profile ')
             | join(' ') }}
      when: compose_command is search('podman')

    # Before anything starts: db exits immediately when MYSQL_PASSWORD is
    # absent from .env, and the message it prints names MariaDB variables
    # the operator never set.
    - name: Heal a missing database password
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/heal_mysql_password.yml"

    - name: Check if already running
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/check_running.yml"

    # A running web container does not mean the instance is converged: a
    # profile added since the last converge (a feature just enabled, or
    # COMPOSE_PROFILES repaired) names a service that is not running yet,
    # and `up -d` is the only step that would start it. Ask compose which
    # services the active profiles imply and compare with what is running,
    # so the cheap no-op is kept for an instance that really is converged.
    - name: List the services the active profiles imply
      ansible.builtin.command:
        cmd: "{{ _compose_cmd }} {{ _compose_files | join(' ') }} {{ _compose_profile_flags | default('') }} config --services"
        chdir: "{{ instance_path }}"
      register: _expected_services
      changed_when: false
      failed_when: false

    - name: List the services actually running
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/list_running_services.yml"

    # An unreadable service list (rc != 0) leaves this empty, which falls
    # back to the previous web-only behavior rather than forcing a converge.
    - name: Determine which expected services are missing
      ansible.builtin.set_fact:
        _missing_services: >-
          {{ ((_expected_services.stdout | default('')).split()
              if _expected_services.rc | default(1) == 0 else [])
             | difference((_running_services | default('')).split()) }}

    - name: Skip start when every expected service is running
      ansible.builtin.debug:
        msg: "Instance is already running."
      when:
        - _container_running | default(false) | bool
        - _missing_services | length == 0

    - name: Report the services being started
      ansible.builtin.debug:
        msg: "Starting {{ _missing_services | join(', ') }}..."
      when:
        - _container_running | default(false) | bool
        - _missing_services | length > 0

    - name: Start containers
      ansible.builtin.command:
        cmd: "{{ _compose_cmd }} {{ _compose_files | join(' ') }} {{ _compose_profile_flags | default('') }} up -d"
        chdir: "{{ instance_path }}"
      register: _start_result
      changed_when: true
      failed_when: false
      when: >-
        not (_container_running | default(false) | bool)
        or _missing_services | length > 0

    # The three failure guards below default rc: `Start containers` is skipped
    # on an already-running instance, and a skipped result is a dict with no
    # rc at all, so a bare `_start_result.rc` raises instead of evaluating.
    #
    # When docker compose up fails (typically an unhealthy container),
    # capture per-service logs and state before we bail out. The caller
    # usually rolls back (docker compose down) on failure, which wipes
    # the containers — so any post-hoc dump from the controller sees
    # nothing. Capturing here, before propagating the error, is the
    # only reliable way to see WHY a container was unhealthy.
    # Compose v2 derives the project name by lowercasing the instance
    # directory name and stripping characters outside [a-z0-9_-], then
    # prefixes the volume. Match that exactly or the volume is not found.
    - name: Resolve the database log volume name
      ansible.builtin.set_fact:
        _start_db_log_volume: >-
          {{ (instance_path | basename | lower
              | regex_replace('[^a-z0-9_-]', '')) }}_mysql-logs

    - name: Capture compose state on failure
      ansible.builtin.command:
        cmd: "{{ _compose_cmd }} {{ _compose_files | join(' ') }} {{ _compose_profile_flags | default('') }} ps -a"
        chdir: "{{ instance_path }}"
      register: _start_ps
      changed_when: false
      failed_when: false
      when: _start_result.rc | default(0) != 0

    - name: Capture compose logs on failure
      ansible.builtin.command:
        cmd: "{{ _compose_cmd }} {{ _compose_files | join(' ') }} {{ _compose_profile_flags | default('') }} logs --tail=200 --no-color"
        chdir: "{{ instance_path }}"
      register: _start_logs
      changed_when: false
      failed_when: false
      when: _start_result.rc | default(0) != 0

    # A container restarting every couple of seconds may hold nothing useful
    # in its stdout by the time the capture above runs, and an instance
    # started before the db service teed its error log has none there at all.
    # The volume-backed copy outlives both.
    - name: Capture the database error log on failure
      when: _start_result.rc | default(0) != 0
      block:
        # `run -v` auto-creates a missing named volume, so an external-database
        # instance would collect a stray empty one on every failed start.
        - name: Check whether the database log volume exists
          ansible.builtin.command:
            argv:
              - "{{ inspect_command | default('docker') }}"
              - volume
              - inspect
              - "{{ _start_db_log_volume }}"
          register: _start_db_log_vol
          changed_when: false
          failed_when: false

        - name: Read the database error log
          ansible.builtin.command:
            argv:
              - "{{ inspect_command | default('docker') }}"
              - run
              - --rm
              - -v
              - "{{ _start_db_log_volume }}:/l:ro"
              - docker.io/library/mariadb:11.4
              - tail
              - -n
              - "100"
              - /l/error.log
          register: _start_db_log
          changed_when: false
          failed_when: false
          when: _start_db_log_vol.rc == 0

    # Ansible's default callback swallows stderr/stdout for failed
    # command modules under the compact "[ERROR]: Task failed: ..."
    # rendering. Register with failed_when: false and fail explicitly
    # so the full output is visible in CI/operator logs.
    - name: Fail with full output if docker compose up failed
      ansible.builtin.fail:
        msg: |-
          docker compose up exited with rc={{ _start_result.rc }}
          --- STDOUT ---
          {{ _start_result.stdout | default('(empty)') }}
          --- STDERR ---
          {{ _start_result.stderr | default('(empty)') }}
          --- docker compose ps -a ---
          {{ _start_ps.stdout | default('(not captured)') }}
          --- docker compose logs (last 200) ---
          {{ _start_logs.stdout | default('(not captured)') }}
          --- database error log (last 100) ---
          {{ _start_db_log.stdout | default('(not captured)')
             if (_start_db_log.rc | default(1)) == 0
             else '(no error log; external database, or the volume is absent)' }}
      when: _start_result.rc | default(0) != 0

    # `up -d` exiting 0 is not evidence that every service started:
    # podman-compose reports success while a service it could not create —
    # an image reference it cannot resolve, say — is simply absent. The
    # checks below cover `web` alone, so any other service went missing
    # without a word and the command still reported success.
    #
    # Absence, not "not running", is the test: `observable-init` is a
    # one-shot (restart: "no") and has an exited container by design, so a
    # service that ran and exited is not a failure. A service with no
    # container was never created.
    - name: List the services that have a container
      ansible.builtin.command:
        argv:
          - "{{ _inspect_cmd }}"
          - ps
          - "-a"
          - --filter
          - "label=com.docker.compose.project={{ instance_path | basename | lower }}"
          - --format
          - '{% raw %}{{.Label "com.docker.compose.service"}}{% endraw %}'
        chdir: "{{ instance_path }}"
      register: _start_present_services
      changed_when: false
      failed_when: false

    # An unreadable expected-service list leaves this empty, matching the
    # pre-start comparison above: an unknown answer is not a failure.
    - name: Determine which expected services never started
      ansible.builtin.set_fact:
        _start_absent_services: >-
          {{ ((_expected_services.stdout | default('')).split()
              if _expected_services.rc | default(1) == 0 else [])
             | difference((_start_present_services.stdout | default('')).split()) }}

    - name: Fail when an expected service never started
      ansible.builtin.fail:
        msg: >-
          The containers started, but the active profiles select
          {{ _start_absent_services | join(', ') }}, which
          {{ 'has' if _start_absent_services | length == 1 else 'have' }}
          no container on the host for instance '{{ instance_id }}'.
          The instance is not fully up. The compose command reported
          success, so the reason is per-service — check the container
          logs on the host, and confirm the image reference for
          {{ _start_absent_services | join(', ') }} can be resolved
          there.
      when: _start_absent_services | length > 0

    # Wait for the web container to finish booting before returning.
    # /run-all.sh in the canasta image runs `composer update`
    # synchronously before starting apache; install.php and any other
    # `docker compose exec web php …` task that runs immediately after
    # `up -d` will race composer and crash with "vendor/composer/...
    # bootstrap.php: No such file or directory" if vendor is mid-write.
    # The CanastaBase HEALTHCHECK probes /server-status, which only
    # responds once both composer AND apache have finished — so
    # "healthy" is the right gate. Custom images that do not declare a
    # HEALTHCHECK skip the wait (we trust them to define their own
    # readiness contract).
    #
    # Runtimes disagree on what "no health data" looks like: Podman
    # 4.9.3 reports a non-nil .State.Health whose Status is empty, older
    # Podman omits .State.Health entirely, and Docker reports a real
    # status. So the probe renders the status itself rather than testing
    # the struct for presence — an empty render means "nothing to wait
    # on" on every runtime, with no version knowledge encoded.
    - name: Get web container id
      ansible.builtin.command:
        cmd: >-
          {{ _inspect_cmd }} ps
          --filter label=com.docker.compose.project={{ instance_path | basename | lower }}
          --filter label=com.docker.compose.service=web
          --format {% raw %}{{.ID}}{% endraw %}
        chdir: "{{ instance_path }}"
      register: _start_web_cid
      changed_when: false

    # `ps` without -a lists only running containers, so an empty result
    # means the stack is not up. `up -d` exiting 0 does not rule that out:
    # with rootless podman and no lingering, systemd kills the containers
    # the moment the ssh session ends. Without this check the health gate
    # below is merely skipped and the run reports success.
    - name: Fail when no web container is running after start
      ansible.builtin.fail:
        msg: >-
          Started the containers, but no running 'web' container is present
          for instance '{{ instance_id }}'. The instance is not up — check
          'canasta list' and the container logs on the host. On rootless
          Podman this is usually lingering: without
          'sudo loginctl enable-linger <user>', systemd stops the
          containers as soon as the session that started them ends.
      when: _start_web_cid.stdout | trim == ''

    - name: Probe whether web reports a health status
      ansible.builtin.command:
        argv:
          - "{{ _inspect_cmd }}"
          - inspect
          - "-f"
          - "{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{end}}{% endraw %}"
          - "{{ _start_web_cid.stdout | trim }}"
      register: _start_web_has_health
      changed_when: false
      when: _start_web_cid.stdout | trim != ''

    # Up to 60 retries × 10s = 10 min — comfortably above the
    # CanastaBase healthcheck's 5 min --start-period plus a slow
    # first-time composer install.
    #
    # failed_when: false so the fail below can name the last status;
    # exhausting the retries reports only the inspect invocation.
    - name: Wait for web container to report healthy
      ansible.builtin.command:
        argv:
          - "{{ _inspect_cmd }}"
          - inspect
          - "-f"
          - "{% raw %}{{.State.Health.Status}}{% endraw %}"
          - "{{ _start_web_cid.stdout | trim }}"
      register: _start_web_health
      changed_when: false
      failed_when: false
      retries: 60
      delay: 10
      until: _start_web_health.stdout | trim == 'healthy'
      when:
        - _start_web_cid.stdout | trim != ''
        - _start_web_has_health.stdout | default('') | trim != ''

    - name: Fail when web never reported healthy
      ansible.builtin.fail:
        msg: >-
          The 'web' container for instance '{{ instance_id }}' did not report
          healthy within 10 minutes; its last status was
          '{{ _start_web_health.stdout | default('') | trim | default('(none)', true) }}'.
          The image's healthcheck probes /server-status, which answers only
          once composer and apache have both finished — so this usually means
          composer is still running, or failed. Check the container logs.
      when:
        - _start_web_cid.stdout | trim != ''
        - _start_web_has_health.stdout | default('') | trim != ''
        - (_start_web_health.stdout | default('') | trim) != 'healthy'

    # Podman renders an empty status for the stock image, so the wait
    # above skips and the composer race comes back. Two reasons, both
    # outside our control: the published image is OCI-format and podman
    # ignores Healthcheck in an OCI config, and podman runs healthchecks
    # from systemd transient timers that compose never creates — the
    # static builds used in CI have no systemd at all.
    #
    # So ask the container the question the healthcheck would ask,
    # rather than asking the runtime for an answer it cannot produce.
    # This depends on nothing but `exec`.
    #
    # 127.0.0.1, not localhost: localhost resolves to ::1 first under
    # rootless podman, and CanastaBase before 1.3.19 served
    # /server-status only to 127.0.0.1.
    #
    # Best-effort on purpose. A custom image that never serves
    # /server-status must not turn a missing signal into a failed
    # create — the gate did not run on Podman at all before this, so
    # warning and continuing is never worse than the old behavior,
    # while a wait that cannot pass would be far worse. 30 × 10s
    # matches the image healthcheck's 5 min --start-period.
    - name: Wait for web to answer on Podman
      ansible.builtin.command:
        argv:
          - "{{ _inspect_cmd }}"
          - exec
          - "{{ _start_web_cid.stdout | trim }}"
          - wget
          - "-q"
          - "--method=HEAD"
          - "127.0.0.1/server-status"
      register: _start_web_podman_ready
      changed_when: false
      failed_when: false
      retries: 30
      delay: 10
      until: _start_web_podman_ready.rc == 0
      when:
        - _start_web_cid.stdout | trim != ''
        - (_start_web_has_health.stdout | default('') | trim) == ''
        - _inspect_cmd | default('docker') is search('podman')

    - name: Report that web never answered on Podman
      ansible.builtin.debug:
        msg: >-
          web did not answer /server-status within 5 minutes, so the
          readiness gate is being skipped. A custom image that does not
          serve /server-status is expected here. On the stock image this
          means web is still starting, and the MediaWiki installer may
          race composer — check the container logs if create then fails
          on a missing vendor/ file.
      when: (_start_web_podman_ready.rc | default(0)) != 0

    # Register CAPI + auto-enroll the bouncer when CrowdSec is on. Shared
    # with the K8s start path and create. crowdsec_autoenroll is false only
    # for create's first start, which defers enrollment until after the
    # instance is registered (the crowdsec preflight resolves it).
    - name: Auto-enroll CrowdSec (register CAPI + enroll bouncer) when enabled
      ansible.builtin.include_tasks: crowdsec_autoenroll.yml
      when: crowdsec_autoenroll | default(true) | bool

- name: Start (Kubernetes)
  when: instance_orchestrator | default('compose') in ['kubernetes', 'k8s']
  block:
    - name: Set K8s namespace
      ansible.builtin.set_fact:
        _k8s_namespace: "canasta-{{ instance_id }}"

    # Reconcile caddy image + crowdsec.enabled from .env before reading
    # values.yaml, so the deployed manifests match the feature flags no
    # matter how they were set (config set, create -e, or a hand edit).
    - name: Reconcile caddy image and crowdsec.enabled in values.yaml
      ansible.builtin.include_tasks: k8s_reconcile_caddy.yml

    # Slurp values.yaml from the target host once and parse it. All
    # three downstream reads (web.replicaCount, db.enabled,
    # argocd.syncPolicy) used to call lookup('file', instance_path ~
    # '/values.yaml'), which runs on the controller — broken when
    # controller and target are different hosts (#514). Same fix shape
    # PR #115 used for init_kubernetes.yml and push_kubernetes.yml.
    - name: Read values.yaml from target
      ansible.builtin.slurp:
        src: "{{ instance_path }}/values.yaml"
      register: _start_values_raw

    - name: Parse values.yaml
      ansible.builtin.set_fact:
        _start_values: "{{ _start_values_raw.content | b64decode | from_yaml }}"

    - name: Sync config to ConfigMaps
      ansible.builtin.include_tasks: k8s_sync_config.yml

    - name: Sync user extensions/skins into their PVCs
      ansible.builtin.include_tasks: k8s_sync_user_dirs.yml

    - name: Render sidecars to Helm values
      canasta_render_sidecars:
        instance_path: "{{ instance_path }}"
        orchestrator: kubernetes

    - name: Build + push locally-built sidecar images
      ansible.builtin.include_tasks: k8s_build_sidecars.yml

    - name: Check if instance is scaled to zero
      ansible.builtin.command:
        cmd: >-
          kubectl get deployment canasta-{{ instance_id }}-web
          -n {{ _k8s_namespace }}
          -o jsonpath={.spec.replicas}
      register: _current_replicas
      changed_when: false
      ignore_errors: true  # OK if deployment doesn't exist yet

    - name: Report applying Helm release
      ansible.builtin.debug:
        msg: "Applying Helm release (pulling images and rolling out pods; this may take a few minutes)..."

    - name: Apply values and upgrade Helm release
      ansible.builtin.include_tasks: helm_deploy.yml

    - name: Restore replica counts after stop
      when: (_current_replicas.stdout | default('0')) == '0'
      block:
        - name: Read web replica count from values
          ansible.builtin.set_fact:
            _web_replicas: "{{ _start_values.get('web', {}).get('replicaCount', 1) }}"

        # External-DB instances with Elasticsearch disabled have no
        # StatefulSets; 'kubectl scale --all' errors with "no objects
        # passed to scale". Check first and skip if none exist.
        - name: Check for statefulsets before scaling
          ansible.builtin.command:
            cmd: "kubectl get statefulset -n {{ _k8s_namespace }} -o name"
          register: _start_sts_list
          changed_when: false

        - name: Scale up statefulsets
          ansible.builtin.command:
            cmd: >-
              kubectl scale statefulset --all --replicas=1
              -n {{ _k8s_namespace }}
          changed_when: true
          when: _start_sts_list.stdout_lines | length > 0

        # Scale every deployment back up — core components AND any app
        # sidecars. Helm won't restore them on its own: its 3-way merge
        # leaves the kubectl scale-to-0 in place when the manifest's
        # replicas didn't change. Using --all (rather than a fixed list)
        # is what makes a Helm-managed sidecar survive a stop/restart.
        - name: Scale up all deployments
          ansible.builtin.command:
            cmd: >-
              kubectl scale deployment --all --replicas=1
              -n {{ _k8s_namespace }}
          changed_when: true

        # Restore the web count afterward (it may be > 1); --all set it to 1.
        - name: Restore web replica count
          ansible.builtin.command:
            cmd: >-
              kubectl scale deployment canasta-{{ instance_id }}-web
              --replicas={{ _web_replicas }}
              -n {{ _k8s_namespace }}
          changed_when: true
          when: _web_replicas | int != 1

    # Skip the DB readiness wait when the instance uses an external
    # database (db.enabled: false). In that case there's no bundled
    # -db StatefulSet and the rollout-status call errors with NotFound.
    - name: Read db.enabled from values.yaml
      ansible.builtin.set_fact:
        _db_enabled: "{{ _start_values.get('db', {}).get('enabled', true) }}"

    - name: Report waiting for rollout
      ansible.builtin.debug:
        msg: "Waiting for pods to become ready..."

    - name: Wait for DB readiness
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status statefulset/canasta-{{ instance_id }}-db
          -n {{ _k8s_namespace }} --timeout=300s
      changed_when: false
      when: _db_enabled | bool

    - name: Wait for web readiness
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status deployment/canasta-{{ instance_id }}-web
          -n {{ _k8s_namespace }} --timeout=300s
      changed_when: false

    # Register CAPI + auto-enroll the bouncer when CrowdSec is on but no
    # key is stored yet. Shared with the Compose start path and create.
    - name: Auto-enroll CrowdSec (register CAPI + enroll bouncer) when enabled
      ansible.builtin.include_tasks: crowdsec_autoenroll.yml
      when: crowdsec_autoenroll | default(true) | bool

    # Re-enable Argo CD auto-sync after start. The stop flow suspends
    # sync to prevent selfHeal from reverting the scale-to-zero. We
    # read the sync policy from the instance's values.yaml so we
    # restore whatever the user configured, not a hardcoded default.
    - name: Check if Argo CD Application exists for this instance
      ansible.builtin.command:
        cmd: >-
          kubectl get application canasta-{{ instance_id }}
          -n {{ argocd_namespace | default('argocd') }}
          -o jsonpath={.metadata.name}
      register: _start_argocd_app
      changed_when: false
      ignore_errors: true  # OK if no Argo CD app exists

    - name: Re-enable Argo CD auto-sync
      when: _start_argocd_app.rc == 0
      block:
        - name: Read sync policy from values.yaml
          ansible.builtin.set_fact:
            _argocd_sync_policy: "{{ _start_values.get('argocd', {}).get('syncPolicy', {}) }}"

        - name: Build sync policy patch
          ansible.builtin.set_fact:
            _sync_patch:
              spec:
                syncPolicy:
                  automated:
                    selfHeal: "{{ _argocd_sync_policy.get('selfHeal', true) }}"
                    prune: "{{ _argocd_sync_policy.get('prune', true) }}"
                  syncOptions:
                    - CreateNamespace=true

        - name: Patch Application to restore auto-sync
          ansible.builtin.command:
            cmd: >-
              kubectl patch application canasta-{{ instance_id }}
              -n {{ argocd_namespace | default('argocd') }}
              --type merge -p '{{ _sync_patch | to_json }}'
          changed_when: true
