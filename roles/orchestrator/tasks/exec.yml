---
# Execute a command inside a container/pod.
# Uses set_fact to build the command, then a single unconditional
# register to avoid register-on-skip variable clobbering.
#
# Input:
#   instance_path (str)
#   instance_orchestrator (str) - compose or kubernetes
#   exec_service (str) - service name (default: web)
#   exec_command (str) - command to run
#   exec_stdin (str, optional) - path to a file (on the controller) whose
#     contents are fed to the command's stdin. Read as UTF-8 text. Ignored
#     on the long/detached path. Compose pipes via `exec -T`; K8s adds `-i`.
#   exec_no_log (bool, optional) - suppress command in output
#   exec_long (bool, optional) - run detached + polled for long commands
#     (update.php on a big wiki, a large mysqldump) so a controller-side
#     SSH reset doesn't abort them. Default false (held single connection).
#   exec_long_async (int, optional) - max seconds for a long exec (3600)
#   exec_long_timeout_msg (str, optional) - on a long exec still running
#     when the wait ends, warn with this text and continue instead of failing
#   exec_user (str, optional) - container user to run as. kubectl exec
#     cannot switch users, so on K8s the pod command runs under
#     `runuser -u`, which the image's container user must be root to use.
#     Default: the image's user (root in the web container).
#   exec_dotenv (dict, optional) - variables to pass into the command on
#     Compose, each read from the .env key it maps to when the command runs
#     (canasta_dotenv_exec), so the value is never on a command line. Ignored
#     on K8s.
#   exec_lock (str, optional) - lock file on the target host; the command
#     runs under `flock -n` on it, and exits 75 without running when another
#     holder has it. Ignored on the long/detached path.
#   exec_allow_failure (bool, optional) - a non-zero exit does not fail the
#     task; the caller reads exec_result.rc. Ignored on the long path.
# Output:
#   exec_result (registered result with .stdout, .rc, etc.)

# Run under bash when the image has it (Canasta's own containers do, and some
# callers rely on bash-isms), else fall back to sh. App sidecars are arbitrary
# images — many slim ones (alpine, *-slim) ship only sh — so a hard /bin/bash
# would fail there. Detecting per-exec keeps `maintenance exec --service
# <sidecar>` working regardless of the sidecar's base image. The command is
# passed as $0 to the inner shell.
- name: Define the in-container shell (bash if present, else sh)
  ansible.builtin.set_fact:
    _exec_shell: >-
      /bin/sh -c 'if command -v bash >/dev/null 2>&1; then exec bash -c "$0"; else exec sh -c "$0"; fi'

# podman-compose ignores COMPOSE_PROFILES from .env, so we must pass
# --profile flags explicitly for `exec`.
- name: Read COMPOSE_PROFILES from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _env_profiles_exec
  no_log: true  # registers the whole .env, including passwords
  when:
    - compose_command is search('podman')
    - not (instance_is_k8s | bool)

- name: Build compose profile flags
  ansible.builtin.set_fact:
    _exec_profile_flags: >-
      {{ (_env_profiles_exec.variables.COMPOSE_PROFILES | default(''))
         | split(',') | map('trim') | reject('equalto', '')
         | map('regex_replace', '^', '--profile ')
         | join(' ') }}
  when:
    - compose_command is search('podman')
    - not (instance_is_k8s | bool)

- name: Build exec command (Compose)
  ansible.builtin.set_fact:
    _exec_full_cmd: >-
      {{ exec_dotenv | default({}, true) | canasta_dotenv_exec }}
      {{ compose_command }} {{ _exec_profile_flags | default('') }} exec -T
      {{ ('--user ' ~ (exec_user | quote)) if (exec_user | default('')) | length > 0 else '' }}
      {{ exec_dotenv | default({}, true) | list | map('regex_replace', '^', '-e ') | join(' ') }}
      {{ exec_service | default('web') }}
      {{ _exec_shell }} {{ exec_command | quote }}
    _exec_chdir: "{{ instance_path }}"
  when: not (instance_is_k8s | bool)
  no_log: "{{ exec_no_log | default(false) }}"

- name: Hold a lock for the exec
  ansible.builtin.set_fact:
    _exec_full_cmd: >-
      flock -n -E 75 {{ exec_lock | quote }} /bin/sh -c {{ _exec_full_cmd | quote }}
  when: (exec_lock | default('')) | length > 0
  no_log: "{{ exec_no_log | default(false) }}"

- name: >-
    Execute:
    {{ (exec_no_log | default(false) | bool)
       | ternary('[redacted]',
         exec_command | truncate(80)) }}
  ansible.builtin.shell:
    cmd: "{{ _exec_full_cmd }}"
    chdir: "{{ _exec_chdir | default(omit) }}"
    # Read on the controller (lookup runs there), so the content travels
    # with the task and reaches the command regardless of delegation.
    # Gated on the current call's exec_stdin, not a persisted fact.
    stdin: >-
      {{ lookup('file', exec_stdin)
         if (exec_stdin | default('')) | length > 0
         else omit }}
  register: exec_result
  changed_when: false
  failed_when:
    - exec_result.rc != 0
    - not (exec_allow_failure | default(false) | bool)
  no_log: "{{ exec_no_log | default(false) }}"
  when: not (exec_long | default(false) | bool)

# Long commands (update.php on a big wiki, a large mysqldump) run detached
# and polled so a controller-side SSH reset doesn't abort work still
# progressing on the target. The result is mapped back to exec_result so
# callers consume it the same way.
- name: >-
    Execute (long, detached + polled):
    {{ (exec_no_log | default(false) | bool)
       | ternary('[redacted]', exec_command | truncate(60)) }}
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/resilient_exec.yml"
  vars:
    rx_name: >-
      {{ (exec_no_log | default(false) | bool)
         | ternary('[redacted]', exec_command | truncate(60)) }}
    rx_cmd: "{{ _exec_full_cmd }}"
    rx_chdir: "{{ _exec_chdir | default(omit) }}"
    rx_async: "{{ exec_long_async | default(3600) }}"
    # Poll for as long as the command may run (one poll every 10 seconds).
    rx_retries: "{{ ((exec_long_async | default(3600) | int) / 10) | int }}"
    rx_no_log: "{{ exec_no_log | default(false) }}"
    rx_timeout_msg: "{{ exec_long_timeout_msg | default('') }}"
  when: exec_long | default(false) | bool

- name: Map long-exec result to exec_result
  ansible.builtin.set_fact:
    exec_result: "{{ rx_result }}"
  when: exec_long | default(false) | bool
  no_log: "{{ exec_no_log | default(false) }}"
