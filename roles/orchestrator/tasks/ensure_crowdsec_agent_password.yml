---
# Generate, once, the password the CrowdSec agent in the caddy pod logs in to
# the local API with, when CrowdSec is enabled on Kubernetes. It is kept in
# .env, so a backup or a gitops push carries it, and reaches both pods
# through the canasta-<id>-crowdsec Secret (k8s_sync_config.yml).
# Input: instance_path

- name: Read CrowdSec enablement and the agent password
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _agent_pw_env
  no_log: true  # registers the whole .env, including passwords

- name: Generate the CrowdSec agent password
  when:
    - _agent_pw_env.variables.CANASTA_ENABLE_CROWDSEC | default('false', true) | lower == 'true'
    - _agent_pw_env.variables.CROWDSEC_AGENT_PASSWORD | default('') | length == 0
  block:
    - name: Generate a password
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/generate_password.yml"

    - name: Store CROWDSEC_AGENT_PASSWORD
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: CROWDSEC_AGENT_PASSWORD
        value: "{{ _generated_password }}"
      no_log: true
