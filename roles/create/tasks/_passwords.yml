---
# Resolve the three create-time passwords:
#   - root DB password (always)
#   - wiki DB password (mirrors root if the wiki account is root, else
#     distinct)
#   - admin password (always)
#
# The external-DB path overrides _rootdbpass and _wikidbpass after
# this in _envfile.yml — the values produced here are placeholders
# in that case.

- name: Resolve root DB password
  ansible.builtin.include_tasks: _resolve_password.yml
  vars:
    _rp_input: "{{ rootdbpass | default('') }}"
    _rp_report_msg: "Generated root database password (will be saved to .env)"

- name: Capture root DB password
  ansible.builtin.set_fact:
    _rootdbpass: "{{ _resolved_password }}"

# MediaWiki connects with its own account, `mediawiki` unless
# --wikidbuser says otherwise. Kubernetes keeps root until its chart can
# pass a separate account to web.
- name: Choose MediaWiki's database account
  ansible.builtin.set_fact:
    _wiki_db_user: >-
      {{ wikidbuser if (wikidbuser | default('') | length > 0)
         else ('mediawiki' if (orchestrator | default('compose')) == 'compose'
               else 'root') }}

# The wiki password follows the root password while MediaWiki uses root;
# its own account gets its own password.
- name: Mirror wiki DB password from root when the wiki account is root
  ansible.builtin.set_fact:
    _wikidbpass: "{{ _rootdbpass }}"
  when: _wiki_db_user == 'root'

- name: Resolve distinct wiki DB password (non-root wikidbuser)
  ansible.builtin.include_tasks: _resolve_password.yml
  vars:
    _rp_input: "{{ wikidbpass | default('') }}"
  when: _wiki_db_user != 'root'

- name: Capture distinct wiki DB password
  ansible.builtin.set_fact:
    _wikidbpass: "{{ _resolved_password }}"
  when: _wiki_db_user != 'root'

- name: Resolve admin password
  ansible.builtin.include_tasks: _resolve_password.yml
  vars:
    _rp_input: "{{ password | default('') }}"
    _rp_report_msg: "Generated admin password."

- name: Capture admin password
  ansible.builtin.set_fact:
    _admin_password: "{{ _resolved_password }}"
