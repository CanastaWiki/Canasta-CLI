---
# Kubernetes-specific instance setup. Runs only on K8s targets,
# AFTER orchestrator init_config has scaffolded the instance
# directory but BEFORE Helm deploy. Handles:
#   - cert-manager + ClusterIssuer (skipped for localhost / --skip-tls)
#   - default storage class resolution from the controller registry
#   - external-DB facts for the values.yaml template
#   - rendered values.yaml
#   - K8s Secrets (DB creds + MW_SECRET_KEY)
#   - image push to in-cluster registry (when --build-from)
#
# All tasks here are guarded at the include site (orchestrator is
# kubernetes/k8s), so no per-task `when:` is needed.

- name: Install cert-manager and Let's Encrypt issuer
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: k8s_certmanager.yml
  when:
    - domain_name | default('localhost') != 'localhost'
    - not (skip_tls | default(false) | bool)

- name: Read default storage class from registry
  canasta_registry:
    state: get_setting
    setting_key: defaultStorageClass
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _default_sc
  when: storage_class is not defined or storage_class == ''

# The default is recorded on the controller, which may manage several
# clusters; it applies only on the cluster that has the class.
- name: Check that the default storage class exists on this cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - storageclass
      - "{{ _default_sc.value }}"
      - -o
      - name
  register: _default_sc_here
  changed_when: false
  failed_when: false
  when:
    - storage_class is not defined or storage_class == ''
    - _default_sc.value | default('', true) | length > 0

- name: Note a default storage class missing from this cluster
  ansible.builtin.debug:
    msg: >-
      The default storage class '{{ _default_sc.value }}' is not on this
      cluster ({{ (_default_sc_here.stderr | default('') | trim) or 'not found' }});
      using the cluster's own default. Pass --storage-class to choose one.
  when:
    - _default_sc_here.rc is defined
    - _default_sc_here.rc != 0

- name: Apply default storage class
  ansible.builtin.set_fact:
    storage_class: "{{ _default_sc.value }}"
    _storage_class_is_default: true
  when:
    - storage_class is not defined or storage_class == ''
    - _default_sc.value | default('', true) | length > 0
    - (_default_sc_here.rc | default(1)) == 0

# The default access mode belongs to the default storage class, so it applies
# only when that class does: an explicit --storage-class (local-path, say) may
# not support it.
- name: Read default access mode from registry
  canasta_registry:
    state: get_setting
    setting_key: defaultAccessMode
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _default_access_mode
  when:
    - _storage_class_is_default | default(false) | bool
    - access_mode is not defined or access_mode == ''

- name: Apply default access mode
  ansible.builtin.set_fact:
    access_mode: "{{ _default_access_mode.value }}"
  when:
    - _storage_class_is_default | default(false) | bool
    - access_mode is not defined or access_mode == ''
    - _default_access_mode.value | default('', true) | length > 0

# Read external-DB configuration from .env so the values.yaml
# template can switch db.enabled and populate externalDatabase.
# When USE_EXTERNAL_DB=true, the user's envfile has supplied
# MYSQL_HOST/PORT/USER/SSL; we surface those as Ansible vars.
- name: Read external DB config from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _k8s_env_for_values
  no_log: true  # registers the whole .env, including passwords

- name: Set external DB facts for values.yaml template
  ansible.builtin.set_fact:
    _use_external_db: >-
      {{ (_k8s_env_for_values.variables.USE_EXTERNAL_DB | default('false') | lower) == 'true' }}
    _external_db_host: "{{ _k8s_env_for_values.variables.MYSQL_HOST | default('') }}"
    _external_db_port: "{{ _k8s_env_for_values.variables.MYSQL_PORT | default('3306') }}"
    _external_db_user: "{{ _k8s_env_for_values.variables.MYSQL_USER | default('root') }}"
    _external_db_ssl: "{{ _k8s_env_for_values.variables.MYSQL_SSL | default('false') }}"
    _staging_certs: >-
      {{ (_k8s_env_for_values.variables.CANASTA_STAGING_CERTS | default('false') | lower) == 'true' }}

- name: Generate instance values.yaml
  ansible.builtin.template:
    src: "{{ canasta_root }}/roles/orchestrator/templates/k8s_values.yaml.j2"
    dest: "{{ instance_path }}/values.yaml"
    mode: "0644"

# While MediaWiki uses root it reads MYSQL_PASSWORD, so the Secret's
# WIKI_DB_PASSWORD is unused until an upgrade moves MediaWiki to its own
# account, which keeps the key's value. Root's own password must not be it.
- name: Generate a password for MediaWiki's own account
  ansible.builtin.include_tasks: _resolve_password.yml
  vars:
    _rp_input: "{{ '' if _wiki_db_user == 'root' else _wikidbpass }}"

- name: Choose the Secret's password for MediaWiki's own account
  ansible.builtin.set_fact:
    _k8s_wikidbpass: "{{ _resolved_password }}"
  no_log: true

# The pods must get the key .env holds, which keeps one supplied with -e.
- name: Apply K8s secrets
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: k8s_apply_secrets.yml
  vars:
    _k8s_namespace: "canasta-{{ id }}"
    _wikidbpass: "{{ _k8s_wikidbpass }}"
    _mw_secret_key: >-
      {{ _k8s_env_for_values.variables.MW_SECRET_KEY
         if (_k8s_env_for_values.variables.MW_SECRET_KEY | default('') | trim | length > 0)
         else lookup('password', '/dev/null length=64 chars=hexdigits') }}

# Push to the registry's loopback hostPort on this (control-plane) node:
# localhost is auto-insecure for docker (no daemon.json) and not exposed. The
# registry stores by repo path, so pods pull the same image via the registry's
# ClusterIP ({{ registry }}) — see the image ref in k8s_values.yaml.j2.
- name: Push image to registry (if built from source)
  when: build_from is defined and build_from != ''
  block:
    # Guarantee the registry exists even on a cluster that predates it and
    # hasn't been upgraded yet (idempotent, no restart) — so --build-from never
    # dead-ends on a missing registry.
    - name: Ensure the in-cluster image registry
      ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/k8s_ensure_registry.yml"

    - name: Tag and push image to registry
      ansible.builtin.command:
        cmd: "{{ inspect_command | default('docker') }} tag {{ _base_image }} localhost:5000/{{ _base_image }}"
      changed_when: true

    - name: Push image
      ansible.builtin.command:
        cmd: "{{ inspect_command | default('docker') }} push localhost:5000/{{ _base_image }}"
      changed_when: true
