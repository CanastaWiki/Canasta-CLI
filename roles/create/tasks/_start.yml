---
# Start containers for the new instance. Compose runs `docker
# compose up`; K8s syncs ConfigMaps, deploys the Helm release
# without --wait, then blocks on `kubectl rollout status`.
#
# This is the first start (no dev mode); Compose path is restarted
# later with the full config (Step 14 in main.yml). K8s does not
# need the restart because pods come up with the right config from
# the start.

- name: Report pulling Docker images
  ansible.builtin.debug:
    msg: "Pulling Docker images (this may take a while)"

- name: Report starting
  ansible.builtin.debug:
    msg: "Creating Canasta instance '{{ id }}'..."

- name: Start containers (Compose)
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: start.yml
  vars:
    # Defer CrowdSec enrollment to after registration (main.yml): the
    # crowdsec preflight resolves the instance from the registry, which
    # this create has not written yet. The step-14 restart re-runs start
    # too, but enrollment is idempotent (skips once the key is stored).
    crowdsec_autoenroll: false
  when: (orchestrator | default('compose')) == 'compose'

- name: Start containers (Kubernetes)
  when: (orchestrator | default('compose')) in ['kubernetes', 'k8s']
  block:
    # Reconcile caddy image + crowdsec.enabled from .env before deploy, so
    # a create-time `-e CANASTA_ENABLE_CROWDSEC=true` brings up the engine
    # sidecar on the plugin image (the rendered values.yaml has neither).
    - name: Reconcile caddy image and crowdsec.enabled in values.yaml
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: k8s_reconcile_caddy.yml

    - name: Sync config to Kubernetes ConfigMaps
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: k8s_sync_config.yml

    - name: Install Helm release (no wait)
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: helm_deploy.yml
      vars:
        helm_wait: false
        _k8s_namespace: "canasta-{{ id }}"

    # helm_deploy runs without --wait here, so this is the step that
    # blocks and the step that fails. On failure it reports only
    # "exceeded its progress deadline"; the reason (a pod that cannot
    # schedule, a PVC no provisioner will claim) is in the cluster, and
    # create's rollback deletes the namespace moments later. Report it
    # before that happens.
    - name: Wait for web deployment readiness
      block:
        - name: Wait for the web deployment to become ready
          ansible.builtin.command:
            cmd: >-
              kubectl rollout status deployment/canasta-{{ id }}-web
              -n canasta-{{ id }} --timeout=600s
          changed_when: false
      rescue:
        - name: Report why the rollout did not finish
          ansible.builtin.include_role:
            name: orchestrator
            tasks_from: k8s_capture_rollout_failure.yml
          vars:
            _k8s_namespace: "canasta-{{ id }}"
            instance_id: "{{ id }}"

        - name: Fail with the original rollout error
          ansible.builtin.fail:
            msg: >-
              The web deployment for '{{ id }}' did not become ready. The
              cluster state reported above explains why.
              {{ ansible_failed_result.msg | default('') }}

    # CrowdSec bouncer enrollment happens after registration (main.yml),
    # because the crowdsec role's preflight resolves the instance from the
    # registry — which this create has not written yet.
