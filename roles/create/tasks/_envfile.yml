---
# Custom env file merge + external-DB password override + port
# detection. Runs BEFORE wikis.yaml is generated because the
# resolved port (from TLS_MODE / HTTP[S]_PORT) determines
# the domain string written into wikis.yaml.
#
# The external-DB block here also overrides _rootdbpass and
# _wikidbpass with the user-supplied MYSQL_PASSWORD from the env
# file, since the values generated in _passwords.yml would not
# match an external DB.

- name: Merge custom env file if provided
  when: envfile is defined and envfile != ''
  block:
    # envfile is a controller-side path (path_kind: local), so read it on
    # the controller. Without delegation the slurp runs on the target host
    # and looks for the controller's path on the remote filesystem.
    - name: Read custom env file
      ansible.builtin.slurp:
        src: "{{ envfile }}"
      delegate_to: canasta_controller
      vars:
        ansible_connection: local
      register: _custom_env

    - name: Parse and apply custom env variables
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: "{{ item.split('=', 1)[0] }}"
        value: "{{ item.split('=', 1)[1] | canasta_env_unquote }}"
      loop: "{{ (_custom_env.content | b64decode).split('\n') | select('match', '^[A-Z].*=') | list }}"
      loop_control:
        label: "{{ item.split('=', 1)[0] }}"

# For external DB, a non-empty MYSQL_PASSWORD from the user's -e file
# wins over --rootdbpass and the generated one. The template ships the
# key empty, so an empty value means the -e file did not set it.
- name: Check if using external DB
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: USE_EXTERNAL_DB
  register: _ext_db_early_check

- name: Use external DB password from env file
  when: _ext_db_early_check.found and _ext_db_early_check.value | lower == 'true'
  block:
    - name: Read MYSQL_USER from env file
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: MYSQL_USER
      register: _ext_db_user

    - name: Read MYSQL_PASSWORD from env file
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read
        key: MYSQL_PASSWORD
      register: _ext_db_password
      no_log: true  # holds the external database's password

    - name: Override root DB password with external DB password
      ansible.builtin.set_fact:
        _rootdbpass: "{{ _ext_db_password.value | default(_rootdbpass, true) }}"
      no_log: true

    # On Compose MediaWiki gets an account of its own on the external
    # server (--wikidbuser, or one named for the instance, since the server
    # can serve other instances), created at start; --wikidbuser root keeps
    # it on the administrator account. On Kubernetes the chart gives the web
    # pod the administrator account.
    - name: Choose MediaWiki's account on the external database
      ansible.builtin.set_fact:
        _wiki_db_user: >-
          {{ (_ext_db_user.value | default('root', true))
             if instance_is_k8s | bool or wikidbuser | default('') == 'root'
             else wikidbuser if wikidbuser | default('') | length > 0
             else id | canasta_wiki_db_user(true) }}

    - name: Give MediaWiki the administrator's password while it uses that account
      ansible.builtin.set_fact:
        _wikidbpass: "{{ _rootdbpass }}"
      when: _wiki_db_user == (_ext_db_user.value | default('root', true))
      no_log: true

# An env file may still use the TLS keys' old names.
- name: Rename the TLS keys the env file carried
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/rename_tls_keys.yml"

- name: Read HTTPS_PORT and TLS_MODE from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _env_for_port
  no_log: true  # registers the whole .env, including passwords

# --skip-tls is folded in here, not read from TLS_MODE alone:
# _settings_files.yml writes TLS_MODE=off for the flag, but that
# runs *after* this file and after _env_update.yml has already derived
# MW_SITE_SERVER from _http_only. Reading .env only would leave the flag
# invisible at the point the scheme is chosen, so a --skip-tls instance
# got an https:// MW_SITE_SERVER while Caddy served plain HTTP.
#
# The edge serves each instance on its own HTTP_PORT and HTTPS_PORT.
- name: Determine which port (if any) to append to the domain
  ansible.builtin.set_fact:
    _http_only: >-
      {{ (_env_for_port.variables.TLS_MODE | default('', true) | trim | lower == 'off')
         or (skip_tls | default(false) | bool) }}
    _https_port: "{{ _env_for_port.variables.HTTPS_PORT | default('443') }}"
    _http_port: "{{ _env_for_port.variables.HTTP_PORT | default('80') }}"

- name: Build domain with port
  # When TLS_MODE=off, append HTTP_PORT (if non-standard).
  # Otherwise, append HTTPS_PORT (if non-standard).
  ansible.builtin.set_fact:
    _domain_with_port: >-
      {{ domain_name | default('localhost') }}{{
        _http_only
        | ternary(
            (_http_port not in ['80', '']) | ternary(':' ~ _http_port, ''),
            (_https_port not in ['443', '']) | ternary(':' ~ _https_port, '')
          ) }}
