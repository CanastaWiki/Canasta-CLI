---
# After containers are up, wait for the database to accept
# connections and then either:
#   - import an existing dump (--database <file>): replays the SQL
#     dump; or
#   - run the MediaWiki installer (no dump): creates schema,
#     installs core, and writes LocalSettings.php for each wiki; or
#   - skip both (--skip-install): connect to an external database that
#     already holds a MediaWiki schema, without touching it.
#
# The import and installer paths are mutually exclusive on
# `database is defined`; --skip-install suppresses the installer.

- name: Report waiting for database
  ansible.builtin.debug:
    msg: "Waiting for database to be ready"

- name: Wait for database
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: wait_for_db.yml

- name: Import existing database
  when: database is defined and database != ''
  block:
    - name: Report importing database
      ansible.builtin.debug:
        msg: "Importing database..."

    - name: Import database dump
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: import_database.yml
      vars:
        import_wiki_id: "{{ wiki }}"
        import_database_path: "{{ database }}"

    - name: Read the instance's databases
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _create_wikis

    # A wikis.yaml given with -f that lacks the wiki has nowhere to declare
    # them.
    - name: Import the extra databases beside the dump
      when: wiki in _create_wikis.wiki_ids
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: import_extra_databases.yml
      vars:
        extra_dbs_wiki: "{{ wiki }}"
        extra_dbs_dump: "{{ database }}"
        extra_dbs_discover: true
        extra_dbs_groups: "{{ _create_wikis.db_groups }}"

    # On Compose, the start that follows gives MediaWiki's database account
    # access to the databases wikis.yaml declares.
    - name: Declare the imported extra databases for the wiki
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: add_database
        wiki_id: "{{ wiki }}"
        database: "{{ item }}"
      loop: >-
        {{ _import_extra_dumps | default({}) | dict2items | selectattr('value')
           | map(attribute='key') | list }}
      register: _create_extra_declared

    - name: Report the extra databases imported
      ansible.builtin.debug:
        msg: >-
          Imported and declared extra database(s)
          {{ _create_extra_declared.results | map(attribute='item') | join(', ') }}
          for wiki '{{ wiki }}'.
      when: _create_extra_declared.results | default([]) | length > 0

- name: Report skipping installer for existing database
  ansible.builtin.debug:
    msg: >-
      Skipping MediaWiki installer (--skip-install); connecting to an
      external database that already holds the schema.
  when: skip_install | default(false) | bool

- name: Report running installer
  ansible.builtin.debug:
    msg: "Configuring MediaWiki installation"
  when:
    - database is not defined or database == ''
    - not (skip_install | default(false) | bool)

- name: Run MediaWiki installer
  when:
    - database is not defined or database == ''
    - not (skip_install | default(false) | bool)
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: install.yml
  vars:
    install_wiki_ids: "{{ _created_wikis.wiki_ids }}"
    install_wikis: "{{ _created_wikis.wikis }}"
    install_admin_name: "{{ admin | default('WikiSysop') }}"
    install_admin_password: "{{ _admin_password }}"
    install_root_db_password: "{{ _rootdbpass }}"
