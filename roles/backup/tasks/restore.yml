---
# Full restore flow:
# 1. Restic restore into backup volume / K8s temporary pod
# 2. Copy files from volume to host (Compose) or extract + sync (K8s)
# 3. Preserve DB passwords in restored .env
# 4. Import each wiki's database dump

- name: Resolve instance
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/resolve_instance.yml

# A marker left behind means a previous restore never finished. Say what it
# reached before starting another one over the top of it.
- name: Check for an interrupted restore
  ansible.builtin.slurp:
    src: "{{ instance_path }}/{{ canasta_restore_marker }}"
  register: _restore_prior_marker
  failed_when: false

- name: Report the interrupted restore this one is resuming from
  ansible.builtin.debug:
    msg: |-
      WARNING: a previous restore of this instance did not finish. It left:

      {{ _restore_prior_marker.content | b64decode | trim }}

      This instance has been running on half-applied configuration since.
      The restore below replaces it wholesale, and clears the marker when
      it completes.
  when: _restore_prior_marker.content is defined

# MariaDB only applies the root password when the data directory is first
# initialized, so the volume keeps this host's. A restore killed between
# replacing .env with the snapshot's and writing that password back leaves
# .env holding the source's, and nothing else on disk still holds the right
# one — the next restore would then faithfully preserve the wrong value and
# make the loss permanent. Finish that write before reading .env below.
- name: Check for a database password an unfinished restore parked
  ansible.builtin.stat:
    path: "{{ instance_path }}/{{ canasta_restore_dbpass_stash }}"
  register: _restore_dbpass_stash_stat

- name: Complete an unfinished restore's database-password write
  when: _restore_dbpass_stash_stat.stat.exists
  block:
    - name: Read the parked database password
      ansible.builtin.slurp:
        src: "{{ instance_path }}/{{ canasta_restore_dbpass_stash }}"
      register: _restore_dbpass_stash
      no_log: true

    - name: Put the parked database password back in .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: set
        key: MYSQL_PASSWORD
        value: "{{ _restore_dbpass_stash.content | b64decode | trim }}"
      no_log: true
      when: (_restore_dbpass_stash.content | b64decode | trim) != ''

    - name: Report the recovered database password
      when: (_restore_dbpass_stash.content | b64decode | trim) != ''
      ansible.builtin.debug:
        msg: >-
          Recovered this instance's database password: a previous restore was
          interrupted after it replaced .env and before it wrote the password
          back, so .env held the snapshot's. If you set a different password
          by hand since then, re-apply it with 'canasta config set
          MYSQL_PASSWORD=... -i {{ instance_id }}'.

- name: Save current DB password before restore
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: MYSQL_PASSWORD
  register: _restore_dbpass
  no_log: true

# MediaWiki's account lives in this host's database server too, which a
# restore does not touch, so its credentials are this host's as well.
- name: Save MediaWiki's database account before restore
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _restore_wiki_account
  no_log: true

# The snapshot carries the source host's .env, which the restore writes over
# this host's. Read the identity it is about to replace, so a restore onto a
# different host can be recognized as one and said out loud. `read` returns ""
# for a missing key, so a destination with no .env reads as "no prior identity"
# and nothing is claimed about it.
- name: Save this host's site identity before restore
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: MW_SITE_FQDN
  register: _restore_prior_fqdn

# Single-wiki restore (-w) scopes the restore to one wiki's DB and
# per-wiki files. The wiki must already exist in this instance — a
# scoped restore updates an existing wiki, it does not recreate one.
- name: Validate target wiki exists (single-wiki restore)
  when: wiki is defined
  block:
    - name: Read current wikis for single-wiki restore validation
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _restore_target_wikis

    - name: Fail when the target wiki is not in this instance
      ansible.builtin.fail:
        msg: >-
          Wiki '{{ wiki }}' is not in this instance's wikis.yaml, so there is
          nothing to restore into. Present wikis:
          {{ _restore_target_wikis.wiki_ids | join(', ') }}.
      when: wiki not in _restore_target_wikis.wiki_ids

# Resolve 'latest' to a concrete snapshot ID, filtering out
# safety-before-restore snapshots. Restic's own "latest" keyword
# doesn't know about our tags — without this filter, running restore
# a second time picks up the safety snapshot just created (which is
# internal and typically empty) instead of the user's most recent
# real backup.
#
# Note: `snapshot` is passed via -e extra vars (precedence 22), which
# shadows any set_fact (precedence 20). We resolve into a *new* fact
# (`_resolved_snapshot`) and use that everywhere downstream instead of
# trying to rebind `snapshot` itself.
#
# The listing also supplies the tags of the snapshot being restored, so an
# INCOMPLETE one (a backup that could not dump every database) is refused
# unless --allow-incomplete is given. For the same reason 'latest' passes
# over INCOMPLETE snapshots unless that flag is given.
- name: List all snapshots as JSON
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/run_backup.yml
  vars:
    backup_args:
      - "snapshots"
      - "--json"

- name: Read the snapshot listing
  ansible.builtin.set_fact:
    _restore_snapshots: "{{ (_restic_result.stdout | from_json) | sort(attribute='time') }}"

- name: Resolve 'latest' snapshot (excluding internal safety snapshots)
  when: snapshot == 'latest'
  block:
    - name: Pick latest non-safety snapshot
      ansible.builtin.set_fact:
        _resolved_snapshot: "{{ item.short_id }}"
        _resolved_snapshot_time: "{{ item.time }}"
      loop: "{{ _restore_snapshots }}"
      when:
        - "'safety-before-restore' not in (item.tags | default([]))"
        - >-
          (allow_incomplete | default(false) | bool)
          or 'INCOMPLETE' not in (item.tags | default([]))
      loop_control:
        label: "{{ item.short_id }} ({{ item.time }})"

    - name: Find INCOMPLETE snapshots 'latest' passed over
      ansible.builtin.set_fact:
        _restore_skipped_incomplete: >-
          {{ _restore_snapshots
             | selectattr('time', '>', _resolved_snapshot_time | default(''))
             | selectattr('tags', 'defined')
             | selectattr('tags', 'contains', 'INCOMPLETE')
             | rejectattr('tags', 'contains', 'safety-before-restore')
             | map(attribute='short_id') | list }}

    - name: Fail if no non-safety snapshot exists
      ansible.builtin.fail:
        msg: >-
          {% if _restore_skipped_incomplete | length > 0 %}
          No complete backup snapshot found: the only candidates are
          INCOMPLETE ({{ _restore_skipped_incomplete | join(', ') }}), which
          lack databases that failed to dump. To restore one anyway, name it
          with -s and add --allow-incomplete.
          {% else %}
          No backup snapshots found (excluding safety-before-restore
          snapshots). Create a backup first with 'canasta backup create'.
          {% endif %}
      when: _resolved_snapshot is not defined

    - name: Report the INCOMPLETE snapshots 'latest' passed over
      ansible.builtin.debug:
        msg: >-
          WARNING: skipping newer INCOMPLETE snapshot(s)
          {{ _restore_skipped_incomplete | join(', ') }}; restoring
          {{ _resolved_snapshot }} ({{ _resolved_snapshot_time }}), the
          latest complete snapshot.
      when: _restore_skipped_incomplete | length > 0

- name: Set effective snapshot ID
  ansible.builtin.set_fact:
    _resolved_snapshot: "{{ snapshot }}"
  when: _resolved_snapshot is not defined

- name: Find the snapshot in the repository
  ansible.builtin.set_fact:
    _restore_matches: >-
      {{ _restore_snapshots
         | selectattr('id', 'match', _resolved_snapshot | regex_escape)
         | map(attribute='short_id') | list }}

- name: Fail when the snapshot is not in the repository
  ansible.builtin.fail:
    msg: >-
      {% if _restore_matches | length == 0 -%}
      Snapshot '{{ _resolved_snapshot }}' not found in the backup repository.
      {%- else -%}
      Snapshot ID '{{ _resolved_snapshot }}' matches more than one snapshot
      ({{ _restore_matches | join(', ') }}); give more of the ID.
      {%- endif %}
      Run 'canasta backup list -i {{ instance_id }}' to see available snapshots.
  when: _restore_matches | length != 1

- name: Read the restored snapshot's tags
  ansible.builtin.set_fact:
    _restore_snapshot_tags: >-
      {{ _restore_snapshots
         | selectattr('id', 'match', _resolved_snapshot | regex_escape)
         | map(attribute='tags', default=[]) | flatten | unique | list }}

- name: Note whether the snapshot is INCOMPLETE
  ansible.builtin.set_fact:
    _restore_incomplete: "{{ 'INCOMPLETE' in _restore_snapshot_tags }}"
    _restore_missing_dbs: >-
      {{ _restore_snapshot_tags | select('match', '^missing-db:')
         | map('regex_replace', '^missing-db:', '') | list }}

- name: Refuse an INCOMPLETE snapshot
  ansible.builtin.fail:
    msg: >-
      Snapshot {{ _resolved_snapshot }} is INCOMPLETE: database(s)
      {{ _restore_missing_dbs | join(', ') | default('(unrecorded)', true) }}
      failed to dump when it was taken and are not in it. Restoring it would
      bring back everything else while leaving those databases as they are
      now. To restore it anyway, add --allow-incomplete.
  when:
    - _restore_incomplete | bool
    - not (allow_incomplete | default(false) | bool)

- name: Warn that the snapshot is INCOMPLETE
  ansible.builtin.debug:
    msg: >-
      WARNING: snapshot {{ _resolved_snapshot }} is INCOMPLETE. Restoring
      what it has; database(s)
      {{ _restore_missing_dbs | join(', ') | default('(unrecorded)', true) }}
      are not in it and will be left as they are.
  when: _restore_incomplete | bool

- name: Note when this restore started
  ansible.builtin.set_fact:
    _restore_started_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

- name: Mark the restore as in flight
  ansible.builtin.include_tasks: _restore_marker.yml
  vars:
    restore_marker_phase: starting

# Outside config/, which the restore replaces wholesale, and outside the set
# of names the snapshot carries — so the copy that overwrites .env cannot
# reach it. Single-wiki restore leaves .env alone and needs no stash.
- name: Park this host's database password for the span .env is the snapshot's
  ansible.builtin.copy:
    content: "{{ _restore_dbpass.value }}"
    dest: "{{ instance_path }}/{{ canasta_restore_dbpass_stash }}"
    mode: "0600"
  no_log: true
  when:
    - wiki is not defined
    - (_restore_dbpass.value | default('', true)) != ''

# The orchestrator owns the restore mechanics (Compose volume restore +
# file copy + DB import, or the K8s pod-based restore); dispatch
# unconditionally.
# A restore that fails while still in its "starting" phase has changed
# nothing, so it must not leave a marker that reads as an interrupted one.
- name: Restore from snapshot
  block:
    - name: Run the orchestrator restore
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/restore_instance.yml
  rescue:
    - name: Read how far the failed restore got
      ansible.builtin.slurp:
        src: "{{ instance_path }}/{{ canasta_restore_marker }}"
      register: _restore_marker_at_failure
      failed_when: false

    - name: Clear the marker of a restore that changed nothing
      when: >-
        (_restore_marker_at_failure.content | default('') | b64decode)
        is search('(?m)^phase: starting$')
      block:
        - name: Remove the restore marker
          ansible.builtin.include_tasks: _restore_marker.yml
          vars:
            restore_marker_clear: true

        - name: Remove the password parked by a restore that changed nothing
          ansible.builtin.file:
            path: "{{ instance_path }}/{{ canasta_restore_dbpass_stash }}"
            state: absent

    - name: Report the restore failure
      ansible.builtin.fail:
        msg: >-
          {% if _restore_failed_phase == 'starting' -%}
          The restore failed before changing anything (see the error above);
          this instance is as it was.
          {%- elif _restore_failed_phase -%}
          The restore failed partway through, in its {{ _restore_failed_phase }}
          phase (see the error above). Run the restore again to complete it.
          {%- else -%}
          The restore failed (see the error above).
          {%- endif %}
      vars:
        _restore_failed_phase: >-
          {{ (_restore_marker_at_failure.content | default('') | b64decode)
             | regex_findall('(?m)^phase: (.*)$') | first | default('') }}

# Everything above this point is the restore proper: the snapshot's files
# and databases are already in place once it completes. A failure in the
# restart therefore means "restored but not running", which is a very
# different situation from "restore failed" — and re-running the restore
# is the wrong response to it.
- name: Restart instance after restore
  block:
    - name: Mark the restart phase
      ansible.builtin.include_tasks: _restore_marker.yml
      vars:
        restore_marker_phase: restart

    - name: Start the instance with the restored state
      ansible.builtin.include_role:
        name: instance_lifecycle
        tasks_from: restart.yml
  rescue:
    # Left in place deliberately: the instance is restored but not running,
    # and nothing has re-materialized its backup schedule.
    - name: Mark the restart as the phase that failed
      ansible.builtin.include_tasks: _restore_marker.yml
      vars:
        restore_marker_phase: restart-failed

    - name: Report a restore that succeeded with a failed restart
      ansible.builtin.fail:
        msg: >-
          The restore completed: files and databases from snapshot
          {{ _resolved_snapshot }} are in place. Only the post-restore
          restart failed (see the error above).

          Do not re-run the restore — the data is already restored.
          Bring the instance up with
          'canasta start --id {{ instance_id }}' and confirm with
          'canasta list'.

# The snapshot restored config/backup-schedule.yml (if the instance had a
# schedule); re-materialize the crontab on the instance's host so the
# schedule is active again after a restore — including onto a fresh host.
- name: Mark the backup-schedule phase
  ansible.builtin.include_tasks: _restore_marker.yml
  vars:
    restore_marker_phase: backup-schedule

- name: Re-materialize the backup schedule from restored state
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/backup_schedule_rematerialize.yml

- name: Clear the restore marker on success
  ansible.builtin.include_tasks: _restore_marker.yml
  vars:
    restore_marker_clear: true

- name: Remove the parked database password
  ansible.builtin.file:
    path: "{{ instance_path }}/{{ canasta_restore_dbpass_stash }}"
    state: absent

- name: Display result
  ansible.builtin.debug:
    msg: >-
      Restored {{ ("wiki '" ~ wiki ~ "' from") if wiki is defined else "from" }}
      snapshot {{ _resolved_snapshot }}.
      Database tables present in the snapshot were replaced; any table
      created since it was taken (a later extension install, a MediaWiki
      upgrade) still exists.
      {% if _restore_incomplete | bool %}
      The snapshot is INCOMPLETE, so database(s)
      {{ _restore_missing_dbs | join(', ') | default('(unrecorded)', true) }}
      were not restored; this instance's copies, if any, were left as they
      were.
      {% endif %}
