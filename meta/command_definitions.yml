---
# Command definitions for the Canasta CLI.
# Single source of truth for command dispatch, parameter validation, and documentation generation.
#
# Parameter types:
#   string   - Free-form text
#   path     - Filesystem path
#   bool     - True/false flag (default: false)
#   choice   - One of a fixed set of values (see 'choices')
#   integer  - Whole number
#
# Special fields:
#   required          - Parameter must be provided
#   required_unless   - Required unless the named parameter is provided
#   sensitive         - Value is a secret (auto-generated if omitted, no_log in Ansible)
#   mutual_exclusion  - Cannot be combined with the named parameter
#   positional        - Accepted as positional argument(s), not a flag
#   as_list           - For positional multi. Reaches Ansible as a list, so a
#                       value may contain spaces. Without it, the values are
#                       joined with spaces into one string.
#   aliases           - For type:bool. Deprecated flag spellings (e.g. ["--yes",
#                       "-y"]) that set the same parameter but are hidden
#                       from --help and the generated reference.
#   validator         - Name of a regex in canasta.py:_VALIDATORS (e.g. 'hostname')
#   path_kind         - For type:path. 'remote' = remote target dir (default with
#                       --host is '~/canasta'; relative paths rejected with --host).
#                       Omit or 'local' = path on the laptop, resolved against cwd.
#                       'instance_host' = path on the instance's host (from --host,
#                       else the registry); resolved against cwd when that host is
#                       this machine, else passed through for the host to expand
#                       (relative paths rejected).

global_flags:
  # --help/-h is provided automatically by argparse on every parser;
  # listed here so wiki_publish.py renders it in the Global Flags
  # section of every command page. No argparse wiring reads this entry.
  - name: help
    short: h
    type: bool
    default: false
    description: "Show help message and exit"
  - name: verbose
    short: v
    type: bool
    default: false
    description: "Enable verbose output"

# Subcommand groups (canasta host, canasta gitops, etc.). These have no leaf-command entry of their own; they exist as
# parents in canasta.py:SUBCOMMAND_GROUPS / NESTED_SUBCOMMAND_GROUPS and
# get help text when invoked without a subcommand. wiki_publish.py reads
# this list to auto-generate CLI: landing pages so they don't drift from
# the actual subcommand set. Internal names use underscores, matching
# the leaf-command convention (storage_setup, backup_schedule).
command_groups:
  - name: host
    description: "Manage saved hosts"
    long_description: |
      Manage the persistent host inventory at `$CANASTA_CONFIG_DIR/hosts.yml`.
      Saved hosts are targeted by short name with `--host` on subsequent
      canasta commands instead of repeating SSH details every time.

  - name: config
    description: "View and modify Canasta configuration"
    long_description: |
      View and modify the .env configuration for a Canasta instance.

      Use `canasta config get` to view current settings and
      `canasta config set` to change them. The set command handles side
      effects automatically (e.g., updating wikis.yaml when changing
      HTTPS_PORT) and restarts the instance. Editing .env by hand may
      leave the instance in an inconsistent state.

      Key names are case-insensitive and hyphens are treated as
      underscores, so `https-port`, `HTTPS_PORT`, and `Https_Port` all
      work.

      Settings safe to change on a running instance:

      {{CONFIG_KEYS_TABLE}}

      Restic backups also accept any backend-specific credentials whose
      keys start with `AWS_`, `AZURE_`, `B2_`, `GOOGLE_`, `OS_`, `ST_`,
      or `RCLONE_` (e.g. `AWS_ACCESS_KEY_ID` for S3,
      `AZURE_ACCOUNT_NAME` for Azure, `B2_ACCOUNT_ID` for Backblaze).
      The entire .env is passed to the Restic container, so any
      variable Restic recognizes will work — see
      https://restic.readthedocs.io/en/stable/040_backup.html . SMTP
      credentials (`SMTP_*`) are also accepted.

      Other settings (database passwords, secret keys, etc.) are
      generated by `canasta create` and should not be changed directly.
      To change the domain, run
      `canasta config set MW_SITE_FQDN=<domain>`. It also updates
      `MW_SITE_SERVER` and the URL in `config/wikis.yaml` of every wiki on
      the old domain. A wiki on another domain keeps its URL; change that
      in `config/wikis.yaml`.

  - name: extension
    description: "Manage Canasta extensions"
    long_description: |
      Manage MediaWiki extensions in a Canasta instance. Subcommands
      list available extensions and enable or disable them globally or
      for a specific wiki in a farm.

  - name: skin
    description: "Manage Canasta skins"
    long_description: |
      Manage MediaWiki skins in a Canasta instance. Subcommands list
      available skins and enable or disable them globally or for a
      specific wiki in a farm.

  - name: maintenance
    description: "Run update and other maintenance scripts"
    long_description: |
      Run MediaWiki maintenance operations on a Canasta instance.
      Subcommands run the standard update sequence, execute arbitrary
      core maintenance scripts, run extension-specific maintenance
      scripts, or open an interactive shell in the running container.

  - name: schedule
    description: "Schedule recurring maintenance commands"
    long_description: |
      Run a command inside one of an instance's containers on a recurring
      schedule: cache cleanup, a maintenance script, third-party
      housekeeping. Each schedule is a crontab entry on the host where the
      instance runs that runs `canasta schedule run` on the schedule. That host needs the
      `cron` package and a runnable `canasta`, as scheduled backups do.

      Schedules are kept in `config/schedules.yml`, which backups capture
      and gitops distributes; a restore or a `canasta gitops pull`
      re-installs the crontab entries from it. Each run's output is
      appended to `schedule-<name>.log` in the instance directory, and
      `canasta schedule list` shows the result of the last run.

  - name: sitemap
    description: "Manage sitemaps for a Canasta instance"
    long_description: |
      Generate or remove XML sitemaps for wikis in a Canasta instance.
      Sitemaps improve search engine indexing by listing all pages on
      your wiki.

  - name: backup
    description: "Backup and restore Canasta instances"
    long_description: |
      Manage backups of a Canasta instance. Subcommands initialize a
      backup repository, create and restore backups, list and compare
      backups, and schedule recurring backups. Requires
      `RESTIC_REPOSITORY` (or AWS S3 settings) and `RESTIC_PASSWORD`
      to be configured in the instance's .env file.

  - name: backup_schedule
    description: "Manage scheduled backups"
    long_description: |
      Manage recurring backup schedules. A schedule is a crontab entry on
      the host where the instance runs — the local or remote host the
      instance's other commands run on. The entry runs
      `canasta backup create -i <id> --tag scheduled` on the schedule,
      which performs the backup in a Compose container. Output goes to
      `backup.log` in the instance directory; failures are visible there
      and via `tail -F`.

      That host therefore needs the `cron` package (Debian:
      `apt install cron`) and a runnable `canasta` — the cron entry calls
      `canasta backup create`. `canasta backup schedule set` fails with
      guidance if either is missing on a remote host. The
      schedule is also persisted to `config/backup-schedule.yml`, so it
      is captured by backups and re-materialized on restore.

  - name: backup_databases
    description: "Manage which databases a wiki's backup captures"
    long_description: |
      Manage the databases a wiki's backup dumps. Every backup includes
      the wiki's own database; these subcommands add and remove the extra
      ones, for data an extension keeps in a database of its own (Cargo's
      `$wgCargoDBname`).

      A wiki and its extra databases are dumped by one `mariadb-dump`
      call, so they share a transaction and are captured at the same
      moment. The declaration lives in `config/wikis.yaml` and is carried
      by backups and gitops alike.

  - name: gitops
    description: "Git-based configuration management"
    long_description: |
      Manage Canasta instance configuration through a Git repository.
      Supports version-controlled configuration, encrypted secrets via
      git-crypt, and multi-server deployments with push/pull workflows.

  - name: devmode
    description: "Manage development mode"
    long_description: |
      Enable or disable development mode on a Canasta instance.
      Development mode extracts MediaWiki code for live editing and
      enables Xdebug for step debugging.

  - name: crowdsec
    description: "Manage CrowdSec threat detection"
    long_description: |
      Manage the optional CrowdSec security feature on an instance.
      Enable or disable CrowdSec itself with
      `canasta config set CANASTA_ENABLE_CROWDSEC=true|false` (the
      same pattern as the other optional features). The subcommands
      below allow further configuration and monitoring once CrowdSec
      is enabled:

      * `bouncer-enroll` registers the Caddy bouncer with the CrowdSec
        engine, captures the generated API key, stores it as
        `CROWDSEC_BOUNCER_API_KEY`, and restarts so the bouncer starts
        enforcing decisions. This now happens automatically the first
        time the instance starts after CrowdSec is enabled; run it by
        hand only to force a fresh key (`--force`).
      * `console-enroll` connects the engine to the CrowdSec Console
        (app.crowdsec.net) for the full community blocklist. Optional —
        the engine already pulls the smaller "Lite" community blocklist
        via the Central API by default.
      * `reload` restarts just the engine to apply changes (an accepted
        console enrollment, whitelist edits) without restarting the whole
        instance.
      * `status` shows the registered bouncers and the currently active
        IP decisions.
      * `scenarios` lists the loaded collections and scenarios so you
        can confirm behavioral detection is active.
      * `alerts` shows the attacks CrowdSec has detected (the detection
        history), complementing `status` (the bans in force right now).
      * `metrics` shows engine throughput — the quickest check that the
        Caddy access log is actually being read.
      * `ban` / `unban` add or remove a manual decision for an IP,
        independent of CrowdSec's automatic detection.

      Durable detection tuning (whitelisting trusted IPs, custom rules)
      is done by editing `config/crowdsec/whitelists.yaml` in the
      instance directory — a version-controlled file, like
      `Caddyfile.global`.

  - name: sidecar
    description: "Manage app sidecars for a Canasta instance"
    long_description: |
      Declare and manage app sidecars — companion services the wiki talks
      to (e.g. a cache or a parsing service) — in `config/sidecars.yaml`.
      Subcommands add, list, and remove sidecar
      declarations, and migrate legacy `docker-compose.override.yml` sidecars
      into the schema; run `canasta restart` to apply. For richer sidecars
      (mounted config files, dependencies, healthchecks), edit
      `config/sidecars.yaml` directly.

  - name: image
    description: "Manage locally built images and reclaim image storage"
    long_description: |
      `image prune` reclaims image storage on a host.

      `image build-args`, `image set-build-arg` and `image unset-build-arg`
      show and change the build arguments an instance created with
      `--build-from` is built with.

commands:
  # ---------------------------------------------------------------------------
  # Instance lifecycle
  # ---------------------------------------------------------------------------
  - name: create
    description: "Create a new Canasta instance"
    long_description: |
      Create a new Canasta MediaWiki instance. Generates configuration files,
      starts the containers, and runs the MediaWiki installer. With
      --skip-install, the installer is skipped and the instance is connected
      to an external database that already holds a MediaWiki schema.

      With --database, the wiki is created from the dump instead of by the
      installer. Dumps that `canasta export` writes beside the main one for
      the wiki's extra databases (`<stem>.<database>.sql`, `.sql.gz`,
      `.sql.xz` or `.sql.zst`, where `<stem>` is the main dump's path
      without its `.sql` extension and compression suffix) are imported too, and each database is declared for the
      wiki (see `canasta backup databases`). A file whose database name is
      not valid, is a MariaDB system database, or is another wiki's
      database is reported and skipped.
    examples:
      - "canasta create -i mysite -w main -n example.com"
      - "canasta create -i mysite -w main -n example.com -d /path/to/dump.sql"
      - "canasta create -i mysite -w main -n localhost"
      - "canasta create -i mysite -w main -n example.com -e prod.env --skip-install"
    playbook: create.yml
    parameters:
      - name: host
        short: H
        type: string
        description: "Target host for the new instance (default: localhost)"
      - name: docker_host
        type: string
        description: >-
          Docker API socket on the target. Set this when the target
          uses rootless podman (typically `unix:///run/user/<uid>/podman/podman.sock`)
          or rootless Docker. Persisted to the instance registry so
          subsequent `start`, `stop`, `config set`, etc. inherit it.
          Leave unset for system Docker on `/var/run/docker.sock`.
      - name: path
        short: p
        type: path
        path_kind: remote
        default: "."
        description: >-
          Canasta installation directory. Default is '.' for local
          installs; with --host, default is '~/canasta' on the remote
          and the value must be absolute (or '~'-prefixed) — relative
          paths are rejected because they'd otherwise be resolved
          against the laptop's filesystem.
      - name: id
        short: i
        type: string
        required: true
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        required_unless: yamlfile
        description: "ID of the wiki"
      - name: site_name
        short: t
        type: string
        description: "Display name of the wiki (defaults to wiki ID)"
      - name: domain_name
        short: n
        type: string
        required: true
        validator: hostname
        description: "Domain name"
      - name: admin
        short: a
        type: string
        default: WikiSysop
        description: "Initial wiki admin username"
      - name: password
        short: s
        type: string
        sensitive: true
        description: "Initial wiki admin password (auto-generated if not provided)"
      - name: yamlfile
        short: f
        type: path
        description: "Initial wikis.yaml file, on the controller (the machine running canasta)"
      - name: keep_config
        short: k
        type: bool
        default: false
        description: "Keep config files on failure"
      - name: override
        short: r
        type: path
        description: "File on the controller (the machine running canasta) to copy to docker-compose.override.yml"
      - name: rootdbpass
        type: string
        sensitive: true
        description: "Root database password (auto-generated if not provided)"
      - name: wikidbuser
        type: string
        description: >-
          Database account MediaWiki connects with (default: mediawiki, or
          mediawiki_<id> on an external database, since
          the server can serve other instances). The CLI creates it with
          access to the instance's wiki databases only, logging in to an
          external database as the env file's MYSQL_USER. Pass root to
          start MediaWiki on the database administrator account; the next
          upgrade moves it to its own account unless
          CANASTA_DB_ROOT_ACCOUNT=true is set.
      - name: wikidbpass
        type: string
        sensitive: true
        description: "Wiki database password (auto-generated if not provided)"
      - name: envfile
        short: e
        type: path
        description: "Path on the controller (the machine running canasta) to a .env file with password overrides"
      - name: canasta_image
        type: string
        mutual_exclusion: build_from
        description: "Custom Canasta image reference"
      - name: canasta_base
        type: bool
        default: false
        mutual_exclusion: canasta_image
        description: >-
          Run the `canasta-base` image (MediaWiki core without the bundled
          extensions and skins) instead of canasta. Without --build-from
          it is the `canasta-base` release matching this CLI's Canasta
          version, which upgrade moves to each new release. With
          --build-from, only `canasta-base` is built from the source
          directory, and upgrade rebuilds it the same way.
      - name: build_from
        type: path
        path_kind: instance_host
        mutual_exclusion: canasta_image
        description: >-
          Build from a source directory on the instance's host (with --host,
          an absolute path or one starting with a quoted '~' (for example '~/x'))
      - name: build_arg
        type: string
        multi: true
        description: >-
          Build argument KEY=VALUE forwarded to the --build-from image
          builds (repeatable, e.g. --build-arg MW_VERSION=master). A
          user-supplied BASE_IMAGE overrides the auto-detected base: a
          local `canasta-base` build, from Canasta/ when it has
          Dockerfile.canasta or else from CanastaBase/ when that is in the
          source directory, else the published `canasta-base` image for
          Canasta source and the current Canasta release image for an
          overlay. The local `canasta-base` build is then skipped.
      - name: database
        short: d
        type: path
        mutual_exclusion: skip_install
        description: >-
          Path on the controller (the machine running canasta) to an
          existing database dump (plain SQL, or compressed with gzip, xz or
          zstd). Extra-database dumps beside it (<stem>.<database>.sql,
          .sql.gz, .sql.xz or .sql.zst) are imported and
          declared for the wiki.
      - name: skip_install
        type: bool
        default: false
        mutual_exclusion: database
        description: >-
          Skip the MediaWiki installer (install.php) and connect to a
          database that already has a MediaWiki schema. Requires
          USE_EXTERNAL_DB=true (set via -e envfile) and cannot be
          combined with --database. Use this when an external database
          (e.g. RDS/Aurora) was provisioned separately and already
          holds the wiki's tables.
      - name: images
        short: I
        type: path
        description: >-
          Path on the controller (the machine running canasta) to a tar (.tar
          or .tar.gz) of a wiki's images directory at the hash-directory level
          (0/, 1/, archive/, ...). Its files are copied into the wiki's
          uploads (images/<wiki>/) as www-data — a placement restore, not
          importImages. Pairs with --database, which supplies the File: page
          rows; a leading images/ parent in the tar is elided.
      - name: wiki_settings
        short: l
        type: path
        description: "Path on the controller (the machine running canasta) to a per-wiki Settings.php"
      - name: global_settings
        short: g
        type: path
        description: "Path on the controller (the machine running canasta) to a global settings file"
      - name: composer
        type: path
        description: "Path on the controller (the machine running canasta) to a custom composer.local.json"
      - name: skip_tls
        type: bool
        default: false
        description: "Skip automatic Let's Encrypt TLS setup"
      - name: staging_certs
        type: bool
        default: false
        description: "Use Let's Encrypt staging CA (untrusted by browsers, but avoids rate limits while testing)"

  - name: delete
    description: "Delete a Canasta instance"
    unfinished_pull_ok: true
    long_description: |
      Permanently delete a Canasta instance, removing containers, volumes,
      and configuration files. If run without --id from an instance directory,
      the instance is resolved by matching the current directory against the
      registry.

      If the containers and volumes of an instance cannot be
      removed, delete stops and leaves the instance registered and its files
      in place. Pass --force to delete the instance anyway; any containers
      or volumes that remain must then be removed by hand.

      Pass --keep-data to remove the instance from the registry only: its
      containers, volumes and files stay as they are.
    examples:
      - "canasta delete -y"
      - "cd /path/to/instance && canasta delete -y"
      - "canasta delete -i mysite -y --force"
      - "canasta delete -i mysite -y --keep-data"
    playbook: delete.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: "yes"
        short: "y"
        type: bool
        default: false
        description: "Skip confirmation prompt"
      - name: force
        short: f
        type: bool
        default: false
        description: "Delete even if the containers or volumes cannot be removed"
      - name: keep_data
        type: bool
        default: false
        description: "Remove the instance from the registry only, leaving its containers, volumes and files in place"

  - name: start
    description: "Start a Canasta instance"
    long_description: |
      Start the Docker containers for a Canasta instance. Before
      bringing the stack up, `COMPOSE_PROFILES` in `.env` is
      reconciled from the instance's feature flags so optional
      components start or stay down based on their current setting:

      * `CANASTA_ENABLE_VARNISH` (default `true`) — Varnish cache
      * `CANASTA_ENABLE_OBSERVABILITY` (default `false`) — OpenSearch,
        Logstash and OpenSearch Dashboards log stack
      * `CANASTA_ENABLE_REDIS` (default `false`) — Redis, a main
        object cache the web server and maintenance scripts share

      With `CANASTA_ENABLE_OPENSEARCH=true`, the instance also joins the
      host's OpenSearch, which every instance on the host with it on
      shares: start runs the cluster, gives the instance its own user and
      indexes, and makes CirrusSearch each wiki's search engine once that
      wiki's index is built.

      If the instance has development mode enabled, Xdebug starts
      automatically. Use `canasta devmode enable` or `canasta devmode
      disable` to toggle development mode; use `canasta config set
      <FLAG>=true|false` to adjust the optional components.

      The command returns once the web container reports healthy, so a
      command run immediately afterward does not race the image's
      startup. An image that declares no healthcheck is not waited on.
      If the web container's startup `composer update` failed, so the
      packages in `config/composer.local.json` are not installed, a
      warning names the failure and how to read its details.

      Each wiki's API is then requested through the
      HAProxy edge on the instance's host, and a warning names each wiki
      that does not answer within a minute, with the reason. Any
      response from behind the edge other than a server error (5xx)
      counts as an answer, so a private or password-protected wiki
      answers too. The certificate is not checked. The CLI run with
      canasta-docker does not make these requests for an instance on its
      own host.
    examples:
      - "canasta start"
    playbook: start.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: stop
    description: "Stop a Canasta instance"
    unfinished_pull_ok: true
    long_description: |
      Stop all Docker containers for a Canasta instance. The
      containers are stopped gracefully, preserving all data in
      Docker volumes.
    examples:
      - "canasta stop"
    playbook: stop.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: restart
    description: "Restart a Canasta instance"
    long_description: |
      Restart a Canasta instance by stopping and then starting all
      Docker containers. Any pending configuration migrations are
      applied during the restart. Use `canasta devmode enable` or
      `canasta devmode disable` to change the development mode
      setting. The command returns once the web container reports
      healthy, and warns if its startup `composer update` failed. It
      also warns about each wiki that does not answer
      through the HAProxy edge, as `canasta start` does.
    examples:
      - "canasta restart"
    playbook: restart.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: reconcile
    description: "Bring an instance's config files and running containers into agreement"
    long_description: |
      Make an instance consistent, without a full restart: its generated
      config files match their sources, and its running containers match
      its config files. Safe to run at any time, and the fix for drift
      reported by 'canasta doctor'.

      The most common use is applying edits to config/settings,
      config/wikis.yaml, .env, or Caddyfile.site. It recreates only the
      containers whose configuration changed and reloads Caddy.
      It also regenerates the Caddyfile, re-derives COMPOSE_PROFILES from
      the feature flags, starts any containers that should be running but
      are not, and clears the Varnish cache so no page is served with the
      old configuration.

      On a gitops instance, each generated file and its sources are
      brought into agreement first, whichever one was edited:
      config/wikis.yaml with wikis.yaml.template, and .env with
      env.template and the host's vars.yaml. An edit to .env is written
      into the sources the way 'canasta config set' writes it; an edit to
      the sources is rendered into .env, config/wikis.yaml, my.cnf and the
      admin password files. If the same setting was edited on both sides
      and they disagree, reconcile stops without changing either. Run
      'canasta gitops push' afterwards to share the change.
    examples:
      - "canasta reconcile"
      - "canasta reconcile --id mysite"
    playbook: reconcile.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: rebuild
    description: "Rebuild custom images for a Canasta instance"
    long_description: |
      Rebuild every service that has a `build:` directive in the
      merged compose config (docker-compose.override.yml or
      docker-compose.dev.yml) and restart the instance to pick up
      the rebuilt image. The command returns once the web container
      reports healthy.

      Use this after editing a custom Dockerfile, or after changing
      the base CANASTA_IMAGE when you want to refresh a layered
      custom image. `canasta upgrade` also performs the same
      rebuild automatically when the configured image changes;
      `canasta rebuild` is the standalone form for cases where the
      operator wants to rebuild without an upgrade.
    examples:
      - "canasta rebuild"
      - "canasta rebuild -i mywiki --no-cache"
      - "canasta rebuild --no-restart"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: no_cache
        type: bool
        default: false
        description: "Pass --no-cache to docker compose build"
      - name: no_restart
        type: bool
        default: false
        description: "Build images but skip the restart afterward"

  - name: list
    description: "List all registered Canasta instances"
    long_description: |
      Display all Canasta instances in the local registry.

      With --cleanup, remove registry entries for instances whose
      directories are confirmed missing. Entries for hosts that are
      unreachable (DNS failure, SSH refused, etc.) are left alone —
      a transient network problem shouldn't cause entries to be
      silently dropped. Pass --force to remove unreachable entries
      too, or --dry-run to preview without removing anything.

      The STATUS column reports what the container runtime says about the
      web container: RUNNING, STOPPED, or UNHEALTHY when the container
      is crash-looping or failing its health check (`canasta doctor -i
      <id>` names the cause). It can read RUNNING while MediaWiki itself
      is failing. With --check-wikis, each wiki of every running instance
      is also probed over HTTP and annotated REACHABLE, NOT REACHABLE
      or UNKNOWN — the last meaning the instance's host could not be
      reached, so the wiki's state is unknown rather than known-bad.
      This costs one request per wiki, so it is off by default.

      DB ACCOUNT MOVE PENDING after the status means MediaWiki still
      connects as the database administrator account (root on the bundled
      database), which `canasta upgrade` moves it off. An upgrade skips the
      move for an instance that is stopped, so start the instance and run
      `canasta upgrade` again to complete it. Setting
      CANASTA_DB_ROOT_ACCOUNT=true keeps the instance on the administrator
      account and clears the indicator.
    examples:
      - "canasta list"
      - "canasta list --check-wikis"
      - "canasta list --cleanup"
      - "canasta list --cleanup --dry-run"
      - "canasta list --cleanup --force"
    direct_only: true
    parameters:
      - name: host
        short: H
        type: string
        description: "Filter output by host (default: all hosts)"
      - name: check_wikis
        type: bool
        default: false
        description: "Probe each wiki over HTTP and report whether it responds"
      - name: cleanup
        type: bool
        default: false
        description: "Remove stale entries whose directories are confirmed missing"
      - name: force
        short: f
        type: bool
        default: false
        description: "With --cleanup, also remove entries for unreachable hosts"
      - name: dry_run
        type: bool
        default: false
        description: "With --cleanup, print what would be removed without removing"

  - name: version
    description: "Display version information"
    long_description: |
      Always prints the Canasta CLI version and the target
      Canasta version (the image tag this CLI release is built to
      deploy).

      Additional output depends on context:

      * Inside an instance directory: also reports that instance's
        pinned CANASTA_IMAGE tag and running runtime version.
      * Outside any instance directory: lists every registered
        instance with its pinned CANASTA_IMAGE tag (no runtime query;
        fast).
      * With --id: reports full image + running version for the
        named instance (same as inside that instance's directory).
      * With --cli-only: prints only the CLI header; skips all
        instance reads. Intended for scripts that just want the CLI
        version deterministically.

      For an instance built with --build-from, the image tag is followed
      by the base image of its most recent build.
    examples:
      - "canasta version"
      - "canasta version -i mysite"
      - "canasta version --cli-only"
    direct_only: true
    parameters:
      - name: host
        short: H
        type: string
        description: "Filter list-all output by host (default: all hosts)"
      - name: id
        short: i
        type: string
        description: "Report image version for this instance"
      - name: cli_only
        short: c
        type: bool
        default: false
        description: "Print only the CLI version; skip instance queries"

  - name: doctor
    description: "Check target host dependencies"
    long_description: |
      Verify that the target host has a container runtime: Docker +
      Docker Compose, or Podman. Also reports status of optional tools
      (git, git-crypt, crontab) and system resources (memory, disk
      space).

      When an instance is resolved (from -i, or from the current
      directory), also checks that instance: config and runtime
      agreement, whether local config edits have been applied, whether
      CrowdSec is enabled with no TRUSTED_PROXIES set,
      the certificate the origin is actually serving (expired, or not
      publicly trusted), the HAProxy edge (whether it,
      acme.sh and the instance's CrowdSec bouncer are running, whether the
      instance is among its members, each hostname's certificate, and
      whether it can see visitors' addresses), whether the web container's startup `composer update` failed, and
      whether the web container is crash-looping or failing its health
      check, with the startup error from its log and how to fix it.
    examples:
      - "canasta doctor"
      - "canasta doctor --host prod1.example.com"
      - "canasta doctor -i mysite"
    direct_only: true
    parameters:
      - name: host
        short: H
        type: string
        description: "Target host (default: localhost)"
      - name: docker_host
        type: string
        description: >-
          Docker API socket on the target. Set this when the target
          uses rootless podman or rootless Docker (e.g.
          `unix:///run/user/1000/podman/podman.sock`). Defaults to
          system Docker's `/var/run/docker.sock`.
      - name: id
        short: i
        type: string
        description: >-
          Canasta instance ID — check the host where this instance is
          registered. Mutually exclusive with --host; --host wins if
          both are given.

  - name: wiki_check
    description: "Check that configured wikis are accessible"
    long_description: |
      Read the instance's configured wikis from `config/wikis.yaml` and
      check that each one is serving MediaWiki. Each wiki's MediaWiki API
      is queried from the instance's host; a wiki whose read API is
      private still counts as reachable, because the denial proves
      MediaWiki answered. A container can be up while MediaWiki returns
      errors, so this reports what a reader sees rather than whether the
      workload is running. Exits non-zero if any wiki fails. `canasta
      list --check-wikis` runs the same probe across every instance.
    examples:
      - "canasta wiki-check -i mysite"
      - "canasta wiki-check --host prod1.example.com -i mysite"
    direct_only: true
    parameters:
      - name: host
        short: H
        type: string
        description: "Target host (default: localhost)"
      - name: id
        short: i
        type: string
        description: >-
          Canasta instance ID — check the host where this instance is
          registered. Mutually exclusive with --host; --host wins if
          both are given.

  - name: install
    description: "Install dependencies on the target host"
    unfinished_pull_ok: true
    long_description: |
      Install one or more dependencies on the target host. Supported
      packages: docker, git-crypt, canasta, podman, docker-rootless,
      uv, uv:<tool>.

      `canasta` installs the Canasta CLI (canasta-native) on the target
      host, so an instance deployed remotely from a controller can also
      be operated directly on its own host. This is required before
      scheduling backups on a remote host — the schedule's cron runs
      `canasta backup` there — and is useful any time you want
      to manage an instance locally on the host it runs on rather than
      only through the controller. Idempotent — skips if canasta is
      already present.

      `podman` installs Podman and podman-compose, enables lingering for
      the operator user, and lowers the unprivileged port floor to 80 so
      rootless Podman can bind ports 80 and 443. This covers the two
      prerequisites that `canasta create` checks during preflight for
      rootless Podman targets. Idempotent — skips if podman is already
      installed.

      `docker-rootless` installs rootless Docker for the operator,
      alongside rootful Docker if the host has it, and configures it so
      the HAProxy edge receives visitors' IP addresses. It also enables
      lingering, lowers the unprivileged port floor to 80, and leaves the
      docker CLI on the system daemon. Create an instance on it with the
      `--docker-host` socket the command prints. A host's instances all
      use one runtime. Re-running it re-applies the configuration.

      `uv` installs the Astral uv Python package manager on its own.
      `uv:<tool>` installs `<tool>` via uv (e.g. `uv:podman-compose`).
      This is the recommended workaround for Debian 13 (trixie) stable,
      which ships podman-compose 1.3.0 — a version with a known bug
      that breaks Canasta's docker-compose.yml defaults. Idempotent —
      skips if the tool is already present.

      Multiple packages can be combined in a single command.
    examples:
      - "canasta install docker"
      - "canasta install docker git-crypt"
      - "canasta install -i mysite git-crypt"
      - "canasta install -i mysite canasta"
      - "canasta install podman"
      - "canasta install --host prod1.example.com podman"
      - "canasta install docker-rootless"
      - "canasta install uv"
      - "canasta install --host prod1.example.com uv"
      - "canasta install uv:podman-compose"
      - "canasta install --host prod1.example.com uv:podman-compose"
    playbook: install.yml
    parameters:
      - name: host
        short: H
        type: string
        description: "Target host (default: localhost)"
      - name: docker_host
        type: string
        description: >-
          Docker API socket on the target. Set this when the target
          uses rootless podman or rootless Docker (e.g.
          `unix:///run/user/1000/podman/podman.sock`). Defaults to
          system Docker's `/var/run/docker.sock`.
      - name: id
        short: i
        type: string
        description: >-
          Canasta instance ID — install on the host where this instance
          is registered. Mutually exclusive with --host; --host wins
          if both are given. Useful after `canasta create` to add
          dependencies (e.g. git-crypt) to the instance's host.
      - name: packages
        type: string
        positional: true
        multi: true
        required: true
        choices: [docker, git-crypt, podman, docker-rootless, canasta, uv]
        choices_dynamic_prefix: "uv:"
        # Charset the tail after the prefix must match. Mirrors the
        # playbook's `^uv:[a-zA-Z0-9_-]+$` validation in install.yml so
        # argparse rejects the same values before Ansible starts;
        # tests/unit/test_install_podman.py asserts the two agree.
        choices_dynamic_pattern: "[a-zA-Z0-9_-]+"
        description: >-
          Dependencies to install (docker, git-crypt, podman,
          docker-rootless, canasta, uv, uv:<tool>)

  - name: upgrade
    description: "Upgrade Canasta instances"
    long_description: |
      Upgrade all registered Canasta instances by refreshing configs,
      pulling latest images, running migrations, and restarting containers.
      A native install first updates the CLI itself to the latest release;
      with `--dry-run` it reports the release it would update to and
      previews with the installed version.
      A restarted instance whose startup `composer update` failed is
      reported with a warning, and so is each wiki of a running
      instance that does not answer through the HAProxy edge
      after the upgrade, as `canasta start` reports it.

      An instance whose new image may not fit on the
      filesystem that holds container images is not upgraded and keeps
      running as it is. The size of the image it runs now is the measure,
      so the check can ask for more space than the pull needs. The
      filesystem also needs at least 250,000 free inodes, since an image
      unpacks to over 100,000 files. `canasta image prune` reclaims the
      images no instance uses.

      Upgrade first moves each host's instances behind
      the HAProxy edge, keeping their hostnames, ports and certificates. A
      host whose instances the edge cannot all serve is refused with the
      reason, and none of its instances is upgraded; an instance whose move
      fails is put back as it was and not upgraded. `--dry-run` shows each
      host's plan. Upgrade also renames the TLS settings in each `.env`:
      `CADDY_TLS_MODE` to `TLS_MODE` (`CADDY_AUTO_HTTPS=off` to
      `TLS_MODE=off`), and `CADDY_TRUSTED_PROXIES`, `CADDY_TLS_CERT` and
      `CADDY_TLS_KEY` to `TRUSTED_PROXIES`, `TLS_CERT` and `TLS_KEY`.

      An instance managed through gitops runs the Canasta
      release of the CLI on its own host, so upgrade moves its `.env` to the
      new release and leaves env.template, which every host shares,
      unchanged. An image set with `canasta config set CANASTA_IMAGE=...`
      other than a release of the official image is kept in env.template
      for every host, and upgrade leaves it as it is.

      An instance built from source is rebuilt on the upgrade's Canasta
      release: a `BASE_IMAGE` build argument that names an older
      `ghcr.io/canastawiki/canasta:<version>` image is moved to the new
      release, in the rebuild and in the recorded build arguments. Any other
      `BASE_IMAGE` is kept as given.

      Upgrade also moves a running instance on the bundled database off the
      database root account, onto MediaWiki's own `mediawiki` account with
      access to the instance's wiki databases only. It leaves the instance
      on root, and says why, while a settings file sets `$wgDBuser` or
      `$wgDBpassword` or the server holds a database no wiki declares, and
      tries again on the next upgrade. `canasta config set
      CANASTA_DB_ROOT_ACCOUNT=true` keeps an instance on root. A stopped instance is left
      stopped and on root until an upgrade runs while it is running;
      `--dry-run` and the end of the upgrade name each such instance.

      By default the CLI itself updates to the latest released version
      within the current major (the highest vX.Y.Z tag whose major matches
      the installed version), so an upgrade never crosses a major boundary
      on its own. Pass --allow-major to move to the latest release overall,
      including a new major version (which may include breaking changes).
      Pass --dev to track the development branch (head of main) instead.

      A move to a new major version goes in steps. The CLI first updates to
      the latest release of its current major and upgrades every instance
      there, as `canasta upgrade` does. It then checks every instance for
      what would stop it from moving, and moves to the new major only if
      nothing does; otherwise it names each problem and stays where it is,
      with no instance moved. For the move to 5.x, which runs MediaWiki
      1.47, these stop it: the Interwiki or Lingo extension enabled or loaded, which
      the 1.47 image does not ship; an enabled extension in `user-extensions`
      whose `requires.MediaWiki` excludes 1.47; and `php8.2` packages or
      `/etc/php/8.2` in `docker-compose.override.yml`, `config/sidecars.yaml`,
      a `Dockerfile` in the instance directory or an image build argument.
      Settings that MediaWiki 1.44 removed, `CANASTA_ELASTICSEARCH_IMAGE`, and
      an image built from source are named for a look before the move.
      `--dry-run --allow-major` runs the checks of the installed version and
      changes nothing.

      Once nothing stops the move, every instance is backed up with
      `canasta backup create`, tagged `before-<major>.x`, and the CLI moves
      only if every backup succeeds. An instance with no backup repository
      (`RESTIC_REPOSITORY`) therefore stops the move too. Pass
      --skip-backup when the instances are backed up already. To go back,
      put the CLI back on the earlier release and restore that snapshot with
      `canasta backup restore -s <snapshot>`, which returns the instance to
      the image and database it had before the move.

      Pass --purge to reclaim disk after the upgrade: each upgraded host has
      the Canasta images the upgrade superseded removed (never one an instance
      on that host is pinned to, running or stopped), dangling sidecar-rebuild
      layers pruned. Volumes are never touched. `canasta image prune`
      runs the same reclaim on one host without upgrading anything.
    examples:
      - "canasta upgrade"
      - "canasta upgrade --allow-major"
      - "canasta upgrade --dev"
      - "canasta upgrade --dry-run"
      - "canasta upgrade --purge"
    playbook: upgrade.yml
    parameters:
      - name: dry_run
        type: bool
        default: false
        description: "Preview changes without applying, including the CLI's own update"
      - name: dev
        type: bool
        default: false
        description: "Track the development branch (head of main) instead of the latest release"
      - name: allow_major
        type: bool
        default: false
        description: "Allow upgrading across a major version boundary to the latest release overall (may include breaking changes)"
      - name: purge
        type: bool
        default: false
        description: "After upgrading, reclaim disk by removing images the upgrade superseded (never removes in-use images or volumes)"
      - name: skip_backup
        type: bool
        default: false
        description: "With --allow-major, move to a new major release without first backing up every instance"

  # ---------------------------------------------------------------------------
  # Wiki management
  # ---------------------------------------------------------------------------
  - name: add
    description: "Add a new wiki to a Canasta instance"
    long_description: |
      Add a new wiki to an existing Canasta instance, creating a
      wiki farm. The new wiki is registered in `wikis.yaml`, the
      Caddyfile is regenerated, and the MediaWiki installer runs
      for the new wiki. You can also import an existing database
      dump instead of running the installer, or pass --skip-install
      to connect to an external database that already holds the new
      wiki's schema.

      With --database, dumps that `canasta export` writes beside the main
      one for the wiki's extra databases (`<stem>.<database>.sql`,
      `.sql.gz`, `.sql.xz` or `.sql.zst`, where `<stem>` is the main dump's
      path without its `.sql` extension and compression suffix) are
      imported too, and each database is
      declared for the new wiki (see `canasta backup databases`). A file
      whose database name is not valid, is a MariaDB system database, or
      is a database another wiki in the instance uses is reported and
      skipped.
    examples:
      - "canasta add -w docs -u localhost/docs"
    playbook: add.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        required: true
        description: "ID of the wiki"
      - name: url
        short: u
        type: string
        required: true
        description: "Domain/path for the wiki (e.g. localhost/docs)"
      - name: site_name
        short: t
        type: string
        description: "Display name of the wiki"
      - name: database
        short: d
        type: path
        mutual_exclusion: skip_install
        description: >-
          Path on the controller (the machine running canasta) to an
          existing database dump (plain SQL, or compressed with gzip, xz or
          zstd). Extra-database dumps beside it (<stem>.<database>.sql,
          .sql.gz, .sql.xz or .sql.zst) are imported and
          declared for the new wiki.
      - name: skip_install
        type: bool
        default: false
        mutual_exclusion: database
        description: >-
          Skip the MediaWiki installer (install.php) and connect to a
          database that already has the new wiki's schema. Requires the
          instance to use USE_EXTERNAL_DB=true and cannot be combined
          with --database.
      - name: images
        short: I
        type: path
        description: >-
          Path on the controller (the machine running canasta) to a tar (.tar
          or .tar.gz) of the new wiki's images directory at the hash-directory
          level (0/, 1/, archive/, ...). Its files are copied into the wiki's
          uploads (images/<wiki>/) as www-data — a placement restore, not
          importImages. Pairs with --database, which supplies the File: page
          rows; a leading images/ parent is elided.
      - name: wiki_settings
        short: l
        type: path
        description: "Path on the controller (the machine running canasta) to a per-wiki Settings.php"
      - name: admin
        short: a
        type: string
        description: "Initial wiki admin username"
      - name: password
        short: s
        type: string
        sensitive: true
        description: "Initial wiki admin password"

  - name: remove
    description: "Remove a wiki from a Canasta instance"
    long_description: |
      Remove a wiki from a Canasta instance. Drops the wiki database
      and removes per-wiki configuration.
    examples:
      - "canasta remove -w docs -y"
    playbook: remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        required: true
        description: "ID of the wiki to remove"
      - name: "yes"
        short: "y"
        type: bool
        default: false
        description: "Skip confirmation prompt"

  - name: import
    description: "Import a database into an existing wiki"
    long_description: |
      Import a database dump into an existing wiki, replacing its
      current database. The instance must be running. A dump may be plain
      SQL or compressed with gzip, xz or zstd; its contents, not its name,
      decide which. For a wiki on an external database, a compressed dump
      must be gzip, the only format the web container can decompress.

      The extra databases the wiki declares (see `canasta backup
      databases`) are imported too, each from the dump `canasta export`
      writes beside the main one: `<stem>.<database>.sql`, `.sql.gz`,
      `.sql.xz` or `.sql.zst`, where `<stem>` is the main dump's path
      without its `.sql` extension and compression suffix. An extra database with no such dump is
      left as it is, and reported.

      After the import, update.php runs for the wiki so an older dump's
      schema matches the installed MediaWiki and extensions. Pass
      --skip-update to leave the schema as the dump has it.

      To create a new wiki from a database dump, use the `--database`
      flag with `canasta create` or `canasta add` instead.
    examples:
      - "canasta import -w main -d dump.sql"
      - "canasta import -w main -d dump.sql.xz"
    playbook: import.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        required: true
        description: "ID of the wiki to import into"
      - name: database
        short: d
        type: path
        required: true
        description: "Path on the controller (the machine running canasta) to a SQL dump file (plain, or compressed with gzip, xz or zstd)"
      - name: wiki_settings
        short: l
        type: path
        description: "Path on the controller (the machine running canasta) to a per-wiki Settings.php to replace the current one"
      - name: skip_update
        type: bool
        default: false
        description: "Skip running update.php after importing"

  - name: export
    description: "Export the database of a wiki in a Canasta instance"
    long_description: |
      Export a wiki's database as a SQL dump file. The instance must
      be running. By default the dump is saved to `<wikiID>.sql` in
      the current directory, or, for an instance on a remote host, in
      the home directory of the SSH user there. Use a `.gz` extension
      on the output path to get a gzip-compressed dump.

      Each extra database the wiki declares (see `canasta backup
      databases`) is exported to its own file beside the main one,
      named `<stem>.<database>.sql` (or `.sql.gz`), where `<stem>` is
      the output path without its `.sql`/`.sql.gz` extension. For
      example, `canasta export -w main` with a declared `main_cargo`
      writes `main.sql` and `main.main_cargo.sql`. `canasta import`
      reads them from the same place.
    examples:
      - "canasta export -w main"
      - "canasta export -w main -f backup.sql.gz"
    playbook: export.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        required: true
        description: "ID of the wiki to export"
      - name: file
        short: f
        type: path
        path_kind: instance_host
        description: >-
          Output file path on the instance's host (default: <wikiID>.sql, use
          .gz for compression). For an instance on a remote host, an absolute
          path or one starting with a quoted '~' (for example '~/x')

  # ---------------------------------------------------------------------------
  # Config management
  # ---------------------------------------------------------------------------
  - name: config_get
    description: "Show configuration settings"
    long_description: |
      Show configuration settings from the instance .env file.
      With no keys, prints all settings. With one or more keys,
      prints just those values.

      Credential values are masked in the no-key listing, which is the
      output that tends to end up in a scrollback, a CI log or a support
      thread. Naming a key prints its value, since that is an explicit
      request for it; `--show-secrets` unmasks the whole listing.
    examples:
      - "canasta config get"
      - "canasta config get MW_SITE_SERVER"
      - "canasta config get MW_SITE_SERVER HTTPS_PORT"
      - "canasta config get --show-secrets"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: keys
        type: string
        positional: true
        multi: true
        description: "Configuration key(s) to query"
      - name: show_secrets
        long: show-secrets
        type: bool
        default: false
        description: "Print credential values instead of masking them"
      - name: force
        short: f
        type: bool
        default: false
        description: "Allow querying unrecognized keys"

  - name: config_set
    description: "Change configuration values"
    long_description: |
      Change one or more configuration values in the instance .env file.
      Handles side effects automatically (e.g. updating wikis.yaml when
      changing HTTPS_PORT).
    examples:
      - "canasta config set MW_SITE_SERVER=https://example.com"
      - "canasta config set --web MW_MAP_DOMAIN_TO_DOCKER_GATEWAY=false"
      - "canasta config set --secret --web MAPS_API_KEY=abc123"
    playbook: config_set.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: settings
        type: string
        positional: true
        multi: true
        as_list: true
        description: "KEY=VALUE pairs to set"
      - name: no_restart
        type: bool
        default: false
        description: "Save settings without restarting the instance"
      - name: force
        short: f
        type: bool
        default: false
        description: "Allow setting unrecognized keys"
      - name: secret
        type: bool
        default: false
        description: >-
          Store opaque app secrets such as a sidecar credential or a
          Settings.php API key, bypassing .env validation and side effects.
          The value goes in .env, where a sidecar's env can reference it as
          ${KEY}, and the key name is recorded in config/secret-keys; on a
          gitops instance it is also stored in the encrypted host vars.
          Recognized configuration keys are
          rejected; set them without --secret.
      - name: web
        type: bool
        default: false
        description: >-
          Pass the key(s) to the web container's environment (which also
          runs the job runner), for a setting the web image or Settings.php
          reads with getenv() that Canasta does not pass on its own.
          Without --secret the value is a plain setting: it is stored in
          .env (and env.template on a gitops instance), shown by 'config
          get', and the key is listed in config/env-keys-web; it reaches the
          container through the generated docker-compose.web-env.yml.
          Unrecognized keys are accepted without --force; recognized keys
          and keys named like credentials are refused. With --secret, the
          key is listed in config/secret-keys-web and passed the same way.

  - name: config_refresh_template
    description: "List, diff, or adopt template versions of seeded config files"
    long_description: |
      Overwrite an instance's copy of a template-seeded config file
      (e.g. config/default.vcl, config/settings/global/Vector.php) with
      the version shipped in the current CLI. These files are copied
      once when the instance is created and then owned by you, so an
      upgrade never changes them; use this to adopt an improved shipped
      version, or to restore a seed file you deleted.

      This command is read-only unless --apply is given. With no file
      argument it lists the seed files whose instance copy differs from
      the current template. With one or more files it shows the diff but
      changes nothing; add --apply to overwrite, so review the diff first
      (your local edits to that file are replaced). --apply requires at
      least one file name. Rendered files (.env,
      wikis.yaml, Caddyfile) belong to 'canasta reconcile' and per-wiki
      Settings.php is user-owned; neither is touched here. --yes is
      accepted as a deprecated spelling of --apply.
    examples:
      - "canasta config refresh-template"
      - "canasta config refresh-template config/default.vcl"
      - "canasta config refresh-template config/default.vcl --apply"
    playbook: config_refresh_template.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: files
        type: string
        positional: true
        multi: true
        description: >-
          Template-seeded file path(s) to refresh, relative to the
          instance root (e.g. config/default.vcl)
      - name: apply
        type: bool
        default: false
        aliases: ["--yes", "-y"]
        description: "Overwrite the instance copy (without this, only previews the diff)"

  - name: config_unset
    description: "Remove a configuration setting"
    long_description: |
      Remove one or more configuration keys from the `.env` file of
      a Canasta instance.

      Each argument is a key name to remove. Multiple keys can be
      removed in a single invocation and only one restart is
      performed.

      If a key has side effects (e.g., `HTTPS_PORT`), they are
      reverted before the key is removed. A key set with `config set --web`
      is also removed from `config/env-keys-web`, so it is no longer passed
      to the web container. The instance is then
      restarted unless `--no-restart` is specified.

      With `--secret`, the keys set with `config set --secret` are
      removed, along with any `--web` exposure: from `.env` (and the
      gitops vars), `config/secret-keys`, and `config/secret-keys-web`.
    examples:
      - "canasta config unset MW_SITE_SERVER"
      - "canasta config unset MY_SIDECAR_TOKEN --secret"
    playbook: config_unset.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: keys
        type: string
        positional: true
        multi: true
        description: "Configuration keys to remove"
      - name: no_restart
        type: bool
        default: false
        description: "Remove settings without restarting the instance"
      - name: force
        short: f
        type: bool
        default: false
        description: "Allow unsetting unrecognized keys"
      - name: secret
        type: bool
        default: false
        description: >-
          Remove key(s) set with 'config set --secret', including their
          --web exposure, instead of plain .env keys.

  # ---------------------------------------------------------------------------
  # Extensions
  # ---------------------------------------------------------------------------
  - name: extension_list
    description: "Lists all the installed Canasta extensions"
    long_description: |
      List the names of the extensions available in the instance: those
      bundled in the Canasta image plus any user extensions. Whether an
      extension is enabled is not shown.
    examples:
      - "canasta extension list"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID within the farm"

  - name: extension_enable
    description: "Enable a Canasta extension"
    long_description: |
      Enable one or more Canasta extensions by name. Multiple
      extensions can be specified as a comma-separated list. Use
      the `--wiki` flag to enable an extension for a specific wiki
      only.

      After enabling, `update.php` is automatically run to apply any
      required database changes. Use `--skip-update` to skip this
      step.

      An extension whose extension.json requires an extension or skin that is not
      enabled is refused, naming what is missing; enable it first or name
      it in the same command. Only what `canasta extension enable` and
      `canasta skin enable` enabled counts, not what other settings files
      load. If applying the change or `update.php`
      fails, what the command enabled is disabled again so the wikis keep
      loading.
    examples:
      - "canasta extension enable VisualEditor,Cite"
    playbook: extension_enable.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID within the farm"
      - name: extensions
        type: string
        positional: true
        required: true
        description: "Comma-separated extension names"
      - name: skip_update
        type: bool
        default: false
        description: "Skip running update.php after enabling"

  - name: extension_disable
    description: "Disable a Canasta extension"
    long_description: |
      Disable one or more Canasta extensions by name. Multiple
      extensions can be specified as a comma-separated list. Use
      the `--wiki` flag to disable an extension for a specific wiki
      only.

      An extension that another extension or skin enabled with `canasta
      extension enable` or `canasta skin enable` requires is refused,
      naming the ones that require it. This is checked while the instance
      is running.
    examples:
      - "canasta extension disable VisualEditor"
    playbook: extension_disable.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID within the farm"
      - name: extensions
        type: string
        positional: true
        required: true
        description: "Comma-separated extension names"

  - name: extension_remove
    description: "Remove a previously added non-bundled extension"
    long_description: |
      Undo `canasta extension add`: disables the extension in the global and every
      wiki's settings.yaml,
      deletes its directory from the instance's extensions/ directory (on a
      gitops instance, deinit and unregister the submodule and clean up
      .git/modules), unregisters its composer.json from
      config/composer.local.json and re-runs `composer update --no-dev`,
      commits the removal (gitops), and starts the containers if they are
      stopped.

      Names not present under extensions/ are reported and skipped. Database
      tables created by the removed extension are left in place — MediaWiki
      does not reverse schema updates. Run `canasta gitops push` afterwards
      to distribute a gitops removal to other hosts.

      An extension that another extension or skin enabled with `canasta
      extension enable` or `canasta skin enable` requires is refused,
      naming the ones that require it. This is checked while the instance
      is running.
    examples:
      - "canasta extension remove MyExtension"
      - "canasta extension remove MyExtension,OtherExtension"
    playbook: extension_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: names
        type: string
        positional: true
        required: true
        description: "Comma-separated extension names"

  - name: skin_remove
    description: "Remove a previously added non-bundled skin"
    long_description: |
      Undo `canasta skin add`: disables the skin in the global and every
      wiki's settings.yaml,
      deletes its directory from the instance's skins/ directory (on a
      gitops instance, deinit and unregister the submodule and clean up
      .git/modules), unregisters its composer.json from
      config/composer.local.json and re-runs `composer update --no-dev`,
      commits the removal (gitops), and starts the containers if they are
      stopped.

      Names not present under skins/ are reported and skipped. Run
      `canasta gitops push` afterwards to distribute a gitops removal to
      other hosts.

      A skin that another extension or skin enabled with `canasta
      extension enable` or `canasta skin enable` requires is refused,
      naming the ones that require it. This is checked while the instance
      is running.
    examples:
      - "canasta skin remove Mirage"
      - "canasta skin remove Mirage,Cosmos"
    playbook: skin_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: names
        type: string
        positional: true
        required: true
        description: "Comma-separated skin names"

  - name: extension_set_version
    description: "Pin a user extension to a specific version"
    long_description: |
      Move a gitops-managed user extension's submodule to a specific
      version (branch, tag, or commit) and stage the change, ready for
      `canasta gitops push` to distribute it to every host. This replaces
      the raw `git checkout` inside the submodule that changing an
      extension's version otherwise requires.

      Pass the release branch matching your MediaWiki version (e.g.
      `REL1_43`) rather than a development branch like `master`, which is
      the common cause of version-mismatch regressions.
      Only user extensions (vendored as submodules) can be pinned. A
      bundled extension has no per-instance submodule, so this refuses it —
      to use a different version, add it with `canasta extension add
      --override`, whose copy overrides the bundled one and, on a gitops
      instance, can then be pinned here. Pass `--run-update` to
      apply any database schema changes for the new version immediately;
      otherwise run `canasta maintenance update` afterward if the version
      touches the schema.
    examples:
      - "canasta extension set-version UserPageEditProtection --ref REL1_43"
    playbook: extension_set_version.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: extension_name
        type: string
        positional: true
        required: true
        description: "Extension name (the extensions/<extension_name> submodule)"
      - name: ref
        type: string
        required: true
        description: "Version to pin to: a branch, tag, or commit SHA"
      - name: run_update
        type: bool
        default: false
        description: "Run update.php after pinning to apply DB schema changes"

  - name: extension_add
    description: "Add an extension, cloning it from its git repository if needed"
    long_description: |
      Add a MediaWiki extension to the instance and enable it. Each name is
      matched case-insensitively and handled in this order:

      # Already in the instance's extensions/ directory: the existing checkout is
        kept and its branch is verified.
      # Bundled with Canasta (shipped in the image): nothing is cloned; the
        extension is only enabled. `--repository` and `--branch` are refused,
        since the image sets its version, unless `--override` is given.
      # Otherwise it is cloned into extensions/, which requires `--clone`
        (or an explicit `--repository`). Without it the command fails before
        changing anything and names the URL it would clone and where that
        URL came from.

      When cloning, the git URL is taken from `--repository`, else from
      ExtensionJson.json (the extjsonuploader Toolforge dataset), else from
      Wikimedia Gerrit (mediawiki/extensions/<Name>). URLs from
      ExtensionJson.json and Gerrit must be https. When Gerrit does not
      answer, its GitHub mirror (github.com/wikimedia/mediawiki-extensions-<Name>)
      is used instead. The URL and its source are
      printed for every clone, flagged when the repository is not hosted on
      Wikimedia Gerrit. Pass `--branch` to pin a specific branch. The branch is
      chosen automatically as REL1_YY matching the instance's MediaWiki
      version (e.g. MediaWiki 1.43 -> REL1_43), tried on every remote (GitHub
      and GitLab mirrors carry the same REL branches); if the REL branch does
      not exist there, the default branch is used unless `--branch` is given.
      Override the detected version with `--mw-version`.

      If the extension ships a composer.json, its non-dev requirements are
      installed: it is registered in config/composer.local.json (committed in
      gitops) and `composer update --no-dev` runs in the web container.
      A composer.json whose autoload.files names a file the extension does
      not ship is not registered, and the command fails; so does a composer
      update after which the autoloader requires a missing file, with the
      registration rolled back so the wikis keep loading.

      With `--override`, a bundled extension is cloned like any other, at the
      branch `--branch` names (or the automatic one), from `--repository` or
      the usual lookup, and `--clone` is not needed. The copy in extensions/
      overrides the bundled one: the command warns, naming both versions, and
      restarts the instance so the copy is loaded. `canasta extension list` marks
      it, `canasta upgrade` warns while its version differs from the bundled
      one, and `canasta extension remove` deletes the copy, so the bundled extension is
      used again, still enabled.

      On a gitops instance the extension is added as a submodule and committed
      (run `canasta gitops push` to distribute it). The extension is then
      enabled automatically (write settings + run update.php); use
      `--skip-enable` to add the code only.

      Enabling refuses an extension whose extension.json requires an extension or
      skin that is not enabled, and is rolled back if `update.php` fails;
      the code stays added.
    examples:
      - "canasta extension add ParserFunctions"
      - "canasta extension add DarkMode --clone"
      - "canasta extension add DarkMode --clone --mw-version 1.43.2"
      - "canasta extension add MyExtension --repository https://example.org/MyExtension.git --branch main"
      - "canasta extension add SemanticMediaWiki --override --branch 7.2.1"
    playbook: extension_add.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID to enable the extension for (passed to enable)"
      - name: names
        type: string
        positional: true
        required: true
        description: "Comma-separated extension names"
      - name: mw_version
        type: string
        description: "MediaWiki version (e.g. 1.43.2); overrides auto-detection for REL1_YY branch selection"
      - name: repository
        type: string
        description: "Git URL to clone (overrides the name lookup); only with a single name"
      - name: branch
        type: string
        description: "Branch to check out (overrides auto branch selection); only with a single name"
      - name: clone
        type: bool
        default: false
        description: "Allow cloning extensions that are neither bundled nor already in extensions/"
      - name: override
        type: bool
        default: false
        description: "Clone a bundled extension into extensions/, where the copy overrides the bundled one"
      - name: skip_enable
        type: bool
        default: false
        description: "Add the code only; do not enable the extension"
      - name: skip_update
        type: bool
        default: false
        description: "Skip running update.php after enabling"

