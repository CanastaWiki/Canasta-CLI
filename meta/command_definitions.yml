  # ---------------------------------------------------------------------------
  # Maintenance
  # ---------------------------------------------------------------------------
  - name: maintenance_update
    description: "Run MediaWiki maintenance update"
    long_description: |
      Run standard MediaWiki maintenance: update.php, runJobs.php,
      and Semantic MediaWiki rebuildData.php on wikis that load SMW.
    examples:
      - "canasta maintenance update"
      - "canasta maintenance update -w mywiki --skip-jobs"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID to run on (default: all wikis)"
      - name: skip_jobs
        type: bool
        default: false
        description: "Skip running runJobs.php"
      - name: skip_smw
        type: bool
        default: false
        description: "Skip running Semantic MediaWiki rebuildData.php"

  - name: maintenance_script
    description: "Run maintenance scripts"
    long_description: |
      Run a MediaWiki core maintenance script inside the web
      container.

      With no arguments, lists all available maintenance scripts.
      With one or more arguments, runs the specified script. The
      script name is relative to the `maintenance/` directory. The
      `.php` suffix is optional — `createAndPromote` and
      `createAndPromote.php` are both valid.

      Flags (`-i`, `--wiki`) must come before the script name.
      Everything after the script name is treated as script
      arguments — no quotes needed.

      In a wiki farm, runs on all wikis by default. Use `--wiki` to
      target a specific wiki.
    examples:
      - "canasta maintenance script rebuildall"
      - "canasta maintenance script createAndPromote SomeUser --sysop"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID to run script on"
      - name: script_args
        type: string
        positional: true
        description: "Maintenance script name and arguments"

  - name: maintenance_extension
    description: "Run extension maintenance scripts"
    long_description: |
      Run maintenance scripts provided by MediaWiki extensions.

      With no arguments, lists all installed extensions that have a
      `maintenance/` directory. With arguments, runs the specified
      script using MediaWiki's `run.php` wrapper with the extension-
      prefix syntax `<ExtName>:<scriptName>`. The `.php` suffix is
      optional. Anything after the script name is passed through as
      script arguments — no quotes needed.

      In a wiki farm, runs on all wikis by default. Use `--wiki` to
      target a specific wiki.
    examples:
      - "canasta maintenance extension"
      - "canasta maintenance extension Cite:fixHTMLOutputForCite"
      - "canasta maintenance extension SemanticMediaWiki:rebuildData -v"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID"
      - name: script_args
        type: string
        positional: true
        description: "Extension maintenance script and arguments"

  - name: maintenance_exec
    description: "Execute a command in a container"
    unfinished_pull_ok: true
    long_description: |
      Execute an arbitrary command inside a container of a Canasta instance.

      With no arguments and no --service flag, lists the running services.
      The default service is "web" (the MediaWiki container).

      Use --stdin-file to feed a file to the command's standard input — for
      example, piping wikitext to `maintenance/run.php edit <page>`. The
      file is read on the controller, so it works for local and remote
      targets alike. Content is read as text (UTF-8).

      On a wiki farm, a MediaWiki command run without --wiki uses the
      first wiki listed in config/wikis.yaml. Pass --wiki=<id> in the
      command itself, for example
      `php maintenance/run.php edit --wiki=<id> <page>`.
    examples:
      - "canasta maintenance exec -- ls /var/www/mediawiki"
      - "canasta maintenance exec -s db -- mariadb-admin ping -h localhost"
      - "canasta maintenance exec --stdin-file page.txt -- php run.php edit 'Main Page'"
    playbook: maintenance_exec.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: service
        short: s
        type: string
        description: "Service name (default: web)"
      - name: stdin_file
        type: path
        description: "File fed to the command's standard input (e.g. wikitext for an edit), read as UTF-8 on the controller."
      - name: exec_args
        type: string
        positional: true
        description: "Command and arguments to execute"

  # ---------------------------------------------------------------------------
  # Schedules
  # ---------------------------------------------------------------------------
  - name: schedule_add
    description: "Add a recurring maintenance command"
    long_description: |
      Add a schedule that runs a shell command inside a container of the
      instance (the web container unless `--service` names another) on a
      standard 5-field cron expression
      `minute hour day-of-month month day-of-week`.

      The command runs under bash (or sh where the container has no bash)
      inside the container, so paths, PHP, and the environment are the
      container's: `php maintenance/run.php ...` runs from the MediaWiki
      directory. In the web container it runs as `www-data`, as
      maintenance scripts do; in another service's container, as that
      image's user. A `%` in the command is passed through as is. On a wiki farm, pass `--wiki=<id>` in the command to
      target a wiki other than the first.

      A name that is already in use is refused; to change a schedule,
      remove it and add it again. `backup` is reserved for
      `canasta backup schedule`.

      On a gitops instance, `--gitops-hosts` limits the schedule to the
      named gitops hosts. It is then installed only on those hosts, so
      another host in the repository, or a clone restored from a backup,
      does not run it. Without it, every host runs the schedule against
      its own instance.

      If a run is still going when the schedule fires again, the new run
      is skipped. A restart or upgrade that replaces the container stops a
      run in progress; it is recorded as failed and the next firing runs
      as usual.
    examples:
      - "canasta schedule add -n parser-cache --cron '0 3 * * *' --command 'php maintenance/run.php purgeParserCache --age 604800'"
      - "canasta schedule add -n rebuild --cron '30 4 * * 0' --command 'php maintenance/run.php rebuildall' --gitops-hosts prod"
    playbook: schedule_add.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: schedule_name
        long: name
        short: n
        type: string
        required: true
        description: "Schedule name (lowercase letters, digits, hyphens)"
      - name: cron
        type: string
        required: true
        description: "5-field cron expression"
      - name: schedule_command
        long: command
        type: string
        required: true
        description: "Shell command to run inside the container"
      - name: service
        short: s
        type: string
        description: "Service whose container runs the command (default: web)"
      - name: gitops_hosts
        type: string
        description: "Comma-separated gitops hosts to run the schedule on (default: all)"

  - name: schedule_list
    description: "List an instance's schedules"
    unfinished_pull_ok: true
    long_description: |
      List the instance's schedules with their service, cron expression,
      command, and the time and result of the last run (`ok`, `exit <n>`,
      or `never`). The backup schedule, if one is set, is listed as a
      read-only `backup` row.

      Warns when the crontab on this host does not match
      `config/schedules.yml`: a schedule with no crontab entry, or an
      entry with no schedule.
    examples:
      - "canasta schedule list"
    playbook: schedule_list.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: schedule_remove
    description: "Remove a recurring maintenance command"
    long_description: |
      Remove a schedule from `config/schedules.yml` and its crontab entry.
      A run already in progress finishes; its log is kept.
    examples:
      - "canasta schedule remove --name parser-cache"
    playbook: schedule_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: schedule_name
        long: name
        short: n
        type: string
        required: true
        description: "Schedule name"

  - name: schedule_run
    description: "Run a schedule's command now"
    long_description: |
      Run a schedule's command once, now, regardless of its cron
      expression. This is also what each scheduled firing runs. The
      command's output is printed, and this exits non-zero when the command
      fails; the command's own exit status is recorded and shown by
      `canasta schedule list`. If the previous run of the same schedule is
      still going, this run is skipped and exits zero.
    examples:
      - "canasta schedule run --name parser-cache"
    playbook: schedule_run.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: schedule_name
        long: name
        short: n
        type: string
        required: true
        description: "Schedule name"

  # ---------------------------------------------------------------------------
  # CrowdSec
  # ---------------------------------------------------------------------------
  - name: crowdsec_bouncer_enroll
    description: "Register the Caddy bouncer with the CrowdSec engine"
    long_description: |
      Register the Caddy bouncer with the running CrowdSec engine,
      store the generated API key as CROWDSEC_BOUNCER_API_KEY, and
      restart so the bouncer begins enforcing decisions.

      Enabling CrowdSec
      (`canasta config set CANASTA_ENABLE_CROWDSEC=true`) now enrolls the
      bouncer automatically on the next start, so you rarely need to run
      this by hand. It is idempotent: if the bouncer is already enrolled
      and a key is stored, it reports success and does nothing. Use
      `--force` to revoke the existing bouncer and issue a fresh key
      (e.g. to rotate a key, or recover one that drifted out of sync).
      Distinct from `console-enroll`, which connects the engine to the
      cloud CrowdSec Console.
    examples:
      - "canasta crowdsec bouncer-enroll"
      - "canasta crowdsec bouncer-enroll -i mysite"
      - "canasta crowdsec bouncer-enroll -i mysite --force"
    playbook: crowdsec_bouncer_enroll.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: force
        short: f
        type: bool
        default: false
        description: "Revoke the existing bouncer and issue a fresh key"

  - name: crowdsec_console_enroll
    description: "Connect CrowdSec to the Console for the full community blocklist"
    long_description: |
      Enroll this instance's CrowdSec engine in the CrowdSec Console
      (https://app.crowdsec.net) to unlock the full community blocklist
      plus any console-managed third-party blocklists.

      This is optional. Without it, the engine still pulls the smaller
      "Lite" community blocklist automatically via the Central API — so
      CrowdSec already blocks crowd-sourced IPs out of the box; console
      enrollment just upgrades that to the full list.

      Get an enrollment key from the Console (Security Engines → Enroll),
      run this command, then return to the Console to accept the pending
      engine and subscribe it to the blocklists you want. Distinct from
      `canasta crowdsec bouncer-enroll`, which registers the local Caddy
      bouncer with the engine.
    examples:
      - "canasta crowdsec console-enroll cssde-xxxxxxxxxxxx"
      - "canasta crowdsec console-enroll cssde-xxxxxxxxxxxx --name prod1"
      - "canasta crowdsec console-enroll cssde-xxxxxxxxxxxx -i mysite"
    playbook: crowdsec_console_enroll.yml
    parameters:
      - name: key
        type: string
        positional: true
        required: true
        description: "Console enrollment key from app.crowdsec.net"
      - name: name
        type: string
        description: "Instance name to show in the Console"
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: crowdsec_reload
    description: "Restart the CrowdSec engine to apply changes"
    long_description: |
      Restart the CrowdSec engine to apply pending changes without
      restarting the whole instance. Use it after accepting a console
      enrollment or after editing `config/crowdsec/whitelists.yaml`.
      Only the engine restarts, so the Caddy bouncer keeps enforcing its
      cached decisions throughout. Note that community and console blocklists arrive on
      CrowdSec's own pull cycle (about every 2 hours), which a restart does
      not force.

      After you unsubscribe a list — or delete the engine — in the Console,
      the engine keeps enforcing the IPs it already pulled from that list:
      they stay in its local decision DB and the Caddy bouncer keeps blocking
      them. It just stops receiving updates (a free-tier engine gets no
      reconcile, since that is a paid PAPI order). That frozen snapshot is
      usually fine to leave in place. Purge it only when you actually want to
      STOP blocking those IPs: add `--purge-blocklist <name>` (one list, by the
      name shown under "Console blocklists in effect" in `canasta crowdsec
      status`) or `--purge-blocklists` (all). Lists you are still subscribed to
      refill on the next pull cycle.
    examples:
      - "canasta crowdsec reload"
      - "canasta crowdsec reload -i mysite"
      - "canasta crowdsec reload --purge-blocklist firehol_cruzit_web_attacks"
      - "canasta crowdsec reload --purge-blocklists"
    playbook: crowdsec_reload.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: purge_blocklist
        type: string
        description: "Stop blocking one console blocklist's cached IPs, by the name shown in status"
      - name: purge_blocklists
        type: bool
        default: false
        description: "Stop blocking all cached console-blocklist IPs"

  - name: crowdsec_status
    description: "Show CrowdSec bouncers and active decisions"
    unfinished_pull_ok: true
    long_description: |
      Show the bouncers registered with the CrowdSec engine and the IP
      decisions (bans, captchas) currently in effect. Read-only.

      Also shows whether the engine is registered with the Central API and
      when the community blocklist last updated. Updates normally arrive
      every 2 hours; if none has arrived for 3 hours, the line is a warning
      instead: the engine cannot reach the Central API, or it is being
      refused. All of this is read from the engine's local state, so the
      command never contacts the Central API.
    examples:
      - "canasta crowdsec status"
      - "canasta crowdsec status -i mysite"
    playbook: crowdsec_status.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: crowdsec_ban
    description: "Block an IP via a manual CrowdSec decision"
    long_description: |
      Add a manual CrowdSec decision blocking an IP address, independent
      of the engine's automatic detection. Defaults to a 4-hour ban.
    examples:
      - "canasta crowdsec ban 203.0.113.50"
      - "canasta crowdsec ban 203.0.113.50 --duration 24h --reason scraper"
      - "canasta crowdsec ban 203.0.113.50 -i mysite"
    playbook: crowdsec_ban.yml
    parameters:
      - name: ip
        type: string
        positional: true
        required: true
        description: "IP address to block"
      - name: duration
        type: string
        description: "Ban duration (e.g. 4h, 24h, 7d). Default: CrowdSec's 4h"
      - name: reason
        type: string
        description: "Reason recorded with the decision"
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: crowdsec_unban
    description: "Remove a manual CrowdSec decision for an IP"
    long_description: |
      Remove CrowdSec decisions for an IP address (e.g. lift a ban added
      by `canasta crowdsec ban` or by automatic detection).
    examples:
      - "canasta crowdsec unban 203.0.113.50"
      - "canasta crowdsec unban 203.0.113.50 -i mysite"
    playbook: crowdsec_unban.yml
    parameters:
      - name: ip
        type: string
        positional: true
        required: true
        description: "IP address to unblock"
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: crowdsec_scenarios
    description: "List the loaded CrowdSec detection (collections and scenarios)"
    unfinished_pull_ok: true
    long_description: |
      Show the detection logic the CrowdSec engine has loaded: the
      installed hub collections (e.g. `crowdsecurity/caddy`,
      `crowdsecurity/http-cve`) and the individual scenarios they
      provide. Use it to confirm behavioral detection is active — the
      bundled `crowdsecurity/caddy` collection covers aggressive
      crawling and known scraper/bot user-agents out of the box.
      Replaces reaching for `docker compose exec crowdsec cscli
      scenarios list`. Read-only.
    examples:
      - "canasta crowdsec scenarios"
      - "canasta crowdsec scenarios -i mysite"
    playbook: crowdsec_scenarios.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: crowdsec_alerts
    description: "Show recent CrowdSec alerts (detected attacks)"
    unfinished_pull_ok: true
    long_description: |
      List the alerts the CrowdSec engine has raised — the attacks and
      probes its scenarios have detected over time. Unlike
      `canasta crowdsec status`, which shows the IP decisions currently
      being enforced, alerts include the detection history (and
      community/console-sourced events), so this answers "is CrowdSec
      actually catching anything?". Optionally filter by source IP.
      Read-only.
    examples:
      - "canasta crowdsec alerts"
      - "canasta crowdsec alerts --ip 203.0.113.50"
      - "canasta crowdsec alerts -i mysite"
    playbook: crowdsec_alerts.yml
    parameters:
      - name: ip
        type: string
        description: "Show only alerts for this source IP"
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: crowdsec_metrics
    description: "Show CrowdSec engine throughput metrics"
    unfinished_pull_ok: true
    long_description: |
      Show the CrowdSec engine's metrics: log lines read from the Caddy
      access log, how often each scenario has fired, and how many
      decisions each bouncer has pulled. The quickest way to confirm
      detection is flowing — a parsed-lines count of zero means the
      engine isn't seeing the Caddy log, which no other command reveals.
      Read-only.
    examples:
      - "canasta crowdsec metrics"
      - "canasta crowdsec metrics -i mysite"
    playbook: crowdsec_metrics.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  # ---------------------------------------------------------------------------
  # DevMode
  # ---------------------------------------------------------------------------
  - name: devmode_enable
    description: "Enable development mode"
    long_description: |
      Enable development mode on a Canasta instance. Extracts MediaWiki code
      for live editing and builds an Xdebug-enabled image.
    examples:
      - "canasta devmode enable"
    playbook: devmode_enable.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: devmode_disable
    description: "Disable development mode"
    long_description: |
      Disable development mode. Restores extensions and skins as real
      directories and removes Xdebug.
    examples:
      - "canasta devmode disable"
    playbook: devmode_disable.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  # ---------------------------------------------------------------------------
  # Sitemap
  # ---------------------------------------------------------------------------
  - name: sitemap_generate
    description: "Generate sitemaps for one or all wikis"
    long_description: |
      Generate XML sitemaps for wikis in a Canasta instance. If
      `--wiki` is specified, generates a sitemap for that wiki only.
      Otherwise, generates sitemaps for all wikis in the instance.
      Once generated, the background generator will automatically
      refresh them.

      The sitemaps are published at `MW_SITEMAP_URL_PATH` (default
      `/public_assets/sitemap`), relative to each wiki's URL. A wiki's
      sitemap path cannot contain another wiki's URL on the same host,
      or lie inside one other than a URL its own wiki's URL lies within.
      A path under the article path, such as `/wiki/sitemap`, is served
      from the sitemap files, so a page whose title starts with
      `sitemap/` is reachable only by its capitalized title
      (`Sitemap/...`), and not at all on a wiki with
      `$wgCapitalLinks = false`.

      A wiki's sitemap files are named after its identifier, which
      defaults to the wiki ID: the index is
      `sitemap-index-<identifier>.xml`. `--identifier` stores a
      different one for the `--wiki` wiki in `wikis.yaml` (its
      `sitemap_identifier`), so that an existing index URL can be kept;
      the files of its previous identifier are removed.
      Passing the wiki ID as the identifier restores the default.
    examples:
      - "canasta sitemap generate"
      - "canasta sitemap generate -w mywiki"
      - "canasta sitemap generate -w mywiki --identifier mediawiki"
    playbook: sitemap_generate.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID (omit to generate for all wikis)"
      - name: identifier
        type: string
        description: >-
          Name the --wiki wiki's sitemap files after this identifier
          (letters, digits, '_', '-' and '.', starting with a letter or
          digit) from now on

  - name: sitemap_remove
    description: "Remove sitemaps for one or all wikis"
    long_description: |
      Remove XML sitemap files for wikis in a Canasta instance. If
      `--wiki` is specified, removes the sitemap for that wiki only.
      Otherwise, removes sitemaps for all wikis. Once removed, the
      background generator will skip those wikis.
    examples:
      - "canasta sitemap remove"
    playbook: sitemap_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki ID (omit to remove for all wikis)"

  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------
  - name: backup_init
    description: "Initialize a backup repository"
    long_description: |
      Initialize a new backup repository. This must be run once
      before creating any backups. The repository location is read
      from the `RESTIC_REPOSITORY` variable (or AWS S3 settings) in
      the instance's `.env` file.
    examples:
      - "canasta backup init"
    playbook: backup_init.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: backup_list
    description: "List backups"
    unfinished_pull_ok: true
    long_description: |
      List all snapshots stored in the backup repository. Displays
      each snapshot's ID, timestamp, hostname, and tags. Snapshots
      tagged `INCOMPLETE` are also listed in a warning below the table,
      with the databases each one is missing.
    examples:
      - "canasta backup list"
    playbook: backup_list.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: backup_create
    description: "Create a backup"
    long_description: |
      Create a backup snapshot. Dumps all wiki databases, stages
      config/extensions/images/skins/public_assets and the `sidecars/`
      build contexts, and uploads to the repository.

      A wiki whose data extends into a second database — Cargo's
      `$wgCargoDBname` being the usual case — declares it with
      `canasta backup databases add`.

      Declared databases are dumped in the same invocation as the wiki's
      own, so both come from one transaction. That matters for Cargo,
      whose data tables live in the extra database while the metadata
      tracking them (`cargo_pages`) lives in the wiki database: captured
      at different moments, the metadata under-reports, and editing an
      affected page appends duplicate rows instead of replacing them.

      If a wiki's databases cannot be dumped, the other wikis are still
      dumped and the snapshot is still saved, but it is tagged
      `INCOMPLETE` with a `missing-db:<name>` tag for each database it
      lacks, and the command exits non-zero naming each failed database
      and its error. A scheduled backup's purge therefore does not run.

      Each wiki's dump may run for 240 minutes. A
      dump still running then is stopped and the backup fails. Set
      `CANASTA_BACKUP_TIMEOUT` in `.env` to allow a different number of
      minutes.
    examples:
      - "canasta backup create -t before-upgrade"
    playbook: backup_create.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: tag
        short: t
        type: string
        required: true
        validator: backup_tag
        description: "Backup tag"

  - name: backup_restore
    description: "Restore a backup"
    long_description: |
      Restore a Canasta instance from a backup snapshot. By default,
      a safety snapshot is taken before restoring. The restore
      replaces configuration files, extensions, images, skins,
      public_assets, the `sidecars/` build contexts, `.env`,
      `docker-compose.override.yml`, `my.cnf`, and all wiki databases — including any extra databases declared in
      `config/wikis.yaml` — with the contents of the specified snapshot.

      Use `-w`/`--wiki` to restore only a single wiki's database,
      per-wiki settings, images, and public assets from the backup,
      leaving shared files untouched.

      A snapshot tagged `INCOMPLETE` is missing databases that failed to
      dump when it was taken. Restore refuses it, naming the missing
      databases, unless `--allow-incomplete` is given; with the flag it
      restores everything the snapshot has and leaves the missing
      databases as they are. `-s latest` skips `INCOMPLETE` snapshots
      unless `--allow-incomplete` is given.

      Each wiki's database import may run for
      `CANASTA_BACKUP_TIMEOUT` minutes (240 by default), read from the
      `.env` in place when the import starts. A full restore has already
      replaced `.env` with the snapshot's by then.
    examples:
      - "canasta backup restore -s abc123"
      - "canasta backup restore -s abc123 --allow-incomplete"
    playbook: backup_restore.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: snapshot
        short: s
        type: string
        required: true
        description: "Snapshot ID"
      - name: skip_safety_backup
        type: bool
        default: false
        description: "Skip taking a safety snapshot before restore"
      - name: wiki
        short: w
        type: string
        description: "Restore only this wiki's database and per-wiki files"
      - name: allow_incomplete
        type: bool
        default: false
        description: "Restore a snapshot tagged INCOMPLETE, which is missing databases"

  - name: backup_delete
    description: "Delete a backup"
    long_description: |
      Remove a snapshot from the backup repository by its ID. The
      snapshot data may still exist until a prune is run on the
      repository.
    examples:
      - "canasta backup delete -s abc123"
    playbook: backup_delete.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: snapshot
        short: s
        type: string
        required: true
        description: "Snapshot ID to delete"

  - name: backup_unlock
    description: "Remove locks other processes created"
    long_description: |
      Remove stale lock files from the backup repository. Use this
      if a previous backup operation was interrupted and left the
      repository in a locked state.
    examples:
      - "canasta backup unlock"
    playbook: backup_unlock.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: backup_files
    description: "List files in a backup"
    unfinished_pull_ok: true
    long_description: |
      List all files contained in a specific backup snapshot. This
      is useful for inspecting what was backed up before performing
      a restore.
    examples:
      - "canasta backup files -s abc123"
    playbook: backup_files.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: snapshot
        short: s
        type: string
        required: true
        description: "Snapshot ID"

  - name: backup_check
    description: "Check backup repository integrity"
    unfinished_pull_ok: true
    long_description: |
      Verify the integrity of the backup repository and its data.
      This checks for errors in the repository structure and
      snapshot data.
    examples:
      - "canasta backup check"
    playbook: backup_check.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: backup_diff
    description: "Show difference between two backups"
    unfinished_pull_ok: true
    long_description: |
      Show the differences between two backup snapshots. This
      compares the file contents and metadata of both snapshots,
      displaying added, removed, and modified files.
    examples:
      - "canasta backup diff -s snap1 --snapshot2 snap2"
    playbook: backup_diff.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: snapshot
        short: s
        type: string
        required: true
        description: "First snapshot ID"
      - name: snapshot2
        type: string
        required: true
        description: "Second snapshot ID"

  - name: backup_purge
    description: "Remove old backups based on retention policy"
    long_description: |
      Remove backup snapshots that exceed the specified retention
      policy and reclaim disk space. At least one retention flag
      (e.g. `--keep-within` or `--keep-last`) is required. The
      retention flags mirror restic's `forget` options.

      Deleting snapshots cannot be undone, so preview the effect of a
      retention policy with `--dry-run` before running it for real.
    examples:
      - "canasta backup purge --keep-last 5"
      - "canasta backup purge --keep-within 30d"
      - "canasta backup purge --keep-within 30d --dry-run"
    playbook: backup_purge.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: keep_last
        type: string
        description: "Number of most recent backups to keep"
      - name: keep_hourly
        type: string
        description: "Number of hourly backups to keep"
      - name: keep_daily
        type: string
        description: "Number of daily backups to keep"
      - name: keep_weekly
        type: string
        description: "Number of weekly backups to keep"
      - name: keep_monthly
        type: string
        description: "Number of monthly backups to keep"
      - name: keep_yearly
        type: string
        description: "Number of yearly backups to keep"
      - name: keep_within
        type: string
        description: "Keep all backups made within this duration (e.g. 30d, 6m)"
      - name: keep_tag
        type: string
        description: "Keep backups that have this tag"
      - name: dry_run
        long: dry-run
        type: bool
        default: false
        description: "Report what would be removed without deleting anything"

  - name: backup_schedule_set
    description: "Set a recurring backup schedule"
    long_description: |
      Schedule recurring backups using a cron expression. The cron
      expression follows the standard 5-field format
      `minute hour day-of-month month day-of-week`.

      This writes a crontab entry on the host where the instance runs
      that runs `canasta backup create -i <id> --tag scheduled` on the
      schedule; output goes to `backup.log` in the instance directory.
      `canasta` must be installed on that host — on a remote instance,
      set it up first with
      `canasta install canasta -H <host>`.

      Give any of the retention flags to chain `canasta backup purge`
      after each backup, so old snapshots are pruned without a separate
      maintenance run. They are the flags `canasta backup purge` accepts
      and mean the same thing, so a policy that can be purged by hand can
      be scheduled. With no retention flag, nothing is purged and
      snapshots accumulate.

      The schedule is persisted to `config/backup-schedule.yml` (captured
      by backups, re-materialized on restore). Setting a new schedule
      replaces the existing crontab entry in place; duplicates aren't
      created.
    examples:
      - "canasta backup schedule set '0 2 * * *'"
      - "canasta backup schedule set '0 3 * * *' --keep-within 30d"
      - "canasta backup schedule set '37 3 * * *' --keep-daily 7 --keep-weekly 4"
    playbook: backup_schedule_set.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: cron_expression
        type: string
        positional: true
        required: true
        description: "Cron expression for the schedule"
      - name: keep_last
        type: string
        description: "Number of most recent backups to keep"
      - name: keep_hourly
        type: string
        description: "Number of hourly backups to keep"
      - name: keep_daily
        type: string
        description: "Number of daily backups to keep"
      - name: keep_weekly
        type: string
        description: "Number of weekly backups to keep"
      - name: keep_monthly
        type: string
        description: "Number of monthly backups to keep"
      - name: keep_yearly
        type: string
        description: "Number of yearly backups to keep"
      - name: keep_within
        type: string
        description: "Keep all backups made within this duration (e.g. 30d, 6m)"
      - name: keep_tag
        type: string
        description: "Keep backups that have this tag"

  - name: backup_schedule_list
    description: "Show the backup schedule"
    unfinished_pull_ok: true
    long_description: |
      Show the current backup schedule for this instance, if one
      exists.

      Reads the crontab on the host where the instance runs and parses the
      `canasta backup create -i <id>` entry, reporting the schedule
      expression and the retention policy of the purge chained after it,
      if any. "No backup schedule found" means no entry exists for this
      instance.
    examples:
      - "canasta backup schedule list"
    playbook: backup_schedule_list.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: backup_schedule_remove
    description: "Remove a scheduled backup"
    long_description: |
      Remove the recurring backup schedule for this instance — deletes
      the crontab entry on the host where the instance runs and clears
      `config/backup-schedule.yml` so it isn't re-materialized on
      restore. A backup already running when the schedule is removed
      finishes naturally — only future firings stop.
    examples:
      - "canasta backup schedule remove"
    playbook: backup_schedule_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: backup_databases_add
    description: "Include another database in a wiki's backups"
    long_description: |
      Add a database to a wiki's backup group, for data an extension keeps
      outside the wiki database — Cargo's `$wgCargoDBname` being the usual
      case.

      The group is dumped by a single `mariadb-dump` call, so every
      database in it comes from one transaction. Cargo needs that: its
      data tables live in the extra database while `cargo_pages`, which
      governs them, lives in the wiki database. Captured at different
      moments, `cargo_pages` under-reports, the delete on edit matches
      nothing, and the edit appends duplicate rows instead of replacing
      them.

      The database must be reachable on the instance's own database
      server, since one dump is one connection. `-w`/`--wiki` is required
      on a farm and optional on a single-wiki instance. The declaration is
      stored in `config/wikis.yaml` and takes effect on the next backup —
      no restart.

      MediaWiki's own database account gets access to the database at
      once.
    examples:
      - "canasta backup databases add mywiki_cargo"
      - "canasta backup databases add -w mywiki mywiki_cargo"
    playbook: backup_databases_add.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki the database belongs to (required on a farm)"
      - name: database
        type: string
        positional: true
        required: true
        description: "Name of the database to include"

  - name: backup_databases_remove
    description: "Stop including a database in a wiki's backups"
    long_description: |
      Remove a database from a wiki's backup group. The wiki's own
      database cannot be removed — every backup includes it.

      Takes effect on the next backup. Snapshots already taken keep the
      database they captured, so a restore from one of them still brings
      it back.

      MediaWiki's own database account loses access to the database at
      once.
    examples:
      - "canasta backup databases remove mywiki_cargo"
    playbook: backup_databases_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Wiki the database belongs to (required on a farm)"
      - name: database
        type: string
        positional: true
        required: true
        description: "Name of the database to drop from the group"

  - name: backup_databases_list
    description: "Show which databases each wiki's backup dumps"
    unfinished_pull_ok: true
    long_description: |
      List the databases each wiki's backup captures — the wiki database
      plus anything added with `canasta backup databases add`. A wiki with
      no extras reports its own database only.
    examples:
      - "canasta backup databases list"
    playbook: backup_databases_list.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: wiki
        short: w
        type: string
        description: "Show only this wiki"

  # ---------------------------------------------------------------------------
  # GitOps
  # ---------------------------------------------------------------------------
  - name: gitops_init
    description: "Initialize git-based configuration management"
    long_description: |
      Bootstrap git-based configuration management. Converts extensions
      and skins to submodules and pushes to a remote repository.

      Per-host vars.yaml is encrypted with git-crypt so secrets stay out
      of the repo at rest.
    examples:
      - "canasta gitops init -n prod --repo git@github.com:org/config.git --key /tmp/gc.key"
    playbook: gitops_init.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: host_name
        short: n
        long: name
        type: string
        required: true
        description: "Name for this host in hosts.yaml"
      - name: role
        type: choice
        choices: [source, sink, both]
        default: both
        description: "Host role"
      - name: repo
        type: string
        required: true
        description: "Git repository URL"
      - name: key
        type: path
        required_unless: git_crypt_gpg_user
        description: >-
          A path on the controller (the machine running canasta) that
          receives the git-crypt symmetric key, which other hosts use to
          unlock encrypted vars. Not used with --git-crypt-gpg-user.
      - name: git_crypt_gpg_user
        type: string
        description: >-
          GPG recipient (email or key id) to encrypt the
          git-crypt key to, enabling GPG-based unlock instead of a shared
          symmetric key file. When set, gitops initializes git-crypt with
          `git-crypt add-gpg-user` and later `gitops pull`/`push` unlock via
          `git-crypt unlock` (using a forwarded GPG agent). No git-crypt key
          is exported, so --key is not needed.
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. When set, git runs with GIT_SSH_COMMAND="ssh -i
          <ssh-key> ...". On a remote host, give an absolute path or one
          starting with a quoted '~' (for example '~/x'). The instance
          remembers the path, and later gitops commands use it when --ssh-key
          is omitted; passing it again replaces it. Without a remembered key,
          git uses ssh-agent forwarding.
      - name: force
        short: f
        type: bool
        default: false
        description: "Force push to non-empty remote"
      - name: reinit
        type: bool
        default: false
        description: >-
          Wipe local gitops state (.git, .gitops-host, env.template,
          wikis.yaml.template, hosts/) before
          starting. Use after a previous init died mid-run, e.g.
          before the git push succeeded. Submodule structure is not
          fully restorable — extensions whose conversion finished
          before the failure may end up tracked as flat directories.
      - name: pull_requests
        type: bool
        default: false
        description: "Require pull requests instead of pushing to main"
      - name: git_user_name
        type: string
        description: "Git user.name for commits in the instance's gitops repository, stored in that repository's git config"
      - name: git_user_email
        type: string
        description: "Git user.email for commits in the instance's gitops repository, stored in that repository's git config"

  - name: gitops_join
    description: "Join an existing gitops repository"
    long_description: |
      Join an existing gitops repository for a Canasta instance.

      Clones the repo, adds this host to the host inventory, extracts
      host-specific values into `vars.yaml`, and pushes the new host
      entry back to the repo. It also unlocks git-crypt so encrypted
      vars become readable.

      The instance must already exist and have a working `.env`
      file. Use `canasta gitops init` to bootstrap a new gitops
      repository instead.

      Each wiki's URL on this host is taken from the
      instance, so when the repository holds a wiki farm, the instance
      must already have every wiki in it. Add any it lacks with
      `canasta add -w <id> -u <url>` before joining; otherwise join
      stops before changing anything and names them.

      Every host sharing a gitops repository runs the same Canasta CLI
      version. A host whose CLI is older than the recorded version of a
      host that can push is refused before anything changes, with the
      newer hosts named: upgrade its CLI first. The joining host records
      its own version in `hosts/<host>/cli-version`.

      Account-wide credentials (the AWS keys, SMTP) are shared across
      every host in the repo. Backup credentials are not: a password
      that unlocks one specific repository belongs with the per-host
      `RESTIC_REPOSITORY` it opens, so `RESTIC_PASSWORD` stays on the
      host that generated it. If the hosts in this repo all back up to
      one restic repository, set the joining host's password to match
      it — `canasta config set -i <id> RESTIC_PASSWORD=<password>` —
      or its backups will fail against a repository it cannot open.
    examples:
      - "canasta gitops join -n staging --repo git@github.com:org/config.git --key /tmp/gc.key"
    playbook: gitops_join.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: host_name
        short: n
        long: name
        type: string
        required: true
        description: "Name for this host"
      - name: repo
        type: string
        required: true
        description: "Git repository URL"
      - name: key
        type: path
        description: >-
          A path on the controller (the machine running canasta) to the
          git-crypt symmetric key file exported by `canasta gitops init`. It
          unlocks any git-crypt repo; it may be omitted for a repo with GPG
          recipients, which is then unlocked through a forwarded GPG agent.
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. When set, git runs with GIT_SSH_COMMAND="ssh -i
          <ssh-key> ...". On a remote host, give an absolute path or one
          starting with a quoted '~' (for example '~/x'). The instance
          remembers the path, and later gitops commands use it when --ssh-key
          is omitted; passing it again replaces it. Without a remembered key,
          git uses ssh-agent forwarding.
      - name: reinit
        type: bool
        default: false
        description: >-
          Wipe local gitops state before joining. Use after a
          previous init or join died mid-run and left this instance
          unable to retry. Also re-attaches a host that is already
          registered in the repo (the registration is updated in
          place rather than rejected as a duplicate).
      - name: git_user_name
        type: string
        description: "Git user.name for commits in the instance's gitops repository, stored in that repository's git config"
      - name: git_user_email
        type: string
        description: "Git user.email for commits in the instance's gitops repository, stored in that repository's git config"

  - name: gitops_add
    description: "Add configuration changes to git"
    long_description: |
      Stage one or more files for the next gitops push. Each path is
      relative to the instance root. At least one file is required.

      Staging config/wikis.yaml captures its literal edits (e.g. a wiki
      display name) into wikis.yaml.template rather than the rendered
      file, so they survive the next render and reach other hosts.
    examples:
      - "canasta gitops add config/wikis.yaml"
      - "canasta gitops add extensions/WikiWorks/LocalSettings.php config/default.vcl"
    playbook: gitops_add.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: files
        type: string
        positional: true
        multi: true
        required: true
        description: "File path(s) to stage (relative to instance root)"

  - name: gitops_rm
    description: "Remove configuration from git tracking"
    long_description: |
      Remove configuration files from git tracking. If a file path is
      given, delete that file and stage the deletion. Without a path,
      stage all pending deletions (files already deleted from disk).
    examples:
      - "canasta gitops rm public_assets/main/.htaccess"
      - "canasta gitops rm"
    playbook: gitops_rm.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: path
        type: string
        positional: true
        description: "File path to remove (relative to instance root)"

  - name: gitops_set_role
    description: "Change a host's role in the gitops repository"
    long_description: |
      Set the role of a host in `hosts/hosts.yaml` and push that change
      alone. Run it on a host that can push (role `source` or `both`).
      A `sink` host only pulls, and its recorded CLI version is not
      compared with the other hosts'. The last host that can push cannot
      be given role `sink`.

      The change is made on top of the repository's main branch as it is
      on the remote, and holds only `hosts/hosts.yaml`: nothing staged,
      changed or committed on this host goes with it, and this host's
      files are not changed until its next `canasta gitops pull`. It runs
      whatever the CLI versions of the other hosts, so a host whose pull
      and push stop on another host's newer CLI can still run it.
    examples:
      - "canasta gitops set-role --host-name staging --role sink"
    playbook: gitops_set_role.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: host_name
        type: string
        required: true
        description: "Name of the host in hosts/hosts.yaml"
      - name: role
        type: choice
        choices: [source, sink, both]
        required: true
        description: "New role for the host"
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. When set, git runs with GIT_SSH_COMMAND="ssh -i
          <ssh-key> ...". On a remote host, give an absolute path or one
          starting with a quoted '~' (for example '~/x'). The instance
          remembers the path, and later gitops commands use it when --ssh-key
          is omitted; passing it again replaces it. Without a remembered key,
          git uses ssh-agent forwarding.
      - name: key
        type: path
        description: >-
          Path on the controller (the machine running canasta)
          to the git-crypt symmetric key, used to unlock the checkout if it is
          locked. Without it, a repo with GPG recipients is unlocked through a
          forwarded GPG agent.

  - name: gitops_remove_host
    description: "Remove a host from the gitops repository"
    long_description: |
      Remove a host from `hosts/hosts.yaml`, together with its own files
      under `hosts/<host>/`: its `vars.yaml` and its recorded CLI
      version.
      Values every host shares stay in `hosts/_shared/`. Use it for a
      host that is retired; the host's own instance is not changed.

      Run it on another host that can push (role `source` or `both`). A
      host cannot remove itself, and the last host that can push cannot
      be removed.

      The change is made on top of the repository's main branch as it is
      on the remote, and holds only those paths: nothing staged, changed
      or committed on this host goes with it, and this host's files are
      not changed until its next `canasta gitops pull`. It runs whatever
      the CLI versions of the other hosts, so a host whose pull and push
      stop on a retired host's newer CLI can still run it.
    examples:
      - "canasta gitops remove-host --host-name old-prod"
    playbook: gitops_remove_host.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: host_name
        type: string
        required: true
        description: "Name of the host in hosts/hosts.yaml"
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. When set, git runs with GIT_SSH_COMMAND="ssh -i
          <ssh-key> ...". On a remote host, give an absolute path or one
          starting with a quoted '~' (for example '~/x'). The instance
          remembers the path, and later gitops commands use it when --ssh-key
          is omitted; passing it again replaces it. Without a remembered key,
          git uses ssh-agent forwarding.
      - name: key
        type: path
        description: >-
          Path on the controller (the machine running canasta)
          to the git-crypt symmetric key, used to unlock the checkout if it is
          locked. Without it, a repo with GPG recipients is unlocked through a
          forwarded GPG agent.

  - name: gitops_push
    description: "Push configuration changes to the git repository"
    long_description: |
      Commit staged changes and push to the remote repository. Stage
      changes first with `canasta gitops add`; commits already made by
      other commands (such as `canasta gitops fix-submodules`) are also
      pushed even when nothing is staged. When `pull_requests` is enabled
      in `hosts.yaml`, creates a branch and opens a pull request instead
      of pushing directly to main.

      Every host sharing a gitops repository runs the same Canasta CLI
      version. Each host records its version in `hosts/<host>/cli-version`
      when it creates or joins the repository and on every push. A host
      whose CLI is older than the record of a host that can push stops
      before changing anything and names the newer hosts: upgrade its CLI
      first. A newer host goes on and names the hosts still on an older
      CLI. Hosts whose role cannot push are not compared, since they
      publish no record after joining. A retired host is taken out with
      `canasta gitops remove-host`, and one that should no longer be
      compared is made pull-only with `canasta gitops set-role --role
      sink`; both run whatever the other hosts' CLI versions.
    examples:
      - "canasta gitops push"
      - "canasta gitops push -m 'Add docs wiki'"
    playbook: gitops_push.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: message
        short: m
        type: string
        description: "Commit message (defaults to 'Configuration update')"
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. When set, git runs with GIT_SSH_COMMAND="ssh -i
          <ssh-key> ...". On a remote host, give an absolute path or one
          starting with a quoted '~' (for example '~/x'). The instance
          remembers the path, and later gitops commands use it when --ssh-key
          is omitted; passing it again replaces it. Without a remembered key,
          git uses ssh-agent forwarding.
      - name: key
        type: path
        description: >-
          Path on the controller (the machine running canasta)
          to the git-crypt symmetric key, used to unlock the checkout if it is
          locked. Without it, a repo with GPG recipients is unlocked through a
          forwarded GPG agent.

  - name: gitops_pull
    description: "Pull latest configuration from the git repository"
    long_description: |
      Pull the latest configuration from the remote repository,
      update submodules, render `.env` and admin password files from
      the template and host vars, and report what changed and
      whether a restart is needed.

      Every host sharing a gitops repository runs the same Canasta CLI
      version. Each host records its version in `hosts/<host>/cli-version`
      when it creates or joins the repository and on every push. A host
      whose CLI is older than the record of a host that can push stops
      before changing anything and names the newer hosts: upgrade its CLI
      first. A newer host goes on and names the hosts still on an older
      CLI. Hosts whose role cannot push are not compared, since they
      publish no record after joining. A retired host is taken out with
      `canasta gitops remove-host`, and one that should no longer be
      compared is made pull-only with `canasta gitops set-role --role
      sink`; both run whatever the other hosts' CLI versions.
    examples:
      - "canasta gitops pull"
    playbook: gitops_pull.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. When set, git runs with GIT_SSH_COMMAND="ssh -i
          <ssh-key> ...". On a remote host, give an absolute path or one
          starting with a quoted '~' (for example '~/x'). The instance
          remembers the path, and later gitops commands use it when --ssh-key
          is omitted; passing it again replaces it. Without a remembered key,
          git uses ssh-agent forwarding.
      - name: key
        type: path
        description: >-
          Path on the controller (the machine running canasta)
          to the git-crypt symmetric key, used to unlock the checkout if it is
          locked. Without it, a repo with GPG recipients is unlocked through a
          forwarded GPG agent.

  - name: gitops_resolve
    description: "Resolve a gitops pull whose changes conflict with this host's"
    unfinished_pull_ok: true
    long_description: |
      When `canasta gitops pull` cannot replay this host's commits on top of
      the remote's, it rolls back and names the conflicting files. Run
      `canasta gitops resolve` to replay the pull again and stop at the
      conflicts, with each file listed by what it needs.

      Edit out the conflict markers in a text file. An encrypted file the
      git-crypt merge driver merged has ordinary markers too, and is
      committed encrypted. For a binary file, or an encrypted file the
      driver could not merge, keep one version whole with
      `--keep local <file>` (this host's) or `--keep remote <file>`.

      `--continue` finishes the replay, stopping again if a later commit
      conflicts, and then applies the result as `gitops pull` does: it
      renders this host's files and reports whether a restart is needed.
      `--abort` goes back to where the pull started, with this host's
      commits intact.

      While a pull is being resolved, commands that read or write the
      instance's configuration refuse to run.
    examples:
      - "canasta gitops resolve -i mywiki"
      - "canasta gitops resolve -i mywiki --keep remote public_assets/logo.png"
      - "canasta gitops resolve -i mywiki --continue"
      - "canasta gitops resolve -i mywiki --abort"
    playbook: gitops_resolve.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: resume
        long: continue
        type: bool
        description: >-
          Finish the replay once the conflicts are resolved, and apply the
          pulled changes.
      - name: abort
        type: bool
        description: "Go back to where the pull started."
      - name: keep
        type: choice
        choices: [local, remote]
        description: >-
          Keep one version of the named files whole: local (this host's) or
          remote.
      - name: files
        type: string
        positional: true
        multi: true
        as_list: true
        description: "Files to keep one version of, with --keep."
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for git network
          operations. The instance remembers the path for later gitops
          commands. Without a remembered key, git uses ssh-agent forwarding.
      - name: key
        type: path
        description: >-
          Path on the controller (the machine running canasta)
          to the git-crypt symmetric key, used to unlock the checkout if it is
          locked.

  - name: gitops_status
    description: "Show gitops status for the instance"
    long_description: |
      Show the current host, role, uncommitted changes, and
      ahead/behind status relative to the remote.
    examples:
      - "canasta gitops status"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: ssh_key
        type: path
        path_kind: instance_host
        description: >-
          Path on the instance's host to an SSH private key for the remote
          fetch. When set, git runs with GIT_SSH_COMMAND="ssh -i <ssh-key>
          ...". On a remote host, give an absolute path or one starting with
          '~'. When omitted, the key path a gitops command remembered for the
          instance is used, else ssh-agent forwarding.

  - name: gitops_diff
    description: "Show local and remote changes since the branches diverged"
    unfinished_pull_ok: true
    long_description: |
      Show the actual patch for uncommitted working tree changes, for
      local commits not yet pushed, and for remote commits that would
      be applied on the next pull. Each section is headed by its file
      count. Use --stat to show a diffstat summary instead of the full
      patch.
    examples:
      - "canasta gitops diff"
      - "canasta gitops diff --stat"
    playbook: gitops_diff.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: stat
        type: bool
        default: false
        description: "Show a diffstat summary instead of the full patch"

  - name: gitops_fix_submodules
    description: "Convert extensions and skins to proper git submodules"
    long_description: |
      Fix submodule registration in an existing gitops repository.

      This handles two cases:

      # Extensions or skins that were added after gitops init and
        need to be converted from standalone git repositories to
        submodules.
      # Submodules listed in .gitmodules that were accidentally
        committed as regular directories instead of gitlinks.

      After fixing, run `canasta gitops push` to push the changes.
    examples:
      - "canasta gitops fix-submodules"
    playbook: gitops_fix_submodules.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  # ---------------------------------------------------------------------------
  # Host management (persistent hosts.yml in user config dir)
  # ---------------------------------------------------------------------------
  - name: host_add
    description: "Add or update a host entry in the persistent hosts.yml"
    long_description: |
      Add or update a host definition in $CANASTA_CONFIG_DIR/hosts.yml.
      Saved hosts can then be targeted by short name with --host.
    examples:
      - "canasta host add --name prod1 --ssh ubuntu@prod1.example.com"
      - "canasta host add --name prod2 --ssh canasta@10.0.0.5 --python /usr/bin/python3"
    direct_only: true
    parameters:
      - name: host_name
        long: name
        short: n
        type: string
        required: true
        description: "Short name for the host (used with --host)"
      - name: ssh
        type: string
        required: true
        description: "SSH destination (user@host or just host)"
      - name: python
        type: string
        description: "Path to python3 on the remote host"

  - name: host_remove
    description: "Remove a host entry from the persistent hosts.yml"
    long_description: |
      Remove a saved host definition from
      `$CANASTA_CONFIG_DIR/hosts.yml`. After removal, the short name
      can no longer be used with `--host`.

      Removing a host from `hosts.yml` does not affect instances
      already registered on that host; they remain in the registry
      and continue to be targeted by their original SSH details.
    examples:
      - "canasta host remove --name prod1"
    direct_only: true
    parameters:
      - name: host_name
        long: name
        short: n
        type: string
        required: true
        description: "Short name of the host to remove"

  - name: host_list
    description: "List all host entries from the persistent hosts.yml"
    long_description: |
      List every saved host definition from
      `$CANASTA_CONFIG_DIR/hosts.yml`. For each host, displays the
      short name (the value passed to `--host`), the SSH destination
      (`user@host`), and the Python interpreter path if one was set.

      Use `canasta host add` to add entries and `canasta host remove`
      to remove them.
    examples:
      - "canasta host list"
    direct_only: true
    parameters: []

  - name: status
    description: "Show container state for a single instance"
    long_description: |
      Show runtime state for a single Canasta instance: its host, whether
      it is RUNNING, STOPPED or PAUSED (naming the paused services), any
      unfinished restore or gitops pull, and the `compose ps` listing of
      its containers.
    examples:
      - "canasta status --id mysite"
      - "cd /path/to/instance && canasta status"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: sidecar_add
    description: "Add app sidecar(s) to config/sidecars.yaml from a YAML file"
    long_description: |
      Declare app sidecar(s) in `config/sidecars.yaml` from a YAML file of
      full definitions — a single sidecar mapping, a list, or a `sidecars:`
      list — then run `canasta restart` to deploy them. The file uses the
      sidecar schema (name, image/build, ports, command, env, envPrivate,
      volumes, files, depends_on, healthcheck, resources). Any
      other key is refused.

      To migrate an existing `docker-compose.override.yml`, use
      `canasta sidecar migrate` instead, which translates its sidecar
      services into this schema.
    examples:
      - "canasta sidecar add -i mywiki --file sidecars.yaml"
    playbook: sidecar_add.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: file
        short: f
        type: path
        required: true
        description: >-
          Path on the controller (the machine running canasta) to a YAML file
          of full sidecar definition(s) (the sidecar schema)

  - name: sidecar_list
    description: "List app sidecars declared for a Canasta instance"
    unfinished_pull_ok: true
    long_description: |
      List the sidecars declared in `config/sidecars.yaml`, with their
      image (or build context) and ports.
    examples:
      - "canasta sidecar list -i mywiki"
    playbook: sidecar_list.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: sidecar_remove
    description: "Remove an app sidecar from config/sidecars.yaml"
    long_description: |
      Remove a sidecar declaration from `config/sidecars.yaml`, then run
      `canasta restart` to tear it down.
    examples:
      - "canasta sidecar remove -i mywiki --name cache"
    playbook: sidecar_remove.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: sidecar_name
        long: name
        short: n
        type: string
        required: true
        description: "Name of the sidecar to remove"

  - name: sidecar_migrate
    description: "Migrate docker-compose.override.yml sidecars to config/sidecars.yaml"
    long_description: |
      Translate sidecar services in an instance's `docker-compose.override.yml`
      into `config/sidecars.yaml` (the sidecar schema) and remove them
      from the override, so they gain a managed lifecycle. Core-stack overrides (web/db/caddy/...) and any service that
      can't be fully modelled are left in the override and reported. Run
      `canasta restart` afterward to deploy the migrated sidecars.
    examples:
      - "canasta sidecar migrate -i mywiki"
      - "canasta sidecar migrate -i mywiki --dry-run"
    playbook: sidecar_migrate.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: dry_run
        long: dry-run
        type: bool
        default: false
        description: "Show the migration plan without writing any files"

  - name: image_prune
    description: "Reclaim container image storage on a host"
    unfinished_pull_ok: true
    long_description: |
      Remove container images the host no longer needs, and their orphaned
      layers. Upgrades leave superseded Canasta images behind, and repeated
      builds of the same tag (e.g. the `:local` tags used by `--build-from`
      and `build:` sidecars) orphan the previous build's layers.
      Nothing else ever collects them, so the disk only grows until this runs.

      On a Docker or Podman host, removes the Canasta image tags no instance
      registered on the host is pinned to, and the `--build-from` images
      (`canasta:local-<id>`) and the `canasta-base` builds under them
      (`canasta-base:local-<id>`) of instances no longer registered, and
      the shared `canasta-base:local` an older CLI built once no
      registered instance's `--build-from` image remains, then prunes
      dangling layers. A host carrying both runtimes is reclaimed in each.

      The Docker build cache is kept because it speeds up the next build;
      its size is reported with the command that removes it
      (`docker builder prune`).

      Volumes are never touched, and an image an instance on the host is
      pinned to is kept whether or not that instance is running.
    examples:
      - "canasta image prune"
      - "canasta image prune --dry-run"
      - "canasta image prune -H prod1"
    playbook: image_prune.yml
    parameters:
      - name: host
        short: H
        type: string
        description: >-
          Target host (a saved host name or user@hostname; default:
          localhost)
      - name: dry_run
        type: bool
        default: false
        description: "Report what would be removed without removing anything"

  - name: image_build_args
    description: "Show the build arguments of an instance built from source"
    long_description: |
      Print the build arguments (`KEY=VALUE`, one per line) recorded for an
      instance created with `canasta create --build-from`. They are the
      `--build-arg` values given at create, as changed since by
      `canasta image set-build-arg` and `canasta image unset-build-arg`
      and by `canasta upgrade` moving a `BASE_IMAGE` pinned to an older
      Canasta release. `canasta upgrade` rebuilds the instance's image
      with them.
    examples:
      - "canasta image build-args"
      - "canasta image build-args -i mywiki"
    direct_only: true
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"

  - name: image_set_build_arg
    description: "Set build arguments of an instance built from source and rebuild it"
    long_description: |
      Set one or more build arguments of an instance created with
      `canasta create --build-from`, replacing any value already recorded
      for the same key, then rebuild the instance's image with them and
      restart the instance onto it. The rebuild runs on the instance's
      host, from the source directory recorded at create.

      The image is rebuilt before the new arguments are recorded, so a
      failed build leaves both the recorded arguments and the running
      image as they were. A rebuild that yields the image the instance
      already runs does not restart it, and a stopped instance is left
      stopped. With `--no-rebuild`, the arguments are only recorded, and
      the next `canasta upgrade` rebuilds with them.

      The usual reason to set one is `BASE_IMAGE`, the image an overlay's
      Dockerfile builds `FROM`. Build arguments are kept in the instance
      registry on the controller, not in gitops.
    examples:
      - "canasta image set-build-arg BASE_IMAGE=ghcr.io/canastawiki/canasta:3.5.29"
      - "canasta image set-build-arg -i mywiki MW_VERSION=master --no-rebuild"
    playbook: image_set_build_arg.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: settings
        type: string
        positional: true
        multi: true
        as_list: true
        required: true
        description: "KEY=VALUE build argument(s) to set"
      - name: no_rebuild
        type: bool
        default: false
        description: "Record the build arguments without rebuilding the image"

  - name: image_unset_build_arg
    description: "Remove build arguments of an instance built from source and rebuild it"
    long_description: |
      Remove one or more build arguments, by key, from an instance created
      with `canasta create --build-from`, then rebuild the instance's
      image without them and restart the instance onto it. A key that is
      not recorded is reported and otherwise ignored.

      Without a `BASE_IMAGE` build argument, the image builds on the
      auto-detected base: a local `canasta-base` build, from Canasta/ when it
      has Dockerfile.canasta or else from CanastaBase/ when that is in the
      source directory, else the published `canasta-base` image for Canasta
      source and the current Canasta release image for an overlay.

      The rebuild, recording and restart behave as for
      `canasta image set-build-arg`, including `--no-rebuild`.
    examples:
      - "canasta image unset-build-arg MW_VERSION"
      - "canasta image unset-build-arg -i mywiki BASE_IMAGE --no-rebuild"
    playbook: image_unset_build_arg.yml
    parameters:
      - name: id
        short: i
        type: string
        description: "Canasta instance ID"
      - name: keys
        type: string
        positional: true
        multi: true
        as_list: true
        required: true
        description: "Key(s) of the build argument(s) to remove"
      - name: no_rebuild
        type: bool
        default: false
        description: "Record the change without rebuilding the image"
