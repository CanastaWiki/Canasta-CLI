---
# Canasta CLI main dispatcher playbook.
#
# Usage:
#   ansible-playbook canasta.yml -e "command=create id=mysite wiki=mywiki"
#   ansible-playbook canasta.yml -e "command=start id=mysite target_host=prod1.example.com" --limit prod1.example.com
#   ./canasta create --id mysite --wiki mywiki
#   ./canasta create --host prod1.example.com --id mysite --wiki mywiki
#
- name: Canasta
  hosts: "{{ target_host | default('localhost') }}"
  gather_facts: false

  vars:
    canasta_root: "{{ playbook_dir }}"
    canasta_default_image: "ghcr.io/canastawiki/canasta:{{ lookup('file', playbook_dir + '/CANASTA_VERSION') | trim }}"
    # Wikimedia's edge refuses generic user agents, including git's default,
    # so requests to Gerrit name the CLI, its version and where to reach it.
    canasta_user_agent: >-
      Canasta-CLI/{{ lookup('file', playbook_dir + '/VERSION') | trim }}
      (https://github.com/CanastaWiki/Canasta-CLI)
    # Templated on every use, so it follows instance_orchestrator wherever
    # that is set. Until it is, create's `orchestrator` extra-var decides.
    instance_is_k8s: >-
      {{ (instance_orchestrator | default(orchestrator | default('compose')))
         in ['kubernetes', 'k8s'] }}
    # CANASTA_LOCAL_REMOTE_TEMP (set by canasta-docker) is for local
    # connections only. Templated per task because switch_connection.yml
    # rebinds the localhost play host to SSH targets with set_fact.
    ansible_remote_tmp: >-
      {{ lookup('env', 'CANASTA_LOCAL_REMOTE_TEMP')
         if (ansible_connection | default('')) in ['local', 'ansible.builtin.local']
            and lookup('env', 'CANASTA_LOCAL_REMOTE_TEMP')
         else lookup('env', 'ANSIBLE_REMOTE_TEMP') | default('~/.ansible/tmp', true) }}

  # DOCKER_HOST applies to every `docker` / `docker compose` invocation
  # in the play. Operators on rootless podman / rootless Docker need
  # this to point at their per-user socket
  # (e.g. unix:///run/user/<uid>/podman/podman.sock); without it,
  # `docker info` connects to the default `/var/run/docker.sock` and
  # fails. Precedence:
  #   1. --docker-host on the current invocation (e.g. canasta create
  #      --docker-host=…). Bound as `docker_host`.
  #   2. dockerHost from the registry, set by resolve_instance.yml on
  #      a previous create. Bound as `instance_docker_host`.
  #   3. The probe result from detect_docker_socket.yml (covers a
  #      first-time `canasta create` against a rootless target where
  #      no flag was passed and no registry entry exists yet).
  #      Bound as `_detected_docker_host`.
  #   4. omit — let docker fall back to its compiled-in default.
  # GIT_HTTP_USER_AGENT covers every git clone, fetch and submodule update,
  # on the controller and on targets.
  environment:
    DOCKER_HOST: >-
      {{ docker_host
         | default(instance_docker_host | default(''), true)
         | default(_detected_docker_host | default(''), true)
         | default(omit, true) }}
    GIT_HTTP_USER_AGENT: "{{ canasta_user_agent }}"

  pre_tasks:
    # Registry operations must reach the controller's conf.json, never a
    # target's. `delegate_to: localhost` cannot guarantee that: for
    # commands that loop over instances, switch_connection.yml rebinds
    # the play host's connection with set_fact, and set_fact outranks
    # task vars — so a delegated task carrying
    # `vars: ansible_connection: local` still went out over SSH and wrote
    # the target's registry.
    #
    # add_host rather than an inventory entry because `--host` makes
    # canasta.py pass `-i <host>,`, which replaces the inventory named in
    # ansible.cfg. A host added here exists on every path.
    - name: Add the controller as a delegation target
      ansible.builtin.add_host:
        name: canasta_controller
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
      run_once: true

    # ansible-playbook read canasta.py's vars file at startup, and it can
    # hold secrets passed to config set, so it goes now rather than waiting
    # for a later invocation's stale-file sweep.
    - name: Remove the vars file canasta.py wrote
      ansible.builtin.file:
        path: "{{ canasta_vars_file }}"
        state: absent
      delegate_to: canasta_controller
      changed_when: false
      run_once: true
      when: canasta_vars_file is defined

    - name: Validate command parameter
      ansible.builtin.assert:
        that: command is defined and command != ''
        fail_msg: >-
          No command specified. Usage: ansible-playbook canasta.yml -e "command=<command>"
          or use the ./canasta wrapper script. Run ./canasta --help for available commands.

    - name: Load command definitions
      ansible.builtin.include_vars:
        file: meta/command_definitions.yml
        name: canasta_commands

    # Canonical secret classifier, play-global so config/gitops/orchestrator
    # all share one definition of "secret" (roles/*/defaults are role-scoped).
    - name: Load canonical secret classification
      ansible.builtin.include_vars:
        file: vars/secret_classification.yml

    # Pinned tool versions (SOPS toolchain) shared across roles — one source.
    - name: Load pinned tool versions
      ansible.builtin.include_vars:
        file: vars/tool_versions.yml

    # Container runtime commands, shared across roles — one source.
    - name: Load container runtime commands
      ansible.builtin.include_vars:
        file: vars/compose_runtime.yml

    # The in-flight restore marker's name, shared with list/status.
    - name: Load the restore marker name
      ansible.builtin.include_vars:
        file: vars/restore_marker.yml

    # Constant tables shared with direct_commands/_helpers.py — one source.
    - name: Load the Compose profile, image, database and directory tables
      ansible.builtin.include_vars:
        file: "vars/{{ item }}"
      loop:
        - compose_profiles.yml
        - images.yml
        - mysql_defaults.yml
        - rootless_operator_dirs.yml

    - name: Validate command exists
      ansible.builtin.assert:
        that: command in (canasta_commands.commands | map(attribute='name'))
        fail_msg: >-
          Unknown command '{{ command }}'.
          Valid commands: {{ canasta_commands.commands | map(attribute='name') | join(', ') }}

    - name: Validate required parameters
      ansible.builtin.include_tasks: roles/common/tasks/validate_params.yml

  tasks:
    - name: Look up command definition
      ansible.builtin.set_fact:
        _cmd_def: >-
          {{ canasta_commands.commands
             | selectattr('name', 'equalto', command) | first }}

    # direct_only commands are implemented entirely in the direct_commands
    # package and have no Ansible playbook; canasta.py never dispatches them
    # here. Reaching this point means canasta.yml was run by hand. Fail
    # clearly rather than trying to include a nonexistent playbook.
    - name: Fail if command has no Ansible playbook
      ansible.builtin.fail:
        msg: >-
          Command '{{ command }}' has no Ansible playbook. Run it through
          the canasta CLI instead.
      when: _cmd_def.direct_only | default(false) | bool

    - name: Dispatch to command playbook
      ansible.builtin.include_tasks: "playbooks/{{ _cmd_def.playbook }}"
