---
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for re-running the full suite (including the
  # integration jobs that are normally gated to push-to-main only).
  # Useful when reviewing a PR that touches integration-relevant
  # code. See #67.
  workflow_dispatch:

# All jobs in this workflow only read the checkout to run tests and
# linters; none push images, write back to the repo, or post comments.
permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest-cov

      - name: Run unit tests with coverage
        run: |
          .venv/bin/pytest tests/unit/ -v \
            --cov=roles/common/library \
            --cov=roles/extensions_skins/library \
            --cov=scripts/generate_docs.py \
            --cov=scripts/validate_definitions.py \
            --cov=canasta.py \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          # Total as a single integer percentage, plus the per-module
          # markdown table that coverage.py generates directly.
          TOTAL=$(.venv/bin/coverage report --format=total)
          {
            echo "## Unit Test Coverage: ${TOTAL}%"
            echo ""
            .venv/bin/coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn

      - name: Upload coverage XML
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Validate command definitions
        run: .venv/bin/python scripts/validate_definitions.py

  integration-core:
    name: "Integration: Core Lifecycle"
    # Skip on PRs (run only on push to main and manual workflow_dispatch).
    # See #67.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      - name: Run core tests
        run: >-
          .venv/bin/python tests/integration/run_tests.py
          lifecycle import upgrade upgrade-rebuilds-buildable rebuild
          version doctor host-management
        timeout-minutes: 25

  # Podman is a supported container runtime, but every other integration job
  # runs on Docker — so a Podman-only regression ships with a green suite.
  # This lane mirrors integration-core's compose legs on podman-compose.
  #
  # Docker is taken away rather than left idle: a hardcoded `docker` call has
  # to fail here instead of quietly reaching a live daemon.
  #
  # A matrix tests three podman versions (4.9.5, 5.3.2, 5.8.4) and two
  # podman-compose versions (1.3.0, 1.6.0). The full podman binary with its
  # runtime helpers (crun, conmon, netavark, fuse-overlayfs) is downloaded as
  # a self-contained static bundle from mgoltzsche/podman-static.
  #
  # Known limitation: mgoltzsche/podman-static tops out at v5.8.4, so this
  # lane cannot test podman 6.x.  When ubuntu-26.04 ships with podman 6.x
  # from apt, a separate lane or runner update will be needed.
  integration-podman:
    name: "Integration: Podman"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        podman_version: ["4.9.5", "5.3.2", "5.8.4"]
        podman_compose_version: ["1.3.0"]
        include:
          - podman_version: "5.8.4"
            podman_compose_version: "1.6.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt uidmap

      - name: Leg details
        run: |
          echo "podman=${{ matrix.podman_version }} podman-compose=${{ matrix.podman_compose_version }}"

      - name: Download podman ${{ matrix.podman_version }} static bundle
        run: |
          url="https://github.com/mgoltzsche/podman-static/releases/download/v${{ matrix.podman_version }}/podman-linux-amd64.tar.gz"
          curl -fsSL --retry 3 "$url" -o /tmp/podman-static.tar.gz
          # Pinned sha256 — if the upstream archive changes, update these.
          # Computed from the release asset at the time of writing.
          case "${{ matrix.podman_version }}" in
            4.9.5) expected="05fcac12a6777c4db5f90ecf71b859d669c7bb1a8ee39d9ab299ac9ad1f99c5d" ;;
            5.3.2) expected="3feea505a40cba6d4940cbfcbc89e28441073685c0d93b9e1e0a69fd2379b7b5" ;;
            5.8.4) expected="a58765fe8be6ab3fb79f892f1a027b4ce4a7e8eb589df1ef960c167cbde08d69" ;;
            *)     echo "unknown podman version: ${{ matrix.podman_version }}" >&2; exit 1 ;;
          esac
          actual=$(sha256sum /tmp/podman-static.tar.gz | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          sudo tar -xzf /tmp/podman-static.tar.gz \
            -C /usr/local --strip-components=3 podman-linux-amd64/usr/
          sudo tar -xzf /tmp/podman-static.tar.gz \
            -C /etc --strip-components=2 podman-linux-amd64/etc/
          rm -f /tmp/podman-static.tar.gz
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      # Runner image ubuntu24 ships podman ahead of /usr/local/bin on PATH.
      # Move those aside so the downloaded one is what runs.
      - name: Shadow other podman binaries on PATH
        run: |
          downloaded="$(readlink -f /usr/local/bin/podman)"
          for p in $(type -a -P podman || true); do
            [ -e "$p" ] || continue
            if [ "$(readlink -f "$p")" != "$downloaded" ]; then
              echo "Shadowing $p ($("$p" --version 2>/dev/null || echo unknown))"
              sudo mv "$p" "$p.shadowed"
            fi
          done
          hash -r

      # Ubuntu >=24.04 ships an AppArmor profile that restricts user
      # namespaces to processes matching specific profiles.  The static
      # podman lives at /usr/local/bin/podman, not /usr/bin/podman, so
      # the stock profile doesn't apply.  Widen the path glob so the
      # downloaded binary can create user namespaces (#155).
      - name: Relax AppArmor profile for /usr/local/bin/podman
        run: |
          if [ -f /etc/apparmor.d/podman ]; then
            sudo sed -Ei \
              's!^profile podman /usr/bin/podman !profile podman /usr/{bin,local/bin}/podman !' \
              /etc/apparmor.d/podman
            sudo apparmor_parser -r /etc/apparmor.d/podman 2>/dev/null || true
            grep -q '/usr/{bin,local/bin}/podman' /etc/apparmor.d/podman || {
              echo "AppArmor profile update not confirmed" >&2
              exit 1
            }
          fi

      - name: Configure rootless Podman
        run: |
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/registries.conf <<'EOF'
          unqualified-search-registries = ["docker.io"]
          EOF
          # Point to the system fuse-overlayfs (which uses the distro's
          # setuid fusermount3) rather than the static bundle's copy
          # (which lacks the setuid bit needed for unprivileged FUSE).
          cat > ~/.config/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          [storage.options.overlay]
          mount_program = "/usr/bin/fuse-overlayfs"
          EOF
          # Use runc instead of crun: the bundle's crun shadows the
          # system one but podman discovers crun by a hardcoded path
          # (/usr/bin/crun) rather than PATH lookup, so the system's
          # crun always wins.  The static bundle's runc works fine.
          cat > ~/.config/containers/containers.conf <<'EOF'
          [engine]
          runtime = "runc"
          cgroup_manager = "cgroupfs"
          events_logger = "file"
          EOF
          # Rootless Podman prerequisites
          sudo loginctl enable-linger "$(id -un)"
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
          grep -q "^$(id -un):" /etc/subuid 2>/dev/null || \
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid 2>/dev/null || \
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Install podman-compose ${{ matrix.podman_compose_version }}
        run: |
          python -m pip install --user \
            "podman-compose==${{ matrix.podman_compose_version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify podman-compose version
        run: |
          resolved="$(command -v podman-compose || true)"
          if [ -z "$resolved" ]; then
            echo "podman-compose not found on PATH" >&2
            exit 1
          fi
          version="$(pip show podman-compose 2>/dev/null \
            | sed -n 's/^Version: //p')"
          echo "podman-compose: $resolved ($version)"
          echo "target:  ${{ matrix.podman_compose_version }}"
          if [ "$version" != "${{ matrix.podman_compose_version }}" ]; then
            echo "expected podman-compose ${{ matrix.podman_compose_version }}" \
                 "but got $version from $resolved" >&2
            exit 1
          fi

      - name: Verify podman version
        run: |
          resolved="$(command -v podman || true)"
          if [ -z "$resolved" ]; then
            echo "podman not found on PATH after download/shadow" >&2
            exit 1
          fi
          version="$(podman --version | awk '{print $3}')"
          echo "podman:  $resolved ($version)"
          echo "target:  ${{ matrix.podman_version }}"
          target="${{ matrix.podman_version }}"
          if [ "$version" != "$target" ]; then
            echo "expected podman $target but got $version from $resolved" >&2
            exit 1
          fi

      - name: Remove Docker so only Podman is reachable
        run: |
          sudo systemctl stop docker.socket docker.service || true
          sudo systemctl mask docker.socket docker.service || true
          for d in $(type -a -P docker || true); do
            if [ -e "$d" ]; then
              sudo mv "$d" "$d.disabled"
            fi
          done
          hash -r
          if command -v docker; then
            echo "docker is still on PATH" >&2
            exit 1
          fi

      - name: Smoke test podman
        run: |
          podman --version
          podman-compose --version
          podman info >/dev/null
          podman run --rm docker.io/library/alpine:latest true
          echo "Podman ${{ matrix.podman_version }} smoke test passed"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"

      - name: Run Podman tests
        run: >-
          .venv/bin/python tests/integration/run_tests.py
          lifecycle upgrade upgrade-rebuilds-buildable rebuild doctor
        timeout-minutes: 35

  integration-features:
    name: "Integration: Features"
    if: github.event_name != 'pull_request'  # See #67
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Two parallel legs so the suite doesn't approach the step timeout and the
    # whole workflow's long pole is ~halved. Legs are balanced by measured
    # per-test runtime; keep the two backup tests together on one leg. The job
    # name is static (no matrix expression) so GitHub renders the leg suffix
    # correctly even when the job is skipped on pull_request events; the step
    # below maps each leg label to its test set.
    strategy:
      fail-fast: false
      matrix:
        leg: ["config & farms", "backup & ops"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      - name: Run feature tests (${{ matrix.leg }})
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            "config & farms") tests="extension-skin wiki-farm config-side-effects" ;;
            "backup & ops")   tests="backup backup-advanced sitemap maintenance" ;;
            *) echo "unknown feature leg: $LEG" >&2; exit 1 ;;
          esac
          .venv/bin/python tests/integration/run_tests.py $tests
        timeout-minutes: 20

  integration-gitops:
    name: "Integration: GitOps"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          sudo groupadd -f www-data
          sudo usermod -aG www-data $(whoami)
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      - name: Run gitops tests
        run: >-
          sg www-data -c '.venv/bin/python tests/integration/run_tests.py
          gitops gitops-join gitops-pull-diff config-set-gitops gitops-push-shared gitops-push-reporting'
        timeout-minutes: 30

  integration-k8s:
    name: "Integration: Kubernetes"
    if: github.event_name != 'pull_request'  # See #67
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      # Bootstrap the cluster via the product's own install path so CI
      # exercises 'canasta install k8s-cp' (which installs k3s + helm at the
      # pinned canasta_k3s_version / canasta_helm_version, writing
      # ~/.kube/config) instead of a separate, unpinned curl | sh that
      # depended on update.k3s.io.
      - name: Bootstrap k3s control plane via canasta
        run: ./canasta-native install k8s-cp
      - name: Run K8s tests
        run: >-
          .venv/bin/python tests/integration/run_tests.py
          k8s-lifecycle
        timeout-minutes: 20
      # Reuse the same bootstrapped cluster (k8s-lifecycle deletes its instance
      # on cleanup, and the in-cluster registry was deployed at install) so this
      # adds only the build/push/pull path, not a second k3s bootstrap.
      - name: Run K8s build-from test
        run: >-
          .venv/bin/python tests/integration/run_tests.py
          k8s-build-from
        timeout-minutes: 18

  # Separate job (own runner) so the CrowdSec enable — which drives several
  # Helm rollouts — gets a fresh, unloaded node and its own time budget rather
  # than serializing behind k8s-lifecycle on a shared 2-CPU runner.
  integration-k8s-crowdsec:
    name: "Integration: Kubernetes CrowdSec"
    if: github.event_name != 'pull_request'  # See #67
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      # Bootstrap the cluster via the product's own install path so CI
      # exercises 'canasta install k8s-cp' (which installs k3s + helm at the
      # pinned canasta_k3s_version / canasta_helm_version, writing
      # ~/.kube/config) instead of a separate, unpinned curl | sh that
      # depended on update.k3s.io.
      - name: Bootstrap k3s control plane via canasta
        run: ./canasta-native install k8s-cp
      - name: Run K8s CrowdSec test
        run: >-
          .venv/bin/python tests/integration/run_tests.py
          k8s-crowdsec
        timeout-minutes: 35

  # Separate job (own runner) so the K8s backup Jobs run against a
  # fresh single-node cluster with their own time budget, in parallel with
  # the other k8s jobs rather than serializing behind them.
  integration-k8s-backup:
    name: "Integration: Kubernetes Backup"
    if: github.event_name != 'pull_request'  # See #67
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      # Bootstrap the cluster via the product's own install path so CI
      # exercises 'canasta install k8s-cp' (which installs k3s + helm at the
      # pinned canasta_k3s_version / canasta_helm_version, writing
      # ~/.kube/config) instead of a separate, unpinned curl | sh that
      # depended on update.k3s.io.
      - name: Bootstrap k3s control plane via canasta
        run: ./canasta-native install k8s-cp
      - name: Run K8s backup test
        run: >-
          .venv/bin/python tests/integration/run_tests.py
          k8s-backup
        timeout-minutes: 20

  remote-integration:
    name: Remote Host Integration Tests
    if: github.event_name != 'pull_request'  # See #67
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install kubernetes
          # Retry to ride out transient Ansible Galaxy CDN timeouts.
          for attempt in 1 2 3 4; do
            .venv/bin/ansible-galaxy collection install kubernetes.core && break
            if [ "$attempt" -eq 4 ]; then
              echo "ansible-galaxy install failed after 4 attempts" >&2
              exit 1
            fi
            echo "ansible-galaxy install attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done

      - name: Run remote integration tests
        run: tests/integration/remote/run_tests.sh
        timeout-minutes: 15

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t canasta-cli:test .

      - name: Test version command
        run: |
          OUTPUT=$(docker run --rm canasta-cli:test version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Canasta CLI v"

      - name: Test list command (empty registry)
        run: |
          OUTPUT=$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            canasta-cli:test list)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No Canasta instances"

      - name: Test doctor command
        run: |
          OUTPUT=$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            canasta-cli:test doctor)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Docker"

      - name: Test help output
        run: |
          OUTPUT=$(docker run --rm canasta-cli:test --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "create"
          echo "$OUTPUT" | grep -q "backup"

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.1

      - name: Lint chart with localhost domain
        run: >-
          helm lint roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=localhost'

      - name: Lint chart with real domain
        run: >-
          helm lint roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=example.com'

      - name: Template renders without errors (localhost)
        run: >-
          helm template test roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=localhost'
          > /dev/null

      - name: Template renders without errors (multi-domain)
        run: >-
          helm template test roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=example.com'
          --set 'domains[1]=docs.example.com'
          > /dev/null

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install yamllint

      - name: YAML lint
        run: >-
          .venv/bin/yamllint --strict -c .yamllint.yml
          meta/ roles/ playbooks/ inventory/ canasta.yml

      - name: Python unused-import check
        run: .venv/bin/ruff check --select F401 .

      - name: Validate definitions
        run: .venv/bin/python scripts/validate_definitions.py
