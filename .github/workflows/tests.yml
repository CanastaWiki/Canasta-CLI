---
name: Tests

on:
  push:
    branches: [main, mw-1.47]
  pull_request:
    branches: [main, mw-1.47]
  workflow_dispatch:

# All jobs in this workflow only read the checkout to run tests and
# linters; none push images, write back to the repo, or post comments.
permissions:
  contents: read

jobs:
  # The unit suite runs in four shards on separate runners, each with one
  # pytest-xdist worker per CPU. Most of its time goes to tests that run real
  # task files through ansible-playbook; those are independent processes, but
  # four workers already saturate one runner's CPUs. pytest-split balances the
  # shards using the per-test times in tests/.test_durations (tests missing
  # from it count as the average). Refresh that file when the shards drift
  # apart: run the suite serially with
  #   pytest tests/unit --store-durations --durations-path tests/.test_durations
  unit-shard:
    name: "Unit Tests (shard ${{ matrix.group }}/4)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest-cov

      # Coverage reports and the threshold are computed once, over all
      # shards, in the Unit Tests job below.
      - name: Run unit tests with coverage
        run: |
          .venv/bin/pytest tests/unit/ -v -rs -n auto \
            --splits 4 --group ${{ matrix.group }} \
            --durations-path tests/.test_durations \
            --cov=roles/common/library \
            --cov=roles/common/module_utils \
            --cov=roles/extensions_skins/library \
            --cov=filter_plugins \
            --cov=callback_plugins \
            --cov=scripts \
            --cov=direct_commands \
            --cov=canasta \
            --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.group }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  # Keeps the name of the required "Unit Tests" check. It runs even when a
  # shard fails, and fails itself in that case: a skipped required check
  # would count as passing.
  unit:
    name: Unit Tests
    needs: unit-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any shard did not pass
        if: needs.unit-shard.result != 'success'
        run: |
          echo "Unit test shards finished with: ${{ needs.unit-shard.result }}"
          exit 1

      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest-cov

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data

      - name: Combine coverage and check the threshold
        run: |
          # Each artifact holds one shard's .coverage file; give each a
          # distinct name so coverage combine reads them all.
          for dir in coverage-data/coverage-data-*; do
            mv "$dir/.coverage" ".coverage.${dir##*-}"
          done
          .venv/bin/coverage combine
          .venv/bin/coverage report --show-missing
          .venv/bin/coverage xml -o coverage.xml
          .venv/bin/coverage html -d htmlcov
          .venv/bin/coverage report --fail-under=70 > /dev/null

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          # Total as a single integer percentage, plus the per-module
          # markdown table that coverage.py generates directly.
          TOTAL=$(.venv/bin/coverage report --format=total)
          {
            echo "## Unit Test Coverage: ${TOTAL}%"
            echo ""
            .venv/bin/coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn

      - name: Upload coverage XML
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Validate command definitions
        run: .venv/bin/python scripts/validate_definitions.py

      - name: Check every integration test is run by CI
        run: .venv/bin/python scripts/validate_ci_test_coverage.py

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t canasta-cli:test .

      - name: Test version command
        run: |
          OUTPUT=$(docker run --rm canasta-cli:test version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Canasta CLI v"

      - name: Test list command (empty registry)
        run: |
          OUTPUT=$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            canasta-cli:test list)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No Canasta instances"

      - name: Test doctor command
        run: |
          OUTPUT=$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            canasta-cli:test doctor)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Docker"

      - name: Test help output
        run: |
          OUTPUT=$(docker run --rm canasta-cli:test --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "create"
          echo "$OUTPUT" | grep -q "backup"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install yamllint

      # One target, so CI and a local `make lint` cannot disagree. They
      # had: this job still passed `--select F401`, which overrides
      # ruff.toml and silently ran a weaker check than the Makefile, and
      # it never ran ansible-lint at all.
      - name: Lint (yamllint, ruff, ansible-lint, definitions)
        run: make lint

      - name: Shell lint
        uses: docker://koalaman/shellcheck:stable
        with:
          args: --severity=info canasta-docker canasta-native get-canasta.sh

      - name: Workflow lint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color=false

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: hadolint.yaml
