---
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# All jobs in this workflow only read the checkout to run tests and
# linters; none push images, write back to the repo, or post comments.
permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest-cov

      - name: Run unit tests with coverage
        run: |
          .venv/bin/pytest tests/unit/ -v \
            --cov=roles/common/library \
            --cov=roles/extensions_skins/library \
            --cov=scripts \
            --cov=direct_commands \
            --cov=canasta \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          # Total as a single integer percentage, plus the per-module
          # markdown table that coverage.py generates directly.
          TOTAL=$(.venv/bin/coverage report --format=total)
          {
            echo "## Unit Test Coverage: ${TOTAL}%"
            echo ""
            .venv/bin/coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn

      - name: Upload coverage XML
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Validate command definitions
        run: .venv/bin/python scripts/validate_definitions.py

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t canasta-cli:test .

      - name: Test version command
        run: |
          OUTPUT=$(docker run --rm canasta-cli:test version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Canasta CLI v"

      - name: Test list command (empty registry)
        run: |
          OUTPUT=$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            canasta-cli:test list)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No Canasta instances"

      - name: Test doctor command
        run: |
          OUTPUT=$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            canasta-cli:test doctor)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Docker"

      - name: Test help output
        run: |
          OUTPUT=$(docker run --rm canasta-cli:test --help)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "create"
          echo "$OUTPUT" | grep -q "backup"

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.1

      - name: Lint chart with localhost domain
        run: >-
          helm lint roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=localhost'

      - name: Lint chart with real domain
        run: >-
          helm lint roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=example.com'

      - name: Template renders without errors (localhost)
        run: >-
          helm template test roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=localhost'
          > /dev/null

      - name: Template renders without errors (multi-domain)
        run: >-
          helm template test roles/orchestrator/files/helm/canasta/
          --set instance.id=test
          --set 'domains[0]=example.com'
          --set 'domains[1]=docs.example.com'
          > /dev/null

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install yamllint

      # One target, so CI and a local `make lint` cannot disagree. They
      # had: this job still passed `--select F401`, which overrides
      # ruff.toml and silently ran a weaker check than the Makefile, and
      # it never ran ansible-lint at all.
      - name: Lint (yamllint, ruff, ansible-lint, definitions)
        run: make lint

      - name: Shell lint
        uses: docker://koalaman/shellcheck:stable
        with:
          args: --severity=info canasta-docker canasta-native get-canasta.sh

      - name: Workflow lint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color=false

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: hadolint.yaml
