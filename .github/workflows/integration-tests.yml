---
name: Integration Tests

# Integration tests create real Canasta instances and take minutes each, so
# they run on push to main and on demand, not on pull requests.
on:
  push:
    branches: [main]
  # Manual trigger for re-running the full suite.
  workflow_dispatch:
    inputs:
      podman_full_matrix:
        description: "Test every Podman version, not just the one a push tests"
        type: boolean
        default: false
      two_image:
        description: "Also build both images from a Canasta checkout"
        type: boolean
        default: false
  # Weekly full version sweep so push-to-main can run a single
  # representative leg while the matrix is still exercised regularly.
  schedule:
    - cron: "0 0 * * 0"

# The jobs in this workflow only read the checkout to run tests; none push
# images or write back to the repo.
permissions:
  contents: read

# Each push to main contains every earlier one, so a newer run supersedes
# the older one; cancel it rather than let back-to-back merges queue full
# runs that hold every runner and starve the other workflows.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# The Docker tests are split into matrix legs balanced by measured per-test
# runtime, so each leg finishes in about fifteen minutes and the run is no
# longer than its longest leg. Tests are independent: each creates its own
# instance, and each leg runs on its own runner. Job names are static (no
# matrix expression) so GitHub renders the leg suffix correctly.

jobs:
  integration-docker:
    name: "Integration: Docker"
    # Run only on push to main and manual workflow_dispatch, not on the
    # weekly schedule.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      # Every leg runs at once. With the Podman and remote legs the run
      # stays under the account's 20 concurrent jobs
      # (test_integration_workflow_concurrency.py checks the total).
      max-parallel: 15
      # Each leg is named for its longest test.
      matrix:
        leg: ["config-side-effects", "sidecar-lifecycle",
              "upgrade-backfills-mycnf-template", "extension-lifecycle",
              "backup", "backup-advanced", "gitops-pull-reapplies",
              "add-extra-database", "backup-restore-safety",
              "backup-extra-database", "backup-custom-dockerfile",
              "crowdsec", "wiki-farm", "config-set-gitops-domain",
              "gitops-join"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The gitops tests need the runner user in www-data, the group that
      # owns the wiki files; every leg gets it because any leg may hold
      # one.
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          sudo groupadd -f www-data
          sudo usermod -aG www-data "$(whoami)"
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      - name: Run Docker tests (${{ matrix.leg }})
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            "config-side-effects")
              tests="config-side-effects upgrade-rebuilds-buildable reconcile" ;;
            "sidecar-lifecycle")
              tests="sidecar-lifecycle config-set-gitops-port canasta-base" ;;
            "upgrade-backfills-mycnf-template")
              tests="upgrade-backfills-mycnf-template import sidecar-migrate" ;;
            "extension-lifecycle")
              tests="extension-lifecycle gitops-push-shared gitops-fix-submodules-no-url" ;;
            "backup")
              tests="backup gitops-fix-submodules config-set-gitops" ;;
            "backup-advanced")
              tests="backup-advanced gitops-pull-diff upgrade-backfill-hosts-yaml" ;;
            "gitops-pull-reapplies")
              tests="gitops-pull-reapplies gitops-renders-mycnf gitops-add-wikis-yaml maintenance" ;;
            "add-extra-database")
              tests="add-extra-database gitops upgrade" ;;
            "backup-restore-safety")
              tests="backup-restore-safety sitemap schedule" ;;
            "backup-extra-database")
              tests="backup-extra-database upgrade-refreshes-gitignore gitops-push-reporting" ;;
            "backup-custom-dockerfile")
              tests="backup-custom-dockerfile rebuild gitops-status-fetch" ;;
            "crowdsec")
              tests="crowdsec skin-lifecycle config-refresh-template host-management" ;;
            "wiki-farm")
              tests="wiki-farm gitops-add-wiki-tracked upgrade-backfills-wikis-template doctor" ;;
            "config-set-gitops-domain")
              tests="config-set-gitops-domain extension-skin build-from-overlay" ;;
            "gitops-join")
              tests="gitops-join lifecycle backup-missing-dockerfile version" ;;
            *) echo "unknown leg: $LEG" >&2; exit 1 ;;
          esac
          sg www-data -c ".venv/bin/python tests/integration/run_tests.py --no-skip $tests"
        timeout-minutes: 22

  # Podman is a supported container runtime, but every other integration job
  # runs on Docker — so a Podman-only regression ships with a green suite.
  # This lane runs the core lifecycle tests on podman-compose.
  #
  # Docker is taken away rather than left idle: a hardcoded `docker` call has
  # to fail here instead of quietly reaching a live daemon.
  #
  # A matrix tests three podman versions (4.9.5, 5.3.2, 5.8.4) and two
  # podman-compose versions (1.3.0, 1.6.0), each split into the same three
  # test legs. The weekly schedule adds a backup leg on the newest pair. A
  # push to main tests only 5.3.2 with 1.3.0, and so does a manual run unless
  # its podman_full_matrix input is set. The
  # full podman binary with its runtime helpers (crun, conmon, netavark,
  # fuse-overlayfs) is downloaded as a self-contained static bundle from
  # mgoltzsche/podman-static.
  #
  # Known limitation: mgoltzsche/podman-static tops out at v5.8.4, so this
  # lane cannot test podman 6.x.  When ubuntu-26.04 ships with podman 6.x
  # from apt, a separate lane or runner update will be needed.
  integration-podman-matrix:
    name: "Integration: Podman matrix"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set podman test matrix
        id: set-matrix
        env:
          EVENT: ${{ github.event_name }}
          FULL_MATRIX: ${{ inputs.podman_full_matrix }}
        run: |
          legs='"leg":["lifecycle & upgrade","rebuild-buildable","rebuild & socket"]'
          if [ "$EVENT" = "push" ] ||
             { [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL_MATRIX" != "true" ]; }; then
            # On push-to-main, and on a manual run unless it asks for the
            # full sweep, run one representative version to keep the long
            # pole short; the full sweep runs on schedule and on request.
            matrix='{"podman_version":["5.3.2"],"podman_compose_version":["1.3.0"],'"$legs"'}'
          else
            compose16='{"podman_version":"5.8.4","podman_compose_version":"1.6.0","leg":'
            include="[${compose16}\"lifecycle & upgrade\"},${compose16}\"rebuild-buildable\"},${compose16}\"rebuild & socket\"}]"
            if [ "$EVENT" = "schedule" ]; then
              include="${include%]},${compose16}\"backup\"}]"
            fi
            matrix='{"podman_version":["4.9.5","5.3.2","5.8.4"],"podman_compose_version":["1.3.0"],'"$legs"',"include":'"$include"'}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration-podman:
    name: "Integration: Podman"
    needs: integration-podman-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two runners take the three push legs in about as long as the
      # longest Docker leg.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.integration-podman-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt uidmap

      - name: Leg details
        run: |
          echo "podman=${{ matrix.podman_version }} podman-compose=${{ matrix.podman_compose_version }} leg=${{ matrix.leg }}"

      - name: Download podman ${{ matrix.podman_version }} static bundle
        run: |
          url="https://github.com/mgoltzsche/podman-static/releases/download/v${{ matrix.podman_version }}/podman-linux-amd64.tar.gz"
          curl -fsSL --retry 3 "$url" -o /tmp/podman-static.tar.gz
          # Pinned sha256 — if the upstream archive changes, update these.
          # Computed from the release asset at the time of writing.
          case "${{ matrix.podman_version }}" in
            4.9.5) expected="05fcac12a6777c4db5f90ecf71b859d669c7bb1a8ee39d9ab299ac9ad1f99c5d" ;;
            5.3.2) expected="3feea505a40cba6d4940cbfcbc89e28441073685c0d93b9e1e0a69fd2379b7b5" ;;
            5.8.4) expected="a58765fe8be6ab3fb79f892f1a027b4ce4a7e8eb589df1ef960c167cbde08d69" ;;
            *)     echo "unknown podman version: ${{ matrix.podman_version }}" >&2; exit 1 ;;
          esac
          actual=$(sha256sum /tmp/podman-static.tar.gz | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "sha256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          # The archive root contains both usr/ and etc/.  Extract each
          # tree with the strip level that lands it at the matching system
          # path, not nested under /usr/local/local.
          sudo tar -xzf /tmp/podman-static.tar.gz \
            -C /usr --strip-components=2 podman-linux-amd64/usr/
          # Installing etc/containers/ from the bundle replaces the runner's
          # registries.conf with an older format, but this lane is rootless so
          # ~/.config/containers/registries.conf (written below) wins.
          sudo tar -xzf /tmp/podman-static.tar.gz \
            -C /etc --strip-components=2 podman-linux-amd64/etc/
          rm -f /tmp/podman-static.tar.gz
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      # The runner image ships its own podman binary.  Move those aside so the
      # downloaded one is what runs.  (The /usr/local/bin entry added via
      # GITHUB_PATH is prepended to PATH, but we keep the loop as defense-in
      # depth in case a system path is added later.)
      - name: Shadow other podman binaries on PATH
        run: |
          downloaded="$(readlink -f /usr/local/bin/podman)"
          for p in $(type -a -P podman || true); do
            [ -e "$p" ] || continue
            if [ "$(readlink -f "$p")" != "$downloaded" ]; then
              echo "Shadowing $p ($("$p" --version 2>/dev/null || echo unknown))"
              sudo mv "$p" "$p.shadowed"
            fi
          done
          hash -r

      # Ubuntu >=24.04 ships an AppArmor profile that restricts user
      # namespaces to processes matching specific profiles.  The static
      # podman lives at /usr/local/bin/podman, not /usr/bin/podman, so
      # the stock profile doesn't apply.  Widen the path glob so the
      # downloaded binary can create user namespaces.  See mgoltzsche/
      # podman-static documentation for the recommended profile change.
      - name: Relax AppArmor profile for /usr/local/bin/podman
        run: |
          if [ -f /etc/apparmor.d/podman ]; then
            sudo sed -Ei \
              's!^profile podman /usr/bin/podman !profile podman /usr/{bin,local/bin}/podman !' \
              /etc/apparmor.d/podman
            sudo apparmor_parser -r /etc/apparmor.d/podman 2>/dev/null || true
            grep -q '/usr/{bin,local/bin}/podman' /etc/apparmor.d/podman || {
              echo "AppArmor profile update not confirmed" >&2
              exit 1
            }
          fi

      - name: Configure rootless Podman
        run: |
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/registries.conf <<'EOF'
          unqualified-search-registries = ["docker.io"]
          EOF
          # Point to the system fuse-overlayfs (which uses the distro's
          # setuid fusermount3) rather than the static bundle's copy
          # (which lacks the setuid bit needed for unprivileged FUSE).
          cat > ~/.config/containers/storage.conf <<'EOF'
          [storage]
          driver = "overlay"
          [storage.options.overlay]
          mount_program = "/usr/bin/fuse-overlayfs"
          EOF
          # The bundle's own /etc/containers/containers.conf sets
          # cgroup_manager = "cgroupfs" and events_logger = "file".  Add
          # a user-level override that points the crun runtime at the bundle
          # copy; otherwise podman searches a built-in absolute-path list
          # that puts /usr/bin/crun ahead of /usr/local/bin/crun and the
          # system crun is too old for podman 5.x.
          cat > ~/.config/containers/containers.conf <<'EOF'
          [engine]
          cgroup_manager = "cgroupfs"
          events_logger = "file"
          [engine.runtimes]
          crun = ["/usr/local/bin/crun"]
          EOF
          # Subordinate id ranges are a property of the runner image, not
          # something Canasta configures — the static bundle brings no
          # useradd hook to write them. Lingering, the unprivileged port
          # floor and the socket are deliberately NOT set here: they are
          # the three rootless prerequisites `canasta install podman`
          # exists to configure, and setting them by hand would mean this
          # lane never tests that it does.
          grep -q "^$(id -un):" /etc/subuid 2>/dev/null || \
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          grep -q "^$(id -un):" /etc/subgid 2>/dev/null || \
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Install podman-compose ${{ matrix.podman_compose_version }}
        run: |
          python -m pip install --user \
            "podman-compose==${{ matrix.podman_compose_version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify podman-compose version
        run: |
          resolved="$(command -v podman-compose || true)"
          if [ -z "$resolved" ]; then
            echo "podman-compose not found on PATH" >&2
            exit 1
          fi
          # --version prints both the compose version and the podman version
          # on separate lines; the 'version' subcommand has a --short flag.
          version="$(podman-compose version --short)"
          echo "podman-compose: $resolved ($version)"
          echo "target:  ${{ matrix.podman_compose_version }}"
          if [ "$version" != "${{ matrix.podman_compose_version }}" ]; then
            echo "expected podman-compose ${{ matrix.podman_compose_version }}" \
                 "but got $version from $resolved" >&2
            exit 1
          fi

      - name: Verify podman version
        run: |
          resolved="$(command -v podman || true)"
          if [ -z "$resolved" ]; then
            echo "podman not found on PATH after download/shadow" >&2
            exit 1
          fi
          version="$(podman --version | awk '{print $3}')"
          echo "podman:  $resolved ($version)"
          echo "target:  ${{ matrix.podman_version }}"
          target="${{ matrix.podman_version }}"
          if [ "$version" != "$target" ]; then
            echo "expected podman $target but got $version from $resolved" >&2
            exit 1
          fi

      - name: Remove Docker so only Podman is reachable
        run: |
          sudo systemctl stop docker.socket docker.service || true
          sudo systemctl mask docker.socket docker.service || true
          # On this runner /bin is a symlink to /usr/bin, so type -a -P docker
          # can return the same binary twice; the guard skips the second hit.
          for d in $(type -a -P docker || true); do
            if [ -e "$d" ]; then
              sudo mv "$d" "$d.disabled"
            fi
          done
          hash -r
          if command -v docker; then
            echo "docker is still on PATH" >&2
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"

      # The rootless prerequisites — lingering, the unprivileged port
      # floor, and the socket — are configured the way an operator
      # configures them, so the lane both exercises the install path and
      # ends up in the state a real Podman host is in.
      #
      # The socket is the point. Without it the CLI detects no Podman
      # socket, falls through to "Docker absent, use Podman" instead, and
      # the lane silently tests a route no installed host takes.
      - name: Configure rootless prerequisites via canasta install podman
        run: ./canasta-native install podman

      # Every one of those three steps warns rather than fails when it
      # cannot be applied, which is exactly how this gap stayed invisible.
      # Assert the results so a silent regression fails the lane instead
      # of quietly restoring the blind spot.
      - name: Assert the rootless prerequisites are in place
        run: |
          fail=0
          sock="/run/user/$(id -u)/podman/podman.sock"
          if [ ! -S "$sock" ]; then
            echo "No socket at $sock — 'canasta install podman' did not enable" \
                 "podman.socket, so this lane cannot reach the socket-detection" \
                 "path it exists to cover." >&2
            systemctl --user status podman.socket --no-pager 2>&1 | head -20 >&2 || true
            fail=1
          fi
          if [ "$(loginctl show-user "$(id -un)" -p Linger --value)" != "yes" ]; then
            echo "Lingering is off — systemd would reap the containers when" \
                 "the session ends." >&2
            fail=1
          fi
          floor="$(cat /proc/sys/net/ipv4/ip_unprivileged_port_start)"
          if [ "$floor" -gt 80 ]; then
            echo "Unprivileged port floor is $floor — rootless Caddy cannot" \
                 "bind 80/443." >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "socket=$sock linger=yes port_floor=$floor"

      # After `canasta install podman`, so this confirms the environment
      # that command produced actually runs containers — /run/user/<uid>
      # does not exist until lingering is enabled.
      - name: Smoke test podman
        run: |
          podman --version
          podman-compose --version
          podman info >/dev/null
          podman run --rm docker.io/library/alpine:latest true
          echo "Podman ${{ matrix.podman_version }} smoke test passed"

      - name: Run Podman tests (${{ matrix.leg }})
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            "lifecycle & upgrade") tests=(lifecycle upgrade doctor) ;;
            "rebuild-buildable")   tests=(upgrade-rebuilds-buildable) ;;
            "rebuild & socket")    tests=(rebuild podman-socket-runtime) ;;
            "backup")              tests=(backup-advanced) ;;
            *) echo "unknown podman leg: $LEG" >&2; exit 1 ;;
          esac
          .venv/bin/python tests/integration/run_tests.py --no-skip "${tests[@]}"
        timeout-minutes: 18

  # Building both images from Canasta's main branch takes far longer than a
  # push leg allows, so it runs weekly and on request.
  integration-two-image:
    name: "Integration: Two-image build from source"
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.two_image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          git config --global user.name "CI"
          git config --global user.email "ci@canasta.wiki"
      - name: Run two-image build tests
        run: >-
          .venv/bin/python tests/integration/run_tests.py --no-skip
          build-from-two-image build-from-canasta-base
        timeout-minutes: 80

  remote-integration:
    name: Remote Host Integration Tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The single-host and multi-host tests take about 8 and 12 minutes, so
    # they run on separate runners.
    strategy:
      fail-fast: false
      matrix:
        part: [single, multi]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run remote integration tests
        run: tests/integration/remote/run_tests.sh ${{ matrix.part }}
        timeout-minutes: 40
