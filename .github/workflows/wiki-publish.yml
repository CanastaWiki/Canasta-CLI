---
# Publish Canasta CLI Reference to wiki
#
# Fires on every push to main and on manual dispatch. Publishes the
# CLI: namespace and MediaWiki:Menu-cli-reference to the wiki at
# WIKI_API_URL.
#
# Required secrets (set at the repo or org level):
#   WIKI_API_URL      - e.g. https://canasta.wiki/w/api.php
#   WIKI_BOT_USER     - e.g. User@BotName
#   WIKI_BOT_PASSWORD

name: Publish CLI Reference to Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'meta/command_definitions.yml'
      - 'scripts/wiki_publish.py'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

# Publishing happens against an external MediaWiki via API; the
# workflow doesn't need to write to this repo.
permissions:
  contents: read

# Overlapping runs edit the same pages and hit MediaWiki edit conflicts.
concurrency:
  group: wiki-publish
  cancel-in-progress: false

env:
  WIKI_API_URL: >-
    ${{ secrets.WIKI_API_URL
        || 'https://test-docs.canasta.wiki/w/api.php' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Publish CLI reference pages
        run: |
          python scripts/wiki_publish.py \
            --api "${{ env.WIKI_API_URL }}" \
            --user "${{ secrets.WIKI_BOT_USER }}" \
            --pass "${{ secrets.WIKI_BOT_PASSWORD }}" \
            --prune
