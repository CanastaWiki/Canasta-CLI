---
# Build and push Canasta's Caddy image (upstream Caddy + the CrowdSec
# bouncer).
#
# The caddy service runs this image when CrowdSec is enabled. It
# is versioned by the bundled Caddy release, not the Canasta-CLI VERSION
# file, so it builds only when its Dockerfile changes or on manual
# dispatch — independent of the canasta-ansible image pipeline in
# docker.yml.
#
# Tags: the Caddy base version, with a -<n> revision when the plugin set
# changes on the same Caddy version (e.g. 2.11.9-1), plus 'latest' on
# main. Change the tag in the same commit as the Dockerfile, and keep it in
# lockstep with canasta_caddy_plugin_image in vars/images.yml: a manual
# dispatch from any branch publishes that branch's Dockerfile under this
# tag, replacing whatever was published under it before.

name: Caddy Image

on:
  push:
    branches: [main]
    paths:
      - "images/caddy/**"
      - ".github/workflows/docker-caddy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/canastawiki/canasta-caddy
          tags: |
            type=raw,value=2.11.9-1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/caddy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
