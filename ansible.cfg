[defaults]
inventory = inventory/localhost.yml
roles_path = roles
library = roles/common/library:roles/extensions_skins/library:roles/backup/library
# Role-local module_utils only auto-discover when the role is invoked
# via the play-level `roles:` keyword. Canasta uses `include_role` /
# `include_tasks` everywhere, so we have to add the path explicitly
# here for `from ansible.module_utils.canasta_validate import …` to
# resolve at runtime (it works in unit tests via conftest only).
module_utils = roles/common/module_utils
gathering = explicit
# Overridden at runtime by canasta.py to canasta_minimal (non-verbose mode)
stdout_callback = default
callback_plugins = callback_plugins
# Role-local filter plugins do not auto-discover under include_role (same
# reason as module_utils above), so the filter dir is registered here.
filter_plugins = filter_plugins
# Suppressed to keep CLI output clean
deprecation_warnings = False
nocows = True
retry_files_enabled = False

[ssh_connection]
control_path_dir = /tmp/.ansible-cp
# ServerAliveInterval because a restore or a large backup can spend tens of
# minutes inside one task with no traffic on the connection, and neither ssh
# nor sshd sends keepalives by default — an idle session is then at the mercy
# of every NAT and stateful firewall in the path. Two interrupted restores
# died this way, mid-task, where no rescue can run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20
pipelining = True

[privilege_escalation]
become = False
