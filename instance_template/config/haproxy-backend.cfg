# HAProxy configuration for this instance at the HAProxy edge.
# Lines here are added to each of this instance's backends in the edge's
# generated haproxy.cfg. This file is not overwritten by the CLI or by
# upgrades. Changes take effect at the next 'canasta restart'; the edge
# checks the result first and rejects a configuration HAProxy would not load.
#
# Only backend directives belong here. For example:
#   http-request deny if { path_beg /private }
#   http-request deny if { path_beg /wiki/Special:UserLogin } !{ src 192.0.2.0/24 }
#   timeout server 300s
#
# See https://docs.haproxy.org/3.2/configuration.html for available directives.
