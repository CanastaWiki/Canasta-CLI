# Generated by Canasta. Do not edit: changes are lost on the next render.

global
    log stdout format raw local0
    maxconn 2000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout http-request 10s
    timeout server 180s
    timeout queue 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend http
    bind :80
    http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].THUMB\n" if { path_beg /.well-known/acme-challenge/ }
    http-request redirect scheme https code 301

frontend https
    bind :443 ssl crt-list /usr/local/etc/haproxy/crt-list alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].THUMB\n" if { path_beg /.well-known/acme-challenge/ }
    http-request set-var(txn.site) req.hdr(host),lower,field(1,:),map(/usr/local/etc/haproxy/hosts.map)
    http-request set-var(txn.inst) var(txn.site),field(1,/)
    acl known_site var(txn.inst) -m found
    acl media_host var(txn.site),field(2,/) -m str media
    acl dynamic path_sub /api.php
    acl dynamic path_sub /rest.php/
    acl dynamic req.fhdr(cookie) -m reg ([sS]ession|Token)=
    acl dynamic req.hdr(authorization) -m found
    acl dynamic url_sub -i Special:
    acl dynamic url_sub -i Special%3A
    acl dynamic url_param(diff) -m found
    acl dynamic url_param(oldid) -m found
    acl has_action url_param(action) -m found
    acl view_action url_param(action) -m str view
    use_backend be_%[var(txn.inst)]_dynamic if known_site !media_host dynamic
    use_backend be_%[var(txn.inst)]_dynamic if known_site !media_host !METH_GET
    use_backend be_%[var(txn.inst)]_dynamic if known_site !media_host has_action !view_action
    use_backend be_%[var(txn.inst)]_default if known_site
    default_backend be_no_site

backend be_no_site
    http-request return status 404 content-type text/plain string "No site is served at this address.\n"

backend be_main_dynamic
    server caddy caddy-main:80 resolvers docker init-addr last,libc,none check maxconn 15

backend be_main_default
    server caddy caddy-main:80 resolvers docker init-addr last,libc,none check maxconn 200

backend be_other_dynamic
    server caddy caddy-other:80 resolvers docker init-addr last,libc,none check maxconn 6
    http-request deny if { path_beg /private }

backend be_other_default
    server caddy caddy-other:80 resolvers docker init-addr last,libc,none check maxconn 20
    http-request deny if { path_beg /private }
