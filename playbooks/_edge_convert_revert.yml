---
# Undo a failed move to the edge for one instance: put back the files the
# previous release left, so its Caddy serves its own ports and certificates
# again.
# Input: _edge_inst

- name: Point the facts at the instance
  ansible.builtin.include_tasks: _edge_instance_facts.yml

- name: Put back the files the move changed
  ansible.builtin.shell:
    cmd: >-
      for f in docker-compose.yml .env config/Caddyfile; do
      [ -e "{{ _edge_backups[instance_id] }}/$f" ]
      && cp -p "{{ _edge_backups[instance_id] }}/$f" "$f"; done; true
    chdir: "{{ instance_path }}"
  changed_when: true
  when: instance_id in (_edge_backups | default({}))

- name: Take the instance out of the edge
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: edge_sync.yml
  vars:
    edge_member: absent

- name: Point the facts at the instance without its edge layer
  ansible.builtin.include_tasks: _edge_instance_facts.yml

- name: Start the instance's Caddy on its own ports
  ansible.builtin.command:
    cmd: "{{ compose_command }} {{ _edge_caddy_files | join(' ') }} up -d --no-deps --force-recreate caddy"
    chdir: "{{ instance_path }}"
  changed_when: true
  when: _edge_was_running[instance_id] | default(false) | bool

- name: Drop the files kept to undo the move
  ansible.builtin.file:
    path: "{{ _edge_backups[instance_id] }}"
    state: absent
  when: instance_id in (_edge_backups | default({}))
