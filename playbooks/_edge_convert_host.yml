---
# Move a host's eligible Docker Compose instances behind the HAProxy edge.
# Called once per host from upgrade.yml, before the instances upgrade, so
# the switch happens for every instance on the host at once: the edge needs
# 80/443, which each instance's Caddy holds until then.
# Input: _edge_host_name, _edge_host_instances (the host's Compose
#        registry entries, as id -> entry items)

- name: Decide which instances move behind the edge
  ansible.builtin.include_tasks: _edge_plan_host.yml

# Its instances are not upgraded either: they would come back without a
# working front door.
- name: Refuse a host the edge cannot serve yet
  ansible.builtin.set_fact:
    _upgrade_failures: >-
      {{ _upgrade_failures | default([]) + [
           'not upgrading ' ~ _edge_host_name ~ ': ' ~ _edge_plan.refuse] }}
    _edge_refused: "{{ _edge_refused | default([]) + _edge_plan.held }}"
    _edge_refusals: "{{ _edge_refusals | default(0) | int + 1 }}"
  when: _edge_plan.refuse is not none

- name: Warn about instances moving on rootless Docker
  ansible.builtin.debug:
    msg: >-
      '{{ item }}' runs on rootless Docker, whose port forwarding replaces
      each visitor's address with its own while the daemon's userland proxy
      is on, as it is by default, so MediaWiki, CrowdSec and the HAProxy edge
      cannot tell visitors apart; the edge applies no per-client rate limits
      to it. RootlessKit 3.0 or later keeps visitors' addresses once the
      userland proxy is off: set "userland-proxy": false in
      ~/.config/docker/daemon.json, load the br_netfilter kernel module,
      restart the daemon, then set CANASTA_EDGE_RATE_DYNAMIC and
      CANASTA_EDGE_RATE_DEFAULT to turn the limits on.
  loop: "{{ _edge_plan.rootless | default([]) }}"

- name: Move instances behind the edge
  when: _edge_plan.convert | length > 0
  block:
    - name: Prepare each instance for the edge
      ansible.builtin.include_tasks: _edge_convert_prepare.yml
      loop: "{{ _edge_host_instances | selectattr('key', 'in', _edge_plan.convert) | list }}"
      loop_control:
        loop_var: _edge_inst
        label: "{{ _edge_inst.key }}"

    # From here until each instance rejoins, its sites are down: seconds.
    - name: Stop each instance's Caddy
      ansible.builtin.command:
        cmd: "{{ _edge_inst.value.composeCommand | default(_upgrade_default_compose_command) }} stop caddy"
        chdir: "{{ _edge_inst.value.path }}"
      loop: "{{ _edge_host_instances | selectattr('key', 'in', _edge_plan.convert) | list }}"
      loop_control:
        loop_var: _edge_inst
        label: "{{ _edge_inst.key }}"
      changed_when: true

    - name: Bring each instance up behind the edge
      ansible.builtin.include_tasks: _edge_convert_join.yml
      loop: "{{ _edge_host_instances | selectattr('key', 'in', _edge_plan.convert) | list }}"
      loop_control:
        loop_var: _edge_inst
        label: "{{ _edge_inst.key }}"

    - name: Report instances now behind the edge
      ansible.builtin.debug:
        msg: >-
          Moved {{ _edge_plan.convert | join(', ') }} behind the HAProxy edge
          on {{ _edge_host_name }}, at the same addresses as before.

    - name: Drop the files kept to undo the move
      ansible.builtin.file:
        path: "{{ item.value }}"
        state: absent
      loop: "{{ _edge_backups | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  rescue:
    - name: Put each instance back in front of its own Caddy
      ansible.builtin.include_tasks: _edge_convert_revert.yml
      loop: "{{ _edge_host_instances | selectattr('key', 'in', _edge_plan.convert) | list }}"
      loop_control:
        loop_var: _edge_inst
        label: "{{ _edge_inst.key }}"

    # Reported with the other upgrade failures; the instances are not
    # upgraded, since they are back as the previous release left them.
    - name: Record the failed move to the edge
      ansible.builtin.set_fact:
        _upgrade_failures: >-
          {{ _upgrade_failures | default([]) + [
               'moving ' ~ (_edge_plan.convert | join(', ')) ~ ' behind the HAProxy edge on '
               ~ _edge_host_name ~ ' failed; '
               ~ (_edge_plan.convert | join(', '))
               ~ (' is back on its' if _edge_plan.convert | length == 1 else ' are back on their')
               ~ ' own Caddy as before the upgrade, and not upgraded. Run the upgrade again'
               ~ ' once this is fixed: '
               ~ (ansible_failed_result.msg | default('see the task above') | trim)] }}
        _edge_refused: "{{ _edge_refused | default([]) + _edge_plan.convert }}"
        _edge_refusals: "{{ _edge_refusals | default(0) | int + 1 }}"
