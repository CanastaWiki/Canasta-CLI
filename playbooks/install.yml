---
# canasta install - Install dependencies on the target host.
# Accepts one or more package names: docker, git-crypt, sops, canasta,
# podman, docker-rootless, uv, uv:<tool>.

# When --id is given without --host, resolve the instance's registered
# host and switch the connection to it. This lets `canasta install
# -i mysite git-crypt` install on whichever host the instance lives on
# without the user having to recall it.
- name: Resolve instance host from --id
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"
  when:
    - id is defined and id != ''
    - target_host is not defined or target_host == '' or target_host == 'localhost'

- name: Split the requested packages
  ansible.builtin.set_fact:
    _install_packages: "{{ packages.split() }}"

- name: Validate packages
  ansible.builtin.fail:
    msg: >-
      Unknown package '{{ item }}'. Supported: docker, git-crypt, sops,
      canasta, podman, docker-rootless, uv, uv:<tool>.
  when: >
    item not in ['docker', 'git-crypt', 'sops', 'canasta', 'podman',
                 'docker-rootless', 'uv']
    and not (item | regex_search('^uv:[a-zA-Z0-9_-]+$'))
  loop: "{{ _install_packages }}"

- name: Separate uv-prefixed targets from the requested packages
  ansible.builtin.set_fact:
    _uv_targets: >-
      {{ _install_packages | select('search', '^uv:')
         | map('regex_replace', '^uv:', '') | list }}

# Every package below needs root. Refuse now, with a message naming the
# cause, rather than letting become time out mid-install.
- name: Check that privilege escalation will work
  ansible.builtin.include_role:
    name: install
    tasks_from: _escalation_preflight.yml

- name: Install Docker
  ansible.builtin.include_role:
    name: install
    tasks_from: docker.yml
  when: "'docker' in _install_packages"

- name: Install git-crypt
  ansible.builtin.include_role:
    name: install
    tasks_from: git_crypt.yml
  when: "'git-crypt' in _install_packages"

- name: Install the SOPS toolchain (sops + age)
  ansible.builtin.include_role:
    name: install
    tasks_from: sops_age.yml
  when: "'sops' in _install_packages"

- name: Install canasta-native
  ansible.builtin.include_role:
    name: install
    tasks_from: canasta.yml
  when: "'canasta' in _install_packages"

- name: Install Podman and configure rootless prerequisites
  ansible.builtin.include_role:
    name: install
    tasks_from: podman.yml
  when: "'podman' in _install_packages"

- name: Install rootless Docker for the operator
  ansible.builtin.include_role:
    name: install
    tasks_from: docker_rootless.yml
  when: "'docker-rootless' in _install_packages"

- name: Install uv and requested uv tools
  ansible.builtin.include_role:
    name: install
    tasks_from: uv.yml
  when: "_uv_targets | length > 0 or 'uv' in _install_packages"
  vars:
    uv_targets: "{{ _uv_targets }}"
    uv_install_self: "{{ 'uv' in _install_packages }}"
