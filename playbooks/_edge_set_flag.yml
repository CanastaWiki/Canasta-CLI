---
# Record an instance's CANASTA_ENABLE_EDGE in .env and, under gitops, in the
# repo's host vars, so a later pull keeps it.
# Input: _edge_flag (item: key = instance ID), _edge_flag_value,
#        _edge_host_instances

- name: Find the instance's directory
  ansible.builtin.set_fact:
    _edge_flag_path: >-
      {{ (_edge_host_instances | selectattr('key', 'equalto', _edge_flag.key)
          | first).value.path }}

- name: Set CANASTA_ENABLE_EDGE
  canasta_env:
    path: "{{ _edge_flag_path }}/.env"
    state: set
    key: CANASTA_ENABLE_EDGE
    value: "{{ _edge_flag_value }}"

- name: Check whether the instance is gitops-managed
  ansible.builtin.stat:
    path: "{{ _edge_flag_path }}/.gitops-host"
  register: _edge_flag_gitops

- name: Record CANASTA_ENABLE_EDGE in the gitops host vars
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/config/tasks/_update_gitops_vars.yml"
  vars:
    instance_path: "{{ _edge_flag_path }}"
    _config_settings: ["CANASTA_ENABLE_EDGE={{ _edge_flag_value }}"]
    _config_gitops_stat: "{{ _edge_flag_gitops }}"
  when: _edge_flag_gitops.stat.exists
