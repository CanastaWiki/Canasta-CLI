---
# canasta upgrade - Upgrade all registered Canasta instances.
# The CLI self-update (git pull on the install dir) happens in
# canasta.py before this playbook runs — see canasta.self_update_cli.
# That keeps the running ansible-playbook process from holding a
# stale ansible.cfg / module_utils path in memory across a pull.

# --- Upgrade instances ---
- name: Get all instances
  canasta_registry:
    state: query_all
    filter_host: "{{ target_host | default(omit) }}"
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _upgrade_instances

- name: Report dry run
  when: dry_run | default(false) | bool
  block:
    - name: Report instances that would upgrade
      ansible.builtin.debug:
        msg: >-
          Dry run - would upgrade
          {{ _upgrade_instances.instances | length }} instance(s):
          {{ _upgrade_instances.instances.keys() | list | join(', ') }}

    - name: Report purge that would run
      ansible.builtin.debug:
        msg: >-
          Dry run - would then purge images superseded by the upgrade on:
          {{ _upgrade_instances.instances.values()
             | map(attribute='host') | map('default', 'localhost')
             | unique | list | join(', ') }}
      when: purge | default(false) | bool

- name: Upgrade each instance
  when: not (dry_run | default(false) | bool)
  block:
    # Each iteration overwrites compose_command/inspect_command, so the
    # per-instance fallback cannot reference them: an instance with no
    # recorded runtime would inherit the previous instance's. Keep the
    # play-scope defaults under names the loop never assigns.
    - name: Remember the default container runtime
      ansible.builtin.set_fact:
        _upgrade_default_compose_command: "{{ compose_command }}"
        _upgrade_default_inspect_command: "{{ inspect_command }}"

    # Before any instance upgrades: on each host, the instances that move
    # behind the HAProxy edge move together, since the edge needs 80/443.
    # The plan leaves Kubernetes instances out.
    - name: Group the instances by host
      ansible.builtin.set_fact:
        _edge_hosts: >-
          {{ _edge_hosts | default({})
             | combine({(item.value.host | default('localhost', true)): [item]},
                       list_merge='append') }}
      loop: "{{ _upgrade_instances.instances | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Move each host's instances behind the edge
      ansible.builtin.include_tasks: _edge_convert_host.yml
      loop: "{{ _edge_hosts | default({}) | dict2items }}"
      loop_control:
        loop_var: _edge_host
        label: "{{ _edge_host.key }}"
      vars:
        _edge_host_name: "{{ _edge_host.key }}"
        _edge_host_instances: "{{ _edge_host.value }}"

    - name: Upgrade instances
      ansible.builtin.include_tasks: _upgrade_single.yml
      loop: >-
        {{ _upgrade_instances.instances | dict2items
           | rejectattr('key', 'in', _edge_refused | default([])) | list }}
      loop_control:
        loop_var: _inst
        label: "{{ _inst.key }}"

    - name: Report upgrade complete
      ansible.builtin.debug:
        msg: >-
          Upgraded
          {{ _upgrade_done }}
          instance(s).{% if _upgrade_gitops_staged | default([]) | length > 0 %}
          {{ _upgrade_gitops_staged | length }} of them
          ({{ _upgrade_gitops_staged | join(', ') }}) {{ _upgrade_staged_phrase }}
          only after 'canasta gitops push'.{% endif %}
      vars:
        # A refused host is one failure but skips each of its instances.
        _upgrade_done: >-
          {{ _upgrade_instances.instances | length - (_edge_refused | default([]) | length)
             - (_upgrade_failures | default([]) | length) + (_edge_refusals | default(0) | int) }}
        _upgrade_staged_phrase: >-
          {{ 'is staged in its gitops repo and deploys'
             if (_upgrade_gitops_staged | default([]) | length) == 1
             else 'are staged in their gitops repos and deploy' }}

    # --- Purge superseded images (--purge) ---
    # Runs once per distinct host after all its instances have upgraded, so
    # the per-host prune / registry restart happens once, not per instance.
    - name: Purge superseded images
      ansible.builtin.include_tasks: _purge_host.yml
      loop: >-
        {{ _upgrade_instances.instances.values()
           | map(attribute='host') | map('default', 'localhost')
           | unique | list }}
      loop_control:
        loop_var: _purge_host_name
      when: purge | default(false) | bool

    - name: Fail if any instance failed to upgrade
      ansible.builtin.fail:
        msg: |
          {{ _upgrade_failures | length }} instance(s) failed to upgrade:
          {% for f in _upgrade_failures %}
            {{ f }}
          {% endfor %}
      when: (_upgrade_failures | default([]) | length) > 0
