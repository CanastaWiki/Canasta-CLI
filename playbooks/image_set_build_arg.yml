---
# canasta image set-build-arg - Set build arguments of an instance built
# from source, then rebuild its image with them.

- name: Resolve instance
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/resolve_instance.yml

- name: Require an instance built from source
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/imagebuild/tasks/require_build_from.yml

- name: Validate build-arg format (KEY=VALUE)
  ansible.builtin.fail:
    msg: >-
      Invalid build argument '{{ item }}': expected KEY=VALUE, with a KEY
      of letters, digits and underscores that does not start with a digit.
  loop: "{{ settings }}"
  when: item is not match('^[A-Za-z_][A-Za-z0-9_]*=')

- name: Name the image the rebuild produces
  ansible.builtin.set_fact:
    _set_build_arg_output: >-
      {{ 'canasta:local' if (instance_is_k8s | bool)
         else 'canasta:local-' ~ instance_id }}

- name: Refuse a BASE_IMAGE that is the build-from output tag
  ansible.builtin.fail:
    msg: >-
      BASE_IMAGE={{ _set_build_arg_output }} collides with the build-from
      output tag ({{ _set_build_arg_output }}): the overlay would build FROM
      its own output and overwrite it. Tag the base under a distinct name,
      e.g. `docker tag {{ _set_build_arg_output }} canasta:merged`, and set
      BASE_IMAGE=canasta:merged.
  when: >-
    (_instance_result.instance.buildArgs | default([])
     | canasta_set_build_args(settings)
     | select('equalto', 'BASE_IMAGE=' ~ _set_build_arg_output) | list | length) > 0

- name: Apply the new build arguments
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/imagebuild/tasks/apply_build_args.yml
  vars:
    _build_args_new: >-
      {{ _instance_result.instance.buildArgs | default([])
         | canasta_set_build_args(settings) }}
