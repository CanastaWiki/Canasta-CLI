---
# canasta import - Import a database into a wiki.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Validate wiki ID
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/validate_wiki_id.yml

- name: Wait for database
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: wait_for_db.yml

- name: Import database
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: import_database.yml
  vars:
    import_wiki_id: "{{ wiki }}"
    import_database_path: "{{ database }}"

# `canasta export` writes each extra database the wiki declares to a sibling
# of the main dump, named <stem>.<database>.sql (or .sql.gz).
- name: Read the wiki's extra databases
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: query
    wiki_id: "{{ wiki }}"
  register: _import_wiki

- name: Name where the extra databases' dumps would be
  ansible.builtin.set_fact:
    _import_stem: "{{ database | regex_replace('(\\.sql)?(\\.gz)?$', '') }}"
    _import_extras: "{{ (_import_wiki.databases | default([wiki], true))[1:] }}"
    _import_extra_dumps: {}

- name: Find the dump for each extra database
  ansible.builtin.set_fact:
    _import_extra_dumps: >-
      {{ _import_extra_dumps | combine({item:
           [_import_stem ~ '.' ~ item ~ '.sql.gz', _import_stem ~ '.' ~ item ~ '.sql']
           | select('file') | first | default('')}) }}
  loop: "{{ _import_extras }}"

- name: Import each extra database
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: import_database.yml
  vars:
    import_wiki_id: "{{ item.key }}"
    import_database_path: "{{ item.value }}"
  loop: "{{ _import_extra_dumps | dict2items | selectattr('value') | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: Find dumps beside the main one that this wiki does not declare
  ansible.builtin.set_fact:
    _import_undeclared: >-
      {{ (query('ansible.builtin.fileglob', _import_stem ~ '.*.sql')
          + query('ansible.builtin.fileglob', _import_stem ~ '.*.sql.gz'))
         | map('regex_replace', '^' ~ (_import_stem | regex_escape) ~ '[.]', '')
         | map('regex_replace', '[.]sql([.]gz)?$', '')
         | reject('in', _import_extras) | unique | list }}

- name: Warn about extra databases with no dump
  ansible.builtin.debug:
    msg: >-
      WARNING: no dump found for extra database(s)
      {{ _import_missing | join(', ') }} of wiki '{{ wiki }}' (looked for
      {{ _import_stem }}.<database>.sql or .sql.gz); left as they are.
  vars:
    _import_missing: "{{ _import_extra_dumps | dict2items | rejectattr('value') | map(attribute='key') | list }}"
  when: _import_missing | length > 0

- name: Warn about dumps for databases this wiki does not declare
  ansible.builtin.debug:
    msg: >-
      WARNING: not imported: {{ _import_undeclared | join(', ') }}, which
      wiki '{{ wiki }}' does not declare as an extra database in this
      instance. Add it with 'canasta backup databases add' and import again
      to bring it in.
  when: _import_undeclared | length > 0

- name: Copy per-wiki Settings.php if provided
  ansible.builtin.copy:
    src: "{{ wiki_settings }}"
    dest: "{{ instance_path }}/config/settings/wikis/{{ wiki }}/Settings.php"
    mode: "0644"
  when: wiki_settings is defined and wiki_settings != ''

- name: Report import complete
  ansible.builtin.debug:
    msg: >-
      Database imported into wiki '{{ wiki }}'{% if _import_extra_dumps | dict2items | selectattr('value') | list %},
      with extra database(s)
      {{ _import_extra_dumps | dict2items | selectattr('value') | map(attribute='key') | join(', ') }}{% endif %}.
