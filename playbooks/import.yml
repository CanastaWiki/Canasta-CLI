---
# canasta import - Import a database into a wiki.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Validate wiki ID
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/validate_wiki_id.yml

- name: Check the input files are on the controller
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/check_controller_files.yml
  vars:
    controller_files:
      - label: Database dump
        path: "{{ database | default('') }}"
      - label: Settings file
        path: "{{ wiki_settings | default('') }}"

- name: Wait for database
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: wait_for_db.yml

- name: Import database
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: import_database.yml
  vars:
    import_wiki_id: "{{ wiki }}"
    import_database_path: "{{ database }}"

- name: Read the wiki's extra databases
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: query
    wiki_id: "{{ wiki }}"
  register: _import_wiki

- name: Import the wiki's extra databases
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: import_extra_databases.yml
  vars:
    extra_dbs_wiki: "{{ wiki }}"
    extra_dbs_dump: "{{ database }}"
    extra_dbs_declared: "{{ (_import_wiki.databases | default([wiki], true))[1:] }}"

- name: Copy per-wiki Settings.php if provided
  ansible.builtin.copy:
    src: "{{ wiki_settings }}"
    dest: "{{ instance_path }}/config/settings/wikis/{{ wiki }}/Settings.php"
    mode: "0644"
  when: wiki_settings is defined and wiki_settings != ''

# update.php reads the wiki's settings, so it runs after any replacement
# Settings.php is in place.
- name: Run update.php for the imported wiki
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
  vars:
    exec_service: web
    exec_command: "php maintenance/update.php --wiki={{ wiki | quote }}"
    exec_user: www-data
    exec_long: true
    exec_long_timeout_msg: >-
      Once it ends, run 'canasta maintenance update -i {{ instance_id }}
      -w {{ wiki }}' to complete it.
  when: not (skip_update | default(false) | bool)

- name: Report import complete
  ansible.builtin.debug:
    msg: >-
      Database imported into wiki '{{ wiki }}'{% if _import_extra_dumps | dict2items | selectattr('value') | list %},
      with extra database(s)
      {{ _import_extra_dumps | dict2items | selectattr('value') | map(attribute='key') | join(', ') }}{% endif %}.
      {% if skip_update | default(false) | bool %}Its schema was not updated
      (--skip-update).{% elif _rx_timed_out | default(false) | bool %}Its schema
      update had not finished when the wait ended.{% else %}Its schema was
      updated.{% endif %}
