---
# canasta add - Add a wiki to an existing Canasta instance.
# wikis.yaml is updated AFTER successful install. A gitops-managed
# Kubernetes instance is staged in its gitops repo instead of being
# redeployed.

- name: Resolve instance
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/resolve_instance.yml

- name: Validate wiki ID
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/validate_wiki_id.yml

- name: Check the input files are on the controller
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/check_controller_files.yml
  vars:
    controller_files:
      - label: Database dump
        path: "{{ database | default('') }}"
      - label: Images tarball
        path: "{{ images | default('') }}"
      - label: Settings file
        path: "{{ wiki_settings | default('') }}"

- name: Read the instance's ports from .env
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read_all
  register: _add_port_env
  no_log: true  # registers the whole .env, including passwords

# MediaWiki matches the request's host:port against wikis.yaml, and every
# wiki on the instance is served on the instance's port, so a URL given
# without a port gets the one create puts on the main wiki's URL.
# Behind the edge every wiki is served on 443, so none gets a port.
- name: Parse URL into domain and path
  vars:
    _add_behind_edge: >-
      {{ _add_port_env.variables.CANASTA_ENABLE_EDGE | default('false', true) | lower == 'true' }}
    _add_http_only: >-
      {{ not (_add_behind_edge | bool)
         and _add_port_env.variables.CADDY_AUTO_HTTPS | default('on') | lower == 'off' }}
    _add_port: >-
      {{ '443' if (_add_behind_edge | bool)
         else _add_port_env.variables.HTTP_PORT | default('80')
         if (_add_http_only | bool)
         else _add_port_env.variables.HTTPS_PORT | default('443') }}
    _add_host: "{{ url | regex_replace('/.*$', '') }}"
  ansible.builtin.set_fact:
    _add_domain: >-
      {{ _add_host
         if (_add_host is search(':[0-9]+$')
             or _add_port in ['', (_add_http_only | bool) | ternary('80', '443')])
         else _add_host ~ ':' ~ _add_port }}
    _add_path: >-
      {{ url | regex_replace('^[^/]*', '')
         | regex_replace('^/', '') }}

# Refuse path-based wikis when the instance has very short URLs on.
# The runtime catches this too, but failing fast
# at the CLI gives the user a clear error before the wiki actually
# gets installed (which would otherwise leave a half-created wiki
# database that the next restart would refuse to load).
- name: Read CANASTA_ENABLE_VERY_SHORT_URLS from .env to validate URL shape
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: CANASTA_ENABLE_VERY_SHORT_URLS
  register: _add_vsu

- name: Fail if adding a path-based wiki to an instance with very short URLs
  ansible.builtin.fail:
    msg: >-
      Cannot add wiki '{{ wiki }}' with path-based URL '{{ url }}':
      this instance has CANASTA_ENABLE_VERY_SHORT_URLS=true, which
      requires every wiki to be on a unique hostname with no path
      component. Use a hostname-only URL or disable very short URLs
      first
      (canasta config set CANASTA_ENABLE_VERY_SHORT_URLS=false).
  when:
    - _add_vsu.value | default('false') | lower == 'true'
    - _add_path | length > 0

- name: Check wiki ID doesn't already exist
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: query
    wiki_id: "{{ wiki }}"
  register: _add_check

- name: Fail if wiki already exists
  ansible.builtin.fail:
    msg: "Wiki ID '{{ wiki }}' already exists."
  when: _add_check.exists | default(false)

- name: Read .env for DB password
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: MYSQL_PASSWORD
  register: _add_dbpass
  no_log: true

- name: Read .env for DB user (for install.php --dbuser)
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: MYSQL_USER
  register: _add_dbuser

# --skip-install connects to a database that already holds the new wiki's
# schema, so there is no dump to import and it only makes sense against an
# external database.
- name: Fail if --skip-install is combined with --database
  ansible.builtin.fail:
    msg: >-
      --skip-install cannot be combined with --database. --skip-install
      connects to a database that already holds the wiki's schema, so
      there is no dump to import.
  when:
    - skip_install | default(false) | bool
    - database is defined and database != ''

- name: Read .env for external DB flag
  canasta_env:
    path: "{{ instance_path }}/.env"
    state: read
    key: USE_EXTERNAL_DB
  register: _add_ext_db
  when: skip_install | default(false) | bool

- name: Fail if --skip-install without USE_EXTERNAL_DB
  ansible.builtin.fail:
    msg: >-
      --skip-install requires the instance to use an external database
      (USE_EXTERNAL_DB=true). The bundled database has no schema for
      wiki '{{ wiki }}', so install.php cannot be skipped.
  when:
    - skip_install | default(false) | bool
    - not (_add_ext_db.value | default('false') | lower == 'true')

- name: Generate admin password if not provided
  when: password is not defined or password == ''
  block:
    - name: Generate password
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/common/tasks/generate_password.yml
    - name: Store generated password
      ansible.builtin.set_fact:
        _add_admin_password: "{{ _generated_password }}"

- name: Use provided admin password
  ansible.builtin.set_fact:
    _add_admin_password: "{{ password }}"
  when: password is defined and password != ''

- name: Create per-wiki settings directory
  ansible.builtin.file:
    path: >-
      {{ instance_path }}/config/settings/wikis/{{ wiki }}
    state: directory
    mode: "0755"

# Per-wiki public_assets subdir (logos/favicon). Canasta serves
# /public_assets/* by rewriting to public_assets/<wiki-id>/, so the
# added wiki needs its own dir. Created here so it exists in the
# instance dir for the K8s user-dir sync to mirror and for gitops to
# track (stage_new_wiki.yml stages public_assets/<id>). The .gitkeep
# keeps the otherwise-empty dir under git.
- name: Create per-wiki public_assets directory
  ansible.builtin.file:
    path: "{{ instance_path }}/public_assets/{{ wiki }}"
    state: directory
    mode: "0755"

- name: Keep the per-wiki public_assets directory under git
  ansible.builtin.copy:
    dest: "{{ instance_path }}/public_assets/{{ wiki }}/.gitkeep"
    content: ""
    mode: "0644"
    force: false

- name: Copy per-wiki Settings.php if provided
  ansible.builtin.copy:
    src: "{{ wiki_settings }}"
    dest: >-
      {{ instance_path }}/config/settings/wikis/{{ wiki }}/Settings.php
    mode: "0644"
  when: wiki_settings is defined and wiki_settings != ''

# Install or import the wiki database BEFORE updating wikis.yaml
- name: Import database if provided
  when: database is defined and database != ''
  block:
    - name: Wait for database
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: wait_for_db.yml

    # A large dump import runs detached and polled, producing no incremental
    # output, so announce the phase up front — otherwise `canasta add` sits
    # silently for the whole import and reads as hung (mirrors create).
    - name: Report importing database
      ansible.builtin.debug:
        msg: "Importing database (this can take a while for a large dump)..."

    - name: Import database dump
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: import_database.yml
      vars:
        import_wiki_id: "{{ wiki }}"
        import_database_path: "{{ database }}"

    - name: Read the instance's databases
      canasta_wikis_yaml:
        instance_path: "{{ instance_path }}"
        state: read
      register: _add_wikis

    - name: Import the extra databases beside the dump
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: import_extra_databases.yml
      vars:
        extra_dbs_wiki: "{{ wiki }}"
        extra_dbs_dump: "{{ database }}"
        extra_dbs_discover: true
        extra_dbs_groups: "{{ _add_wikis.db_groups }}"

    - name: Record the extra databases imported
      ansible.builtin.set_fact:
        _add_extra_dbs: >-
          {{ _import_extra_dumps | dict2items | selectattr('value')
             | map(attribute='key') | list }}

# --skip-install: the external database already holds this wiki's schema,
# so register it in the farm without running install.php. Still wait for
# the database so a farm addition against an unreachable DB fails clearly.
- name: Skip installer for existing database
  when:
    - database is not defined or database == ''
    - skip_install | default(false) | bool
  block:
    - name: Report skipping installer for existing database
      ansible.builtin.debug:
        msg: >-
          Skipping MediaWiki installer for wiki '{{ wiki }}'
          (--skip-install); connecting to an external database that
          already holds the schema.

    - name: Wait for database
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: wait_for_db.yml

- name: Run install.php for new wiki
  when:
    - database is not defined or database == ''
    - not (skip_install | default(false) | bool)
  block:
    - name: Wait for database
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: wait_for_db.yml

    - name: Read DB connection from .env
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read_all
      register: _add_db_env
      no_log: true  # registers the whole .env, including passwords

    - name: Install new wiki
      ansible.builtin.include_role:
        name: mediawiki
        tasks_from: run_install_php.yml
      vars:
        install_php_db_password: "{{ _add_dbpass.value }}"
        install_php_admin_password: "{{ _add_admin_password }}"
        install_php_args: >-
          --skins='Vector'
          --dbserver={{ _add_db_env.variables.MYSQL_HOST | default('db') }}:{{ _add_db_env.variables.MYSQL_PORT | default('3306') }}
          --dbname={{ wiki }}
          --confpath=/tmp/canasta-install/
          --scriptpath=/w
          --server=https://{{ _add_domain }}
          --dbuser={{ _add_dbuser.value | default('root', true) | quote }}
          {{ wiki | quote }}
          {{ admin | default('WikiSysop') | quote }}

    - name: Clean up install temp directory
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/exec.yml
      vars:
        exec_service: web
        exec_command: "rm -rf /tmp/canasta-install/"

    - name: Save admin password
      ansible.builtin.copy:
        content: "{{ _add_admin_password }}"
        dest: >-
          {{ instance_path }}/admin-password_{{ wiki }}
        mode: "0600"
      no_log: true

# Import uploaded media for the new wiki (--images), after its DB is ready so
# the File: page rows (from --database) are present; this only places the
# files. A placement restore, not importImages.
- name: Import images tarball for the new wiki
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: import_images.yml
  vars:
    import_wiki_id: "{{ wiki }}"
    import_images_path: "{{ images }}"
  when: images is defined and images != ''

# NOW add to wikis.yaml (after successful install/import)
- name: Add wiki to wikis.yaml
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: add
    wiki_id: "{{ wiki }}"
    domain: "{{ _add_domain }}"
    wiki_path: "{{ _add_path }}"
    site_name: "{{ site_name | default('') }}"

# Declared before the restart, whose start gives MediaWiki's database
# account access to them.
- name: Declare the imported extra databases for the wiki
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: add_database
    wiki_id: "{{ wiki }}"
    database: "{{ item }}"
  loop: "{{ _add_extra_dbs | default([]) }}"

- name: Regenerate Caddyfile
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml

# Intrinsically K8s: the served domains live in values.yaml (Compose
# routes new wikis via the Caddyfile regenerated above). No Compose
# equivalent to dispatch to; kept here by design.
- name: Update Kubernetes values.yaml domains list
  when: instance_is_k8s | bool
  block:
    - name: Read current values.yaml
      ansible.builtin.slurp:
        src: "{{ instance_path }}/values.yaml"
      register: _add_values_raw

    - name: Parse current domains
      ansible.builtin.set_fact:
        _add_current_values: "{{ _add_values_raw.content | b64decode | from_yaml }}"

    - name: Add domain if not already present
      ansible.builtin.set_fact:
        _add_new_domains: >-
          {{ (_add_current_values.domains | default([])) | union([_add_domain | trim | regex_replace(':[0-9]+$', '')]) }}

    - name: Update values.yaml with new domains list
      ansible.builtin.copy:
        content: "{{ _add_current_values | combine({'domains': _add_new_domains}) | to_nice_yaml(indent=2) }}"
        dest: "{{ instance_path }}/values.yaml"
        mode: "0644"
      when: _add_new_domains | length > (_add_current_values.domains | default([]) | length)

    - name: Sync updated config to ConfigMaps
      ansible.builtin.include_role:
        name: orchestrator
        tasks_from: k8s_sync_config.yml

# A fingerprint left under this ID by an earlier wiki would make the restart
# skip update.php for the new one.
- name: Remove any update.php fingerprint for the wiki ID
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: remove_update_fingerprint.yml
  vars:
    update_fingerprint_wiki: "{{ wiki }}"

# Argo CD deploys a gitops-managed Kubernetes instance from its repo and
# self-heals back to it, so a direct deploy would be reverted until the
# staged changes are pushed. The new wiki's database is already in place;
# its configuration is staged only, and the web pods' startup runs
# update.php for it once the sync rolls them.
- name: Check whether the instance is gitops-managed
  ansible.builtin.stat:
    path: "{{ instance_path }}/.gitops-host"
  register: _add_gitops_marker

- name: Decide whether add only stages the wiki for a gitops push
  ansible.builtin.set_fact:
    _add_stage_only: >-
      {{ (instance_is_k8s | bool) and _add_gitops_marker.stat.exists }}

- name: Restart instance
  ansible.builtin.include_role:
    name: instance_lifecycle
    tasks_from: restart.yml
  when: not (_add_stage_only | default(false) | bool)

# After the restart, which loads the new wiki and gives MediaWiki's database
# account access to its extra databases.
- name: Run update.php for the imported wiki
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: run_update_php.yml
  vars:
    update_php_wikis: ["{{ wiki }}"]
  when:
    - database is defined and database != ''
    - not (_add_stage_only | default(false) | bool)

# Stage the new wiki's gitops-tracked files (per-wiki settings,
# public_assets, and the farm template). 'gitops init' captures wikis
# present at init time; a wiki added later was never brought into
# tracking, so its logos/settings could be lost on a repo-based recovery.
# No-op on non-gitops instances.
- name: Capture the new wiki for gitops
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/stage_new_wiki.yml
  vars:
    new_wiki_id: "{{ wiki }}"
    new_wiki_report: "{{ not (_add_stage_only | default(false) | bool) }}"

- name: Report wiki added
  ansible.builtin.debug:
    msg: >-
      Wiki '{{ wiki }}' added to instance '{{ instance_id }}'{% if _add_extra_dbs | default([]) %},
      with extra database(s) {{ _add_extra_dbs | join(', ') }} imported and
      declared{% endif %}.
  when: not (_add_stage_only | default(false) | bool)

- name: Report the wiki staged for a gitops push
  ansible.builtin.debug:
    msg: >-
      Wiki '{{ wiki }}' is set up in the database{% if _add_extra_dbs | default([]) %},
      with extra database(s) {{ _add_extra_dbs | join(', ') }} imported and
      declared,{% endif %} and staged in its gitops repo but not deployed.
      Run 'canasta gitops push -i {{ instance_id }}', then
      'canasta gitops sync -i {{ instance_id }}', to deploy it.
  when: _add_stage_only | default(false) | bool
