---
# Upgrade a single instance. Called in a loop from upgrade.yml.
# Input: _inst (dict with key=id, value=instance details)

- name: "Upgrading instance '{{ _inst.key }}'"
  ansible.builtin.debug:
    msg: "Upgrading '{{ _inst.key }}' at {{ _inst.value.path }}"

- name: Set instance facts
  ansible.builtin.set_fact:
    instance_id: "{{ _inst.key }}"
    instance_path: "{{ _inst.value.path }}"
    instance_orchestrator: "{{ _inst.value.orchestrator | default('compose') }}"
    instance_devmode: "{{ _inst.value.devMode | default(false) }}"
    # Without these, every step of the upgrade uses the play-scope
    # default runtime: `docker compose pull` against a podman host fails
    # on a missing Docker socket, and the profile flags pull.yml builds
    # for podman are never applied.
    compose_command: >-
      {{ _inst.value.composeCommand
         | default(_upgrade_default_compose_command) }}
    inspect_command: >-
      {{ _inst.value.inspectCommand
         | default(_upgrade_default_inspect_command) }}
    # Set per instance, not left to whatever the previous iteration used:
    # canasta.yml's play-level DOCKER_HOST reads this, so an unset value
    # would leak the last instance's socket into the next one.
    instance_docker_host: "{{ _inst.value.dockerHost | default('') }}"
    _instance_host: "{{ _inst.value.host | default('localhost') }}"

- name: Switch connection to instance host
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/switch_connection.yml"

# The registry is a claim about the host, not a fact about it, so check
# it rather than taking it at its word. An instance registered before the
# runtime became a field has nothing recorded and falls back to Docker;
# one registered by a create that misread a Podman socket as Docker has
# `docker compose` recorded outright. Both run the whole upgrade through
# `docker compose` on a host with no Docker daemon, and gating on "no
# value recorded" only ever caught the first.
- name: Confirm the recorded runtime against the instance's host
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/detect_runtime.yml"
  when: not (instance_is_k8s | bool)

- name: Check for an unfinished gitops pull
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/check_unfinished_pull.yml"

# Recorded rather than failed, so the host's other instances still upgrade.
- name: Skip an instance whose gitops pull is unfinished
  ansible.builtin.set_fact:
    _upgrade_failures: >-
      {{ (_upgrade_failures | default([]))
         + ["'" ~ instance_id ~ "': not upgraded, because " ~ unfinished_pull_reason] }}
  when: unfinished_pull | bool

- name: Check for tls directives Caddy cannot use behind the edge
  canasta_edge:
    state: check
    instance_id: "{{ instance_id }}"
    instance_path: "{{ instance_path }}"
  register: _upgrade_caddy_tls
  failed_when: false
  when:
    - not (instance_is_k8s | bool)
    - not (unfinished_pull | bool)

# Before the upgrade stops anything, so the instance keeps running as it is.
- name: Skip an instance with tls directives
  ansible.builtin.set_fact:
    _upgrade_failures: >-
      {{ (_upgrade_failures | default([]))
         + ["'" ~ instance_id ~ "': not upgraded, because " ~ _upgrade_caddy_tls.reason] }}
  when: _upgrade_caddy_tls.tls_directives | default([]) | length > 0

- name: Reset the image space check for this instance
  ansible.builtin.set_fact:
    _upgrade_space_reason: ''

- name: Check that the image pull fits on the disk
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/upgrade/tasks/check_image_space.yml"
  when:
    - not (instance_is_k8s | bool)
    - not (unfinished_pull | bool)
    - _upgrade_caddy_tls.tls_directives | default([]) | length == 0
    - _inst.value.buildFrom | default('') == ''

- name: Skip an instance whose image would not fit
  ansible.builtin.set_fact:
    _upgrade_failures: "{{ (_upgrade_failures | default([])) + [_upgrade_space_reason] }}"
  when: _upgrade_space_reason | length > 0

- name: Decide whether the instance upgrades
  ansible.builtin.set_fact:
    _upgrade_skip: >-
      {{ (unfinished_pull | bool)
         or (_upgrade_caddy_tls.tls_directives | default([]) | length > 0)
         or (_upgrade_space_reason | length > 0) }}

- name: Run upgrade role (migrations + refresh + restart)
  when: not (_upgrade_skip | bool)
  ansible.builtin.include_role:
    name: upgrade

# A bouncer created before the edge layer mounted tmpfs over the image's
# volumes still holds two anonymous volumes. Rewrite the layer, and replace
# the container with its volumes, rather than wait for the next restart.
- name: Check whether the edge bouncer predates its tmpfs mounts
  ansible.builtin.shell:
    cmd: >-
      grep -q '^  crowdsec-spoa:' docker-compose.edge.yml 2>/dev/null
      && ! grep -q 'tmpfs:' docker-compose.edge.yml && echo old || true
    chdir: "{{ instance_path }}"
  register: _upgrade_spoa_layer
  changed_when: false
  when:
    - not (instance_is_k8s | bool)
    - not (_upgrade_skip | bool)

- name: Rewrite the edge layer with the bouncer's tmpfs mounts
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/orchestrator/tasks/edge_sync.yml"
  when: (_upgrade_spoa_layer.stdout | default('') | trim) == 'old'

- name: Find the edge bouncer container
  ansible.builtin.command:
    argv:
      - "{{ inspect_command }}"
      - ps
      - -a
      - --filter
      - "label=com.docker.compose.project={{ instance_path | basename | lower }}"
      - --filter
      - label=com.docker.compose.service=crowdsec-spoa
      - --format
      - "{% raw %}{{.ID}} {{.State}}{% endraw %}"
  register: _upgrade_spoa_containers
  changed_when: false
  when: (_upgrade_spoa_layer.stdout | default('') | trim) == 'old'

- name: Remove the old edge bouncer with its volumes
  ansible.builtin.command:
    argv: "{{ [inspect_command, 'rm', '-f', '-v']
              + (_upgrade_spoa_containers.stdout_lines | map('split') | map('first') | list) }}"
  changed_when: true
  when:
    - (_upgrade_spoa_layer.stdout | default('') | trim) == 'old'
    - (_upgrade_spoa_containers.stdout_lines | default([]) | length) > 0

- name: Start the edge bouncer on the new layer
  ansible.builtin.command:
    cmd: >-
      {{ compose_command }} -f docker-compose.yml -f docker-compose.edge.yml
      up -d --no-deps crowdsec-spoa
    chdir: "{{ instance_path }}"
  environment:
    COMPOSE_IGNORE_ORPHANS: "true"
  changed_when: true
  when:
    - (_upgrade_spoa_layer.stdout | default('') | trim) == 'old'
    - (_upgrade_spoa_containers.stdout | default('')) is search(' running')

# Bouncers created before the layer mounted tmpfs over the image's volumes
# left two anonymous volumes behind each time; remove those on this daemon.
- name: Remove volumes earlier CrowdSec bouncers left behind
  canasta_edge:
    state: prune
    inspect_command: "{{ inspect_command }}"
  register: _upgrade_spoa_prune
  when: not (instance_is_k8s | bool)

- name: Report the removed bouncer volumes
  ansible.builtin.debug:
    msg: >-
      Removed {{ _upgrade_spoa_prune.removed | length }} volume(s) earlier
      CrowdSec bouncers left behind.
  when:
    - not (instance_is_k8s | bool)
    - (_upgrade_spoa_prune.removed | default([]) | length) > 0

# Also for an instance the upgrade did not restart: the edge in front of it
# may have been.
- name: Report wikis that do not answer through the edge
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: edge_probe.yml
  when:
    - not (_upgrade_skip | bool)
    - _was_running | default(false) | bool
    - not (_upgrade_restart_failed | default(false) | bool)
