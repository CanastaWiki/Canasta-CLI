---
# canasta create - Create a new Canasta instance.

- name: Validate wiki ID
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/validate_wiki_id.yml"
  when: wiki is defined and wiki != ''

- name: Check instance does not already exist
  canasta_registry:
    id: "{{ id }}"
    state: query
  delegate_to: canasta_controller
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: _pre_check
  ignore_errors: true  # OK if instance doesn't exist yet

- name: Fail early if instance already exists
  ansible.builtin.fail:
    msg: >-
      Instance '{{ id }}' already exists in the registry
      (path: {{ _pre_check.instance.path }},
      host: {{ _pre_check.instance.host | default('localhost') }}).
      Run 'canasta delete --id {{ id }}' to remove it first.
  when: _pre_check is succeeded

- name: Create Canasta instance
  block:
    - name: Run create role
      ansible.builtin.include_role:
        name: create
  rescue:
    # podman-compose ignores COMPOSE_PROFILES from .env, so `down -v` needs
    # explicit --profile flags to remove the profiled services' volumes.
    - name: Read COMPOSE_PROFILES from .env for cleanup
      canasta_env:
        path: "{{ instance_path }}/.env"
        state: read_all
      register: _env_profiles_rescue
      no_log: true  # registers the whole .env, including passwords
      when:
        - instance_path is defined
        - not (keep_config | default(false) | bool)
        - not (instance_is_k8s | bool)
        - compose_command | default('docker compose') is search('podman')
      ignore_errors: true  # Best-effort cleanup on failure

    - name: Build compose profile flags for cleanup
      ansible.builtin.set_fact:
        _rescue_profile_flags: >-
          {{ (_env_profiles_rescue.variables.COMPOSE_PROFILES | default(''))
             | split(',') | map('trim') | reject('equalto', '')
             | map('regex_replace', '^', '--profile ')
             | join(' ') }}
      when: _env_profiles_rescue.variables is defined

    - name: Clean up on failure (destroy Compose containers)
      ansible.builtin.command:
        cmd: >-
          {{ compose_command | default('docker compose') }}
          {{ _rescue_profile_flags | default('') }} down -v
        chdir: "{{ instance_path | default(omit) }}"
      when:
        - instance_path is defined
        - not (keep_config | default(false) | bool)
        - not (instance_is_k8s | bool)
      changed_when: true
      ignore_errors: true  # Best-effort cleanup on failure

    - name: Clean up on failure (uninstall Helm release)
      ansible.builtin.command:
        cmd: "helm uninstall canasta-{{ id }} -n canasta-{{ id }}"
      when:
        - not (keep_config | default(false) | bool)
        - instance_is_k8s | bool
        - _create_owns_namespace | default(false) | bool
      changed_when: true
      ignore_errors: true  # Best-effort cleanup on failure

    - name: Clean up on failure (delete K8s namespace)
      ansible.builtin.command:
        cmd: "kubectl delete namespace canasta-{{ id }} --ignore-not-found"
      when:
        - not (keep_config | default(false) | bool)
        - instance_is_k8s | bool
        - _create_owns_namespace | default(false) | bool
      changed_when: true
      ignore_errors: true  # Best-effort cleanup on failure

    # Rootless Podman maps the container's root to a subuid, so files the
    # containers wrote into the instance directory are owned by that
    # subuid. The `file` module below removes them from this process's
    # namespace and gets EACCES, leaving a directory the operator cannot
    # delete either — and a non-empty one blocks the next create. Clear
    # them from inside the namespace first; `file` then finds only what
    # it can remove. Same approach delete takes.
    - name: Detect rootless Podman before cleaning up
      ansible.builtin.command:
        cmd: podman info --format {% raw %}{{.Host.Security.Rootless}}{% endraw %}
      register: _create_podman_rootless
      changed_when: false
      failed_when: false
      when:
        - instance_path is defined
        - not (keep_config | default(false) | bool)
        - instance_dir_was_created | default(false) | bool
        - inspect_command | default('docker') is search('podman')

    # Guarded like delete's equivalent: an absolute path of non-trivial
    # length, so a corrupted registry or unset variable cannot turn this
    # into a destructive `find -delete` near the filesystem root.
    - name: Clean up on failure (remove id-mapped files)
      ansible.builtin.command:
        cmd: >-
          podman unshare find {{ instance_path | quote }} -mindepth 1 -delete
        chdir: "/"
      changed_when: true
      when:
        - instance_path is defined
        - not (keep_config | default(false) | bool)
        - instance_dir_was_created | default(false) | bool
        - (_create_podman_rootless.stdout | default('') | trim) == 'true'
        - instance_path | default('') | length > 5
        - instance_path | default('') is match('^/')
      ignore_errors: true  # Best-effort cleanup on failure

    # Only remove the directory if this run created it. A pre-existing
    # directory (e.g., the operator was using it as a staging area for
    # an upgrade) belongs to the operator and must not be deleted.
    - name: Clean up on failure (remove directory)
      ansible.builtin.file:
        path: "{{ instance_path }}"
        state: absent
      when:
        - instance_path is defined
        - not (keep_config | default(false) | bool)
        - instance_dir_was_created | default(false) | bool
      changed_when: true
      register: _create_dir_removal
      ignore_errors: true  # Best-effort cleanup on failure

    # The instance may already have joined the edge, which must not keep
    # running, holding 80 and 443, with no instance behind it.
    - name: Take the instance out of the edge on failure
      block:
        - name: Take the instance out of the edge
          ansible.builtin.include_role:
            name: orchestrator
            tasks_from: edge_sync.yml
          vars:
            edge_member: absent
          when:
            - instance_path is defined
            - not (keep_config | default(false) | bool)
            - instance_dir_was_created | default(false) | bool
            - not (instance_is_k8s | bool)
      rescue:
        - name: Report that the edge could not be updated
          ansible.builtin.debug:
            msg: >-
              The HAProxy edge could not be updated after the failed create
              ({{ ansible_failed_result.msg | default('') }}); the next start
              of any instance on this host brings it in line.

    - name: Deregister instance on failure
      canasta_registry:
        id: "{{ id }}"
        state: absent
      delegate_to: canasta_controller
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ignore_errors: true  # OK if never registered

    - name: Report failure
      ansible.builtin.fail:
        msg: >-
          Instance creation failed.{%
          if instance_dir_was_created is defined
             and (keep_config | default(false) | bool) %} Config files kept.{%
          elif (_create_dir_removal.changed | default(false))
               and not (_create_dir_removal.failed | default(false)) %} Files cleaned up.{%
          endif %}
