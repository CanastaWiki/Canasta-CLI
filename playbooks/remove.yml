---
# canasta remove - Remove a wiki from a Canasta instance.
# Cleans images/public_assets inside container, drops the wiki's databases,
# removes config.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Validate wiki ID
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/validate_wiki_id.yml

- name: Read wikis.yaml
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: read
  register: _remove_wikis

- name: Require an existing wiki that is not the last one
  ansible.builtin.fail:
    msg: >-
      {{ ("Wiki ID '%s' not found" % wiki)
         if wiki not in _remove_wikis.wiki_ids
         else "Cannot remove the last wiki" }}
  when: wiki not in _remove_wikis.wiki_ids or _remove_wikis.wiki_ids | length < 2

- name: Require confirmation
  ansible.builtin.fail:
    msg: "Removing wiki '{{ wiki }}' from instance '{{ instance_id }}'. Use --yes to confirm."
  when: not (yes | default(false) | bool)

# Clean up wiki images inside container (owned by www-data on Linux)
- name: Remove wiki images inside container
  ansible.builtin.include_tasks:
    file: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
    # ignore_errors must be applied to the included tasks, not the include
    # itself (where it is inert) — OK if the images dir doesn't exist.
    apply:
      ignore_errors: true
  vars:
    exec_service: web
    exec_command: "rm -rf /mediawiki/images/{{ wiki | quote }}"

# Clean up public assets (sitemaps etc.)
- name: Remove wiki public assets
  ansible.builtin.include_tasks:
    file: "{{ canasta_root }}/roles/orchestrator/tasks/exec.yml"
    # Apply to the included tasks — OK if the assets dir doesn't exist.
    apply:
      ignore_errors: true
  vars:
    exec_service: web
    exec_command: "rm -rf /mediawiki/public_assets/{{ wiki | quote }}"

# A wiki later added under the same ID must not inherit this one's fingerprint.
- name: Remove the wiki's update.php fingerprint
  ansible.builtin.include_role:
    name: mediawiki
    tasks_from: remove_update_fingerprint.yml
  vars:
    update_fingerprint_wiki: "{{ wiki }}"

- name: Remove wiki from wikis.yaml
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: remove
    wiki_id: "{{ wiki }}"

# The wiki's own database and the extra databases it declares, except any
# another wiki also declares and MariaDB's system schemas.
- name: Choose the databases to drop
  ansible.builtin.set_fact:
    _remove_drop_dbs: >-
      {{ _remove_wikis.db_groups | selectattr('wiki', 'equalto', wiki)
         | map(attribute='databases') | flatten
         | reject('in', _remove_wikis.db_groups | rejectattr('wiki', 'equalto', wiki)
                        | map(attribute='databases') | flatten | list)
         | reject('in', ['mysql', 'information_schema', 'performance_schema', 'sys'])
         | list }}
    _remove_dbs_left: []

- name: Drop the wiki's databases
  when: _remove_drop_dbs | length > 0
  block:
    - name: Find where database administration runs
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/db_admin.yml

    - name: Drop wiki databases
      ansible.builtin.include_tasks: >-
        {{ canasta_root }}/roles/orchestrator/tasks/exec.yml
      vars:
        exec_service: "{{ _db_admin_service }}"
        exec_no_log: true
        exec_command: >-
          {{ _db_admin_pwd }} mariadb {{ _db_admin_args }}
          -e '{% for db in _remove_drop_dbs %}DROP DATABASE IF EXISTS `{{ db }}`; {% endfor %}'
  rescue:
    - name: Record the databases left in place
      ansible.builtin.set_fact:
        _remove_dbs_left: "{{ _remove_drop_dbs }}"

    - name: Warn that the wiki's databases were left in place
      ansible.builtin.debug:
        msg: >-
          WARNING: could not drop database(s)
          {{ _remove_drop_dbs | join(', ') }} for wiki '{{ wiki }}':
          {{ (ansible_failed_result.stderr | default(ansible_failed_result.msg | default('')))
          | trim }}.
          Drop {{ 'it' if _remove_drop_dbs | length == 1 else 'them' }}
          yourself once the cause is fixed.

- name: Remove per-wiki settings directory
  ansible.builtin.file:
    path: "{{ instance_path }}/config/settings/wikis/{{ wiki }}"
    state: absent

- name: Remove admin password file
  ansible.builtin.file:
    path: "{{ instance_path }}/admin-password_{{ wiki }}"
    state: absent

- name: Regenerate Caddyfile
  ansible.builtin.include_role:
    name: orchestrator
    tasks_from: update_config.yml

- name: Remove the wiki from gitops
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/gitops/tasks/unstage_removed_wiki.yml
  vars:
    removed_wiki_id: "{{ wiki }}"

- name: Restart instance
  ansible.builtin.include_role:
    name: instance_lifecycle
    tasks_from: restart.yml

- name: Report wiki removed
  ansible.builtin.debug:
    msg: >-
      Wiki '{{ wiki }}' removed from instance '{{ instance_id }}'{{
      (', but its database(s) ' ~ (_remove_dbs_left | join(', ')) ~ ' were left in place')
      if _remove_dbs_left | length > 0 else '' }}.
