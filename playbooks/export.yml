---
# canasta export - Export a wiki's databases.
# The wiki's own database goes to the output file. Each extra database it
# declares in wikis.yaml goes to a sibling file named <stem>.<database>.sql
# (or .sql.gz), which `canasta import` picks up from the same stem.

- name: Resolve instance
  ansible.builtin.include_tasks: "{{ canasta_root }}/roles/common/tasks/resolve_instance.yml"

- name: Validate wiki ID
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/common/tasks/validate_wiki_id.yml

- name: Set output file
  ansible.builtin.set_fact:
    _export_raw: "{{ file | default(wiki + '.sql') }}"

# A relative path resolves against the user's working directory when the
# instance is on this machine, and against the SSH user's home on a remote
# host. A '~' path is expanded on the instance's host by the tasks that
# write the file.
- name: Resolve output path
  ansible.builtin.set_fact:
    _export_file: >-
      {{ _export_raw if _export_raw is match('[/~]')
      else ((lookup('env', 'CANASTA_HOST_PWD')
             | default(lookup('env', 'PWD'), true))
            if _instance_host in ['localhost', '', '127.0.0.1', '::1']
            else '~') + '/' + _export_raw }}

- name: Check if gzip requested
  ansible.builtin.set_fact:
    _export_gzip: "{{ _export_file | regex_search('\\.gz$') is not none }}"

- name: Read the wiki's databases
  canasta_wikis_yaml:
    instance_path: "{{ instance_path }}"
    state: query
    wiki_id: "{{ wiki }}"
  register: _export_wiki

- name: Name the sibling files for extra databases
  ansible.builtin.set_fact:
    _export_stem: "{{ _export_file | regex_replace('(\\.sql)?(\\.gz)?$', '') }}"
    _export_ext: "{{ (_export_gzip | bool) | ternary('.sql.gz', '.sql') }}"
    _export_dbs: "{{ _export_wiki.databases | default([wiki], true) }}"

- name: Export each of the wiki's databases
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/mediawiki/tasks/export_database.yml
  vars:
    export_db: "{{ item }}"
    export_dest: >-
      {{ _export_file if item == wiki
         else _export_stem ~ '.' ~ item ~ _export_ext }}
    export_gzip: "{{ _export_gzip }}"
  loop: "{{ _export_dbs }}"

- name: Report export complete
  ansible.builtin.debug:
    msg: >-
      Wiki '{{ wiki }}' exported to {{ _export_file }}{% if _export_dbs | length > 1 %},
      with its extra database(s) in
      {% for db in _export_dbs[1:] %}{{ _export_stem ~ '.' ~ db ~ _export_ext }}{{ ', ' if not loop.last }}{% endfor %}{% endif %}.
