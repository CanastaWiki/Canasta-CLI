---
# canasta image prune - Reclaim container image storage on the target host.
#
# The reclaim itself lives in the shared image_reclaim.yml task so
# `canasta upgrade --purge` runs the same code. canasta.yml binds the play to
# target_host, so the connection already points at the right host and no
# switch is needed here.

- name: Reclaim image storage on the host
  ansible.builtin.include_tasks: >-
    {{ canasta_root }}/roles/orchestrator/tasks/image_reclaim.yml
  vars:
    _reclaim_host_name: "{{ target_host | default('localhost') }}"
    reclaim_dry_run: "{{ dry_run | default(false) }}"
